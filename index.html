<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tab{font:inherit;font-size:.9rem;font-weight:700;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

.ch{display:block;width:100%;text-align:left;background:transparent;color:inherit;font:inherit;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:8px 0;cursor:pointer;font-size:.95rem;line-height:1.7}

.track{height:8px;border-radius:4px;background:var(--track);margin-top:6px;overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--accent)}
.fill.low{background:var(--ng)}
.tag{display:inline-block;font-size:.74rem;font-weight:700;border-radius:999px;padding:0 .6em;margin-left:.5em;border:1px solid currentColor}
.tag.weak{color:var(--ng)} .tag.few{color:var(--warn)}
.miss{margin:6px 0;font-size:.92rem}

textarea{width:100%;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:8px;margin-top:8px}
footer{max-width:760px;margin:0 auto;padding:0 16px 120px;color:var(--sub);font-size:.8rem}
</style>

<script>
const DATA = {"sets": [{"id": "04", "title": "労基法 第1回", "subject": "労働基準法", "questions": [{"type": "choice", "no": 1, "topic": "賃金", "stem": "労働基準法に定める賃金等に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "雇用契約においてある手当が時間外労働等に対する対価として支払われるものとされているか否かは、雇用契約に係る契約書等の記載内容のほか、具体的事案に応じ、使用者の労働者に対する当該手当や割増賃金に関する説明の内容、労働者の実際の労働時間等の勤務状況などの事情を考慮して判断すべきであるとするのが、最高裁判所の判例である。"}, {"label": "B", "text": "労働基準法第20条に基づく解雇予告手当を算定する際の平均賃金を算定すべき事由の発生した日は、労働者に解雇の通告をした日であり、その後、当該労働者の同意を得て解雇日を変更した場合においても、当初の解雇を通告した日とするものとされている。"}, {"label": "C", "text": "就業規則で定めた減給の制裁について、労働基準法第91条にいう平均賃金を算定すべき事由の発生した日は、減給の制裁の意思表示が相手方に到達した日である。"}, {"label": "D", "text": "雇入れ後3か月に満たない労働者について平均賃金を算定すべき事由が発生した場合において、算定事由発生日前に賃金締切日があるときは、直前の賃金締切日から起算して雇入れ後の期間とその期間中の賃金の総額により算定することとされている。"}, {"label": "E", "text": "使用者の責に帰すべき事由による休業が労働協約、就業規則又は労働契約により休日と定められている日を含む期間にわたる場合、使用者は、当該休日と定められている日についても、労働基準法第26条に定める休業手当を支払わなければならない。"}], "answer": "E", "answerText": "<b>正解 E</b>", "explain": ["A ○【判決】日本ケミカル事件（最一小判 平30.7.19）の本文どおり", "B ○【過去問】令和7年 問2B（正しい肢）", "C ○【過去問＋AI】令和8年 問7オは「制裁事由が発生した日」として誤り。正しくは意思表示の到達日（この部分はAIの知識）", "D ○【過去問】令和7年 問2Dは「賃金締切日があるか否かにかかわらず」として誤り", "<b>E ✕</b>【過去問】令和7年 問4E（正しい肢）の逆。休日と定められている日については、休業手当を支払う義務は生じない"], "key": "04-1"}, {"type": "choice", "no": 2, "topic": "労働契約・解雇", "stem": "労働基準法に定める労働契約等に関する次のアからオまでの記述のうち、正しいものはいくつあるか。", "statements": [{"label": "ア", "text": "満60歳以上の労働者との間に締結される労働契約について、労働基準法第14条第1項第2号により5年までの契約期間が認められるか否かは、当該労働契約の締結時における当該労働者の年齢によって判断される。"}, {"label": "イ", "text": "使用者は、有期労働契約（当該契約を2回以上更新し、又は雇入れの日から起算して1年を超えて継続勤務している者に係るものに限り、あらかじめ当該契約を更新しない旨明示されているものを除く。）を更新しないこととしようとする場合には、少なくとも当該契約の期間の満了する日の30日前までに、その予告をしなければならない。"}, {"label": "ウ", "text": "労働契約の締結に際し明示された労働条件が事実と相違する場合、労働者は、即時に労働契約を解除することができるほか、明示されたとおりの労働条件の履行を使用者に求めることもできる。"}, {"label": "エ", "text": "事業主を異にするX社とY社に使用される労働者が、X社の業務により負傷し、その療養のために休業している場合、当該休業する期間及びその後30日間について、労働基準法第19条第1項による解雇の制限を受けるのはX社であって、Y社はこの制限を受けない。"}, {"label": "オ", "text": "労災保険法に基づく療養補償給付を受ける労働者は、使用者が自ら労働基準法第75条の規定による療養補償を行っている場合に当たらないから、当該労働者が療養開始後3年を経過しても疾病等が治らない場合に、使用者が同法第81条の規定による打切補償の支払をしても、同法第19条第1項ただし書の適用を受けることはできないとするのが、最高裁判所の判例である。"}], "choices": [{"label": "A", "text": "一つ"}, {"label": "B", "text": "二つ"}, {"label": "C", "text": "三つ"}, {"label": "D", "text": "四つ"}, {"label": "E", "text": "五つ"}], "answer": "C", "answerText": "<b>正解 C（三つ：ア・ウ・エ）</b>", "explain": ["ア ○【過去問】令和7年 問3A（正しい肢）", "<b>イ ✕</b>【過去問】令和6年 問3A（正しい肢）は「<b>3回以上</b>更新し」。ここだけを入れ替えています", "ウ ○【過去問】令和7年 問3Cは「解除することができるにとどまり…要求することはできない」として誤り", "エ ○【過去問】令和7年 問3Dは「X社もY社も解雇してはならない」として誤り", "<b>オ ✕</b>【判決】専修大学事件（最二小判 平27.6.8）。記述は原審（高裁）の考え方。最高裁は、労災保険の保険給付の実質は使用者の災害補償義務を政府が保険給付の形式で行うものであるとして、打切補償の支払により第19条第1項ただし書の<b>適用を受けることができる</b>とした"], "key": "04-2"}, {"type": "choice", "no": 3, "topic": "時間外労働・割増賃金", "stem": "労働基準法に定める時間外・休日労働及び割増賃金に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働者数が本社120人、P工場60人、Q営業所20人の合計200人である企業において、本社の労働者110人のみで組織する労働組合がある場合、当該労働組合は当該企業の労働者の過半数で組織されているから、P工場及びQ営業所における労働基準法第36条の協定についても、労働者側の協定当事者となる。"}, {"label": "B", "text": "労働基準法第36条の協定の当事者である「労働者の過半数を代表する者」を選出する際の「労働者」の範囲には、同法第41条第2号の管理監督者や満18歳に満たない者のように時間外労働又は休日労働をさせることが想定されない者は含まれないと解すべきであるとされている。"}, {"label": "C", "text": "いわゆる年俸制の適用を受ける労働者について、年俸額の一部を賞与として支払うこととしている場合であって、当該賞与の支給額があらかじめ確定しているときは、当該賞与は、割増賃金の基礎となる賃金に算入しなければならない。"}, {"label": "D", "text": "使用者が雇用契約に基づき時間外労働等に対する対価として定額の手当を支払う場合について、労働基準法第37条や他の労働関係法令は、当該手当の支払によって割増賃金の全部又は一部を支払ったものといえるために、当該手当を上回る金額の割増賃金請求権が発生した事実を労働者が認識して直ちに支払を請求することができる仕組みが備わっていることを必須のものとしていると解されるとするのが、最高裁判所の判例である。"}, {"label": "E", "text": "通常は事務作業に従事している労働者が、法定労働時間外に、特殊作業手当が支払われる現場作業に従事した場合、当該現場作業は当該労働者にとって通常の業務ではないから、当該特殊作業手当は、当該時間外労働に係る割増賃金の基礎となる賃金に算入しなくとも差し支えないとされている。"}], "answer": "C", "answerText": "<b>正解 C</b>", "explain": ["<b>A ✕</b>【過去問】令和7年 問5A（誤りの肢）と同じ論点。協定は事業場ごとに締結するので、P工場・Q営業所ではその事業場の労働者の過半数を組織していなければ当事者にならない", "<b>B ✕</b>【過去問】令和7年 問5C（正しい肢）の逆。管理監督者等を<b>含む全ての労働者</b>", "C ○【過去問】令和7年 問6Dは「算入しなくとも差し支えない」として誤り", "<b>D ✕</b>【判決】日本ケミカル事件の本文は「…必須のものとしているとは<b>解されない</b>」。語尾だけの入れ替え", "<b>E ✕</b>【過去問】令和7年 問6C（誤りの肢）と同じ論点。時間外に従事した作業に付く特殊作業手当は算入する"], "key": "04-3"}, {"type": "choice", "no": 4, "topic": "年次有給休暇", "stem": "労働基準法に定める年次有給休暇及び就業規則に関する次のアからオまでの記述のうち、誤っているものの組合せは、後記AからEまでのうちどれか。", "statements": [{"label": "ア", "text": "労働基準法第39条第7項の規定による使用者の時季指定について、労働者が半日単位で取得した年次有給休暇の日数分は同条第8項の「日数」に含まれ、その分について使用者は時季指定を要しないが、労働者が時間単位で取得した分は、同項の「日数」に含まれない。"}, {"label": "イ", "text": "労働基準法第39条第1項及び第2項の出勤率の算定に当たり、産前産後の女性が同法第65条の規定によって休業した期間は出勤したものとみなされるが、生理日の就業が著しく困難な女性が同法第68条の規定によって就業しなかった期間は、同法上、出勤したものとはみなされない。"}, {"label": "ウ", "text": "労働基準法第89条第1号から第3号までに掲げる事項の一部を記載していない就業規則であっても、その効力の発生についての他の要件を具備する限り有効であるが、使用者は同条違反の責任を免れない。"}, {"label": "エ", "text": "使用者が、4月1日に入社した労働者に対し、入社日に5労働日、同年7月1日に5労働日の年次有給休暇を付与した場合、使用者は、7月1日から1年以内に5日について時季を定めることにより与えなければならず、当該労働者が4月1日から6月30日までの間に自ら請求して取得した年次有給休暇の日数があっても、その日数を当該5日から控除することはできない。"}, {"label": "オ", "text": "労働者が遅刻又は早退をした場合において、その遅刻又は早退の時間に相当する賃金額を限度として行う賃金の減額は、就業規則に制裁として定められている限り、労働基準法第91条に定める減給の制裁に関する規定の適用を受ける。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとウ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（ウとオ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "E", "answerText": "<b>正解 E（エとオ）</b>", "explain": ["ア ○【過去問】令和6年 問6D（正しい肢）", "イ ○【過去問】令和6年 問6Eは、両方とも出勤したものとみなすとして誤り", "ウ ○【過去問】令和6年 問7Aは「無効とされている」として誤り", "<b>エ ✕</b>【AI】一部を前倒しで付与した場合、付与日数の合計が10労働日に達した日（7月1日）から1年以内に5日を取得させる。その日より前に労働者が取得した日数は、5日から<b>控除することができる</b>（施行規則第24条の5）。この肢はAIの知識によるので、テキストで確認してください", "<b>オ ✕</b>【過去問】令和7年 問7E（正しい肢）の逆。遅刻・早退の時間分は賃金債権が生じないので、その時間分の減額は第91条の適用を<b>受けない</b>。その時間分を超える減額が制裁に当たる"], "key": "04-4"}, {"type": "choice", "no": 5, "topic": "総則", "stem": "労働基準法の総則等に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働基準法第5条に定める「労働者の意思に反して労働を強制」するとは、不当な手段を用いることによって、使用者が労働者の意識ある意思を抑圧し、その自由な発現を妨げて労働すべく強要することをいい、労働者が現実に労働したことを要する。"}, {"label": "B", "text": "労働基準法第6条の「業として利益を得る」とは、営利を目的として同種の行為を反復継続することをいうから、反復継続して利益を得る意思があったとしても、現に行われた行為が1回にとどまる場合は、これに当たらない。"}, {"label": "C", "text": "労働基準法第3条は、労働者の信条によって賃金その他の労働条件につき差別することを禁じているが、これは雇入れ後における労働条件についての制限であって、雇入れそのものを制約する規定ではないとするのが、最高裁判所の判例である。"}, {"label": "D", "text": "労働基準法第9条に定める「労働者」とは、他人との間に使用従属の関係に立って労務に服し、報酬を受けて生活する者をいい、現に事業又は事務所に使用されていることまでは要しない。"}, {"label": "E", "text": "出向元との労働契約関係を維持したまま出向先の指揮命令を受けて就労するいわゆる在籍型出向の出向労働者については、出向元との間に労働契約関係が存続していることから、労働基準法における使用者としての責任は、出向元の使用者が負う。"}], "answer": "C", "answerText": "<b>正解 C</b>", "explain": ["<b>A ✕</b>【過去問】令和7年 問1ア。「必ずしも労働者が現実に労働することを必要としない」", "<b>B ✕</b>【過去問】令和7年 問1イ。1回の行為であっても、反復継続して利益を得る意思があれば当たる", "C ○【過去問】三菱樹脂事件（最大判 昭48.12.12）。令和6年 問1Bは、雇入れの拒否も第3条に違反するとして誤り", "<b>D ✕</b>【過去問】令和7年 問1エ（失業者を含むとした記述）と同じ論点。労働基準法の労働者は、事業又は事務所に<b>使用される者</b>（第9条）", "<b>E ✕</b>【過去問】令和6年 問1D（正しい肢）。三者間の取決めによって定められた権限と責任に応じて、<b>出向元又は出向先</b>の使用者がそれぞれ責任を負う"], "key": "04-5"}, {"type": "cloze", "no": 6, "topic": "選択式", "stem": "次の文中の［ A ］〜［ E ］の部分を選択肢の中の最も適切な語句で埋め、完全な文章とせよ。", "passage": ["1　最高裁判所は、労災保険法による療養補償給付を受ける労働者に対する打切補償と解雇制限との関係が問題となった事件において、次のように判示した。", "「業務災害に関する労災保険制度は、労働基準法により使用者が負う災害補償義務の存在を前提として、その補償負担の緩和を図りつつ被災した労働者の迅速かつ公正な保護を確保するため、使用者による災害補償に代わる保険給付を行う制度であるということができ、このような労災保険法に基づく保険給付の実質は、使用者の労働基準法上の［ A ］を政府が保険給付の形式で行うものであると解するのが相当である。」", "2　最高裁判所は、歩合給の計算に当たり売上高等の一定割合に相当する金額から残業手当等に相当する金額を控除する旨を定めた賃金規則が問題となった事件において、次のように判示した。", "「（当該仕組みの下で）割増金を時間外労働等に対する対価とみるとすれば、出来高払制の賃金部分につき通常の労働時間の賃金に当たる部分はなく、全てが割増賃金であることとなるが、これは、法定の労働時間を超えた労働に対する割増分として支払われるという労働基準法37条の定める割増賃金の［ B ］から逸脱したものといわざるを得ない。」", "「割増金として支払われる賃金のうちどの部分が時間外労働等に対する対価に当たるかは明らかでないから、本件賃金規則における賃金の定めにつき、通常の労働時間の賃金に当たる部分と労働基準法37条の定める割増賃金に当たる部分とを［ C ］することはできないこととなる。」", "3　最高裁判所は、定額の手当の支払による割増賃金の支払が問題となった事件において、雇用契約においてある手当が時間外労働等に対する対価として支払われるものとされているか否かは、「雇用契約に係る契約書等の記載内容のほか、具体的事案に応じ、使用者の労働者に対する当該手当や割増賃金に関する［ D ］、労働者の実際の労働時間等の勤務状況などの事情を考慮して判断すべきである」と判示した。", "4　使用者は、有期労働契約（当該契約を3回以上更新し、又は雇入れの日から起算して1年を超えて継続勤務している者に係るものに限り、あらかじめ当該契約を更新しない旨明示されているものを除く。）を更新しないこととしようとする場合には、少なくとも当該契約の期間の満了する日の［ E ］前までに、その予告をしなければならない。"], "options": [{"mark": "①", "text": "安全配慮義務"}, {"mark": "②", "text": "災害補償義務"}, {"mark": "③", "text": "損害賠償責任"}, {"mark": "④", "text": "保険料負担義務"}, {"mark": "⑤", "text": "趣旨"}, {"mark": "⑥", "text": "本質"}, {"mark": "⑦", "text": "計算方法"}, {"mark": "⑧", "text": "最低基準"}, {"mark": "⑨", "text": "区分"}, {"mark": "⑩", "text": "算定"}, {"mark": "⑪", "text": "特定"}, {"mark": "⑫", "text": "判別"}, {"mark": "⑬", "text": "合意の有無"}, {"mark": "⑭", "text": "計算の根拠"}, {"mark": "⑮", "text": "周知の状況"}, {"mark": "⑯", "text": "説明の内容"}, {"mark": "⑰", "text": "14日"}, {"mark": "⑱", "text": "30日"}, {"mark": "⑲", "text": "1か月"}, {"mark": "⑳", "text": "60日"}], "answers": {"A": "②", "B": "⑥", "C": "⑫", "D": "⑯", "E": "⑱"}, "answerText": "<b>A ② 災害補償義務 ／ B ⑥ 本質 ／ C ⑫ 判別 ／ D ⑯ 説明の内容 ／ E ⑱ 30日</b>", "explain": ["A【判決】専修大学事件（最二小判 平27.6.8）", "B・C【判決】国際自動車事件（最一小判 令2.3.30）。Bは⑤「趣旨」と迷いやすいが、判決は「本質から逸脱」", "D【判決】日本ケミカル事件（最一小判 平30.7.19）", "E【過去問】令和6年 問3A。⑲「1か月」ではなく「30日」"], "key": "04-6"}]}, {"id": "05", "title": "労基法 第2回", "subject": "労働基準法", "questions": [{"type": "choice", "no": 1, "topic": "総則", "stem": "労働基準法の労働者及び使用者に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "契約の形式が請負契約であっても、その実体において使用従属関係が認められ、事業に使用されて賃金を支払われる者であるときは、労働基準法の労働者に該当する。"}, {"label": "B", "text": "同居の親族のみを使用する事業において、一時的に親族以外の者が使用されている場合、当該事業は引き続き同居の親族のみを使用する事業として取り扱われるから、この者は労働基準法の労働者に該当しない。"}, {"label": "C", "text": "法令の規定により事業主等に申請等が義務付けられている場合において、事務代理の委任を受けた社会保険労務士がその懈怠により当該申請等を行わなかったときは、当該社会保険労務士は事業主に使用される者ではないから、労働基準法第10条にいう「使用者」には該当しない。"}, {"label": "D", "text": "労働基準法第10条にいう「使用者」は、同法各条の義務についての履行の責任者をいうものであるから、同法第9条にいう「労働者」に該当する者が、同時に同法第10条にいう「使用者」に該当することはない。"}, {"label": "E", "text": "法人が業として他人の就業に介入して利益を得た場合、労働基準法第6条違反が成立するのは利益を得た当該法人であり、法人のために違反行為を計画し、実行した従業員については、その者が現実に利益を得ていない限り、同条違反は成立しない。"}], "answer": "A", "answerText": "<b>正解 A</b>", "explain": ["A ○【過去問】令和4年 問1Bは、請負の形式であれば労働者に該当することはないとして誤り", "<b>B ✕</b>【過去問】令和4年 問1C（誤りの肢）と同じ論点。一時的であっても親族以外の者が使用されていれば、この者は労働者に該当する", "<b>C ✕</b>【過去問】令和4年 問4E（正しい肢）の逆。この場合の社会保険労務士は「使用者」に該当し、責任を問われうる", "<b>D ✕</b>【過去問】令和5年 問4E（誤りの肢）と同じ論点。労働者であると同時に、ある事項については使用者に当たることがある", "<b>E ✕</b>【過去問】令和5年 問4D（誤りの肢）と同じ論点。利益の帰属先が法人であっても、行為者である従業員について成立する"], "key": "05-1"}, {"type": "choice", "no": 2, "topic": "総則", "stem": "労働基準法の総則に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働基準法第1条にいう「労働関係の当事者」には、使用者及び労働者のほか、それぞれの団体である使用者団体及び労働組合も含まれる。"}, {"label": "B", "text": "特定の思想、信条に従って行う行動が企業の秩序維持に対し重大な影響を及ぼす場合に、その秩序違反行為そのものを理由として差別的取扱いをすることは、労働基準法第3条に違反するものではない。"}, {"label": "C", "text": "就業規則に、労働者が女性であることを理由として賃金について男性と差別的取扱いをする趣旨の規定がある場合、当該規定は無効であるが、現実に男女差別待遇の事実がないときは、労働基準法第4条違反とはならない。"}, {"label": "D", "text": "使用者が、労働者に対し、労働の強制の目的はなく、単に態度が悪いことを理由として暴行を加えた場合であっても、当該暴行が労働者の精神又は身体の自由を不当に拘束する手段に当たる以上、労働基準法第5条違反となる。"}, {"label": "E", "text": "労働基準法第5条に定める「監禁」とは、一定の区画された場所から脱出できない状態に置くことによって労働者の身体の自由を拘束することをいい、必ずしも物質的障害をもって手段とすることを要しない。"}], "answer": "D", "answerText": "<b>正解 D</b>", "explain": ["A ○【過去問】令和4年 問4A", "B ○【過去問】令和5年 問4B", "C ○【過去問】令和4年 問4Cは、現実に差別待遇の事実がなくても第4条違反となるとして誤り", "<b>D ✕</b>【過去問】令和4年 問4D（正しい肢）の逆。労働の強制の目的がない暴行は、刑法の暴行罪が成立する可能性はあっても、第5条違反とはならない", "E ○【過去問】令和5年 問4Cは、物質的障害がない場合には監禁に該当することはないとして誤り"], "key": "05-2"}, {"type": "choice", "no": 3, "topic": "労働契約・解雇", "stem": "労働基準法に定める労働契約等に関する次のアからオまでの記述のうち、正しいものはいくつあるか。", "statements": [{"label": "ア", "text": "労働基準法第14条第1項に規定する期間を超える期間を定めた労働契約を締結した場合、当該労働契約の期間は、同項に規定する期間となる。"}, {"label": "イ", "text": "社宅が単なる福利厚生施設とみなされる場合においては、社宅を供与すべき旨の条件は労働基準法第15条第1項の「労働条件」に含まれないから、労働契約の締結に当たり同旨の条件を付していたにもかかわらず社宅を供与しなかったときでも、同条第2項による労働契約の解除権を行使することはできない。"}, {"label": "ウ", "text": "労働基準法第15条第3項にいう「契約解除の日から14日以内」とは、契約を解除した当日から起算して14日以内をいい、例えば、10月1日に労働契約を解除した場合は、10月14日までをいう。"}, {"label": "エ", "text": "労働基準法第16条のいわゆる賠償予定の禁止については、違約金を定め、又は損害賠償額を予定する契約を締結したときに違反が成立し、違約金又はあらかじめ定めた損害賠償額を現実に徴収したことを要しない。"}, {"label": "オ", "text": "労働基準法第22条第1項に基づいて交付する証明書には、労働者の請求しない事項を記入してはならないから、労働者が同項に定める事項の一部のみについて証明書を請求した場合には、使用者は、請求のあった事項のみを記入しなければならない。"}], "choices": [{"label": "A", "text": "一つ"}, {"label": "B", "text": "二つ"}, {"label": "C", "text": "三つ"}, {"label": "D", "text": "四つ"}, {"label": "E", "text": "五つ"}], "answer": "D", "answerText": "<b>正解 D（四つ：ア・イ・エ・オ）</b>", "explain": ["ア ○【過去問＋AI】令和5年 問5Aは「期間の定めのない労働契約となる」として誤り。上限の期間（3年又は5年）に改められるという部分はAIの知識", "イ ○【過去問】令和5年 問5B", "<b>ウ ✕</b>【過去問】令和4年 問5B（誤りの肢）と同じ論点。初日は算入しないので、解除の日の翌日から起算する（10月15日まで）", "エ ○【過去問】令和4年 問5Cは、現実に徴収したときにはじめて違反が成立するとして誤り", "オ ○【過去問・条文】令和4年 問5Eは、すべて記入しなければならないとして誤り。第22条第3項"], "key": "05-3"}, {"type": "choice", "no": 4, "topic": "賃金", "stem": "労働基準法に定める賃金等に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働基準法第24条第1項に定める直接払の原則は、労働者本人以外の者に賃金を支払うことを禁止するものであるが、労働者が未成年者である場合に、その親権者に賃金を支払うことは、同原則に違反しない。"}, {"label": "B", "text": "賃金の所定支払日が休日に当たる場合に、その支払日を繰り上げることを定めることだけでなく、その支払日を繰り下げることを定めることも、労働基準法第24条第2項に定める一定期日払の原則に違反しない。"}, {"label": "C", "text": "使用者は、労働者が出産、疾病、災害等の非常の場合の費用に充てるために請求する場合においては、支払期日前であっても既往の労働に対する賃金を支払わなければならないが、この非常時払については、通貨払及び直接払を定めた労働基準法第24条第1項の規定は適用されない。"}, {"label": "D", "text": "労働組合が自らの判断によって部分ストライキを決行した場合において、ストライキに参加しなかった当該労働組合所属の労働者の労働が社会観念上無価値となったために使用者が命じた休業は、ストライキの原因が使用者側にもあるときは、労働基準法第26条の「使用者の責に帰すべき事由」によるものに当たるとするのが、最高裁判所の判例である。"}, {"label": "E", "text": "労働基準法第27条に定める出来高払制の保障給について、同種の労働を行っている労働者が多数ある場合には、保障給の趣旨に照らし、個々の労働者の技量、経験、年齢等に応じてその額に差を設けることはできない。"}], "answer": "B", "answerText": "<b>正解 B</b>", "explain": ["<b>A ✕</b>【過去問・条文】令和5年 問6A（誤りの肢）と同じ論点。未成年者は独立して賃金を請求でき、親権者又は後見人は代わって受け取ってはならない（第59条）", "B ○【過去問】令和5年 問6C", "<b>C ✕</b>【過去問】令和5年 問6D（誤りの肢）と同じ論点。非常時払にも第24条第1項は適用される", "<b>D ✕</b>【過去問】令和5年 問6E（誤りの肢）と同じ論点。最高裁は、このような休業は使用者の責に帰すべき事由によるものとはいえないとした", "<b>E ✕</b>【過去問】令和4年 問6オ（正しい肢）の逆。差を設けることは差し支えない"], "key": "05-4"}, {"type": "choice", "no": 5, "topic": "賃金", "stem": "下記のとおり賃金を支払われている労働者が、使用者の責に帰すべき事由により半日休業した場合における労働基準法第26条の休業手当に関する次の記述のうち、正しいものはどれか。<br>賃金：日給1日12,000円。半日休業とした日の賃金は、半日分の6,000円が支払われた。<br>平均賃金：11,000円", "statements": [], "choices": [{"label": "A", "text": "使用者は、以下の算式により600円の休業手当を支払わなければならない。<br>11,000円 × 0.6 − 6,000円 ＝ 600円"}, {"label": "B", "text": "使用者は、以下の算式により1,200円の休業手当を支払わなければならない。<br>12,000円 × 0.6 − 6,000円 ＝ 1,200円"}, {"label": "C", "text": "使用者は、以下の算式により3,000円の休業手当を支払わなければならない。<br>（11,000円 − 6,000円）× 0.6 ＝ 3,000円"}, {"label": "D", "text": "使用者は、以下の算式により3,300円の休業手当を支払わなければならない。<br>11,000円 × 0.6 ÷ 2 ＝ 3,300円"}, {"label": "E", "text": "現実に就労した時間に対して6,000円の賃金が支払われているから、使用者が休業手当として支払うべき金額は発生しない。"}], "answer": "A", "answerText": "<b>正解 A</b>", "explain": ["【過去問＋AI】令和5年 問1と同じ型です。1日の一部を休業した場合、その日について<b>平均賃金の100分の60</b>に相当する額（11,000円 × 0.6 ＝ 6,600円）を保障する必要があります", "現実に就労した時間に対して支払われた賃金（6,000円）が6,600円に満たないので、その<b>差額600円</b>を休業手当として支払います", "令和5年の問題は、支払われた賃金（5,000円）が平均賃金の100分の60（4,200円）以上だったので「発生しない」が正解でした。数字を変えると結論が変わります", "差額を支払うという部分はAIの知識によります"], "key": "05-5"}, {"type": "choice", "no": 6, "topic": "労働時間・休憩", "stem": "労働基準法に定める労働時間に関する次のアからオまでの記述のうち、誤っているものの組合せは、後記AからEまでのうちどれか。", "statements": [{"label": "ア", "text": "警備員が実作業に従事しない仮眠時間について、当該警備員が労働契約に基づき仮眠室における待機と警報や電話等に対して直ちに対応することが義務付けられており、そのような対応をすることが皆無に等しいなど実質的に上記義務付けがされていないと認めることができるような事情が存しない場合には、当該仮眠時間は労働基準法第32条の労働時間に当たるとするのが、最高裁判所の判例である。"}, {"label": "イ", "text": "労働安全衛生規則第44条の定めによる定期健康診断は、事業者にその実施が義務付けられているものであるから、その受診に要する時間は、労働時間として取り扱うものとされている。"}, {"label": "ウ", "text": "事業場に火災が発生した場合において、既に帰宅している所属労働者が任意に事業場に出勤し消火作業に従事したときは、一般に労働時間と解されている。"}, {"label": "エ", "text": "労働者が遅刻をし、その時間だけ通常の終業時刻を繰り下げて労働させる場合に、1日の実労働時間を通算すれば労働基準法第32条又は第40条の労働時間を超えないときは、同法第36条第1項に基づく協定及び同法第37条に基づく割増賃金の支払の必要はない。"}, {"label": "オ", "text": "労働者が事業主を異にする複数の事業場で労働する場合、労働基準法第38条第1項により、法定労働時間に関する規定のほか、同法第34条に定める休憩に関する規定の適用についても、労働時間を通算することとされている。"}], "choices": [{"label": "A", "text": "（アとウ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（イとオ）"}, {"label": "E", "text": "（ウとオ）"}], "answer": "D", "answerText": "<b>正解 D（イとオ）</b>", "explain": ["ア ○【過去問・判決】令和4年 問2E。大星ビル管理事件（最一小判 平14.2.28）", "<b>イ ✕</b>【過去問】令和4年 問2A（誤りの肢）と同じ論点。一般健康診断の受診時間は当然には労働時間とされない（特殊健康診断は労働時間）", "ウ ○【過去問】令和4年 問2Dは「一般に労働時間としないと解されている」として誤り", "エ ○【過去問】令和4年 問3C", "<b>オ ✕</b>【過去問】令和5年 問7C（誤りの肢）と同じ論点。休憩に関する規定の適用については通算されない"], "key": "05-6"}, {"type": "choice", "no": 7, "topic": "時間外労働・割増賃金", "stem": "労働基準法に定める労働時間、時間外・休日労働等に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働基準法第32条の3に定めるフレックスタイム制において、同法第36条第1項の協定を締結する際、1日について延長することができる時間を協定する必要はなく、1か月及び1年について協定すれば足りる。"}, {"label": "B", "text": "労働基準法第32条の2に定めるいわゆる1か月単位の変形労働時間制を労使協定を締結することにより採用する場合、当該労使協定を所轄労働基準監督署長に届け出ることによって、同変形労働時間制の効力が発生する。"}, {"label": "C", "text": "使用者は、物品の販売の事業、保健衛生の事業、接客娯楽の事業等のうち常時10人未満の労働者を使用するものについては、労働基準法第32条の規定にかかわらず、1週間について46時間、1日について8時間まで労働させることができる。"}, {"label": "D", "text": "使用者が労働基準法施行規則第23条によって日直を断続的勤務として許可を受けた場合であっても、休日に日直をさせるときは、同法第36条第1項の協定を締結し、所轄労働基準監督署長に届け出なければならない。"}, {"label": "E", "text": "労働基準法第37条第3項に基づくいわゆる代替休暇を与えることができる期間は、延長して労働させた時間が1か月について60時間を超えた当該1か月の末日の翌日から3か月以内の範囲内で、労使協定で定めた期間とされている。"}], "answer": "A", "answerText": "<b>正解 A</b>", "explain": ["A ○【過去問】令和5年 問7A", "<b>B ✕</b>【過去問】令和4年 問7B（誤りの肢）と同じ論点。届出は必要だが、届出は効力の発生要件ではない", "<b>C ✕</b>【過去問・条文】令和4年 問7A（誤りの肢）と同じ論点。特例は1週間<b>44時間</b>、1日8時間", "<b>D ✕</b>【過去問】令和4年 問3A（正しい肢）の逆。許可を受けた日直には第36条第1項の協定は不要", "<b>E ✕</b>【過去問】令和4年 問7D（正しい肢）は「<b>2か月</b>以内」"], "key": "05-7"}, {"type": "choice", "no": 8, "topic": "労働時間・休憩", "stem": "労働基準法に定める休憩に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "休憩時間は原則として一斉に与えなければならないが、道路による貨物の運送の事業及び倉庫における貨物の取扱いの事業には、この規定は適用されない。"}, {"label": "B", "text": "一昼夜交替制勤務は、2日間の所定労働時間を継続して勤務する場合であるから、労働基準法第34条により、2時間以上の休憩時間を労働時間の途中に与えなければならないとされている。"}, {"label": "C", "text": "休憩時間中の外出について所属長の許可を受けさせることは、事業場内において自由に休息し得る場合には、必ずしも休憩時間の自由利用を定めた労働基準法第34条第3項に違反しない。"}, {"label": "D", "text": "工場の事務所において、昼食休憩時間に来客当番として待機させた場合であっても、結果的に来客が1人もなかったときは、当該時間は休憩時間を与えたものとして取り扱われる。"}, {"label": "E", "text": "使用者は、労働基準法第33条の「災害その他避けることのできない事由」によって臨時の必要がある場合において、行政官庁の許可を受けて労働時間を延長するときは、その必要の限度において、同法第34条の休憩時間を与えないことができる。"}], "answer": "C", "answerText": "<b>正解 C</b>", "explain": ["<b>A ✕</b>【過去問】令和5年 問2ア（誤りの記述）と同じ論点。運送の事業は適用除外だが、倉庫における貨物の取扱い     else { n++; ok += h.ok; t.ok += h.ok; }
  });
  const topics = Object.values(topic).map(t => Object.assign(t, { rate: t.cloze ? Math.round(t.pts / (t.n * 5) * 100) : Math.round(t.ok / t.n * 100) }))
    .sort((a, b) => a.rate - b.rate || b.n - a.n);
  const missed = Object.values(last).filter(h => !h.ok).map(h => BYKEY[h.k]);
  const answered = Object.keys(last).length;
  return { n, ok, czN, czP, topics, missed, answered };
}

/* ---------- 問題の表示 ---------- */
function resultBox(ok, answerText, explain) {
  const r = el("div", "res " + (ok ? "ok" : "ng"));
  r.appendChild(el("div", "verdict " + (ok ? "ok" : "ng"), ok ? "正解" : "不正解"));
  r.appendChild(el("p", "", answerText));
  explain.forEach(t => r.appendChild(el("p", "", t)));
  return r;
}

function renderChoice(q, card) {
  q.statements.forEach(s => card.appendChild(el("p", "st", '<span class="lb">' + s.label + "</span>" + s.text)));
  const short = q.choices.every(c => c.text.length < 12);
  const btns = q.choices.map(c => {
    const b = el("button", "ch" + (short ? " short" : ""), '<span class="lb">' + c.label + "</span>" + c.text);
    b.type = "button";
    b.onclick = () => { state[q.key] = { pick: c.label, done: false }; saveState(); show(); };
    card.appendChild(b);
    return [c.label, b];
  });
  const next = el("button", "btn", "次へ"); next.type = "button"; card.appendChild(next);
  const slot = el("div"); card.appendChild(slot);
  next.onclick = () => {
    const st = state[q.key];
    if (st && st.done) { const n = card.nextElementSibling; if (n) n.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (!st || !st.pick) return;
    st.done = true; saveState(); record(q, st.pick === q.answer); show(); updateScore();
  };
  function show() {
    const st = state[q.key] || {};
    next.disabled = !st.pick;
    btns.forEach(([lb, b]) => b.classList.toggle("pick", !st.done && lb === st.pick));
    if (!st.done) return;
    btns.forEach(([lb, b]) => {
      b.disabled = true;
      if (lb === q.answer) b.classList.add("ok");
      else if (lb === st.pick) b.classList.add("ng");
    });
    slot.replaceChildren(resultBox(st.pick === q.answer, q.answerText, q.explain));
    if (card.nextElementSibling) next.textContent = "次の問題へ"; else next.remove();
    card.appendChild(next);
  }
  return show;
}

function renderCloze(q, card) {
  const pas = el("div", "passage");
  q.passage.forEach(p => pas.appendChild(el("p", "", p.replace(/［\s*([A-E])\s*］/g, '<span class="blank">$1</span>'))));
  card.appendChild(pas);
  const cur = (state[q.key] && state[q.key].picks) || {};
  const sels = ["A", "B", "C", "D", "E"].map(k => {
    const row = el("div", "sel");
    const lab = el("label", "", k); lab.htmlFor = "s" + q.key + k;
    const s = el("select"); s.id = "s" + q.key + k;
    s.appendChild(new Option("選択してください", ""));
    q.options.forEach(o => s.appendChild(new Option(o.mark + " " + o.text, o.mark)));
    s.value = cur[k] || "";
    row.append(lab, s); card.appendChild(row);
    return [k, s];
  });
  const btn = el("button", "btn", "次へ"); btn.type = "button"; card.appendChild(btn);
  const slot = el("div"); card.appendChild(slot);
  const points = picks => ["A", "B", "C", "D", "E"].filter(k => picks[k] === q.answers[k]).length;
  btn.onclick = () => {
    const picks = {}; sels.forEach(([k, s]) => picks[k] = s.value);
    state[q.key] = { picks, done: true }; saveState(); record(q, points(picks) >= 3, points(picks)); show(); updateScore();
  };
  function show() {
    const st = state[q.key];
    if (!st || !st.done) return;
    sels.forEach(([k, s]) => { const ok = st.picks[k] === q.answers[k]; s.disabled = true; s.classList.add(ok ? "ok" : "ng"); });
    btn.remove();
    const n = points(st.picks);
    const box = resultBox(n >= 3, q.answerText, q.explain);
    box.querySelector(".verdict").textContent = n + " / 5 点（基準点の目安は3点）";
    slot.replaceChildren(box);
  }
  return show;
}

function renderQuestions(root, list, showSet) {
  const shows = [];
  list.forEach((q, i) => {
    const card = el("section", "q");
    card.appendChild(el("div", "qno", (showSet ? q.setTitle + "　" : "") + "問" + q.no + (q.type === "cloze" ? "　選択式" : "　択一式") + '<span class="tp">' + q.topic + "</span>"));
    card.appendChild(el("div", "stem", q.stem));
    root.appendChild(card);
    shows.push([q, card]);
  });
  // 次のカードがあるかで「次の問題へ」の表示が変わるため、全カードを置いてから中身を描く
  shows.forEach(([q, card]) => (q.type === "choice" ? renderChoice : renderCloze)(q, card)());
}

function currentList() { return view === "review" ? reviewList : DATA.sets[+view].questions; }
function updateScore() {
  let done = 0, ok = 0, total = 0, cz = "";
  currentList().forEach(q => {
    const st = state[q.key];
    if (q.type === "choice") { total++; if (st && st.done) { done++; if (st.pick === q.answer) ok++; } }
    else if (st && st.done) cz = "　選択式 " + ["A", "B", "C", "D", "E"].filter(k => st.picks[k] === q.answers[k]).length + "/5";
  });
  document.getElementById("score").textContent = "択一式 " + ok + "/" + total + "（解答済み " + done + "）" + cz;
}

/* ---------- 成績の表示 ---------- */
function summaryText(s) {
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  const lines = ["【社労士 練習問題の成績】" + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()),
    "択一式: " + s.ok + "/" + s.n + "問 正解" + (s.n ? "（" + Math.round(s.ok / s.n * 100) + "%）" : ""),
    "選択式: " + s.czP + "/" + s.czN * 5 + "点", "", "■分野別（正答率の低い順）"];
  s.topics.forEach(t => lines.push("・" + t.subject + "／" + t.topic + ": " + t.rate + "%（" + (t.cloze ? t.pts + "/" + t.n * 5 + "点" : t.ok + "/" + t.n + "問") + "）"));
  lines.push("", "■最後に間違えた問題");
  if (!s.missed.length) lines.push("・なし");
  s.missed.forEach(q => lines.push("・" + q.setTitle + " 問" + q.no + "（" + q.topic + "）"));
  return lines.join("\n");
}

function renderStats(root) {
  const s = stats();
  if (!s.answered) {
    root.appendChild(el("div", "note", "<b>まだ解答の記録がありません。</b><br>問題を解いて「次へ」を押すと、ここに分野別の正答率が出ます。"));
    return;
  }
  const k = el("div", "kpis");
  k.appendChild(el("div", "kpi", '<div class="lab">択一式の正答率</div><div class="big">' + (s.n ? Math.round(s.ok / s.n * 100) + "%" : "—") + "<small>" + s.ok + "/" + s.n + "問</small></div>"));
  k.appendChild(el("div", "kpi", '<div class="lab">選択式の得点</div><div class="big">' + (s.czN ? s.czP + "<small>/" + s.czN * 5 + "点</small>" : "—") + "</div>"));
  root.appendChild(k);
  root.appendChild(el("p", "hint", "解いた問題 " + s.answered + " / " + ALL.length + "問。同じ問題を解き直した分も、回数に数えています。"));

  const sec = el("section", "q");
  sec.appendChild(el("h2", "", "分野別の正答率（低い順）"));
  s.topics.forEach(t => {
    const row = el("div", "row");
    const tag = t.n < FEW ? '<span class="tag few">解答数が少ない</span>' : (t.rate < WEAK ? '<span class="tag weak">苦手</span>' : "");
    row.appendChild(el("div", "top", '<span class="name">' + t.topic + tag + '</span><span class="val">' + t.rate + "%<small>" + (t.cloze ? t.pts + "/" + t.n * 5 + "点" : t.ok + "/" + t.n + "問") + "</small></span>"));
    const tr = el("div", "track"); const f = el("div", "fill" + (t.rate < WEAK ? " low" : "")); f.style.width = t.rate + "%"; tr.appendChild(f); row.appendChild(tr);
    sec.appendChild(row);
  });
  sec.appendChild(el("p", "hint", "正答率が" + WEAK + "%未満の分野に「苦手」と表示します。解答数が" + FEW + "問未満の分野は、まだ判断できる数ではありません。"));
  root.appendChild(sec);

  const ms = el("section", "q");
  ms.appendChild(el("h2", "", "最後に間違えた問題（" + s.missed.length + "問）"));
  if (!s.missed.length) ms.appendChild(el("p", "miss", "ありません。"));
  s.missed.forEach(q => ms.appendChild(el("p", "miss", "・" + q.setTitle + " 問" + q.no + "　" + q.topic)));
  if (s.missed.length) {
    const b = el("button", "btn", "間違えた問題だけ解き直す"); b.type = "button";
    b.onclick = () => { reviewList = s.missed.slice(); state = {}; view = "review"; render(); window.scrollTo(0, 0); };
    ms.appendChild(b);
  }
  root.appendChild(ms);

  const ex = el("section", "q");
  ex.appendChild(el("h2", "", "成績をAIに渡す"));
  ex.appendChild(el("p", "hint", "下のボタンで成績をコピーして、Claudeとの会話に貼り付けてください。苦手分野に合わせて勉強計画や問題を調整できます。"));
  const cp = el("button", "btn", "成績をコピー"); cp.type = "button";
  const ta = el("textarea"); ta.rows = 8; ta.readOnly = true; ta.value = summaryText(s);
  cp.onclick = async () => {
    try { await navigator.clipboard.writeText(ta.value); cp.textContent = "コピーしました"; }
    catch (e) { ta.focus(); ta.select(); cp.textContent = "下の文を選択してコピーしてください"; }
  };
  ex.append(cp, ta);
  root.appendChild(ex);

  const del = el("button", "btn ghost", "解答の記録をすべて消す"); del.type = "button";
  del.onclick = () => {
    if (!confirm("これまでの解答の記録をすべて消しますか？")) return;
    hist = []; LS.set("shikaku-quiz:hist", hist);
    DATA.sets.forEach(x => LS.set("shikaku-quiz:v3:" + x.id, {}));
    render();
  };
  root.appendChild(del);
}

/* ---------- 全体 ---------- */
function renderTabs() {
  const box = document.getElementById("tabs"); box.replaceChildren();
  const add = (id, label) => {
    const b = el("button", "tab" + (view === id ? " on" : ""), label); b.type = "button";
    b.onclick = () => { view = id; LS.set("shikaku-quiz:view", id); render(); window.scrollTo(0, 0); };
    box.appendChild(b);
  };
  DATA.sets.forEach((s, i) => add(String(i), s.title + "（" + s.questions.length + "問）"));
  add("stats", "成績・苦手分野");
  if (view === "review") { const b = el("button", "tab on", "復習（" + reviewList.length + "問）"); b.type = "button"; box.appendChild(b); }
}

function render() {
  if (view !== "stats" && view !== "review" && !DATA.sets[+view]) view = "0";
  renderTabs();
  const root = document.getElementById("main"); root.replaceChildren();
  const bar = document.getElementById("bar");
  if (view === "stats") { bar.style.display = "none"; renderStats(root); return; }
  bar.style.display = "";
  if (view === "review") {
    root.appendChild(el("div", "note", "<b>復習</b>　最後に間違えた問題だけを出しています。ここでの解答も成績に記録されます。"));
    renderQuestions(root, reviewList, true);
  } else {
    state = LS.get(stateKey(), {});
    root.appendChild(el("div", "note", "<b>AIが作成したオリジナル問題です。本試験の過去問ではありません。</b><br>条文・最高裁判決の本文・過去の本試験で正誤が確定している内容を根拠に作っていますが、誤りを含む可能性があります。法改正にも追随していません。迷ったら最新のテキストを正としてください。<br>解説の印: 【過去問】本試験の公式正答で確認した内容／【判決】最高裁判決の本文／【条文】法令の条文／【AI】AIの知識によるもの"));
    renderQuestions(root, DATA.sets[+view].questions, false);
  }
  updateScore();
}

document.getElementById("reset").onclick = () => {
  if (!confirm("この画面の解答を消して、もう一度解きますか？（成績の記録は残ります）")) return;
  state = {}; saveState(); render(); window.scrollTo(0, 0);
};
render();
</script>
