前支払期月に支払うべきであった児童手当又は支給すべき事由が消滅した場合におけるその期の児童手当は、その支払期月でない月であっても、支払うものとする。"}, {"label": "エ", "text": "児童手当を支給すべきでないにもかかわらず、児童手当の支給としての支払が行われたときは、その支払われた児童手当は、その後に支払うべき児童手当の内払とみなすことができない。"}, {"label": "オ", "text": "児童手当の支給を受ける権利は、これを行使することができる時から2年を経過したときは、時効によって消滅する。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとウ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（ウとオ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "D", "key": "R08-4-10", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R08-5", "title": "R8本試験 健保", "subject": "健康保険法", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和8年度（第58回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和8年4月10日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "保険者は、被保険者又は被保険者であった者が、正当な理由なしに療養に関する指示に従わないときは、保険給付の一部を行わないことができる。療養の給付については、正当の理由なく療養の指揮に従わない顕著な事実があって、これを矯正するのに他の手段が行われ難い場合に限り制限の対象とする。"}, {"label": "B", "text": "高額療養費の時効起算日は、診療月の翌月の1日であり、傷病が月の途中で治癒した場合においても同様である。ただし、診療費の自己負担分を、診療月の翌月以後に支払ったときは、支払った日の翌日が起算日となる。"}, {"label": "C", "text": "保険者は、療養の給付若しくは入院時食事療養費、入院時生活療養費若しくは保険外併用療養費の支給（以下この項において「療養の給付等」という。）を行うことが困難であると認めるとき、又は被保険者が保険医療機関等以外の病院、診療所、薬局その他の者から診療、薬剤の支給若しくは手当を受けた場合において、保険者がやむを得ないものと認めるときは、療養の給付等に代えて、療養費を支給することができる。保険者がやむを得ないものと認める場合とは、疾病又は負傷等に際し直に診療又は手当を受けなければならないため、保険医のところに行って診療又は手当を受ける時間的余裕のない場合等通常の場合において保険医を選定することが不能又は著しく困難と認められる状態をいう。"}, {"label": "D", "text": "独立して生計を営む子が、健康保険法の適用を受けない事業所に勤務するうち疾病のため失業し、被保険者である父に扶養されるようになった場合、父の被扶養者として家族療養費は支給されない。"}, {"label": "E", "text": "被扶養者が健康保険組合である保険者が開設する病院若しくは診療所又は薬局から療養を受けた場合、保険者がその被扶養者の支払うべき療養に要した費用のうち家族療養費として被保険者に支給すべき額に相当する額の支払を免除したときは、被保険者に対し家族療養費の支給があったものとみなす。"}], "answer": "D", "key": "R08-5-1", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "被保険者（任意継続被保険者を除く。）は、その事業所に使用されなくなったときに至った日の翌日（その事実があった日に更に被保険者の資格を取得するに至ったときは、その日）から、被保険者の資格を喪失する。事実上の使用関係がなく、かつ、休業手当も支給されてはいないが、雇用契約が存続する場合には、被保険者の資格は喪失しない。"}, {"label": "B", "text": "被保険者の被扶養者が死亡したときは、家族埋葬料として、被保険者に対して5万円が支給される。死産児につき法律上埋葬を必要とするため、被保険者の経済的負担となる事実に鑑み死産の場合には、埋葬の事実に基づいて家族埋葬料を支給する。"}, {"label": "C", "text": "任意継続被保険者の申出は、被保険者の資格を喪失した日から20日以内にしなければならない。ただし、保険者は、被保険者の法律の不知は正当な理由であるとして、この期間を経過した後の申出であっても受理することができる。"}, {"label": "D", "text": "任意継続被保険者になった者が、保険者の被保険者の被扶養者となる要件を充足した場合、その日に任意継続被保険者としての資格を喪失する。"}, {"label": "E", "text": "被保険者の賞与額に関する健康保険法第48条の規定による届出は、賞与を支払った日から5日以内に、健康保険被保険者賞与支払届を日本年金機構又は健康保険組合に提出することによって行う。事業主は、同一月に2回以上賞与等の支払を行う場合にあっては、最後の賞与等の支払を行った後5日以内に、合算し一括して差し支えない。"}], "answer": "E", "key": "R08-5-2", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "人工妊娠中絶のうち妊娠4か月以上のものにあっては、療養の給付及び出産育児一時金の給付の対象となり、妊娠4か月未満のものにあっては、療養の給付のみが対象となる。ただし、療養の給付については単に経済的理由による場合には対象とはならない。"}, {"label": "B", "text": "賞与に係る報酬額は、標準報酬月額の定時決定又は7月、8月若しくは9月の随時改定の際、（ア）7月1日前の1年間に受けた賞与の額を12で除して得た額、（イ）7月1日以前1年内に諸規定により賞与の支給回数が変更され、新たに当該賞与が報酬に該当したときは、変更後の諸規定による賞与の支給回数等の支給条件であったとすれば同日前1年間に受けたであろう賞与の額を算定し、その額を12で除して得た額により算定する。"}, {"label": "C", "text": "被保険者に係る療養の給付等について、労災保険法の規定によりこれらに相当する給付を受けることができる場合には行わない。労災保険の任意適用事業所に使用される被保険者に係る通勤災害について、それが労災保険の保険関係の成立の日前に発生したものであるときは、健康保険等で給付される。ただし、事業主の申請により、保険関係成立の日から労災保険の通勤災害の給付が行われる場合はこの限りではない。"}, {"label": "D", "text": "高齢受給者証の交付を受けている者の一部負担金の割合について、随時改定により標準報酬月額が変更になり負担割合も変更する者については、負担割合が変更になるのは改定後の標準報酬月額が適用される月の翌月からである。"}, {"label": "E", "text": "日雇特例被保険者が家族埋葬料の支給を受けるには、死亡の日の属する月の前2か月間に通算して26日分以上又は当該月の前6か月間に通算して78日分以上の保険料が、その日雇特例被保険者について納付されていなければならない。"}], "answer": "D", "key": "R08-5-3", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "市町村長（特別区の区長を含むものとし、地方自治法第252条の19第1項の指定都市にあっては、区長又は総合区長とする。）は、保険者又は保険給付を受けるべき者に対して、当該市町村（特別区を含む。）の条例で定めるところにより、被保険者又は被保険者であった者の戸籍に関し、無料で証明を行うことができる。埋葬料又は埋葬費支給申請のときに添付する埋葬許可証又は火葬許可証の写しは、戸籍に関する証明に該当する。"}, {"label": "B", "text": "厚生労働大臣は、健康保険法第63条第2項第4号に規定する患者申出療養の申出を受けた場合において、当該申出に係る療養を患者申出療養として定めることとした場合には、その旨を当該申出を行った者に速やかに通知する。当該申出に係る療養を患者申出療養として定めないこととした場合には、その結果のみを当該申出を行った者に速やかに通知する。"}, {"label": "C", "text": "健康保険法第82条第2項によると、厚生労働大臣は、保険医療機関若しくは保険薬局に係る指定を行おうとするとき、若しくはその指定を取り消そうとするとき、又は保険医若しくは保険薬剤師に係る登録を取り消そうとするときは、政令で定めるところにより、地方社会保険医療協議会の議を経なければならない。"}, {"label": "D", "text": "被保険者が療養の給付（保険外併用療養費に係る療養を含む。）を受けるため、病院又は診療所に移送されたときは、移送費として、厚生労働省令で定めるところにより算定した金額を支給する。移送費は、厚生労働省令で定めるところにより、保険者が必要であると認める場合に限り、支給するものとする。保険者は、①移送により法に基づく適切な療養を受けたこと、②移送の原因である疾病又は負傷により移動をすることが著しく困難であったこと、③緊急その他やむを得なかったこと、以上のいずれにも該当すると認められる場合に移送費を支給する。したがって、通院なども一時的、緊急的な必要性があれば移送費の支給の対象となる。"}, {"label": "E", "text": "保険者は、被保険者の資格を取得した者があるときは、日、時間、出来高又は請負によって報酬が定められる場合、被保険者の資格を取得した月前1か月間に当該事業所において、同様の業務に従事し、かつ、同様の報酬を受ける者が受けた報酬の額を平均した額を報酬月額として、標準報酬月額を決定する。"}], "answer": "E", "key": "R08-5-4", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和8年度本試験", "stem": "健康保険法に関する次のアからオの記述のうち、誤っているものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "健康保険組合の会計年度は、毎年4月1日に始まり、翌年3月31日に終わる。健康保険組合は、毎年度、収入支出の予算を作成し、当該年度の開始前に、厚生労働大臣に届け出なければならない。これを変更したときも、同様である。また毎年度終了後6か月以内に事業及び決算に関する報告書を作成し、厚生労働大臣に提出しなければならない。さらに毎月の事業状況を翌月20日までに管轄地方厚生局長等に報告しなければならない。"}, {"label": "イ", "text": "健康保険組合は、規約において、名称、事務所の所在地、健康保険組合の設立に係る適用事業所の名称及び所在地、組合会に関する事項、役員に関する事項、組合員に関する事項、保険料に関する事項、準備金その他の財産の管理に関する事項、公告に関する事項などを定めなくてはならない。また、これらの規約内容のすべての変更は厚生労働大臣の認可を受けなければ、その効力を生じない。"}, {"label": "ウ", "text": "健康保険法第53条によると、保険者が健康保険組合である場合においては、同法第52条各号に掲げる保険給付に併せて、理事の定数の2分の1以上の同意があれば、保険給付としてその他の給付を行うことができる。"}, {"label": "エ", "text": "健康保険組合は、支払上現金に不足を生じたときは、準備金に属する現金を繰替使用し、又は一時借入金をすることができる。ただし、この繰替使用した金額及び一時借入金は、当該会計年度内に返還しなければならない。"}, {"label": "オ", "text": "健康保険組合連合会は、健康保険組合が管掌する健康保険の医療に関する給付、保健事業及び福祉事業の実施又は健康保険組合に係る前期高齢者納付金等、後期高齢者支援金等、日雇拠出金、介護納付金、流行初期医療確保拠出金等若しくは子ども・子育て支援納付金の納付に要する費用の財源の不均衡を調整するため、健康保険組合に対する交付金の交付事業を実施している。その事業の費用に充てるために、健康保険組合は調整保険料を徴収し、拠出金を健康保険組合連合会に拠出している。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとウ）"}, {"label": "D", "text": "（ウとオ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "C", "key": "R08-5-5", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "地域型健康保険組合とは、合併により設立された健康保険組合又は合併後存続する健康保険組合のうち、次のいずれの要件に該当するものをいう。①合併前の健康保険組合の設立事業所がいずれも同一都道府県の区域にあること、②当該合併が指定健康保険組合、被保険者の数が常時700人に満たなくなった又は共同して設立された場合は常時3,000人に満たなくなった健康保険組合その他事業運営基盤の安定が必要と認められる健康保険組合として厚生労働省令で定めるものを含むこと。"}, {"label": "B", "text": "傷病手当金は、被保険者（任意継続被保険者を除く。）が療養のため労務に服することができないときに、その労務に服することができなくなった日から起算して3日を経過した日から労務に服することができない期間に、支給される。そのため本来の職場では働けないが、本来の職場における労務に対する代替的性格をもたない副業の労務に従事して、賃金を得ることができるような場合は支給されない。"}, {"label": "C", "text": "法人である納付義務者が解散したとき、又は納付義務者に競売の開始があったとき、保険者は納期前であってもすべての保険料を徴収することができる。"}, {"label": "D", "text": "出産手当金は出産の日（出産の日が出産の予定日後になった場合は、出産の予定日）以前42日（多胎妊娠の場合は98日）から出産の日の後56日までの間において労務に服さなかった期間に支給される。"}, {"label": "E", "text": "被保険者が電子資格確認を受けることができない状況にあるときは、その被保険者は保険者に対し、当該状況にある被保険者の資格に係る情報に関する事項を記載した書面の交付又は当該事項の電磁的方法による提供を求めることができる。書面の交付を受け、若しくは電磁的方法により当該事項の提供を受けた被保険者は、それを保険医療機関の窓口において提示することにより、療養の給付を受ける場合の被保険者の資格の確認を受けることができる。"}], "answer": "B", "key": "R08-5-6", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "保険外併用療養費は、被保険者が保険医療機関等のうち自己の選定するものから、電子資格確認等により、被保険者であることの確認を受け、評価療養、患者申出療養又は選定療養を受けたときに、その療養に要した費用について支給される。"}, {"label": "B", "text": "健康保険法第160条の2によると、子ども・子育て支援金率については、各年度において全ての保険者が納付すべき子ども・子育て支援納付金の総額を当該年度における全ての保険者が管掌する被保険者の標準報酬月額の総額の見込額で除した率を基礎として、保険者が定めるとされている。"}, {"label": "C", "text": "出産育児一時金及び家族出産育児一時金の支給に要する費用の一部については、政令で定めるところにより、高齢者の医療の確保に関する法律の規定により社会保険診療報酬支払基金が保険者に対して交付する出産育児交付金が充てられている。"}, {"label": "D", "text": "産前産後休業を終了した被保険者が、当該産前産後休業を終了した日において当該産前産後休業に係る子を養育する場合において、その使用される事業所の事業主を経由して保険者等に申出をしたときは、保険者等は産前産後休業終了日の翌日が属する月以後3か月間（産前産後休業終了日の翌日において使用される事業所で継続して使用された期間に限るものとし、かつ、報酬支払の基礎となった日数が17日未満である月があるときは、その月を除く。）に受けた報酬の総額をその期間の月数で除して得た額を報酬月額として、標準報酬月額を改定する。"}, {"label": "E", "text": "健康保険法施行規則第44条によると、任意継続被保険者は、個人番号、氏名又は住所を変更したときは、5日以内に、変更前及び変更後の個人番号、氏名又は住所を保険者に届け出なければならない。ただし、住所の変更については、当該任意継続被保険者が健康保険組合が管掌する健康保険の任意継続被保険者であって、当該健康保険組合が当該任意継続被保険者に係る機構保存本人確認情報の提供を受けることができるとき（当該健康保険組合が、当該任意継続被保険者に対し、当該任意継続被保険者に係る情報の提供を求めないときに限る。）は、この限りでない。"}], "answer": "B", "key": "R08-5-7", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "健康保険法第115条第1項によると、療養の給付について支払われた一部負担金の額又は療養（食事療養及び生活療養を除く。）に要した費用の額からその療養に要した費用につき保険外併用療養費、療養費、訪問看護療養費、家族療養費若しくは家族訪問看護療養費として支給される額に相当する額を控除した額が著しく高額であるときは、その療養の給付又はその保険外併用療養費、療養費、訪問看護療養費、家族療養費若しくは家族訪問看護療養費の支給を受けた者に対し、高額療養費を支給する。"}, {"label": "B", "text": "全国健康保険協会が管掌する健康保険の被保険者が同一月内で健康保険組合が管掌する健康保険の被保険者となった場合の高額療養費は、同一の病院で受けた療養の給付であったとしても、診療報酬請求明細書（レセプト）がそれぞれの管掌者別に区分されるので、それぞれの管掌者ごとに支給対象となるか否かを判断する。"}, {"label": "C", "text": "被保険者の配偶者で届出をしていないが事実上婚姻関係と同様の事情にあるものの父母及び子であって、その被保険者と同一の世帯に属し、主としてその被保険者により生計を維持するものの場合、その配偶者の死亡後においてもその父母及び子であって、引き続きその被保険者と同一の世帯に属し、主としてその被保険者により生計を維持するものは被扶養者である。"}, {"label": "D", "text": "年収500万円の被保険者と同居している妻（令和8年4月1日現在21歳の大学生であって障害者ではない。）が、年間の見込収入額が144万円の場合、主としてその被保険者により生計を維持する者として被扶養者に認定される。"}, {"label": "E", "text": "年収700万円の被保険者と別居している子（令和8年4月1日現在19歳の大学生であって、実家から離れて被保険者から年間180万円の援助により生活しており、障害者ではない。）が、年間の見込収入額が145万円の場合、主としてその被保険者により生計を維持する者として被扶養者に認定される。"}], "answer": "D", "key": "R08-5-8", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和8年度本試験", "stem": "健康保険法に関する次のアからオの記述のうち、誤っているものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "被保険者に関する毎月の保険料は、翌月末日までに、納付しなければならない。ただし、任意継続被保険者に関する保険料については、その月の10日（初めて納付すべき保険料については、保険者が指定する日）までとする。"}, {"label": "イ", "text": "任意継続被保険者は、将来の一定期間の保険料を前納することができる。任意継続被保険者は自己の負担する保険料を納付する義務を負い、保険料の前納は、4月から9月まで若しくは10月から翌年3月までの6か月間又は4月から翌年3月までの12か月間を単位として行うものとする。ただし、当該6か月又は12か月の間において、任意継続被保険者の資格を取得した者又はその資格を喪失することが明らかである者については、当該6か月間又は12か月間のうち、その資格を取得した日の属する月の翌月以降の期間又はその資格を喪失する日の属する月の前月までの期間の保険料について前納を行うことができる。"}, {"label": "ウ", "text": "被保険者（任意継続被保険者を除く。）が療養のため労務に服することができないことにより傷病手当金を受給している期間中に65歳に達したことにより国民年金法及び厚生年金保険法による老齢を支給事由とする年金たる給付の支給を受けることができるときは、傷病手当金は、支給されない。ただし、その受けることができる老齢退職年金給付の額（当該老齢退職年金給付が2以上あるときは、当該2以上の老齢退職年金給付の額の合算額）につき厚生労働省令で定めるところにより算定した額が、傷病手当金の額より少ないときは、その差額が支給される。"}, {"label": "エ", "text": "被保険者の被扶養者が家族療養費に係る療養を受けるため、病院又は診療所に移送されたときは、家族移送費として、被保険者に対し、厚生労働省令で定めるところにより算定した金額が支給される。"}, {"label": "オ", "text": "被保険者の疾病又は負傷に関して、入院している場合における食事は医療の一環として提供されるべきものであり、それぞれ患者の病状に応じて必要とする栄養量が与えられ、食事の質の向上と患者サービスの改善をめざして行われるべきものである。また、生活療養の温度、照明及び給水に関する療養環境は医療の一環として形成されるべきものであり、それぞれの患者の病状に応じて適切に行われるべきものである。これらは健康保険法第63条第1項に定める療養の給付により提供される。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとオ）"}, {"label": "D", "text": "（ウとエ）"}, {"label": "E", "text": "（ウとオ）"}], "answer": "E", "key": "R08-5-9", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "定時決定の規定は、6月1日から7月1日までの間に被保険者の資格を取得した者には適用されない。6月1日に入社した者の資格取得時決定により決定された標準報酬月額は、同じ事業所にて定時決定された被保険者と同じ翌年の8月までの各月の標準報酬月額とされる。"}, {"label": "B", "text": "保険者等は、月給者の定時決定を行う場合、その被保険者が毎年4月1日現に使用される事業所において同日以後3か月間である4月、5月、6月に実際に支給された賃金や報酬の総額をもとに標準報酬月額を決定する。"}, {"label": "C", "text": "標準報酬月額の定時決定等における支払基礎日数の取扱いとして、月給者については各月の暦日数によることから、月給者で欠勤日数分に応じ給与が差し引かれる場合にあっては、その月における暦日の数から当該欠勤日数を控除した日数を支払基礎日数とする。"}, {"label": "D", "text": "保険者等は、被保険者が現に使用される事業所において継続した3か月間（その事業所で継続して使用された期間に限るものとし、かつ、報酬支払の基礎となった日数が17日未満である月があるときは、その月を除く。）に受けた報酬の総額をその期間の月数で除して得た額が、その者の標準報酬月額の基礎となった報酬月額に比べて、著しく高低を生じた場合において、必要があると認めるときは随時改定の対象となり、その額を報酬月額として、その著しく高低を生じた月の翌月から、標準報酬月額を改定することができる。"}, {"label": "E", "text": "健康保険法第199条第1項によると、保険者等は、被保険者の資格、標準報酬又は保険料に関し必要があると認めるときは、事業主に対し、事業所の名称、所在地その他必要な資料の提供を求め、又は銀行、信託会社その他の機関に対し、被保険者若しくは被保険者であると認められる者の収入の状況その他の事項につき、報告を求めることができる。"}], "answer": "A", "key": "R08-5-10", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R08-6", "title": "R8本試験 厚年", "subject": "厚生年金保険法", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和8年度（第58回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和8年4月10日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "障害等級2級に該当する程度の障害の状態であり、障害厚生年金の受給権者である甲について、障害等級に該当する程度の障害の状態に該当しなくなったことにより、当該障害厚生年金の支給が停止された。その後、甲が障害厚生年金の支給事由となった障害とは別の疾病により障害の状態となり、当該新たな疾病に係る障害認定日以後65歳に達する日の前日までの間において、当該障害厚生年金の支給事由となった障害と新たな障害とを併合した障害の程度が障害等級2級に該当する程度の障害の状態となった。この場合、当該障害厚生年金の支給停止は解除される。なお、新たな疾病の初診日において甲は被保険者であり、また、厚生年金保険法第47条第1項ただし書きで規定する保険料納付要件を満たしているものとする。"}, {"label": "B", "text": "障害厚生年金は、その受給権者が当該傷病について労働基準法第77条の規定による障害補償を受ける権利を取得したときは、7年間、その支給が停止される。"}, {"label": "C", "text": "厚生年金保険法第48条第1項の規定による前後の障害を併合した障害の程度による障害厚生年金の額の算定においては、併合されたそれぞれの障害に係る障害認定日のうちいずれか早い日の属する月後における被保険者期間は、その計算の基礎とされない。"}, {"label": "D", "text": "障害厚生年金の受給権者の配偶者であり、加給年金額加算の対象となっていた者が、老齢厚生年金（年金額の計算の基礎となる被保険者期間が120月であるとする。）の支給を受けることができるようになった。この場合、加給年金額の支給が停止される。"}, {"label": "E", "text": "障害厚生年金（障害等級1級又は2級）の受給権を取得した日に、当該受給権者によって生計を維持しているその者の65歳未満の配偶者がいる場合は、加給年金額の加算が行われるが、受給権を取得した日の翌日以後にその者によって生計を維持しているその者の65歳未満の配偶者を有することになった場合には加給年金額の加算は行われない。"}], "answer": "A", "key": "R08-6-1", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "常時5人以上の従業員を使用する社会保険労務士の事務所（法人ではないものとする。）は、当該事業所を適用事業所とするためには厚生労働大臣の認可を受ける必要がある。"}, {"label": "B", "text": "適用事業所となる船舶の船舶所有者は適用事業所の事業主とみなされるが、船舶賃借の場合は、船舶の所有者ではなく船舶借入人が事業主とみなされる。"}, {"label": "C", "text": "健康保険法第31条第2項による任意適用事業所の認可の申請と同時に厚生年金保険法第6条第4項による任意適用事業所の認可の申請を行う場合であっても、両者はそれぞれ個別に申請書を提出しなければならない。"}, {"label": "D", "text": "2以上の適用事業所（船舶ではないものとする。）の事業主が同一である場合には、当該事業主は、厚生労働大臣に届け出ることにより、当該2以上の事業所を1の適用事業所とすることができるが、この届出があった場合には、当該2以上の適用事業所は適用事業所でなくなったものとみなされる。"}, {"label": "E", "text": "適用事業所の事業主は、廃止、休止その他の事情により適用事業所に該当しなくなったときは、原則として、当該事実があった日から10日以内に、所定の事項を記載した届書を日本年金機構に提出しなければならないが、この届書には、登記事項証明書その他の適用事業所に該当しなくなったことを証する書類を添えなければならない。なお、当該事業主は船舶所有者ではなく、また、任意適用取消の申請は行っていないものとする。"}], "answer": "B", "key": "R08-6-2", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "1か月の期間を定めて臨時に使用される者で、定めた期間を超えて使用されることが見込まれないものは、厚生年金保険の被保険者とはならない。ただし、船舶所有者に使用される船員ではないものとする。"}, {"label": "B", "text": "2以上の種別の被保険者であった期間を有する者に係る老齢厚生年金について、厚生年金保険法第42条（受給権者）の規定を適用する場合においては、第1号厚生年金被保険者期間、第2号厚生年金被保険者期間、第3号厚生年金被保険者期間又は第4号厚生年金被保険者期間に係る被保険者期間ごとに適用するものとされている。"}, {"label": "C", "text": "厚生年金保険法第43条第2項に規定する在職定時改定は、同法附則第8条に規定する65歳未満の者に支給する特例による老齢厚生年金の額については、適用しない。"}, {"label": "D", "text": "特定適用事業所に使用される者で1週間の所定労働時間が同一の事業所に使用される通常の労働者の1週間の所定労働時間の4分の3未満である者は、1週間の所定労働時間が20時間以上であったとしても、その者が学校教育法に規定する大学の学生（卒業を予定している者であって、適用事業所に使用され、卒業した後も引き続き当該適用事業所に使用されることとなっているもの、休学中の者及び定時制の課程等に在学する者その他これらに準ずる者には該当しないものとする。）である場合には、厚生年金保険の被保険者とはならない。"}, {"label": "E", "text": "特定適用事業所に該当しなくなった適用事業所に使用される特定4分の3未満短時間労働者（厚生年金保険の被保険者の資格を有していたものとする。）については、事業主の申出がない場合であっても、特定適用事業所に該当しなくなった日の翌日に、厚生年金保険の被保険者の資格を喪失する。"}], "answer": "E", "key": "R08-6-3", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "遺族厚生年金の支給要件を満たす被保険者の死亡について労働基準法第79条による遺族補償の支給が行われるべきものであるときは、死亡の日から6年間、遺族厚生年金の支給が停止される。"}, {"label": "B", "text": "2以上の種別の被保険者であった期間を有する者の遺族に係る遺族厚生年金（厚生年金保険法第58条第1項第1号から第3号までのいずれかに該当することにより支給されるものに限る。）の額については、死亡した者に係る2以上の被保険者の種別に係る被保険者であった期間を合算し、1の期間に係る被保険者期間のみを有するものとみなして、遺族厚生年金の額の計算及びその支給停止に関する規定その他政令で定める規定が適用される。"}, {"label": "C", "text": "配偶者以外の者に対する遺族厚生年金の受給権者が2人以上である場合において、受給権者のうち1人以上の者の所在が1年以上明らかでないときは、その者に対する遺族厚生年金は、他の受給権者の申請によって、その所在が明らかでなくなった時にさかのぼって、その支給を停止する。"}, {"label": "D", "text": "被保険者である甲には妻の乙と10歳の子である丙がいたが、甲が死亡したことにより、乙と丙が遺族厚生年金の受給権者となった。その3年後、乙は丁と再婚し、丙は丁の養子となった。この場合、乙と丙の受給権は消滅する。"}, {"label": "E", "text": "被保険者であり老齢厚生年金の受給権者でもある戊は、令和8年3月31日に適用事業所を退職したことにより同年4月1日に被保険者の資格を喪失したが、その後、同年8月現在まで被保険者にはなっていない。この場合、厚生年金保険法第43条第3項に規定する退職改定として、同年4月から年金額が改定される。"}], "answer": "D", "key": "R08-6-4", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "65歳以後の在職老齢年金の計算で用いられる基本月額は、加給年金額を含む老齢厚生年金の額を12で除して得た額である。"}, {"label": "B", "text": "67歳の老齢厚生年金の受給者かつ厚生年金保険の被保険者で、在職老齢年金による支給停止を受けていた者が、令和8年8月1日に退職した。この退職の後に再就職する予定はない。この場合、令和8年8月分の老齢厚生年金は、在職老齢年金による支給停止の対象とはならない。"}, {"label": "C", "text": "67歳の老齢厚生年金の受給者かつ65歳到達以降、厚生年金保険の被保険者ではなかった者が、令和8年8月1日に就職し、厚生年金保険の被保険者の資格を取得した。この場合、令和8年8月分の老齢厚生年金は、在職老齢年金による支給停止の対象とはならない。"}, {"label": "D", "text": "報酬又は賞与の全部又は一部が、通貨以外のもので支払われる場合、その価額は、全国一律の基準で、厚生労働大臣が定める。"}, {"label": "E", "text": "当分の間、一定の要件を満たす60歳以上65歳未満である者は、65歳に達する前に老齢厚生年金の支給繰上げの請求をすることができる。現に国民年金の任意加入被保険者である者も、この請求をすることができる。"}], "answer": "C", "key": "R08-6-5", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "老齢厚生年金における加給年金額の加算対象となる配偶者が、国民年金法第30条の4の障害基礎年金を受給している場合は、当該加給年金額は支給停止となる。ただし、配偶者の前年所得に応じて、当該障害基礎年金の2分の1相当額が支給停止されているときは、加給年金額は支給停止とならない。"}, {"label": "B", "text": "甲は、高校卒業直後の4月1日に18歳で就職し、厚生年金保険の被保険者となった。入社2か月目に初診日のある傷病により、障害認定日に障害の状態が障害等級2級に該当すると認定された。障害認定日時点では19歳であった。20歳前に初診日があるため、甲には障害厚生年金は支給されず、20歳に達した日の属する月の翌月分から、国民年金法第30条の4に基づく障害基礎年金が支給される。"}, {"label": "C", "text": "加給年金額の対象者がいる老齢厚生年金の受給権者は、原則として、毎年、誕生日の属する月の翌月末日までに、生計維持確認届を日本年金機構に提出しなければならない。なお、当該老齢厚生年金の額の全部につき支給が停止されているときも、生計維持確認届の提出が必要である。"}, {"label": "D", "text": "「社会経済の変化を踏まえた年金制度の機能強化のための国民年金法等の一部を改正する等の法律」（令和7年法律第74号）により、法律の公布日の属する年度の翌年度から、次期財政検証作成年度の翌年度までの間は、厚生年金（報酬比例部分）の給付調整が継続される。この間、厚生年金では、マクロ経済スライドによる調整において、その調整率が軽減される。"}, {"label": "E", "text": "年金額は物価変動率などに応じて毎年度改定が行われるが、改定後の年金額が最初に支給されるのは4月の支給日である。"}], "answer": "D", "key": "R08-6-6", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "厚生年金保険法第56条の規定により、障害手当金は、原則として、厚生年金保険の年金たる保険給付の受給権者には支給されない。ただし、最後に障害等級に該当しなくなった日から起算して障害状態に該当することなく3年を経過した障害厚生年金の受給権者（現に障害状態に該当しない者に限る。）は支給対象となりうる。"}, {"label": "B", "text": "障害手当金を受ける権利は、その支給すべき事由が生じた日から5年を経過したときは、時効によって消滅する。"}, {"label": "C", "text": "障害厚生年金の受給権者で、障害の程度の診査が必要であると認めて厚生労働大臣が指定したものは、厚生労働大臣が指定した年において、指定日までに、指定日前の1年以内に作成されたその障害の現状に関する医師等の診断書を日本年金機構に提出しなければならない。ただし、当該障害厚生年金の額の全部につき支給が停止されているときは、この限りでない。"}, {"label": "D", "text": "実施機関は、合意分割（厚生年金保険法第78条の2に規定する離婚等をした場合における標準報酬の改定の特例をいう。）の規定により標準報酬の改定又は決定を行ったときは、その旨を通知しなければならない。その通知の対象となるのは、対象期間標準報酬総額が多く、分割を行う側である第1号改定者と、対象期間標準報酬総額が少なく、分割を受ける側である第2号改定者の双方である。"}, {"label": "E", "text": "厚生年金保険法第100条第1項に基づく立入検査は、適用事業所の事業主に対してだけでなく、厚生年金保険の適用が行われていないものの、適用事業所であると認められる事業所の事業主に対しても行うことができる。"}], "answer": "C", "key": "R08-6-7", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "死亡した被保険者の子は、被保険者死亡の当時、年齢が19歳で婚姻をしていたとしても、障害等級2級に該当する障害の状態にあり、かつ、被保険者によって生計を維持していれば、遺族厚生年金を受けることができる遺族に含まれる。なお、死亡した被保険者によって生計を維持していた他の遺族はいないものとする。"}, {"label": "B", "text": "死亡した被保険者の配偶者の母は、被保険者死亡の当時に年齢が55歳以上、かつ、被保険者によって生計を維持していたとしても、遺族厚生年金を受けることができる遺族には含まれない。なお、死亡した被保険者によって生計を維持していた他の遺族はいないものとする。"}, {"label": "C", "text": "厚生年金保険法第9条及び第10条第1項の規定にかかわらず、同法第12条の規定により、所在地が一定しない事業所に使用される者は、厚生年金保険の被保険者とはならない。ただし、継続して6か月を超えて使用されるべき場合は、この限りでない。"}, {"label": "D", "text": "厚生年金保険法第9条及び第10条第1項の規定にかかわらず、同法第12条の規定により、臨時的事業の事業所に使用される者は、厚生年金保険の被保険者とはならない。ただし、継続して2か月を超えて使用されるべき場合は、この限りでない。"}, {"label": "E", "text": "障害等級3級に該当する障害厚生年金を受給している者が65歳に到達し、老齢基礎年金と老齢厚生年金の受給権も取得した場合、老齢基礎年金と老齢厚生年金の組み合わせか、老齢基礎年金と障害厚生年金の組み合わせのどちらかを選択する必要がある。"}], "answer": "B", "key": "R08-6-8", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次のアからオの記述のうち、正しいものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "67歳到達時点で老齢厚生年金の支給繰下げの申出を行った場合において、経過的加算として老齢厚生年金に加算される部分についても、当該老齢厚生年金の支給繰下げの申出に応じた増額の対象となる。"}, {"label": "イ", "text": "65歳から支給される老齢厚生年金に配偶者加給年金額が加算される場合において、68歳到達時点で老齢厚生年金の支給繰下げの申出を行ったときは、当該配偶者加給年金額は、老齢厚生年金の支給繰下げの申出に応じた増額の対象となる。"}, {"label": "ウ", "text": "積立金の運用に係る行政事務に従事する厚生労働省、財務省、総務省及び文部科学省の職員（政令で定める者に限る。）は、積立金の運用の目的に沿って、慎重かつ細心の注意を払い、全力を挙げてその職務を遂行しなければならない。"}, {"label": "エ", "text": "65歳未満の特別支給の老齢厚生年金を受給していた者が、65歳に到達し、厚生年金保険法第42条に規定する本来の老齢厚生年金をその時点から受給しようとする場合は、実施機関に請求書を提出する必要はない。"}, {"label": "オ", "text": "第1号厚生年金被保険者に係る適用事業所の事業主は、被保険者が70歳に到達し、引き続き当該事業所に使用されることにより70歳以上の使用される者の要件に該当する場合において、当該者の標準報酬月額に相当する額が70歳到達日の前日における標準報酬月額と同額であっても、70歳以上被用者該当届及び70歳到達時の被保険者資格喪失届を省略することができない。"}], "choices": [{"label": "A", "text": "（アとウ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（イとオ）"}, {"label": "E", "text": "（ウとオ）"}], "answer": "A", "key": "R08-6-9", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次のアからオの記述のうち、正しいものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "障害厚生年金の受給権者は、実施機関に対し、障害の程度が増進したことによる障害厚生年金の額の改定を請求することができるが、当該請求については、障害厚生年金の受給権者の障害の程度が増進したことが明らかである場合として厚生労働省令で定める場合を除き、当該障害厚生年金の受給権を取得した日又は実施機関の診査を受けた日から起算して1年6か月を経過した日後でなければ行うことができない。"}, {"label": "イ", "text": "障害手当金の額は、障害厚生年金の額の規定の例により計算した額の100分の200に相当する額と定められているが、当該障害厚生年金の額の計算の基礎となる被保険者期間の月数が300に満たない場合も、実際の被保険者期間の月数で計算されることとなっている。"}, {"label": "ウ", "text": "第1号厚生年金被保険者が死亡したことにより、死亡した被保険者の母が遺族厚生年金の受給権者となった場合において、その後、当該母に届出をしていないが、事実上婚姻関係と同様の事情にある配偶者が生じたときは、当該母の遺族厚生年金の受給権は消滅する。"}, {"label": "エ", "text": "厚生年金保険法第78条の7に規定する離婚時みなし被保険者期間については、老齢厚生年金の配偶者加給年金額が加算されるために必要な要件の1つとなっている老齢厚生年金の額の計算の基礎となる被保険者期間の月数の中に含めることができる。"}, {"label": "オ", "text": "昭和38年10月7日生まれで、令和8年10月に63歳となる女性について、第1号厚生年金被保険者期間のみを有し、特別支給の老齢厚生年金の受給資格要件を満たす（長期加入者や障害者などの特例には該当していない。）場合、報酬比例部分の支給開始年齢も63歳である。"}], "choices": [{"label": "A", "text": "（アとウ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（イとオ）"}, {"label": "E", "text": "（ウとオ）"}], "answer": "E", "key": "R08-6-10", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R08-7", "title": "R8本試験 国年", "subject": "国民年金法", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和8年度（第58回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和8年4月10日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和8年度本試験", "stem": "国民年金法に関する次のアからオの記述のうち、誤っているものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "保険料の一部免除に関する規定により納付することを要しないものとされたその一部の額以外の残余の額に50円未満の端数が生じたときはこれを切り捨て、50円以上100円未満の端数が生じたときはこれを100円に切り上げるものとする。"}, {"label": "イ", "text": "国民年金法第90条の3第1項の規定により保険料を納付することを要しないものとされた被保険者は、国民年金法施行令第6条の6に規定する生徒若しくは学生でなくなったとき（その原因が卒業であるときを除く。）は、氏名、生年月日及び住所並びに個人番号又は基礎年金番号を記載した届書を日本年金機構に提出しなければならない。"}, {"label": "ウ", "text": "納付猶予とは、第1号被保険者等本人（50歳未満）及びその世帯主又は配偶者のいずれもが、地方税法に定める障害者、寡婦その他の同法の規定による市町村民税が課されない者として政令で定める者であって、当該保険料を納付することを要しないものとすべき月の属する年の前年の所得が135万円以下であるとき、当該第1号被保険者等が厚生労働大臣に申請することにより、保険料の全額の納付義務を猶予する制度である。"}, {"label": "エ", "text": "法定免除、全額免除、学生納付特例又は納付猶予の規定により納付することを要しないものとされた保険料の一部につき追納をするときは、学生納付特例又は納付猶予の規定により納付することを要しないものとされた保険料につき行い、次いで法定免除若しくは全額免除、一部免除の規定によりその一部の額につき納付することを要しないものとされた保険料につき行うものとし、これらの保険料のうちにあっては、先に経過した月の分から順次に行うものとする。なお、学生納付特例又は納付猶予により納付を免除された保険料より前に法定免除、全額免除及び申請一部免除により納付を免除された保険料は一切ないものとする。"}, {"label": "オ", "text": "厚生労働大臣は、国民年金法第96条第1項の規定による督促を受けた者がその指定の期限までに保険料その他この法律の規定による徴収金を納付しないときは、国税滞納処分の例によってこれを処分し、又は滞納者の居住地若しくはその者の財産所在地の市町村に対して、その処分を請求することができる。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとウ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（ウとオ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "B", "key": "R08-7-1", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和8年度本試験", "stem": "国民年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "障害基礎年金、遺族基礎年金又は寡婦年金は、その受給権者が他の年金給付（付加年金を除く。）又は厚生年金保険法による年金たる保険給付（当該年金給付と同一の支給事由に基づいて支給されるものを除く。）を受けることができるときは、その間、その支給を停止する。"}, {"label": "B", "text": "年金給付（国民年金法の他の規定又は他の法令の規定によりその全額につき支給を停止されている年金給付を除く。）につき、その全額の支給を停止する受給権者の申出は、申出の時点に遡って撤回することができる。"}, {"label": "C", "text": "自己の故意の犯罪行為若しくは重大な過失により、又は正当な理由がなくて療養に関する指示に従わないことにより、死亡又はその原因となった事故を生じさせた者の死亡については、これを支給事由とする給付を一時差し止めることができる。"}, {"label": "D", "text": "障害認定日は、初診日から起算して1年6か月を経過した日（その期間内にその傷病が治った場合においては、その治った日（その症状が固定し治療の効果が期待できない状態に至った日を含む。））とされるが、人工透析療法を受けている場合には透析を始めてから3か月を経過した日（初診日から起算して1年6か月を超える場合を除く。）が障害認定日とされる。"}, {"label": "E", "text": "死亡一時金の支給を受ける者が第1号被保険者の死亡により寡婦年金を受けることができるときは、死亡一時金と寡婦年金とのうち、死亡日から6年間、その1つを支給し、他は支給を停止する。"}], "answer": "D", "key": "R08-7-2", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和8年度本試験", "stem": "国民年金法における産前産後期間の保険料免除制度に関する次のアからオの記述のうち、正しいものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "産前産後期間の保険料免除制度により保険料を納付することを要しないこととされた期間について、当該期間中に生活保護法による生活扶助を受けるときは、国民年金法第89条第1項第2号に該当するため、同条により保険料が免除される。"}, {"label": "イ", "text": "産前産後の保険料免除期間は、死亡一時金及び脱退一時金の支給要件において、保険料納付済期間に算入される。"}, {"label": "ウ", "text": "産前産後期間の保険料免除に関わる出産とは、妊娠85日（4か月）以上の分娩をいい、早産、死産、流産及び人工妊娠中絶を含む。"}, {"label": "エ", "text": "国民年金に任意加入している被保険者は、産前産後保険料免除の対象となり、保険料の負担を免除される。"}, {"label": "オ", "text": "保険料の納付期限から2年を経過したとき以降、産前産後の保険料免除に係る届出を行うことはできない。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとウ）"}, {"label": "D", "text": "（ウとオ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "C", "key": "R08-7-3", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和8年度本試験", "stem": "国民年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "任意加入被保険者として保険料を前納した者が、前納期間の途中で第1号被保険者資格を取得した場合に当該被保険者が希望したときは、未経過期間に係る前納保険料の還付請求を求めず、当該期間を第1号被保険者の保険料納付済期間として算入させる。"}, {"label": "B", "text": "第1号被保険者として保険料を前納した者が、前納期間の途中で国民年金法第88条の2の規定により産前産後期間の保険料納付義務が免除される場合は、未経過期間に係る前納保険料の還付請求を求めず、当該保険料を免除期間後の保険料として充当する。"}, {"label": "C", "text": "第1号被保険者として保険料を前納した者が、前納期間の途中で第2号被保険者資格を取得したときは、未経過期間に係る前納保険料の還付請求を求めず、当該期間を第2号被保険者の保険料納付済期間として算入させる。"}, {"label": "D", "text": "保険料を前納した者が、前納期間の途中で障害基礎年金の受給権者となったときは、既に納付した前納保険料は、その全額が保険料納付済期間として将来の老齢基礎年金の額に反映されるため、還付請求できない。"}, {"label": "E", "text": "障害基礎年金の受給権者は、保険料納付を要しないため、保険料の前納はできない。"}], "answer": "A", "key": "R08-7-4", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和8年度本試験", "stem": "国民年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "国民年金法第89条第1項等の規定により納付を要しないとされた保険料の全部又は一部につき追納できるのは、被保険者又は被保険者であった者であり、障害基礎年金の受給権者は該当しない。"}, {"label": "B", "text": "保険料を追納できる期間は、老齢基礎年金の受給権を得る前で、追納申請が厚生労働大臣に承認された日の属する月前5年以内の期間に限られる。"}, {"label": "C", "text": "保険料の一部の額につき納付することを要しないものとされた保険料について追納するには、その残余の額につき納付されていなければならない。"}, {"label": "D", "text": "平成15年10月生まれの大学生が、20歳となった令和5年の誕生日月から令和8年3月末に卒業するまで学生納付特例の承認を受けた。この者が、令和10年10月に初めて追納を開始する場合の保険料額は、学生納付特例の承認を受けた当時の保険料額である。"}, {"label": "E", "text": "申請免除等の始期は、申請日の属する月の5年前とされていることから、保険料の納期限から5年を経過していない期間について、遡って保険料免除申請及び納付猶予申請ができる。"}], "answer": "C", "key": "R08-7-5", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和8年度本試験", "stem": "国民年金法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "厚生年金保険の被保険者の資格を取得したときは、その者が20歳未満でも、国民年金の第2号被保険者資格を取得する。"}, {"label": "B", "text": "国民年金法第109条の2の2第1項に規定する学生等被保険者が学生納付特例事務法人に学生納付特例申請をしたときは、学生等被保険者により提出された申請書類を、当該法人が日本年金機構に提出した日に学生納付特例申請があったものとみなす。"}, {"label": "C", "text": "国民年金第1号被保険者の甲は、日本国内に住所を有しなくなった日に、さらに国民年金第2号被保険者に該当するに至った。この場合、甲は、国民年金第２号被保険者に該当するに至った日に国民年金第1号被保険者資格を喪失する。"}, {"label": "D", "text": "第3号被保険者とは、第2号被保険者の被扶養配偶者のうち20歳以上60歳未満の者のことであるが、被扶養配偶者の認定については令和8年4月1日以降、認定対象者の年間収入が、労働条件通知書等の労働契約の内容が確認できる書類において規定される時給・労働時間・日数等を用いて算出した年間収入の見込み額が基準額未満である場合を想定し、労働契約段階では見込み難い時間外労働に対する賃金等の臨時収入を含めないで判定される。"}, {"label": "E", "text": "第1号被保険者及び第3号被保険者は、第2号被保険者に該当することとなった場合を除き、60歳に達した日に国民年金の被保険者の資格を喪失する。"}], "answer": "B", "key": "R08-7-6", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和8年度本試験", "stem": "国民年金法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "国民年金法第109条の2に規定された指定全額免除申請事務取扱者は、基準に該当する被保険者又は被保険者であった者に対して納付勧奨及び免除勧奨を行うこととされ、基準に該当する被保険者又は被保険者であった者より委託を受けて全額免除申請及び納付猶予申請を行うことができる。"}, {"label": "B", "text": "昭和61年3月31日までの期間において、厚生年金保険の被保険者の配偶者であったため、国民年金の任意加入被保険者となることができた期間は、老齢基礎年金の合算対象期間とされるが、この期間に任意加入の申出を行い任意加入被保険者となったものの保険料を納付しなかった場合は合算対象期間とはされない。"}, {"label": "C", "text": "障害基礎年金の受給権は、厚生年金保険法第47条第2項に規定する障害等級に該当する程度の障害の状態に該当しなくなった日から起算して障害厚生年金の障害等級に該当する程度の障害の状態に該当することなく3年を経過したときは消滅する。ただし、3年を経過した日において、当該受給権者が65歳未満であるときを除く。"}, {"label": "D", "text": "死亡日の前日において遺族基礎年金の保険料納付要件を満たした第3号被保険者が死亡したときに、その者に生計を維持する子（国民年金法第37条の2第1項第2号に該当する子）がいた場合は、その者と生計を同じくしていた配偶者の収入が将来にわたって厚生労働大臣の定める金額未満であれば、当該配偶者に遺族基礎年金が支給される。"}, {"label": "E", "text": "初診日の前日において障害基礎年金の保険料納付要件を満たした第3号被保険者が国民年金法第30条第2項に規定する障害等級に該当したときに、その者に生計を維持する子（18歳に達する日以後の最初の3月31日までの間にある子及び20歳未満であって障害等級に該当する障害の状態にある子）がいる場合は、その者の障害基礎年金の額に子の加算が行われる。"}], "answer": "B", "key": "R08-7-7", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和8年度本試験", "stem": "国民年金法に関する次のアからオの記述のうち、正しいものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "政府は、国民年金法第4条の3第1項の規定により作成する「財政の現況及び見通し」において、年金たる給付（付加年金を含む。）の額の調整を行う必要がなくなったと認められるときは、政令で、調整期間の終了年度を定めるものとされている。"}, {"label": "イ", "text": "国民年金法第94条第1項の規定により保険料の追納が行われたときは、追納が行われた日に、追納に係る月の保険料が納付されたものとみなすこととなっている。"}, {"label": "ウ", "text": "国民年金法第93条第1項の規定により保険料の前納が行われたときは、保険料納付済期間又は保険料4分の3免除期間、保険料半額免除期間若しくは保険料4分の1免除期間を計算する場合においては、前納が行われた日に、前納に係る期間の各月の保険料が納付されたものとみなすこととなっている。"}, {"label": "エ", "text": "付加保険料を納付する第1号被保険者が、国民年金基金の加入員となったときは、その加入員となった日の前日に、付加保険料の納付の辞退の申出をしたものとみなされる。"}, {"label": "オ", "text": "国民年金基金連合会には、評議員で組織する評議員会が置かれ、規約の変更、毎事業年度の予算、毎事業年度の事業報告及び決算その他規約で定める事項については、評議員会の議決を経なければならない。"}], "choices": [{"label": "A", "text": "（アとウ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（イとオ）"}, {"label": "E", "text": "（ウとオ）"}], "answer": "D", "key": "R08-7-8", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和8年度本試験", "stem": "国民年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "老齢基礎年金の振替加算について、年齢要件については大正15年4月2日から昭和41年4月1日までの間に生まれた者であるが、その額については、受給権者の老齢基礎年金の額に受給権者の生年月日に応じて政令で定められた率を乗じて得た額となる。"}, {"label": "B", "text": "振替加算が加算された老齢基礎年金の受給権者が、遺族厚生年金の支給を受けることができるときは、その間、振替加算の額に相当する部分の支給が停止される。"}, {"label": "C", "text": "付加年金の額は、200円に付加保険料に係る保険料納付済期間の月数を乗じて得た額とされており、老齢基礎年金の支給繰下げの申出を行った場合においても付加年金は支給の繰下げは行われず、支給額が増額されることもない。"}, {"label": "D", "text": "受給権者が、正当な理由がなくて、国民年金法第105条第3項の規定による届出をせず、又は書類その他の物件を提出しないときは、年金給付の支給は停止されることとなっている。"}, {"label": "E", "text": "国民年金法による学生の保険料の納付特例の規定により、保険料を納付することを要しないものとされた期間については、その期間に係る保険料が追納されない限り、老齢基礎年金の額には反映されない。"}], "answer": "E", "key": "R08-7-9", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和8年度本試験", "stem": "国民年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "年金の支払においては、毎支払期月ごとに支払われる金額に1円未満の端数が生じたときは、これを切り捨てるものとされているが、毎年5月から翌年4月までの間において切り捨てた金額の合計額（1円未満の端数が生じたときは、これを切り捨てた額）については、これを当該4月の支払期月の年金額に加算するものとする。"}, {"label": "B", "text": "厚生労働大臣は、国民年金制度に対する国民の理解を増進させ、及びその信頼を向上させるため、厚生労働省令で定めるところにより、被保険者に対し、当該被保険者の保険料納付の実績及び将来の給付に関する必要な情報を分かりやすい形で通知するものとされているが、当該被保険者が35歳、45歳及び55歳に達する日の属する年度における通知については、被保険者の資格の取得及び喪失並びに種別の変更の履歴や国民年金保険料の納付状況なども通知することとなっている。"}, {"label": "C", "text": "配偶者が遺族基礎年金の受給権を取得した当時胎児であった子が生まれたときは、その子は、配偶者がその権利を取得した当時遺族基礎年金の遺族の範囲に該当するものとされるが、遺族基礎年金の額については、その子が生まれた日の属する月から改定される。"}, {"label": "D", "text": "期間を定めて支給を停止されている障害基礎年金の受給権者に対して、更に障害基礎年金を支給すべき事由が生じたときは、併合認定の規定により支給する前後の障害を併合した障害の程度による障害基礎年金は、従前の障害基礎年金の支給を停止すべきであった期間、その支給を停止するものとし、その間、その者に従前の障害を併合しない障害の程度による障害基礎年金を支給する。"}, {"label": "E", "text": "死亡日の属する月の前月までの第1号被保険者としての被保険者期間に係る死亡日の前日における付加保険料納付済期間が2年以上である者の遺族に支給される死亡一時金の額には、一律8,500円が加算される。"}], "answer": "D", "key": "R08-7-10", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}]};
const WEAK = 60;   // この正答率(%)未満を「苦手」と表示する
const FEW = 3;     // 解答数がこれ未満の分野は「解答数が少ない」と表示する
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const el = (tag, cls, htmlText) => { const n = document.createElement(tag); if (cls) n.className = cls; if (htmlText != null) n.innerHTML = htmlText; return n; };
const hit = (q, p) => !!p && q.answer.indexOf(p) >= 0;   // 複数正答の過去問は answer が "DE" のようになる
const ALL = DATA.sets.flatMap(s => s.questions.map(q => Object.assign(q, { setTitle: s.title, subject: s.subject })));
const BYKEY = Object.fromEntries(ALL.map(q => [q.key, q]));

let view = LS.get("shikaku-quiz:view", "0");   // "0","1"…＝問題集、"stats"＝成績、"review"＝復習
let state = {};                                 // いま画面に出している問題の解答状況
let hist = LS.get("shikaku-quiz:hist", []);     // 解答の履歴 [{k, ok, p, t}]
let reviewList = [];

const stateKey = () => "shikaku-quiz:v3:" + DATA.sets[+view].id;
const saveState = () => { if (view !== "review" && view !== "stats") LS.set(stateKey(), state); };
function record(q, ok, points) {
  hist.push({ k: q.key, ok: ok ? 1 : 0, p: points == null ? null : points, t: Date.now() });
  LS.set("shikaku-quiz:hist", hist);
}

/* ---------- 集計 ---------- */
function stats() {
  const last = {}, topic = {};
  let n = 0, ok = 0, czN = 0, czP = 0;
  hist.forEach(h => {
    const q = BYKEY[h.k]; if (!q) return;
    last[h.k] = h;
    const key = q.subject + "｜" + q.topic;
    const t = topic[key] || (topic[key] = { subject: q.subject, topic: q.topic, n: 0, ok: 0, cloze: q.type === "cloze", pts: 0 });
    t.n++;
    if (q.type === "cloze") { czN++; czP += h.p; t.pts += h.p; t.ok += h.p >= 3 ? 1 : 0; }
    else { n++; ok += h.ok; t.ok += h.ok; }
  });
  const topics = Object.values(topic).map(t => Object.assign(t, { rate: t.cloze ? Math.round(t.pts / (t.n * 5) * 100) : Math.round(t.ok / t.n * 100) }))
    .sort((a, b) => a.rate - b.rate || b.n - a.n);
  const missed = Object.values(last).filter(h => !h.ok).map(h => BYKEY[h.k]);
  const answered = Object.keys(last).length;
  return { n, ok, czN, czP, topics, missed, answered };
}

/* ---------- 問題の表示 ---------- */
function resultBox(ok, answerText, explain) {
  const r = el("div", "res " + (ok ? "ok" : "ng"));
  r.appendChild(el("div", "verdict " + (ok ? "ok" : "ng"), ok ? "正解" : "不正解"));
  r.appendChild(el("p", "", answerText));
  explain.forEach(t => r.appendChild(el("p", "", t)));
  return r;
}

function renderChoice(q, card) {
  q.statements.forEach(s => card.appendChild(el("p", "st", '<span class="lb">' + s.label + "</span>" + s.text)));
  const short = q.choices.every(c => c.text.length < 12);
  const btns = q.choices.map(c => {
    const b = el("button", "ch" + (short ? " short" : ""), '<span class="lb">' + c.label + "</span>" + c.text);
    b.type = "button";
    b.onclick = () => { state[q.key] = { pick: c.label, done: false }; saveState(); show(); };
    card.appendChild(b);
    return [c.label, b];
  });
  const next = el("button", "btn", "次へ"); next.type = "button"; card.appendChild(next);
  const slot = el("div"); card.appendChild(slot);
  next.onclick = () => {
    const st = state[q.key];
    if (st && st.done) { const n = card.nextElementSibling; if (n) n.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (!st || !st.pick) return;
    st.done = true; saveState(); record(q, hit(q, st.pick)); show(); updateScore();
  };
  function show() {
    const st = state[q.key] || {};
    next.disabled = !st.pick;
    btns.forEach(([lb, b]) => b.classList.toggle("pick", !st.done && lb === st.pick));
    if (!st.done) return;
    btns.forEach(([lb, b]) => {
      b.disabled = true;
      if (hit(q, lb)) b.classList.add("ok");
      else if (lb === st.pick) b.classList.add("ng");
    });
    slot.replaceChildren(resultBox(hit(q, st.pick), q.answerText, q.explain));
    if (card.nextElementSibling) next.textContent = "次の問題へ"; else next.remove();
    card.appendChild(next);
  }
  return show;
}

function renderCloze(q, card) {
  const pas = el("div", "passage");
  q.passage.forEach(p => pas.appendChild(el("p", "", p.replace(/［\s*([A-E])\s*］/g, '<span class="blank">$1</span>'))));
  card.appendChild(pas);
  const cur = (state[q.key] && state[q.key].picks) || {};
  const sels = ["A", "B", "C", "D", "E"].map(k => {
    const row = el("div", "sel");
    const lab = el("label", "", k); lab.htmlFor = "s" + q.key + k;
    const s = el("select"); s.id = "s" + q.key + k;
    s.appendChild(new Option("選択してください", ""));
    q.options.forEach(o => s.appendChild(new Option(o.mark + " " + o.text, o.mark)));
    s.value = cur[k] || "";
    row.append(lab, s); card.appendChild(row);
    return [k, s];
  });
  const btn = el("button", "btn", "次へ"); btn.type = "button"; card.appendChild(btn);
  const slot = el("div"); card.appendChild(slot);
  const points = picks => ["A", "B", "C", "D", "E"].filter(k => picks[k] === q.answers[k]).length;
  btn.onclick = () => {
    const picks = {}; sels.forEach(([k, s]) => picks[k] = s.value);
    state[q.key] = { picks, done: true }; saveState(); record(q, points(picks) >= 3, points(picks)); show(); updateScore();
  };
  function show() {
    const st = state[q.key];
    if (!st || !st.done) return;
    sels.forEach(([k, s]) => { const ok = st.picks[k] === q.answers[k]; s.disabled = true; s.classList.add(ok ? "ok" : "ng"); });
    btn.remove();
    const n = points(st.picks);
    const box = resultBox(n >= 3, q.answerText, q.explain);
    box.querySelector(".verdict").textContent = n + " / 5 点（基準点の目安は3点）";
    slot.replaceChildren(box);
  }
  return show;
}

function renderQuestions(root, list, showSet) {
  const shows = [];
  list.forEach((q, i) => {
    const card = el("section", "q");
    card.appendChild(el("div", "qno", (showSet ? q.setTitle + "　" : "") + "問" + q.no + (q.type === "cloze" ? "　選択式" : "　択一式") + '<span class="tp">' + q.topic + "</span>"));
    card.appendChild(el("div", "stem", q.stem));
    root.appendChild(card);
    shows.push([q, card]);
  });
  // 次のカードがあるかで「次の問題へ」の表示が変わるため、全カードを置いてから中身を描く
  shows.forEach(([q, card]) => (q.type === "choice" ? renderChoice : renderCloze)(q, card)());
}

function currentList() { return view === "review" ? reviewList : DATA.sets[+view].questions; }
function updateScore() {
  let done = 0, ok = 0, total = 0, cz = "";
  currentList().forEach(q => {
    const st = state[q.key];
    if (q.type === "choice") { total++; if (st && st.done) { done++; if (hit(q, st.pick)) ok++; } }
    else if (st && st.done) cz = "　選択式 " + ["A", "B", "C", "D", "E"].filter(k => st.picks[k] === q.answers[k]).length + "/5";
  });
  document.getElementById("score").textContent = "択一式 " + ok + "/" + total + "（解答済み " + done + "）" + cz;
}

/* ---------- 成績の表示 ---------- */
function summaryText(s) {
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  const lines = ["【社労士 練習問題の成績】" + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()),
    "択一式: " + s.ok + "/" + s.n + "問 正解" + (s.n ? "（" + Math.round(s.ok / s.n * 100) + "%）" : ""),
    "選択式: " + s.czP + "/" + s.czN * 5 + "点", "", "■分野別（正答率の低い順）"];
  s.topics.forEach(t => lines.push("・" + t.subject + "／" + t.topic + ": " + t.rate + "%（" + (t.cloze ? t.pts + "/" + t.n * 5 + "点" : t.ok + "/" + t.n + "問") + "）"));
  lines.push("", "■最後に間違えた問題");
  if (!s.missed.length) lines.push("・なし");
  s.missed.forEach(q => lines.push("・" + q.setTitle + " 問" + q.no + "（" + q.topic + "）"));
  return lines.join("\n");
}

function renderStats(root) {
  const s = stats();
  if (!s.answered) {
    root.appendChild(el("div", "note", "<b>まだ解答の記録がありません。</b><br>問題を解いて「次へ」を押すと、ここに分野別の正答率が出ます。"));
    return;
  }
  const k = el("div", "kpis");
  k.appendChild(el("div", "kpi", '<div class="lab">択一式の正答率</div><div class="big">' + (s.n ? Math.round(s.ok / s.n * 100) + "%" : "—") + "<small>" + s.ok + "/" + s.n + "問</small></div>"));
  k.appendChild(el("div", "kpi", '<div class="lab">選択式の得点</div><div class="big">' + (s.czN ? s.czP + "<small>/" + s.czN * 5 + "点</small>" : "—") + "</div>"));
  root.appendChild(k);
  root.appendChild(el("p", "hint", "解いた問題 " + s.answered + " / " + ALL.length + "問。同じ問題を解き直した分も、回数に数えています。"));

  const sec = el("section", "q");
  sec.appendChild(el("h2", "", "分野別の正答率（低い順）"));
  s.topics.forEach(t => {
    const row = el("div", "row");
    const tag = t.n < FEW ? '<span class="tag few">解答数が少ない</span>' : (t.rate < WEAK ? '<span class="tag weak">苦手</span>' : "");
    row.appendChild(el("div", "top", '<span class="name">' + t.subject + "／" + t.topic + tag + '</span><span class="val">' + t.rate + "%<small>" + (t.cloze ? t.pts + "/" + t.n * 5 + "点" : t.ok + "/" + t.n + "問") + "</small></span>"));
    const tr = el("div", "track"); const f = el("div", "fill" + (t.rate < WEAK ? " low" : "")); f.style.width = t.rate + "%"; tr.appendChild(f); row.appendChild(tr);
    sec.appendChild(row);
  });
  sec.appendChild(el("p", "hint", "正答率が" + WEAK + "%未満の分野に「苦手」と表示します。解答数が" + FEW + "問未満の分野は、まだ判断できる数ではありません。"));
  root.appendChild(sec);

  const ms = el("section", "q");
  ms.appendChild(el("h2", "", "最後に間違えた問題（" + s.missed.length + "問）"));
  if (!s.missed.length) ms.appendChild(el("p", "miss", "ありません。"));
  s.missed.forEach(q => ms.appendChild(el("p", "miss", "・" + q.setTitle + " 問" + q.no + "　" + q.topic)));
  if (s.missed.length) {
    const b = el("button", "btn", "間違えた問題だけ解き直す"); b.type = "button";
    b.onclick = () => { reviewList = s.missed.slice(); state = {}; view = "review"; render(); window.scrollTo(0, 0); };
    ms.appendChild(b);
  }
  root.appendChild(ms);

  const ex = el("section", "q");
  ex.appendChild(el("h2", "", "成績をAIに渡す"));
  ex.appendChild(el("p", "hint", "下のボタンで成績をコピーして、Claudeとの会話に貼り付けてください。苦手分野に合わせて勉強計画や問題を調整できます。"));
  const cp = el("button", "btn", "成績をコピー"); cp.type = "button";
  const ta = el("textarea"); ta.rows = 8; ta.readOnly = true; ta.value = summaryText(s);
  cp.onclick = async () => {
    try { await navigator.clipboard.writeText(ta.value); cp.textContent = "コピーしました"; }
    catch (e) { ta.focus(); ta.select(); cp.textContent = "下の文を選択してコピーしてください"; }
  };
  ex.append(cp, ta);
  root.appendChild(ex);

  const del = el("button", "btn ghost", "解答の記録をすべて消す"); del.type = "button";
  del.onclick = () => {
    if (!confirm("これまでの解答の記録をすべて消しますか？")) return;
    hist = []; LS.set("shikaku-quiz:hist", hist);
    DATA.sets.forEach(x => LS.set("shikaku-quiz:v3:" + x.id, {}));
    render();
  };
  root.appendChild(del);
}

/* ---------- 全体 ---------- */
function renderTabs() {
  const box = document.getElementById("tabs"); box.replaceChildren();
  const add = (id, label) => {
    const b = el("button", "tab" + (view === id ? " on" : ""), label); b.type = "button";
    b.onclick = () => { view = id; LS.set("shikaku-quiz:view", id); render(); window.scrollTo(0, 0); };
    box.appendChild(b);
  };
  DATA.sets.forEach((s, i) => add(String(i), s.title + "（" + s.questions.length + "問）"));
  add("stats", "成績・苦手分野");
  if (view === "review") { const b = el("button", "tab on", "復習（" + reviewList.length + "問）"); b.type = "button"; box.appendChild(b); }
}

function render() {
  if (view !== "stats" && view !== "review" && !DATA.sets[+view]) view = "0";
  renderTabs();
  const root = document.getElementById("main"); root.replaceChildren();
  const bar = document.getElementById("bar");
  if (view === "stats") { bar.style.display = "none"; renderStats(root); return; }
  bar.style.display = "";
  if (view === "review") {
    root.appendChild(el("div", "note", "<b>復習</b>　最後に間違えた問題だけを出しています。ここでの解答も成績に記録されます。"));
    renderQuestions(root, reviewList, true);
  } else {
    state = LS.get(stateKey(), {});
    const cs = DATA.sets[+view];
    if (cs.kind === "kakomon") root.appendChild(el("div", "note", "<b>本試験の過去問です。</b>解説はなく、正答だけが出ます。<br>" + cs.source));
    else root.appendChild(el("div", "note", "<b>AIが作成したオリジナル問題です。本試験の過去問ではありません。</b><br>条文・最高裁判決の本文・過去の本試験で正誤が確定している内容を根拠に作っていますが、誤りを含む可能性があります。法改正にも追随していません。迷ったら最新のテキストを正としてください。<br>解説の印: 【過去問】本試験の公式正答で確認した内容／【判決】最高裁判決の本文／【条文】法令の条文／【AI】AIの知識によるもの"));
    renderQuestions(root, DATA.sets[+view].questions, false);
  }
  updateScore();
}

document.getElementById("reset").onclick = () => {
  if (!confirm("この画面の解答を消して、もう一度解きますか？（成績の記録は残ります）")) return;
  state = {}; saveState(); render(); window.scrollTo(0, 0);
};
render();
</script>
</body>
</html>
