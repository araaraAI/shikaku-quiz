保険事業の執行に要する費用のうち、特定健康診査等の実施に要する費用の全部を補助することができる。"}, {"label": "B", "text": "健康保険法における被扶養者とは、日本国内に住所を有するもの又は外国において留学をする学生その他の日本国内に住所を有しないが、渡航目的その他の事情を考慮して日本国内に生活の基礎があると認められるものとして厚生労働省令で定めるものをいう。ただし、後期高齢者医療の被保険者等である者その他健康保険法の適用を除外すべき特別の理由がある者として厚生労働省令で定める者はこの限りではない。厚生労働省令で定める者とは、日本の国籍を有しない者であって、出入国管理及び難民認定法（以下「入管法」という。）第7条第1項第2号の規定に基づく入管法別表第1の5の表の下欄に掲げる活動として法務大臣が定める活動のうち、本邦において2年を超えない期間滞在し、観光、保養その他これらに類似する活動を行うものをいう。"}, {"label": "C", "text": "被保険者が、事業主夫婦の寝室に侵入し、就寝中の両人及び使用人に傷害を与えて、現場にて自殺した場合、被保険者の自殺による死亡は故意に基づく事故であり、自殺による埋葬料は支給されない。"}, {"label": "D", "text": "自動車事故による被害を受けた場合の医療保険の給付と自動車損害賠償保障法に基づく自動車損害賠償責任保険（以下「自賠責保険」という。）による給付の関係について、加害者が不明のひき逃げ等の場合や自賠責保険の補償の範囲を超える賠償義務が発生した場合には、被害者の加入する医療保険の保険者が給付を行ったとしても、その保険者は求償する相手先がないケースや結果的に求償が困難なケースが生じるので、医療保険の保険者は、求償する相手先がないことや結果的に求償が困難であることから医療保険の給付を行わない。"}, {"label": "E", "text": "高額療養費制度において、自己負担限度額を超える一部負担金の支払いの免除については、限度額適用認定証等を提示した場合だけではなく、健康保険証としての利用登録を行ったマイナンバーカード（以下「マイナ保険証」という。）により保険資格の確認を行う場合についても対象となっており、マイナ保険証を利用する場合には、医療機関等の窓口において、限度額適用認定証等を提示せずとも、自己負担限度額を超える一部負担金の支払いが免除される。"}], "answer": "E", "key": "R07-5-6", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和7年度本試験", "stem": "健康保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "保険者は、社会保険診療報酬支払基金等に健康保険法第205条の4第1項第2号又は第3号に掲げる事務を委託する場合は、厚生労働大臣若しくは健康保険組合が被保険者の資格の得喪の確認を行った日（事業主の届出による場合には、当該届出を受けた日）、当該保険者が任意継続被保険者の資格取得の申出を受けた日又は資格喪失の申出を受けた日の属する月の末日から5日以内に、当該確認、届出又は申出に係る被保険者の資格に係る情報を、電子情報処理組織を使用する方法その他の情報通信の技術を利用する方法により、社会保険診療報酬支払基金又は国民健康保険団体連合会に提供するものとする。"}, {"label": "B", "text": "出産育児一時金等（出産育児一時金及び家族出産育児一時金をいう。）の医療機関等（病院、診療所又は助産所をいう。）への直接支払制度は、被保険者等が医療機関等との間に、出産育児一時金等の支給申請及び受取に係る代理契約を締結の上、出産育児一時金等の額を限度として、医療機関等が被保険者等に代わって出産育児一時金等の支給申請及び受取を直接保険者と行うことにより、被保険者等があらかじめまとまった現金を用意した上で医療機関等の窓口において出産費用を支払う経済的負担の軽減を図るものである。"}, {"label": "C", "text": "資格確認書の書面による交付又は電磁的方法による提供を求める被保険者（以下本肢において「申請者」という。）は、申請者の氏名及び被保険者等記号・番号又は個人番号等を記載した申請書を保険者に提出して、その交付又は提供を申請しなければならない。この場合において、当該申請書の提出は、申請者が任意継続被保険者である場合を除き、事業主を経由して行うが、災害その他やむを得ない事情により、事業主を経由して行うことが困難であると保険者が認めるときは、事業主を経由することを要しない。"}, {"label": "D", "text": "短時間労働者の被保険者資格の取得要件について、常時50人を超えると見込んで特定適用事業所該当届を提出して適用された後、実際には常時50人を超えなかった場合は遡及取消となる。"}, {"label": "E", "text": "入院時生活療養費の額は、当該生活療養につき生活療養に要する平均的な費用の額を勘案して厚生労働大臣が定める基準により算定した費用の額（その額が現に当該生活療養に要した費用の額を超えるときは、当該現に生活療養に要した費用の額）から、平均的な家計における食費及び光熱水費の状況並びに病院及び診療所における生活療養に要する費用について介護保険法第51条の3第2項第1号に規定する食費の基準費用額及び同項第2号に規定する居住費の基準費用額に相当する費用の額を勘案して厚生労働大臣が定める額（所得の状況、病状の程度、治療の内容その他の事情をしん酌して厚生労働省令で定める者については、別に定める額）を控除した額である。"}], "answer": "D", "key": "R07-5-7", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和7年度本試験", "stem": "健康保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "被保険者が資格喪失後何らの手続をとることなく相当期間を経過したため、受給資格期間は満たしているが、資格喪失後の継続給付を受ける権利の一部が既に時効により消滅している場合、時効未完成の期間については同一の保険者から傷病手当金の給付を受けることができる。"}, {"label": "B", "text": "日本年金機構は、保険料の滞納処分等を行う場合には、あらかじめ財務大臣の認可を受けるとともに、滞納処分等実施規程に従い、税務署職員に行わせなければならない。"}, {"label": "C", "text": "健康保険組合が管掌する健康保険の被保険者に関する一般保険料率は、1,000分の30から1,000分の130までの範囲内において決定する。健康保険組合が一般保険料率を変更しようとするときは、理事長は、社会保障審議会の議を経てその変更について厚生労働大臣の認可を受けなければならない。"}, {"label": "D", "text": "保険者は、被保険者又は被保険者であった者の被扶養者が、正当な理由なしに療養に関する指示に従わないときは、当該被扶養者に係る保険給付の全部又は一部を行わないことができる。療養に関する指示に従わないときとは、保険者又は療養担当者の療養の指揮に関する明白な意志表示があったにもかかわらず、これに従わない者（作為又は不作為の場合を含む。）等をいう。"}, {"label": "E", "text": "選定療養において、後発医薬品（ジェネリック医薬品）のある先発医薬品（長期収載品）の処方を希望する場合、後発医薬品のある先発医薬品の薬価から当該先発医薬品の後発医薬品の薬価を控除して得た価格に4分の1を乗じて得た価格を用いて診療報酬の算定方法の例により算定した点数に10円を乗じて得た額を支払わなければならない。なお、後発医薬品がいくつか存在する場合は、薬価が一番高い後発医薬品との価格差により計算する。"}], "answer": "E", "key": "R07-5-8", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和7年度本試験", "stem": "健康保険法に関する次のアからオの記述のうち、正しいものはいくつあるか。", "statements": [{"label": "ア", "text": "被保険者が令和7年3月15日に出産した場合、令和7年3月分から健康保険法第159条に規定される育児休業期間中の保険料免除の対象となり、当該被保険者に関する保険料は徴収されない。"}, {"label": "イ", "text": "被保険者が令和7年2月3日の就業時間内において私傷病により救急搬送され、そのまま入院した場合、傷病手当金の待期期間の起算日はその翌日である同年2月4日となり、当該起算日以後の3日間連続して労務不能であれば待期期間を満たすことになる。"}, {"label": "ウ", "text": "被保険者が、介護休業期間中に私傷病により傷病手当金を受給する場合には、その期間内に事業主から介護休業手当等で報酬と認められるものが支給されているときは、傷病手当金の支給額について介護休業手当等との調整が行われる。なお、傷病手当金との調整の対象とされる報酬には、就業規則に基づき報酬支払の目的をもって支給された見舞金は含まれない。"}, {"label": "エ", "text": "被保険者の資格を喪失した後も引き続き傷病手当金を受給していた者が、当該傷病手当金を受けなくなった日後3か月以内に死亡したときは、被保険者であった者により生計を維持していた者であって、埋葬を行うものは埋葬料の支給を受けることができるが、当該埋葬料の支給を受けるべき者がない場合においては、埋葬を行った者が、埋葬料の金額の範囲内においてその埋葬に要した費用に相当する金額を受けることができる。"}, {"label": "オ", "text": "被保険者が令和7年1月1日に職場復帰し、育児休業等終了時改定に該当した場合は、改定後の標準報酬月額がその年の8月までの各月の標準報酬月額となる。なお、標準報酬月額の随時改定には該当しないものとする。"}], "choices": [{"label": "A", "text": "一つ"}, {"label": "B", "text": "二つ"}, {"label": "C", "text": "三つ"}, {"label": "D", "text": "四つ"}, {"label": "E", "text": "五つ"}], "answer": "B", "key": "R07-5-9", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和7年度本試験", "stem": "健康保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "保険者は、震災、風水害、火災その他これらに類する災害により、住宅、家財又はその他の財産について著しい損害を受けた被保険者であって、保険医療機関又は保険薬局に一部負担金を支払うことが困難であると認められるものに対し、一部負担金を減額することや一部負担金の支払を免除すること、保険医療機関又は保険薬局に対する支払に代えて一部負担金を直接に徴収することとし、その徴収を猶予することができるが、一部負担金等の徴収猶予については当該被保険者の申請により、6か月以内の期間を限って行うものとされている。"}, {"label": "B", "text": "同一の月に同一の保険医療機関において、入院中に脳神経外科で手術し、退院後に外来で脳神経内科を受診した場合、高額療養費の算定上、同一の保険医療機関で受けた療養とみなされる。"}, {"label": "C", "text": "不妊治療の経済的負担の軽減を図るため、近年高額の医療費がかかる不妊治療に要する費用に対する助成や支援が拡充され、令和4年度からは一般不妊治療や生殖補助医療が新たに保険適用されたところであるが、医療上必要があると認められない、患者の都合による精子の凍結又は融解を行った場合には健康保険法における選定療養の対象とされる。"}, {"label": "D", "text": "被保険者（年収300万円）と同居している母（58歳、障害者ではない。）は、年額100万円の遺族年金を受給しながらパートタイム労働者として勤務しているが、健康保険の被保険者にはなっていない。このとき、母のパートタイム労働者としての給与の年間収入額が120万円であった場合、母は当該被保険者の被扶養者になることができない。"}, {"label": "E", "text": "被保険者（年収500万円）と別居している単身世帯の父（68歳、障害者ではない。）が、日本国内に住所を有するものであって、年額130万円の老齢年金を受給しながら被保険者から年額150万円の援助を受けている場合には、父は当該被保険者の被扶養者になることができる。なお、父は老齢年金以外の収入はないものとする。"}], "answer": "B", "key": "R07-5-10", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R07-6", "title": "R7本試験 厚年", "subject": "厚生年金保険法", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和7年度（第57回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和7年4月11日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和7年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "年金の支給は、年金を支給すべき事由が生じた月の翌月から始め、権利が消滅した月で終わる。"}, {"label": "B", "text": "適用事業所である甲に使用されていた被保険者乙は、令和7年4月1日に甲に使用されなくなったが、同日、別の適用事業所である丙に使用されるに至り、被保険者資格の得喪が生じた。この場合、乙の甲での被保険者資格は令和7年4月1日に喪失し、乙は同日に丙での被保険者資格を取得する。"}, {"label": "C", "text": "厚生労働大臣は、被保険者の資格に関する決定に関し、必要があると認めるときは、適用事業所の事業主又は被保険者に対して、文書その他の物件を提出すべきことを命じることができる。"}, {"label": "D", "text": "老齢厚生年金の受給権者が、その受給権を取得した当時、加給年金額の加算の対象となる配偶者及び1人の子がいたが、受給権を取得した2年後に第2子が誕生した。この場合、当該第2子（受給権者によって生計を維持しているものとする。）については加給年金額の加算の対象とはならない。"}, {"label": "E", "text": "障害等級2級に該当する障害厚生年金の受給権者が、更に障害厚生年金の受給権を取得した。この場合、新たに取得した障害厚生年金が厚生年金保険法第54条第1項（障害補償による支給停止）の規定によりその支給を停止すべきものであるときは、その停止すべき期間、その者に対して従前の障害厚生年金が支給される。"}], "answer": "C", "key": "R07-6-1", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和7年度本試験", "stem": "合意分割（厚生年金保険法第78条の2に規定する離婚等をした場合における標準報酬の改定の特例をいう。）に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "甲と乙は離婚したが、合意分割の請求前に甲が死亡した。その後、乙は、甲の死亡した日から起算して15日目に、所定の事項が記載された公正証書を添えて合意分割の請求を行った。この場合、甲が死亡した日の前日に当該請求があったものとみなされる。"}, {"label": "B", "text": "合意分割の按分割合について当事者の合意のための協議が調わないとき、又は協議をすることができないときには、当事者の申立てにより、家庭裁判所が請求すべき按分割合を定めることができるが、この申立ては当事者の一方のみによってすることができる。"}, {"label": "C", "text": "当事者又はその一方は、原則として、実施機関に対し、標準報酬改定請求を行うために必要な情報の提供を請求することができるが、標準報酬改定請求後にはこの請求を行うことができない。"}, {"label": "D", "text": "対象期間標準報酬総額の算定において、対象期間の全部又は一部が平成15年4月1日前であるときは、同日前の対象期間に係る被保険者期間の各月の標準報酬月額に1．3を乗じて得た額並びに同日以後の対象期間に係る被保険者期間の各月の標準報酬月額（厚生年金保険法第26条第1項の規定により同項に規定する従前標準報酬月額が当該月の標準報酬月額とみなされた月にあっては、当該従前標準報酬月額）及び標準賞与額に、それぞれ当事者を受給権者とみなして対象期間の末日において適用される再評価率を乗じて得た額の総額が当該対象期間標準報酬総額とされる。"}, {"label": "E", "text": "老齢厚生年金の受給権者について、合意分割の標準報酬の改定又は決定が行われたときは、当該標準報酬の改定又は決定が行われた日の属する月の翌月から、年金の額が改定される。"}], "answer": "E", "key": "R07-6-2", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和7年度本試験", "stem": "事後重症の障害厚生年金（厚生年金保険法第47条の2第1項による障害厚生年金）及び基準障害の障害厚生年金（厚生年金保険法第47条の3第1項による障害厚生年金）に関する次のアからオの記述のうち、正しいものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "事後重症の障害厚生年金は、65歳に達する日の前日までに請求しなければならない。"}, {"label": "イ", "text": "基準障害の障害厚生年金の支給は、当該年金を支給すべき事由が生じた月から始められる。"}, {"label": "ウ", "text": "事後重症の障害厚生年金の対象は、障害等級1級及び2級のみである。"}, {"label": "エ", "text": "基準障害の障害厚生年金の対象は、障害等級1級、2級及び3級である。"}, {"label": "オ", "text": "繰上げ支給の老齢厚生年金の受給権者は、事後重症の障害厚生年金及び基準障害の障害厚生年金、いずれも請求することができない。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとオ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（ウとエ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "B", "key": "R07-6-3", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和7年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "保険給付の受給権者が死亡した場合の未支給の保険給付の支給を請求できる遺族の範囲については、厚生年金保険法第37条第1項に規定されているが、これには受給権者の死亡の当時その者と生計を同じくしていた受給権者の配偶者の甥は含まれない。"}, {"label": "B", "text": "事業主は、その厚生年金保険に関する書類を、その完結の日から3年間、保存しなければならない。"}, {"label": "C", "text": "老齢厚生年金の額に加算する加給年金の額の計算において、その額に50円未満の端数が生じたときはこれを切り捨て、50円以上100円未満の端数が生じたときはこれを100円に切り上げるものとされている。"}, {"label": "D", "text": "第3号厚生年金被保険者に係る事務を担当する実施機関としては地方公務員共済組合、全国市町村職員共済組合連合会及び地方公務員共済組合連合会があるが、厚生年金保険法第84条の5第1項の規定による拠出金の納付に関する事務は、地方公務員共済組合が行う。"}, {"label": "E", "text": "事故が第三者の行為によって生じた場合において、受給権者が、当該第三者から同一の事由について損害賠償を受けたときは、政府等は、その価額の限度で、保険給付をしないことができるとされているが、受給権者が当該第三者から損害賠償を受ける前に保険給付を受けたときは、政府が、受給権者が第三者に対して有する損害賠償の請求権を取得することはない。"}], "answer": "C", "key": "R07-6-4", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和7年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "65歳未満で特別支給の老齢厚生年金の受給権を有する者が、厚生年金保険の被保険者である月に高年齢雇用継続給付を受給できるときは、在職による年金の支給停止に加えて、年金の一部が支給停止される。これにより支給停止される年金額は、高年齢雇用継続給付の支給率の変更にあわせて、令和7年度より、最大で標準報酬月額の6％となった。"}, {"label": "B", "text": "厚生年金保険の適用事業所以外の事業所に使用される70歳以上の者で、高齢任意加入被保険者となっている者は、保険料の全額を負担する義務を負う。ただし、事業主の同意があるときは、被保険者と事業主の半額ずつの負担になる。"}, {"label": "C", "text": "2以上の船舶の船舶所有者が同一である場合には、当該2以上の船舶を1つの適用事業所とすることができるが、その際は、厚生労働大臣の承認を受けなければならない。"}, {"label": "D", "text": "障害基礎年金の支給を受けている者に子の加算が行われているとき（当該子について加算する額に相当する部分の全額につき支給停止されているときを除く。）に、当該子に係る加給年金額が加算された老齢厚生年金が併給されることとなった場合は、当該老齢厚生年金については、その間、当該子について加算する額に相当する部分の支給が停止される。"}, {"label": "E", "text": "国家公務員であった者が、令和7年7月21日に退職し、その翌日に厚生年金保険の被保険者資格を喪失した。その後、同年7月28日に民間企業に就職し、厚生年金保険の被保険者資格を取得した。この場合、同年7月は、第2号厚生年金被保険者であった月とみなされる。"}], "answer": "D", "key": "R07-6-5", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和7年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "被保険者期間が6月以上である日本国籍を有しない者（国民年金の被保険者でないものに限る。）であって、老齢厚生年金の受給資格期間を満たさない等の支給要件を満たした者は、脱退一時金の支給を請求することができる。ただし、その者が日本の永住資格を有するときは、この限りでない。"}, {"label": "B", "text": "脱退一時金の支給を受けた者は、その後、再び脱退一時金の支給要件を満たすことがあったとしても、脱退一時金の支給を請求することはできない。"}, {"label": "C", "text": "政府は、国民年金事業に関する財政の現況及び見通し又は厚生年金保険事業に関する財政の現況及び見通しの作成にあたり、その作成年のおおむね100年後に、国民年金法等の一部を改正する法律（平成16年法律第104号）附則第2条第1項の規定によって算出するいわゆるモデル年金の所得代替率が50％を下回ることが見込まれる場合、調整期間の終了について検討を行い、その結果に基づいて調整期間の終了その他の措置を講じなければならない。"}, {"label": "D", "text": "初診日は、原則として初めて治療目的で医療機関を受診した日とし、健康診断を受けた日（以下本肢において「健診日」という。）は初診日として取り扱わないこととされている。ただし、初めて治療目的で医療機関を受診した日の医証（医療機関による初診日の証明）を得られない場合であって、医学的見地からただちに治療が必要と認められる健診結果である場合については、請求者から健診日を初診日とするよう申立てがあれば、健診日を初診日とし、健診日を証明する資料を求めた上で、初診日を認めることができるとされている。"}, {"label": "E", "text": "障害等級2級の障害厚生年金を受給する夫が死亡し、子のいない妻が遺族厚生年金を受給する場合、夫死亡時の妻の年齢によっては、中高齢寡婦加算が行われることがある。ただし、当該死亡した夫の厚生年金保険の被保険者期間の月数が240未満である場合は、中高齢寡婦加算は行われない。"}], "answer": "D", "key": "R07-6-6", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和7年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "地方公共団体の議会の議員が老齢厚生年金の受給権者であるときは、当該議員が厚生年金保険の被保険者ではないとしても、議員報酬の月額及び期末手当の額と老齢厚生年金の額に応じて、老齢厚生年金の一部又は全額が支給停止となる。"}, {"label": "B", "text": "特定適用事業所以外の適用事業所（国又は地方公共団体の適用事業所を除く。）は、労使合意により、任意特定適用事業所の申出をすることができる。この労使合意を行う上での同意の対象となる者には、厚生年金保険法第27条に規定する70歳以上の使用される者は含まれない。"}, {"label": "C", "text": "障害等級2級の障害厚生年金の額は、老齢厚生年金の報酬比例部分の算定式により計算した額となる。ただし、年金額の計算の基礎となる被保険者期間の月数が300に満たないときは、これを300として計算する。また、生年月日に応じた給付乗率の引上げは行われない。"}, {"label": "D", "text": "厚生年金保険の被保険者が70歳に到達した場合は、被保険者資格を喪失する。その後、同一の事業所で同一の労働条件で勤務を継続したとしても、被保険者ではないため、厚生年金保険料を納付する必要はない。ただし、在職老齢年金の仕組みによる支給停止の対象となることがある。"}, {"label": "E", "text": "厚生年金保険法第42条に規定する老齢厚生年金を繰上げ受給している者で65歳に達していない場合は、在職定時改定が適用されない。"}], "answer": "B", "key": "R07-6-7", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和7年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "理美容の事業で、常時5人以上の従業員を使用する個人事業所は、厚生年金保険の強制適用事業所となる。"}, {"label": "B", "text": "被保険者が自殺により保険事故を自ら生じさせたときは、被保険者の遺族に対して、当該死亡を支給事由とする遺族厚生年金は支給しない。"}, {"label": "C", "text": "偽りその他不正の手段により保険給付を受けた者があるときは、実施機関は、受給額に相当する金額の全部又は一部をその者から徴収しなければならない。"}, {"label": "D", "text": "受給権者が、正当な理由がなく、厚生労働省令に定める事項の届出、又は書類その他の物件を提出しないときは、保険給付の支払いを差し止めることができる。その後、当該差止事由が消滅したときでも、差し止められた分の支給は行われない。"}, {"label": "E", "text": "被保険者に対する情報の提供として、実施機関は、被保険者に対し、保険料納付の実績及び将来の給付に関する必要な情報を通知している。厚生年金保険法施行規則は、この通知（厚生労働大臣が行うものに限る。）に記載する事項を規定しているが、その1つに、被保険者期間における標準報酬月額及び標準賞与額に応じた保険料（被保険者の負担するものに限る。）の総額がある。"}], "answer": "E", "key": "R07-6-8", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和7年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "厚生年金保険法第81条の2第1項に規定される育児休業期間中の厚生年金保険料の免除の規定について、育児休業等の期間が1か月以下の場合は、その月の標準報酬月額に係る保険料は免除されるが、その月の標準賞与額に係る保険料についても免除される。"}, {"label": "B", "text": "厚生労働大臣は、納入の告知をした保険料額が当該納付義務者が納付すべき保険料額を超えていることを知ったとき、又は納付した保険料額が当該納付義務者が納付すべき保険料額を超えていることを知ったときは、その超えている部分に関する納入の告知又は納付を、その納入の告知又は納付の日の翌日から1年以内の期日に納付されるべき保険料について納期を繰り上げてしたものとみなすことができる。"}, {"label": "C", "text": "事業主は、被保険者に対して通貨をもって賞与を支払う場合においては、被保険者の負担すべき標準賞与額に係る保険料に相当する額を当該賞与から控除することができる。なお、保険料を控除したときは、事業主は、保険料の控除に関する計算書を作成し、その控除額を被保険者に通知しなければならない。"}, {"label": "D", "text": "前月から引き続き厚生年金保険の被保険者の資格を有する65歳以後の老齢厚生年金の受給権者の総報酬月額相当額が改定された場合は、新たな総報酬月額相当額に基づいて支給停止額が再計算され、当該総報酬月額相当額の改定が行われた月の翌月から支給される年金額が改定される。"}, {"label": "E", "text": "60歳台前半において、障害等級2級の障害基礎年金及び障害厚生年金の受給権者が、雇用保険法の規定による基本手当を受けることができるときは、障害厚生年金については、基本手当との間で調整が行われるため、支給停止の対象となる。"}], "answer": "C", "key": "R07-6-9", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和7年度本試験", "stem": "厚生年金保険法に関する次のアからオの記述のうち、正しいものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "障害手当金の受給権者であって、当該障害に係る障害認定日において2以上の種別の被保険者であった期間を有する者に係る当該障害手当金の支給に関する事務は、当該障害に係る障害認定日における被保険者の種別に応じて、厚生年金保険法第2条の5第1項各号に定める実施機関が行う。"}, {"label": "イ", "text": "実施機関は、必要があると認めるときは、障害等級に該当する程度の障害の状態にあることにより、年金たる保険給付の受給権を有し、又は厚生年金保険法第44条第1項の規定によりその者について加給年金額の加算が行われている子に対して、その指定する医師の診断を受けるべきことを命じ又は当該職員をしてこれらの者の障害の状態を診断させることができる。"}, {"label": "ウ", "text": "遺族厚生年金（その受給権者が65歳に達しているものに限る。）は、その受給権者が老齢厚生年金の受給権を有するとき、当該老齢厚生年金の額に相当する部分の支給が停止される。なお、加給年金額が加算された老齢厚生年金についてもこの規定が適用されるため、加給年金額に相当する部分も含めて、当該遺族厚生年金は支給が停止される。"}, {"label": "エ", "text": "遺族厚生年金の受給権を取得した当時30歳未満の妻が、当該遺族厚生年金と同一の支給事由に基づく遺族基礎年金の受給権を取得しない場合、当該遺族厚生年金の受給権を取得した日から起算して3年を経過したときに遺族厚生年金の受給権は消滅する。"}, {"label": "オ", "text": "事業主が、正当な理由がなく、厚生年金保険法第27条の規定に違反して、被保険者（70歳以上の使用される者を含む。）の資格の取得及び喪失（70歳以上の使用される者にあっては、厚生労働省令で定める要件に該当するに至った日及び当該要件に該当しなくなった日）並びに報酬月額及び賞与額に関する事項について、厚生労働大臣に届け出なければならないにもかかわらず、これを届出せず又は虚偽の届出をした場合は、6か月以下の懲役又は50万円以下の罰金に処せられる。"}], "choices": [{"label": "A", "text": "（アとウ）"}, {"label": "B", "text": "（アとオ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（イとオ）"}, {"label": "E", "text": "（ウとエ）"}], "answer": "D", "key": "R07-6-10", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R07-7", "title": "R7本試験 国年", "subject": "国民年金法", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和7年度（第57回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和7年4月11日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和7年度本試験", "stem": "国民年金法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "給付を受ける権利は、その権利を有する者の請求に基づいて、厚生労働大臣が裁定する。また、脱退一時金についての裁定の請求は、国民年金法施行規則に定める事項を記載した請求書を日本年金機構に提出することによって行わなければならない。"}, {"label": "B", "text": "被保険者の資格に関する処分、給付に関する処分（共済組合等が行った障害基礎年金に係る障害の程度の診査に関する処分を除く。）又は保険料その他この法律の規定による徴収金に関する処分の取消の訴えは、当該処分についての審査請求に対する社会保険審査官の決定を経た後でなければ提起することができない。"}, {"label": "C", "text": "市町村長（特別区の区長を含む。）は、国民年金法第16条に規定する給付を受ける権利の裁定（国民年金法施行令第1条の2第3号イからトまでに掲げる給付を受ける権利の裁定に限る。）の請求の受理及びその請求に係る事実についての審査に関する事務に関して、請求書、申請書又は届書を受理したときは、必要な審査を行い、これを日本年金機構に送付しなければならない。"}, {"label": "D", "text": "厚生労働大臣は、国民年金法による年金たる給付の受給権の裁定をしたときは、原則として、国民年金法施行規則第65条第2項各号に掲げる事項を記載したその年金の年金証書を作成し、これを同条第1項で規定される通知書に添えて、その受給権者に交付しなければならない。"}, {"label": "E", "text": "老齢基礎年金の受給権者は、その個人番号を変更したときは、氏名、生年月日及び住所、変更前及び変更後の個人番号、個人番号の変更年月日を記載した届書を、速やかに、日本年金機構に提出しなければならない。"}], "answer": "B", "key": "R07-7-1", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和7年度本試験", "stem": "国民年金法に関する次のアからオの記述のうち、誤っているものはいくつあるか。", "statements": [{"label": "ア", "text": "被保険者（第3号被保険者を除く。）は、厚生労働省令の定めるところにより、その資格の取得及び喪失並びに種別の変更に関する事項並びに氏名及び住所の変更に関する事項を厚生労働大臣に届け出なければならない。"}, {"label": "イ", "text": "第3号被保険者は、厚生労働省令の定めるところにより、その資格の取得及び喪失並びに種別の変更に関する事項並びに氏名及び住所の変更に関する事項を厚生労働大臣に届け出なければならない。ただし、氏名及び住所の変更に関する事項であって厚生労働省令で定めるものについては、この限りでない。"}, {"label": "ウ", "text": "国民年金法において、「配偶者」、「夫」及び「妻」には、婚姻の届出をしていないが、事実上婚姻関係と同様の事情にある者を含むものとする。"}, {"label": "エ", "text": "主として第2号被保険者の収入により生計を維持することの認定は、健康保険法、国家公務員共済組合法、地方公務員等共済組合法及び私立学校教職員共済法における被扶養者の認定の取扱いを勘案して日本年金機構が行う。"}, {"label": "オ", "text": "20歳未満の者又は60歳以上の者は、厚生年金保険の被保険者の資格を取得するに至った日の翌日に、国民年金第2号被保険者の資格を取得する。"}], "choices": [{"label": "A", "text": "一つ"}, {"label": "B", "text": "二つ"}, {"label": "C", "text": "三つ"}, {"label": "D", "text": "四つ"}, {"label": "E", "text": "五つ"}], "answer": "B", "key": "R07-7-2", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和7年度本試験", "stem": "国民年金法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "国民年金法第30条の4の規定による障害基礎年金は、当該障害基礎年金の受給権者の前年の所得が政令で定める額を超えた場合に、その全部又は2分の1に相当する部分が支給停止される。"}, {"label": "B", "text": "「国民年金・厚生年金保険障害認定基準」によると、自閉症、アスペルガー症候群その他の広汎性発達障害、学習障害、注意欠陥多動性障害等の発達障害があり、社会性やコミュニケーション能力が乏しく、かつ、不適応な行動がみられるために日常生活への適応にあたって援助が必要である障害の状態のものは、知的障害等の他の障害を併発していなくても、当該発達障害のみで障害基礎年金の認定の対象となる。"}, {"label": "C", "text": "疾病にかかり、又は負傷し、かつ、その傷病（以下「基準傷病」という。）に係る初診日において、被保険者（被保険者であった者であって、日本国内に住所を有し、かつ60歳以上65歳未満であるものを含む。）であって、基準傷病以外の傷病により障害の状態にあるものが、基準傷病に係る障害認定日以後65歳に達する日の前日までの間において、初めて、基準傷病による障害（以下「基準障害」という。）と他の障害とを併合して障害等級に該当する程度の障害の状態に該当するに至ったとき（基準傷病の初診日が、基準傷病以外の傷病（基準傷病以外の傷病が2以上ある場合は、基準傷病以外のすべての傷病）の初診日以降であるときに限る。）は、その者に基準障害と他の障害とを併合した障害の程度による障害基礎年金を支給する。"}, {"label": "D", "text": "国民年金法第30条の4の規定による障害基礎年金は、受給権者が、恩給法に基づく年金たる給付、労災保険法の規定による年金たる給付その他の年金たる給付であって政令で定めるものを受けることができるとき、刑事施設、労役場その他これらに準ずる施設に拘禁されているとき、少年院その他これに準ずる施設に収容されているとき又は日本国内に住所を有しないときは、その該当する期間、その支給を停止する。"}, {"label": "E", "text": "国民年金法において、老齢基礎年金、障害基礎年金及び遺族基礎年金には失権が規定されているが、付加年金及び寡婦年金には失権が規定されていない。"}], "answer": "E", "key": "R07-7-3", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和7年度本試験", "stem": "国民年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "国民年金の被保険者期間を計算する場合には、被保険者資格を取得した日の属する月からその資格を喪失した日の属する月までをこれに算入する。"}, {"label": "B", "text": "被保険者の種別（国民年金の第1号被保険者、第2号被保険者、第3号被保険者のいずれであるかの区別をいう。）に変更があった月は、変更前の種別の被保険者であった月とみなす。"}, {"label": "C", "text": "震災、風水害、火災その他これらに類する災害により、被保険者あるいはその世帯主や配偶者が所有する住宅や家財その他の財産について、被害金額が、その価格のおおむね2分の1以上である損害を受けたときは、保険金や損害賠償金等により補充された金額の多寡にかかわらず、申請によって保険料の納付が全額免除される。"}, {"label": "D", "text": "租税その他の公課は、給付として支給された金銭を標準として課すことができないが、老齢基礎年金及び付加年金には、所得税、住民税等の租税を課すことができる。"}, {"label": "E", "text": "令和7年1月から、保険料を2年前納する場合に、最初の4月が到来するまで1か月分ずつ割引された保険料を口座振替し、4月から2年分（24か月分）の保険料をまとめて前納する2年前納（4月開始）という方法を選択できる。"}], "answer": "D", "key": "R07-7-4", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和7年度本試験", "stem": "国民年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "年金給付を受ける権利は、その支給すべき事由が生じた日から5年を経過すると時効によって消滅するため、障害認定日において、当該障害が、障害等級に該当する程度の障害の状態にない場合で、その後に障害の程度が増進したときでも、障害基礎年金の請求は、当該障害認定日から5年を経過する前に行わなければならない。"}, {"label": "B", "text": "失踪の宣告を受けたことにより死亡したとみなされた者の子に対する遺族基礎年金は、失踪の宣告を受けた日において子の年齢が18歳に達する日以後の最初の3月31日に達している場合であっても、失踪の宣告を受けた者の所在が明らかでなくなった日が、18歳に達する日以後の最初の3月31日までの間であれば、その日まで遡って受給できる。"}, {"label": "C", "text": "夫が死亡したことにより遺族基礎年金の受給権を有する妻が、直系姻族と養子縁組したときは、妻の受給権は消滅するが、子に対する遺族基礎年金の支給停止は解除される。"}, {"label": "D", "text": "遺族基礎年金の受給権を有する子が2人以上ある場合において、その子のうち1人以上の子の所在が1年以上明らかでないときは、その子に対する遺族基礎年金は、他の子の申請によって、その所在が明らかでなくなった時に遡って、その支給を停止する。"}, {"label": "E", "text": "失踪の宣告を受けた者に係る消滅時効の起算日は、死亡したとみなされた日の翌日であり、死亡したとみなされた日の翌日から2年を経過した後に、死亡一時金の請求権は時効によって消滅するため、死亡一時金は支給されない。"}], "answer": "D", "key": "R07-7-5", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和7年度本試験", "stem": "国民年金法に関する次のアからオの記述のうち、正しいものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "老齢基礎年金の支給を受ける権利は、受給資格期間が10年以上ある者が65歳に達した日から老齢基礎年金の請求をすることなく5年を経過した時に消滅する。そのため、72歳に達した時点で、老齢基礎年金を請求し、かつ、繰下げ申出をしないときは、繰下げ増額のない老齢基礎年金の支給を受けることとなる。"}, {"label": "イ", "text": "保険料を滞納している者の保険料納付義務は、厚生労働大臣による督促があったとしても、2年で消滅する。"}, {"label": "ウ", "text": "被保険者が、国民年金保険料の前納を口座振替によって行うことを申し出る時に、還付発生の場合の振込方法として、あらかじめ振替口座への振込を申し出ておくと、改めて請求しなくても保険料の還付の請求があったものとみなされる。"}, {"label": "エ", "text": "老齢基礎年金の受給権を有する者であって、かつ、他の年金給付（加給年金を除く。）又は厚生年金保険法による年金給付（老齢を支給事由とするものを除く。）の受給権者でない者による当該老齢基礎年金の支給繰下げの申出は、65歳に達する前に行わなければならない。"}, {"label": "オ", "text": "繰下げ待機中の老齢基礎年金の受給権者が、年金を請求せずに70歳に達した日後に死亡した場合に、遺族が未支給年金を請求する時は、特例的な繰下げみなし増額は適用されず、年金の支給を受ける権利が時効消滅していない過去5年分に限って支給されることになる。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとウ）"}, {"label": "D", "text": "（ウとオ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "D", "key": "R07-7-6", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和7年度本試験", "stem": "国民年金法に関する次のアからオの記述のうち、誤っているものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "日本の老齢基礎年金の受給資格期間である10年を満たさない者について、保険期間を通算する規定がある社会保障協定を締結している協定相手国の年金加入期間がある場合は、当該期間が、日本の老齢基礎年金の合算対象期間となるだけではなく、協定相手国の年金制度への納付済保険料総額が日本の老齢基礎年金の年金額の計算の基礎に含まれる。"}, {"label": "イ", "text": "保険料納付済期間と保険料免除期間を合算した期間が25年に満たない者（被保険者又は被保険者であった者であって、日本国内に住所を有し、かつ、60歳以上65歳未満であるものを除く。）が死亡した場合に、当該合算した期間に合算対象期間を合算した期間が25年以上になる場合には、国民年金法第37条の2に規定された遺族の範囲にある遺族は、遺族基礎年金を受けることができる。"}, {"label": "ウ", "text": "日本国籍を有する人が、20歳から60歳までの間に、日本国内に住所を有さずに海外に在住した期間のうち、昭和36年4月1日から昭和61年3月31日までの期間は、国民年金の任意加入被保険者でなくても、老齢基礎年金の受給資格期間を計算する場合の合算対象期間になる。"}, {"label": "エ", "text": "昭和36年5月1日以後で、20歳に達した日の翌日から65歳に達した日の前日までの間に日本国籍を取得した者が、日本国内に住所を有さずに海外に在住した期間のうち、昭和36年4月1日から日本国籍を取得した日の前日までの20歳以上60歳未満の期間で、外国籍であったために国民年金の被保険者にならなかった期間は、老齢基礎年金の受給資格期間を計算する場合の合算対象期間にならない。"}, {"label": "オ", "text": "昭和61年4月1日以後の第2号被保険者としての被保険者期間のうち20歳未満の期間及び60歳以上の期間は合算対象期間となる。"}], "choices": [{"label": "A", "text": "（アとウ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（イとオ）"}, {"label": "E", "text": "（ウとオ）"}], "answer": "B", "key": "R07-7-7", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和7年度本試験", "stem": "国民年金法に関する次のアからオの記述のうち、正しいものはいくつあるか。", "statements": [{"label": "ア", "text": "厚生労働大臣は、政令で定める場合における保険料その他国民年金法による徴収金の収納を、政令で定めるところにより、日本年金機構に行わせることができるが、年金給付の過誤払による返還金の収納は、日本年金機構に行わせることができない。"}, {"label": "イ", "text": "厚生労働大臣及び日本年金機構は、国民年金事業が、適正かつ円滑に行われるよう、必要な情報交換を行うことその他相互の密接な連携を確保しなければならないとされており、また、厚生労働大臣は、日本年金機構の協力の下、国民年金事業に関する事務に従事する厚生労働省の職員に対し、当該事務を適正かつ円滑に行うために必要な知識及び技能を習得させ、向上させるために必要な研修を行うものとされている。"}, {"label": "ウ", "text": "政府は、国民年金事業の実施に必要な事務を円滑に処理し、被保険者等の利便の向上に資するため、電子情報処理組織の運用を行うが、その運用の一部のみ日本年金機構に行わせることができる。"}, {"label": "エ", "text": "厚生労働大臣は、国民年金法第1条の目的を達成するため、被保険者若しくは被保険者であった者又は受給権者に係る保険料の納付に関する実態その他の厚生労働省令で定める事項に関し、必要な統計調査を行うものとする。"}, {"label": "オ", "text": "厚生労働大臣は、国民年金原簿の訂正請求に係る国民年金原簿の訂正に関する方針を定め、又は変更しようとするときは、あらかじめ、社会保障審議会に諮問しなければならない。"}], "choices": [{"label": "A", "text": "一つ"}, {"label": "B", "text": "二つ"}, {"label": "C", "text": "三つ"}, {"label": "D", "text": "四つ"}, {"label": "E", "text": "五つ"}], "answer": "C", "key": "R07-7-8", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和7年度本試験", "stem": "国民年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "国民年金法附則第5条に基づく任意加入被保険者については、厚生労働大臣に任意加入の申出をした日に資格を取得することになっているが、日本国内に住所を有する60歳以上65歳未満の者の場合は、最長60歳まで遡って任意加入被保険者の資格を取得することができる。"}, {"label": "B", "text": "国民年金法第5条第1項の規定する保険料納付済期間には、保険料を納付することを要しないとされた第1号被保険者の産前産後期間は含まれるが、滞納処分により徴収された保険料に係る第1号被保険者としての被保険者期間は含まれない。"}, {"label": "C", "text": "昭和35年4月14日生まれの者の年金加入歴が下記のとおりであるとき、この者が65歳から老齢基礎年金を受給する場合の年金額を算出する際に算入される月数の合計は444月となる。第1号被保険者期間132月（保険料納付済月数108月、保険料未納月数24月）第2号被保険者期間12月（すべて20歳以上60歳未満の期間）第3号被保険者期間336月"}, {"label": "D", "text": "老齢基礎年金の受給権は、受給権者が死亡したときは消滅することになっているが、受給権者が日本国内に住所を有しなくなった場合においてもそのことを理由として消滅することになっている。"}, {"label": "E", "text": "国民年金基金が支給する一時金については、給付として支給を受けた金銭を標準として、租税その他の公課を課することはできない。"}], "answer": "E", "key": "R07-7-9", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和7年度本試験", "stem": "国民年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "60歳以上の妻が支給の対象となる寡婦年金は、夫が死亡した日の属する月の翌月からその支給が始まるが、60歳未満の妻が支給の対象となる寡婦年金については、妻が60歳に達した日の属する月からその支給が始まる。"}, {"label": "B", "text": "障害基礎年金の受給権者が、厚生年金保険法第47条第2項に規定する障害等級に該当する程度の障害の状態にない場合は、65歳に達したときに当該障害基礎年金の受給権は消滅する。ただし、65歳に達した日において、同項に規定する障害等級に該当する程度の障害の状態に該当しなくなった日から起算して同項に規定する障害等級に該当する程度の障害の状態に該当することなく5年を経過していないときは除かれる。"}, {"label": "C", "text": "厚生労働大臣は、障害基礎年金の受給権者について、その障害の程度を診査し、その程度が従前の障害等級以外の障害等級に該当すると認めるときは、障害基礎年金の額を改定することができるが、改定後の額による障害基礎年金の支給は、改定が行われた日の属する月から始められる。"}, {"label": "D", "text": "配偶者に支給する遺族基礎年金については、子が2人以上ある場合であって、その子のうち1人を除いた子の1人又は2人以上が、障害等級（1級・2級）に該当する障害の状態にあるときを除いて、18歳に達した日以後の最初の3月31日が終了したときに年金額が減額改定される。また、障害等級（1級・2級）に該当する障害の状態にある子の場合は、20歳に達した日以後の最初の3月31日が終了したときに年金額が減額改定される。"}, {"label": "E", "text": "国民年金法第96条第4項及び第5項の規定による滞納処分によって受け入れた金額を保険料に充当する場合においては、さきに経過した月の保険料から順次これに充当し、1か月の保険料の額に満たない端数は、納付義務者に交付するものとされている。"}], "answer": "E", "key": "R07-7-10", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}]};
const WEAK = 60;   // この正答率(%)未満を「苦手」と表示する
const FEW = 3;     // 解答数がこれ未満の分野は「解答数が少ない」と表示する
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const el = (tag, cls, htmlText) => { const n = document.createElement(tag); if (cls) n.className = cls; if (htmlText != null) n.innerHTML = htmlText; return n; };
const hit = (q, p) => !!p && q.answer.indexOf(p) >= 0;   // 複数正答の過去問は answer が "DE" のようになる
const ALL = DATA.sets.flatMap(s => s.questions.map(q => Object.assign(q, { setTitle: s.title, subject: s.subject })));
const BYKEY = Object.fromEntries(ALL.map(q => [q.key, q]));

let view = LS.get("shikaku-quiz:view", "0");   // "0","1"…＝問題集、"stats"＝成績、"review"＝復習
let state = {};                                 // いま画面に出している問題の解答状況
let hist = LS.get("shikaku-quiz:hist", []);     // 解答の履歴 [{k, ok, p, t}]
let reviewList = [];

const stateKey = () => "shikaku-quiz:v3:" + DATA.sets[+view].id;
const saveState = () => { if (view !== "review" && view !== "stats") LS.set(stateKey(), state); };
function record(q, ok, points) {
  hist.push({ k: q.key, ok: ok ? 1 : 0, p: points == null ? null : points, t: Date.now() });
  LS.set("shikaku-quiz:hist", hist);
}

/* ---------- 集計 ---------- */
function stats() {
  const last = {}, topic = {};
  let n = 0, ok = 0, czN = 0, czP = 0;
  hist.forEach(h => {
    const q = BYKEY[h.k]; if (!q) return;
    last[h.k] = h;
    const key = q.subject + "｜" + q.topic;
    const t = topic[key] || (topic[key] = { subject: q.subject, topic: q.topic, n: 0, ok: 0, cloze: q.type === "cloze", pts: 0 });
    t.n++;
    if (q.type === "cloze") { czN++; czP += h.p; t.pts += h.p; t.ok += h.p >= 3 ? 1 : 0; }
    else { n++; ok += h.ok; t.ok += h.ok; }
  });
  const topics = Object.values(topic).map(t => Object.assign(t, { rate: t.cloze ? Math.round(t.pts / (t.n * 5) * 100) : Math.round(t.ok / t.n * 100) }))
    .sort((a, b) => a.rate - b.rate || b.n - a.n);
  const missed = Object.values(last).filter(h => !h.ok).map(h => BYKEY[h.k]);
  const answered = Object.keys(last).length;
  return { n, ok, czN, czP, topics, missed, answered };
}

/* ---------- 問題の表示 ---------- */
function resultBox(ok, answerText, explain) {
  const r = el("div", "res " + (ok ? "ok" : "ng"));
  r.appendChild(el("div", "verdict " + (ok ? "ok" : "ng"), ok ? "正解" : "不正解"));
  r.appendChild(el("p", "", answerText));
  explain.forEach(t => r.appendChild(el("p", "", t)));
  return r;
}

function renderChoice(q, card) {
  q.statements.forEach(s => card.appendChild(el("p", "st", '<span class="lb">' + s.label + "</span>" + s.text)));
  const short = q.choices.every(c => c.text.length < 12);
  const btns = q.choices.map(c => {
    const b = el("button", "ch" + (short ? " short" : ""), '<span class="lb">' + c.label + "</span>" + c.text);
    b.type = "button";
    b.onclick = () => { state[q.key] = { pick: c.label, done: false }; saveState(); show(); };
    card.appendChild(b);
    return [c.label, b];
  });
  const next = el("button", "btn", "次へ"); next.type = "button"; card.appendChild(next);
  const slot = el("div"); card.appendChild(slot);
  next.onclick = () => {
    const st = state[q.key];
    if (st && st.done) { const n = card.nextElementSibling; if (n) n.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (!st || !st.pick) return;
    st.done = true; saveState(); record(q, hit(q, st.pick)); show(); updateScore();
  };
  function show() {
    const st = state[q.key] || {};
    next.disabled = !st.pick;
    btns.forEach(([lb, b]) => b.classList.toggle("pick", !st.done && lb === st.pick));
    if (!st.done) return;
    btns.forEach(([lb, b]) => {
      b.disabled = true;
      if (hit(q, lb)) b.classList.add("ok");
      else if (lb === st.pick) b.classList.add("ng");
    });
    slot.replaceChildren(resultBox(hit(q, st.pick), q.answerText, q.explain));
    if (card.nextElementSibling) next.textContent = "次の問題へ"; else next.remove();
    card.appendChild(next);
  }
  return show;
}

function renderCloze(q, card) {
  const pas = el("div", "passage");
  q.passage.forEach(p => pas.appendChild(el("p", "", p.replace(/［\s*([A-E])\s*］/g, '<span class="blank">$1</span>'))));
  card.appendChild(pas);
  const cur = (state[q.key] && state[q.key].picks) || {};
  const sels = ["A", "B", "C", "D", "E"].map(k => {
    const row = el("div", "sel");
    const lab = el("label", "", k); lab.htmlFor = "s" + q.key + k;
    const s = el("select"); s.id = "s" + q.key + k;
    s.appendChild(new Option("選択してください", ""));
    q.options.forEach(o => s.appendChild(new Option(o.mark + " " + o.text, o.mark)));
    s.value = cur[k] || "";
    row.append(lab, s); card.appendChild(row);
    return [k, s];
  });
  const btn = el("button", "btn", "次へ"); btn.type = "button"; card.appendChild(btn);
  const slot = el("div"); card.appendChild(slot);
  const points = picks => ["A", "B", "C", "D", "E"].filter(k => picks[k] === q.answers[k]).length;
  btn.onclick = () => {
    const picks = {}; sels.forEach(([k, s]) => picks[k] = s.value);
    state[q.key] = { picks, done: true }; saveState(); record(q, points(picks) >= 3, points(picks)); show(); updateScore();
  };
  function show() {
    const st = state[q.key];
    if (!st || !st.done) return;
    sels.forEach(([k, s]) => { const ok = st.picks[k] === q.answers[k]; s.disabled = true; s.classList.add(ok ? "ok" : "ng"); });
    btn.remove();
    const n = points(st.picks);
    const box = resultBox(n >= 3, q.answerText, q.explain);
    box.querySelector(".verdict").textContent = n + " / 5 点（基準点の目安は3点）";
    slot.replaceChildren(box);
  }
  return show;
}

function renderQuestions(root, list, showSet) {
  const shows = [];
  list.forEach((q, i) => {
    const card = el("section", "q");
    card.appendChild(el("div", "qno", (showSet ? q.setTitle + "　" : "") + "問" + q.no + (q.type === "cloze" ? "　選択式" : "　択一式") + '<span class="tp">' + q.topic + "</span>"));
    card.appendChild(el("div", "stem", q.stem));
    root.appendChild(card);
    shows.push([q, card]);
  });
  // 次のカードがあるかで「次の問題へ」の表示が変わるため、全カードを置いてから中身を描く
  shows.forEach(([q, card]) => (q.type === "choice" ? renderChoice : renderCloze)(q, card)());
}

function currentList() { return view === "review" ? reviewList : DATA.sets[+view].questions; }
function updateScore() {
  let done = 0, ok = 0, total = 0, cz = "";
  currentList().forEach(q => {
    const st = state[q.key];
    if (q.type === "choice") { total++; if (st && st.done) { done++; if (hit(q, st.pick)) ok++; } }
    else if (st && st.done) cz = "　選択式 " + ["A", "B", "C", "D", "E"].filter(k => st.picks[k] === q.answers[k]).length + "/5";
  });
  document.getElementById("score").textContent = "択一式 " + ok + "/" + total + "（解答済み " + done + "）" + cz;
}

/* ---------- 成績の表示 ---------- */
function summaryText(s) {
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  const lines = ["【社労士 練習問題の成績】" + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()),
    "択一式: " + s.ok + "/" + s.n + "問 正解" + (s.n ? "（" + Math.round(s.ok / s.n * 100) + "%）" : ""),
    "選択式: " + s.czP + "/" + s.czN * 5 + "点", "", "■分野別（正答率の低い順）"];
  s.topics.forEach(t => lines.push("・" + t.subject + "／" + t.topic + ": " + t.rate + "%（" + (t.cloze ? t.pts + "/" + t.n * 5 + "点" : t.ok + "/" + t.n + "問") + "）"));
  lines.push("", "■最後に間違えた問題");
  if (!s.missed.length) lines.push("・なし");
  s.missed.forEach(q => lines.push("・" + q.setTitle + " 問" + q.no + "（" + q.topic + "）"));
  return lines.join("\n");
}

function renderStats(root) {
  const s = stats();
  if (!s.answered) {
    root.appendChild(el("div", "note", "<b>まだ解答の記録がありません。</b><br>問題を解いて「次へ」を押すと、ここに分野別の正答率が出ます。"));
    return;
  }
  const k = el("div", "kpis");
  k.appendChild(el("div", "kpi", '<div class="lab">択一式の正答率</div><div class="big">' + (s.n ? Math.round(s.ok / s.n * 100) + "%" : "—") + "<small>" + s.ok + "/" + s.n + "問</small></div>"));
  k.appendChild(el("div", "kpi", '<div class="lab">選択式の得点</div><div class="big">' + (s.czN ? s.czP + "<small>/" + s.czN * 5 + "点</small>" : "—") + "</div>"));
  root.appendChild(k);
  root.appendChild(el("p", "hint", "解いた問題 " + s.answered + " / " + ALL.length + "問。同じ問題を解き直した分も、回数に数えています。"));

  const sec = el("section", "q");
  sec.appendChild(el("h2", "", "分野別の正答率（低い順）"));
  s.topics.forEach(t => {
    const row = el("div", "row");
    const tag = t.n < FEW ? '<span class="tag few">解答数が少ない</span>' : (t.rate < WEAK ? '<span class="tag weak">苦手</span>' : "");
    row.appendChild(el("div", "top", '<span class="name">' + t.subject + "／" + t.topic + tag + '</span><span class="val">' + t.rate + "%<small>" + (t.cloze ? t.pts + "/" + t.n * 5 + "点" : t.ok + "/" + t.n + "問") + "</small></span>"));
    const tr = el("div", "track"); const f = el("div", "fill" + (t.rate < WEAK ? " low" : "")); f.style.width = t.rate + "%"; tr.appendChild(f); row.appendChild(tr);
    sec.appendChild(row);
  });
  sec.appendChild(el("p", "hint", "正答率が" + WEAK + "%未満の分野に「苦手」と表示します。解答数が" + FEW + "問未満の分野は、まだ判断できる数ではありません。"));
  root.appendChild(sec);

  const ms = el("section", "q");
  ms.appendChild(el("h2", "", "最後に間違えた問題（" + s.missed.length + "問）"));
  if (!s.missed.length) ms.appendChild(el("p", "miss", "ありません。"));
  s.missed.forEach(q => ms.appendChild(el("p", "miss", "・" + q.setTitle + " 問" + q.no + "　" + q.topic)));
  if (s.missed.length) {
    const b = el("button", "btn", "間違えた問題だけ解き直す"); b.type = "button";
    b.onclick = () => { reviewList = s.missed.slice(); state = {}; view = "review"; render(); window.scrollTo(0, 0); };
    ms.appendChild(b);
  }
  root.appendChild(ms);

  const ex = el("section", "q");
  ex.appendChild(el("h2", "", "成績をAIに渡す"));
  ex.appendChild(el("p", "hint", "下のボタンで成績をコピーして、Claudeとの会話に貼り付けてください。苦手分野に合わせて勉強計画や問題を調整できます。"));
  const cp = el("button", "btn", "成績をコピー"); cp.type = "button";
  const ta = el("textarea"); ta.rows = 8; ta.readOnly = true; ta.value = summaryText(s);
  cp.onclick = async () => {
    try { await navigator.clipboard.writeText(ta.value); cp.textContent = "コピーしました"; }
    catch (e) { ta.focus(); ta.select(); cp.textContent = "下の文を選択してコピーしてください"; }
  };
  ex.append(cp, ta);
  root.appendChild(ex);

  const del = el("button", "btn ghost", "解答の記録をすべて消す"); del.type = "button";
  del.onclick = () => {
    if (!confirm("これまでの解答の記録をすべて消しますか？")) return;
    hist = []; LS.set("shikaku-quiz:hist", hist);
    DATA.sets.forEach(x => LS.set("shikaku-quiz:v3:" + x.id, {}));
    render();
  };
  root.appendChild(del);
}

/* ---------- 全体 ---------- */
function renderTabs() {
  const box = document.getElementById("tabs"); box.replaceChildren();
  const add = (id, label) => {
    const b = el("button", "tab" + (view === id ? " on" : ""), label); b.type = "button";
    b.onclick = () => { view = id; LS.set("shikaku-quiz:view", id); render(); window.scrollTo(0, 0); };
    box.appendChild(b);
  };
  DATA.sets.forEach((s, i) => add(String(i), s.title + "（" + s.questions.length + "問）"));
  add("stats", "成績・苦手分野");
  if (view === "review") { const b = el("button", "tab on", "復習（" + reviewList.length + "問）"); b.type = "button"; box.appendChild(b); }
}

function render() {
  if (view !== "stats" && view !== "review" && !DATA.sets[+view]) view = "0";
  renderTabs();
  const root = document.getElementById("main"); root.replaceChildren();
  const bar = document.getElementById("bar");
  if (view === "stats") { bar.style.display = "none"; renderStats(root); return; }
  bar.style.display = "";
  if (view === "review") {
    root.appendChild(el("div", "note", "<b>復習</b>　最後に間違えた問題だけを出しています。ここでの解答も成績に記録されます。"));
    renderQuestions(root, reviewList, true);
  } else {
    state = LS.get(stateKey(), {});
    const cs = DATA.sets[+view];
    if (cs.kind === "kakomon") root.appendChild(el("div", "note", "<b>本試験の過去問です。</b>解説はなく、正答だけが出ます。<br>" + cs.source));
    else root.appendChild(el("div", "note", "<b>AIが作成したオリジナル問題です。本試験の過去問ではありません。</b><br>条文・最高裁判決の本文・過去の本試験で正誤が確定している内容を根拠に作っていますが、誤りを含む可能性があります。法改正にも追随していません。迷ったら最新のテキストを正としてください。<br>解説の印: 【過去問】本試験の公式正答で確認した内容／【判決】最高裁判決の本文／【条文】法令の条文／【AI】AIの知識によるもの"));
    renderQuestions(root, DATA.sets[+view].questions, false);
  }
  updateScore();
}

document.getElementById("reset").onclick = () => {
  if (!confirm("この画面の解答を消して、もう一度解きますか？（成績の記録は残ります）")) return;
  state = {}; saveState(); render(); window.scrollTo(0, 0);
};
render();
</script>
