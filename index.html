前支払期月に支払うべきであった児童手当又は支給すべき事由が消滅した場合におけるその期の児童手当は、その支払期月でない月であっても、支払うものとする。"}, {"label": "エ", "text": "児童手当を支給すべきでないにもかかわらず、児童手当の支給としての支払が行われたときは、その支払われた児童手当は、その後に支払うべき児童手当の内払とみなすことができない。"}, {"label": "オ", "text": "児童手当の支給を受ける権利は、これを行使することができる時から2年を経過したときは、時効によって消滅する。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとウ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（ウとオ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "D", "key": "R08-4-10", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R08-5", "title": "R8本試験 健保", "subject": "健康保険法", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和8年度（第58回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和8年4月10日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "保険者は、被保険者又は被保険者であった者が、正当な理由なしに療養に関する指示に従わないときは、保険給付の一部を行わないことができる。療養の給付については、正当の理由なく療養の指揮に従わない顕著な事実があって、これを矯正するのに他の手段が行われ難い場合に限り制限の対象とする。"}, {"label": "B", "text": "高額療養費の時効起算日は、診療月の翌月の1日であり、傷病が月の途中で治癒した場合においても同様である。ただし、診療費の自己負担分を、診療月の翌月以後に支払ったときは、支払った日の翌日が起算日となる。"}, {"label": "C", "text": "保険者は、療養の給付若しくは入院時食事療養費、入院時生活療養費若しくは保険外併用療養費の支給（以下この項において「療養の給付等」という。）を行うことが困難であると認めるとき、又は被保険者が保険医療機関等以外の病院、診療所、薬局その他の者から診療、薬剤の支給若しくは手当を受けた場合において、保険者がやむを得ないものと認めるときは、療養の給付等に代えて、療養費を支給することができる。保険者がやむを得ないものと認める場合とは、疾病又は負傷等に際し直に診療又は手当を受けなければならないため、保険医のところに行って診療又は手当を受ける時間的余裕のない場合等通常の場合において保険医を選定することが不能又は著しく困難と認められる状態をいう。"}, {"label": "D", "text": "独立して生計を営む子が、健康保険法の適用を受けない事業所に勤務するうち疾病のため失業し、被保険者である父に扶養されるようになった場合、父の被扶養者として家族療養費は支給されない。"}, {"label": "E", "text": "被扶養者が健康保険組合である保険者が開設する病院若しくは診療所又は薬局から療養を受けた場合、保険者がその被扶養者の支払うべき療養に要した費用のうち家族療養費として被保険者に支給すべき額に相当する額の支払を免除したときは、被保険者に対し家族療養費の支給があったものとみなす。"}], "answer": "D", "key": "R08-5-1", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "被保険者（任意継続被保険者を除く。）は、その事業所に使用されなくなったときに至った日の翌日（その事実があった日に更に被保険者の資格を取得するに至ったときは、その日）から、被保険者の資格を喪失する。事実上の使用関係がなく、かつ、休業手当も支給されてはいないが、雇用契約が存続する場合には、被保険者の資格は喪失しない。"}, {"label": "B", "text": "被保険者の被扶養者が死亡したときは、家族埋葬料として、被保険者に対して5万円が支給される。死産児につき法律上埋葬を必要とするため、被保険者の経済的負担となる事実に鑑み死産の場合には、埋葬の事実に基づいて家族埋葬料を支給する。"}, {"label": "C", "text": "任意継続被保険者の申出は、被保険者の資格を喪失した日から20日以内にしなければならない。ただし、保険者は、被保険者の法律の不知は正当な理由であるとして、この期間を経過した後の申出であっても受理することができる。"}, {"label": "D", "text": "任意継続被保険者になった者が、保険者の被保険者の被扶養者となる要件を充足した場合、その日に任意継続被保険者としての資格を喪失する。"}, {"label": "E", "text": "被保険者の賞与額に関する健康保険法第48条の規定による届出は、賞与を支払った日から5日以内に、健康保険被保険者賞与支払届を日本年金機構又は健康保険組合に提出することによって行う。事業主は、同一月に2回以上賞与等の支払を行う場合にあっては、最後の賞与等の支払を行った後5日以内に、合算し一括して差し支えない。"}], "answer": "E", "key": "R08-5-2", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "人工妊娠中絶のうち妊娠4か月以上のものにあっては、療養の給付及び出産育児一時金の給付の対象となり、妊娠4か月未満のものにあっては、療養の給付のみが対象となる。ただし、療養の給付については単に経済的理由による場合には対象とはならない。"}, {"label": "B", "text": "賞与に係る報酬額は、標準報酬月額の定時決定又は7月、8月若しくは9月の随時改定の際、（ア）7月1日前の1年間に受けた賞与の額を12で除して得た額、（イ）7月1日以前1年内に諸規定により賞与の支給回数が変更され、新たに当該賞与が報酬に該当したときは、変更後の諸規定による賞与の支給回数等の支給条件であったとすれば同日前1年間に受けたであろう賞与の額を算定し、その額を12で除して得た額により算定する。"}, {"label": "C", "text": "被保険者に係る療養の給付等について、労災保険法の規定によりこれらに相当する給付を受けることができる場合には行わない。労災保険の任意適用事業所に使用される被保険者に係る通勤災害について、それが労災保険の保険関係の成立の日前に発生したものであるときは、健康保険等で給付される。ただし、事業主の申請により、保険関係成立の日から労災保険の通勤災害の給付が行われる場合はこの限りではない。"}, {"label": "D", "text": "高齢受給者証の交付を受けている者の一部負担金の割合について、随時改定により標準報酬月額が変更になり負担割合も変更する者については、負担割合が変更になるのは改定後の標準報酬月額が適用される月の翌月からである。"}, {"label": "E", "text": "日雇特例被保険者が家族埋葬料の支給を受けるには、死亡の日の属する月の前2か月間に通算して26日分以上又は当該月の前6か月間に通算して78日分以上の保険料が、その日雇特例被保険者について納付されていなければならない。"}], "answer": "D", "key": "R08-5-3", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "市町村長（特別区の区長を含むものとし、地方自治法第252条の19第1項の指定都市にあっては、区長又は総合区長とする。）は、保険者又は保険給付を受けるべき者に対して、当該市町村（特別区を含む。）の条例で定めるところにより、被保険者又は被保険者であった者の戸籍に関し、無料で証明を行うことができる。埋葬料又は埋葬費支給申請のときに添付する埋葬許可証又は火葬許可証の写しは、戸籍に関する証明に該当する。"}, {"label": "B", "text": "厚生労働大臣は、健康保険法第63条第2項第4号に規定する患者申出療養の申出を受けた場合において、当該申出に係る療養を患者申出療養として定めることとした場合には、その旨を当該申出を行った者に速やかに通知する。当該申出に係る療養を患者申出療養として定めないこととした場合には、その結果のみを当該申出を行った者に速やかに通知する。"}, {"label": "C", "text": "健康保険法第82条第2項によると、厚生労働大臣は、保険医療機関若しくは保険薬局に係る指定を行おうとするとき、若しくはその指定を取り消そうとするとき、又は保険医若しくは保険薬剤師に係る登録を取り消そうとするときは、政令で定めるところにより、地方社会保険医療協議会の議を経なければならない。"}, {"label": "D", "text": "被保険者が療養の給付（保険外併用療養費に係る療養を含む。）を受けるため、病院又は診療所に移送されたときは、移送費として、厚生労働省令で定めるところにより算定した金額を支給する。移送費は、厚生労働省令で定めるところにより、保険者が必要であると認める場合に限り、支給するものとする。保険者は、①移送により法に基づく適切な療養を受けたこと、②移送の原因である疾病又は負傷により移動をすることが著しく困難であったこと、③緊急その他やむを得なかったこと、以上のいずれにも該当すると認められる場合に移送費を支給する。したがって、通院なども一時的、緊急的な必要性があれば移送費の支給の対象となる。"}, {"label": "E", "text": "保険者は、被保険者の資格を取得した者があるときは、日、時間、出来高又は請負によって報酬が定められる場合、被保険者の資格を取得した月前1か月間に当該事業所において、同様の業務に従事し、かつ、同様の報酬を受ける者が受けた報酬の額を平均した額を報酬月額として、標準報酬月額を決定する。"}], "answer": "E", "key": "R08-5-4", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和8年度本試験", "stem": "健康保険法に関する次のアからオの記述のうち、誤っているものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "健康保険組合の会計年度は、毎年4月1日に始まり、翌年3月31日に終わる。健康保険組合は、毎年度、収入支出の予算を作成し、当該年度の開始前に、厚生労働大臣に届け出なければならない。これを変更したときも、同様である。また毎年度終了後6か月以内に事業及び決算に関する報告書を作成し、厚生労働大臣に提出しなければならない。さらに毎月の事業状況を翌月20日までに管轄地方厚生局長等に報告しなければならない。"}, {"label": "イ", "text": "健康保険組合は、規約において、名称、事務所の所在地、健康保険組合の設立に係る適用事業所の名称及び所在地、組合会に関する事項、役員に関する事項、組合員に関する事項、保険料に関する事項、準備金その他の財産の管理に関する事項、公告に関する事項などを定めなくてはならない。また、これらの規約内容のすべての変更は厚生労働大臣の認可を受けなければ、その効力を生じない。"}, {"label": "ウ", "text": "健康保険法第53条によると、保険者が健康保険組合である場合においては、同法第52条各号に掲げる保険給付に併せて、理事の定数の2分の1以上の同意があれば、保険給付としてその他の給付を行うことができる。"}, {"label": "エ", "text": "健康保険組合は、支払上現金に不足を生じたときは、準備金に属する現金を繰替使用し、又は一時借入金をすることができる。ただし、この繰替使用した金額及び一時借入金は、当該会計年度内に返還しなければならない。"}, {"label": "オ", "text": "健康保険組合連合会は、健康保険組合が管掌する健康保険の医療に関する給付、保健事業及び福祉事業の実施又は健康保険組合に係る前期高齢者納付金等、後期高齢者支援金等、日雇拠出金、介護納付金、流行初期医療確保拠出金等若しくは子ども・子育て支援納付金の納付に要する費用の財源の不均衡を調整するため、健康保険組合に対する交付金の交付事業を実施している。その事業の費用に充てるために、健康保険組合は調整保険料を徴収し、拠出金を健康保険組合連合会に拠出している。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとウ）"}, {"label": "D", "text": "（ウとオ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "C", "key": "R08-5-5", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "地域型健康保険組合とは、合併により設立された健康保険組合又は合併後存続する健康保険組合のうち、次のいずれの要件に該当するものをいう。①合併前の健康保険組合の設立事業所がいずれも同一都道府県の区域にあること、②当該合併が指定健康保険組合、被保険者の数が常時700人に満たなくなった又は共同して設立された場合は常時3,000人に満たなくなった健康保険組合その他事業運営基盤の安定が必要と認められる健康保険組合として厚生労働省令で定めるものを含むこと。"}, {"label": "B", "text": "傷病手当金は、被保険者（任意継続被保険者を除く。）が療養のため労務に服することができないときに、その労務に服することができなくなった日から起算して3日を経過した日から労務に服することができない期間に、支給される。そのため本来の職場では働けないが、本来の職場における労務に対する代替的性格をもたない副業の労務に従事して、賃金を得ることができるような場合は支給されない。"}, {"label": "C", "text": "法人である納付義務者が解散したとき、又は納付義務者に競売の開始があったとき、保険者は納期前であってもすべての保険料を徴収することができる。"}, {"label": "D", "text": "出産手当金は出産の日（出産の日が出産の予定日後になった場合は、出産の予定日）以前42日（多胎妊娠の場合は98日）から出産の日の後56日までの間において労務に服さなかった期間に支給される。"}, {"label": "E", "text": "被保険者が電子資格確認を受けることができない状況にあるときは、その被保険者は保険者に対し、当該状況にある被保険者の資格に係る情報に関する事項を記載した書面の交付又は当該事項の電磁的方法による提供を求めることができる。書面の交付を受け、若しくは電磁的方法により当該事項の提供を受けた被保険者は、それを保険医療機関の窓口において提示することにより、療養の給付を受ける場合の被保険者の資格の確認を受けることができる。"}], "answer": "B", "key": "R08-5-6", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "保険外併用療養費は、被保険者が保険医療機関等のうち自己の選定するものから、電子資格確認等により、被保険者であることの確認を受け、評価療養、患者申出療養又は選定療養を受けたときに、その療養に要した費用について支給される。"}, {"label": "B", "text": "健康保険法第160条の2によると、子ども・子育て支援金率については、各年度において全ての保険者が納付すべき子ども・子育て支援納付金の総額を当該年度における全ての保険者が管掌する被保険者の標準報酬月額の総額の見込額で除した率を基礎として、保険者が定めるとされている。"}, {"label": "C", "text": "出産育児一時金及び家族出産育児一時金の支給に要する費用の一部については、政令で定めるところにより、高齢者の医療の確保に関する法律の規定により社会保険診療報酬支払基金が保険者に対して交付する出産育児交付金が充てられている。"}, {"label": "D", "text": "産前産後休業を終了した被保険者が、当該産前産後休業を終了した日において当該産前産後休業に係る子を養育する場合において、その使用される事業所の事業主を経由して保険者等に申出をしたときは、保険者等は産前産後休業終了日の翌日が属する月以後3か月間（産前産後休業終了日の翌日において使用される事業所で継続して使用された期間に限るものとし、かつ、報酬支払の基礎となった日数が17日未満である月があるときは、その月を除く。）に受けた報酬の総額をその期間の月数で除して得た額を報酬月額として、標準報酬月額を改定する。"}, {"label": "E", "text": "健康保険法施行規則第44条によると、任意継続被保険者は、個人番号、氏名又は住所を変更したときは、5日以内に、変更前及び変更後の個人番号、氏名又は住所を保険者に届け出なければならない。ただし、住所の変更については、当該任意継続被保険者が健康保険組合が管掌する健康保険の任意継続被保険者であって、当該健康保険組合が当該任意継続被保険者に係る機構保存本人確認情報の提供を受けることができるとき（当該健康保険組合が、当該任意継続被保険者に対し、当該任意継続被保険者に係る情報の提供を求めないときに限る。）は、この限りでない。"}], "answer": "B", "key": "R08-5-7", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "健康保険法第115条第1項によると、療養の給付について支払われた一部負担金の額又は療養（食事療養及び生活療養を除く。）に要した費用の額からその療養に要した費用につき保険外併用療養費、療養費、訪問看護療養費、家族療養費若しくは家族訪問看護療養費として支給される額に相当する額を控除した額が著しく高額であるときは、その療養の給付又はその保険外併用療養費、療養費、訪問看護療養費、家族療養費若しくは家族訪問看護療養費の支給を受けた者に対し、高額療養費を支給する。"}, {"label": "B", "text": "全国健康保険協会が管掌する健康保険の被保険者が同一月内で健康保険組合が管掌する健康保険の被保険者となった場合の高額療養費は、同一の病院で受けた療養の給付であったとしても、診療報酬請求明細書（レセプト）がそれぞれの管掌者別に区分されるので、それぞれの管掌者ごとに支給対象となるか否かを判断する。"}, {"label": "C", "text": "被保険者の配偶者で届出をしていないが事実上婚姻関係と同様の事情にあるものの父母及び子であって、その被保険者と同一の世帯に属し、主としてその被保険者により生計を維持するものの場合、その配偶者の死亡後においてもその父母及び子であって、引き続きその被保険者と同一の世帯に属し、主としてその被保険者により生計を維持するものは被扶養者である。"}, {"label": "D", "text": "年収500万円の被保険者と同居している妻（令和8年4月1日現在21歳の大学生であって障害者ではない。）が、年間の見込収入額が144万円の場合、主としてその被保険者により生計を維持する者として被扶養者に認定される。"}, {"label": "E", "text": "年収700万円の被保険者と別居している子（令和8年4月1日現在19歳の大学生であって、実家から離れて被保険者から年間180万円の援助により生活しており、障害者ではない。）が、年間の見込収入額が145万円の場合、主としてその被保険者により生計を維持する者として被扶養者に認定される。"}], "answer": "D", "key": "R08-5-8", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和8年度本試験", "stem": "健康保険法に関する次のアからオの記述のうち、誤っているものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "被保険者に関する毎月の保険料は、翌月末日までに、納付しなければならない。ただし、任意継続被保険者に関する保険料については、その月の10日（初めて納付すべき保険料については、保険者が指定する日）までとする。"}, {"label": "イ", "text": "任意継続被保険者は、将来の一定期間の保険料を前納することができる。任意継続被保険者は自己の負担する保険料を納付する義務を負い、保険料の前納は、4月から9月まで若しくは10月から翌年3月までの6か月間又は4月から翌年3月までの12か月間を単位として行うものとする。ただし、当該6か月又は12か月の間において、任意継続被保険者の資格を取得した者又はその資格を喪失することが明らかである者については、当該6か月間又は12か月間のうち、その資格を取得した日の属する月の翌月以降の期間又はその資格を喪失する日の属する月の前月までの期間の保険料について前納を行うことができる。"}, {"label": "ウ", "text": "被保険者（任意継続被保険者を除く。）が療養のため労務に服することができないことにより傷病手当金を受給している期間中に65歳に達したことにより国民年金法及び厚生年金保険法による老齢を支給事由とする年金たる給付の支給を受けることができるときは、傷病手当金は、支給されない。ただし、その受けることができる老齢退職年金給付の額（当該老齢退職年金給付が2以上あるときは、当該2以上の老齢退職年金給付の額の合算額）につき厚生労働省令で定めるところにより算定した額が、傷病手当金の額より少ないときは、その差額が支給される。"}, {"label": "エ", "text": "被保険者の被扶養者が家族療養費に係る療養を受けるため、病院又は診療所に移送されたときは、家族移送費として、被保険者に対し、厚生労働省令で定めるところにより算定した金額が支給される。"}, {"label": "オ", "text": "被保険者の疾病又は負傷に関して、入院している場合における食事は医療の一環として提供されるべきものであり、それぞれ患者の病状に応じて必要とする栄養量が与えられ、食事の質の向上と患者サービスの改善をめざして行われるべきものである。また、生活療養の温度、照明及び給水に関する療養環境は医療の一環として形成されるべきものであり、それぞれの患者の病状に応じて適切に行われるべきものである。これらは健康保険法第63条第1項に定める療養の給付により提供される。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとオ）"}, {"label": "D", "text": "（ウとエ）"}, {"label": "E", "text": "（ウとオ）"}], "answer": "E", "key": "R08-5-9", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和8年度本試験", "stem": "健康保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "定時決定の規定は、6月1日から7月1日までの間に被保険者の資格を取得した者には適用されない。6月1日に入社した者の資格取得時決定により決定された標準報酬月額は、同じ事業所にて定時決定された被保険者と同じ翌年の8月までの各月の標準報酬月額とされる。"}, {"label": "B", "text": "保険者等は、月給者の定時決定を行う場合、その被保険者が毎年4月1日現に使用される事業所において同日以後3か月間である4月、5月、6月に実際に支給された賃金や報酬の総額をもとに標準報酬月額を決定する。"}, {"label": "C", "text": "標準報酬月額の定時決定等における支払基礎日数の取扱いとして、月給者については各月の暦日数によることから、月給者で欠勤日数分に応じ給与が差し引かれる場合にあっては、その月における暦日の数から当該欠勤日数を控除した日数を支払基礎日数とする。"}, {"label": "D", "text": "保険者等は、被保険者が現に使用される事業所において継続した3か月間（その事業所で継続して使用された期間に限るものとし、かつ、報酬支払の基礎となった日数が17日未満である月があるときは、その月を除く。）に受けた報酬の総額をその期間の月数で除して得た額が、その者の標準報酬月額の基礎となった報酬月額に比べて、著しく高低を生じた場合において、必要があると認めるときは随時改定の対象となり、その額を報酬月額として、その著しく高低を生じた月の翌月から、標準報酬月額を改定することができる。"}, {"label": "E", "text": "健康保険法第199条第1項によると、保険者等は、被保険者の資格、標準報酬又は保険料に関し必要があると認めるときは、事業主に対し、事業所の名称、所在地その他必要な資料の提供を求め、又は銀行、信託会社その他の機関に対し、被保険者若しくは被保険者であると認められる者の収入の状況その他の事項につき、報告を求めることができる。"}], "answer": "A", "key": "R08-5-10", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R08-6", "title": "R8本試験 厚年", "subject": "厚生年金保険法", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和8年度（第58回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和8年4月10日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "障害等級2級に該当する程度の障害の状態であり、障害厚生年金の受給権者である甲について、障害等級に該当する程度の障害の状態に該当しなくなったことにより、当該障害厚生年金の支給が停止された。その後、甲が障害厚生年金の支給事由となった障害とは別の疾病により障害の状態となり、当該新たな疾病に係る障害認定日以後65歳に達する日の前日までの間において、当該障害厚生年金の支給事由となった障害と新たな障害とを併合した障害の程度が障害等級2級に該当する程度の障害の状態となった。この場合、当該障害厚生年金の支給停止は解除される。なお、新たな疾病の初診日において甲は被保険者であり、また、厚生年金保険法第47条第1項ただし書きで規定する保険料納付要件を満たしているものとする。"}, {"label": "B", "text": "障害厚生年金は、その受給権者が当該傷病について労働基準法第77条の規定による障害補償を受ける権利を取得したときは、7年間、その支給が停止される。"}, {"label": "C", "text": "厚生年金保険法第48条第1項の規定による前後の障害を併合した障害の程度による障害厚生年金の額の算定においては、併合されたそれぞれの障害に係る障害認定日のうちいずれか早い日の属する月後における被保険者期間は、その計算の基礎とされない。"}, {"label": "D", "text": "障害厚生年金の受給権者の配偶者であり、加給年金額加算の対象となっていた者が、老齢厚生年金（年金額の計算の基礎となる被保険者期間が120月であるとする。）の支給を受けることができるようになった。この場合、加給年金額の支給が停止される。"}, {"label": "E", "text": "障害厚生年金（障害等級1級又は2級）の受給権を取得した日に、当該受給権者によって生計を維持しているその者の65歳未満の配偶者がいる場合は、加給年金額の加算が行われるが、受給権を取得した日の翌日以後にその者によって生計を維持しているその者の65歳未満の配偶者を有することになった場合には加給年金額の加算は行われない。"}], "answer": "A", "key": "R08-6-1", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "常時5人以上の従業員を使用する社会保険労務士の事務所（法人ではないものとする。）は、当該事業所を適用事業所とするためには厚生労働大臣の認可を受ける必要がある。"}, {"label": "B", "text": "適用事業所となる船舶の船舶所有者は適用事業所の事業主とみなされるが、船舶賃借の場合は、船舶の所有者ではなく船舶借入人が事業主とみなされる。"}, {"label": "C", "text": "健康保険法第31条第2項による任意適用事業所の認可の申請と同時に厚生年金保険法第6条第4項による任意適用事業所の認可の申請を行う場合であっても、両者はそれぞれ個別に申請書を提出しなければならない。"}, {"label": "D", "text": "2以上の適用事業所（船舶ではないものとする。）の事業主が同一である場合には、当該事業主は、厚生労働大臣に届け出ることにより、当該2以上の事業所を1の適用事業所とすることができるが、この届出があった場合には、当該2以上の適用事業所は適用事業所でなくなったものとみなされる。"}, {"label": "E", "text": "適用事業所の事業主は、廃止、休止その他の事情により適用事業所に該当しなくなったときは、原則として、当該事実があった日から10日以内に、所定の事項を記載した届書を日本年金機構に提出しなければならないが、この届書には、登記事項証明書その他の適用事業所に該当しなくなったことを証する書類を添えなければならない。なお、当該事業主は船舶所有者ではなく、また、任意適用取消の申請は行っていないものとする。"}], "answer": "B", "key": "R08-6-2", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "1か月の期間を定めて臨時に使用される者で、定めた期間を超えて使用されることが見込まれないものは、厚生年金保険の被保険者とはならない。ただし、船舶所有者に使用される船員ではないものとする。"}, {"label": "B", "text": "2以上の種別の被保険者であった期間を有する者に係る老齢厚生年金について、厚生年金保険法第42条（受給権者）の規定を適用する場合においては、第1号厚生年金被保険者期間、第2号厚生年金被保険者期間、第3号厚生年金被保険者期間又は第4号厚生年金被保険者期間に係る被保険者期間ごとに適用するものとされている。"}, {"label": "C", "text": "厚生年金保険法第43条第2項に規定する在職定時改定は、同法附則第8条に規定する65歳未満の者に支給する特例による老齢厚生年金の額については、適用しない。"}, {"label": "D", "text": "特定適用事業所に使用される者で1週間の所定労働時間が同一の事業所に使用される通常の労働者の1週間の所定労働時間の4分の3未満である者は、1週間の所定労働時間が20時間以上であったとしても、その者が学校教育法に規定する大学の学生（卒業を予定している者であって、適用事業所に使用され、卒業した後も引き続き当該適用事業所に使用されることとなっているもの、休学中の者及び定時制の課程等に在学する者その他これらに準ずる者には該当しないものとする。）である場合には、厚生年金保険の被保険者とはならない。"}, {"label": "E", "text": "特定適用事業所に該当しなくなった適用事業所に使用される特定4分の3未満短時間労働者（厚生年金保険の被保険者の資格を有していたものとする。）については、事業主の申出がない場合であっても、特定適用事業所に該当しなくなった日の翌日に、厚生年金保険の被保険者の資格を喪失する。"}], "answer": "E", "key": "R08-6-3", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "遺族厚生年金の支給要件を満たす被保険者の死亡について労働基準法第79条による遺族補償の支給が行われるべきものであるときは、死亡の日から6年間、遺族厚生年金の支給が停止される。"}, {"label": "B", "text": "2以上の種別の被保険者であった期間を有する者の遺族に係る遺族厚生年金（厚生年金保険法第58条第1項第1号から第3号までのいずれかに該当することにより支給されるものに限る。）の額については、死亡した者に係る2以上の被保険者の種別に係る被保険者であった期間を合算し、1の期間に係る被保険者期間のみを有するものとみなして、遺族厚生年金の額の計算及びその支給停止に関する規定その他政令で定める規定が適用される。"}, {"label": "C", "text": "配偶者以外の者に対する遺族厚生年金の受給権者が2人以上である場合において、受給権者のうち1人以上の者の所在が1年以上明らかでないときは、その者に対する遺族厚生年金は、他の受給権者の申請によって、その所在が明らかでなくなった時にさかのぼって、その支給を停止する。"}, {"label": "D", "text": "被保険者である甲には妻の乙と10歳の子である丙がいたが、甲が死亡したことにより、乙と丙が遺族厚生年金の受給権者となった。その3年後、乙は丁と再婚し、丙は丁の養子となった。この場合、乙と丙の受給権は消滅する。"}, {"label": "E", "text": "被保険者であり老齢厚生年金の受給権者でもある戊は、令和8年3月31日に適用事業所を退職したことにより同年4月1日に被保険者の資格を喪失したが、その後、同年8月現在まで被保険者にはなっていない。この場合、厚生年金保険法第43条第3項に規定する退職改定として、同年4月から年金額が改定される。"}], "answer": "D", "key": "R08-6-4", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "65歳以後の在職老齢年金の計算で用いられる基本月額は、加給年金額を含む老齢厚生年金の額を12で除して得た額である。"}, {"label": "B", "text": "67歳の老齢厚生年金の受給者かつ厚生年金保険の被保険者で、在職老齢年金による支給停止を受けていた者が、令和8年8月1日に退職した。この退職の後に再就職する予定はない。この場合、令和8年8月分の老齢厚生年金は、在職老齢年金による支給停止の対象とはならない。"}, {"label": "C", "text": "67歳の老齢厚生年金の受給者かつ65歳到達以降、厚生年金保険の被保険者ではなかった者が、令和8年8月1日に就職し、厚生年金保険の被保険者の資格を取得した。この場合、令和8年8月分の老齢厚生年金は、在職老齢年金による支給停止の対象とはならない。"}, {"label": "D", "text": "報酬又は賞与の全部又は一部が、通貨以外のもので支払われる場合、その価額は、全国一律の基準で、厚生労働大臣が定める。"}, {"label": "E", "text": "当分の間、一定の要件を満たす60歳以上65歳未満である者は、65歳に達する前に老齢厚生年金の支給繰上げの請求をすることができる。現に国民年金の任意加入被保険者である者も、この請求をすることができる。"}], "answer": "C", "key": "R08-6-5", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "老齢厚生年金における加給年金額の加算対象となる配偶者が、国民年金法第30条の4の障害基礎年金を受給している場合は、当該加給年金額は支給停止となる。ただし、配偶者の前年所得に応じて、当該障害基礎年金の2分の1相当額が支給停止されているときは、加給年金額は支給停止とならない。"}, {"label": "B", "text": "甲は、高校卒業直後の4月1日に18歳で就職し、厚生年金保険の被保険者となった。入社2か月目に初診日のある傷病により、障害認定日に障害の状態が障害等級2級に該当すると認定された。障害認定日時点では19歳であった。20歳前に初診日があるため、甲には障害厚生年金は支給されず、20歳に達した日の属する月の翌月分から、国民年金法第30条の4に基づく障害基礎年金が支給される。"}, {"label": "C", "text": "加給年金額の対象者がいる老齢厚生年金の受給権者は、原則として、毎年、誕生日の属する月の翌月末日までに、生計維持確認届を日本年金機構に提出しなければならない。なお、当該老齢厚生年金の額の全部につき支給が停止されているときも、生計維持確認届の提出が必要である。"}, {"label": "D", "text": "「社会経済の変化を踏まえた年金制度の機能強化のための国民年金法等の一部を改正する等の法律」（令和7年法律第74号）により、法律の公布日の属する年度の翌年度から、次期財政検証作成年度の翌年度までの間は、厚生年金（報酬比例部分）の給付調整が継続される。この間、厚生年金では、マクロ経済スライドによる調整において、その調整率が軽減される。"}, {"label": "E", "text": "年金額は物価変動率などに応じて毎年度改定が行われるが、改定後の年金額が最初に支給されるのは4月の支給日である。"}], "answer": "D", "key": "R08-6-6", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "厚生年金保険法第56条の規定により、障害手当金は、原則として、厚生年金保険の年金たる保険給付の受給権者には支給されない。ただし、最後に障害等級に該当しなくなった日から起算して障害状態に該当することなく3年を経過した障害厚生年金の受給権者（現に障害状態に該当しない者に限る。）は支給対象となりうる。"}, {"label": "B", "text": "障害手当金を受ける権利は、その支給すべき事由が生じた日から5年を経過したときは、時効によって消滅する。"}, {"label": "C", "text": "障害厚生年金の受給権者で、障害の程度の診査が必要であると認めて厚生労働大臣が指定したものは、厚生労働大臣が指定した年において、指定日までに、指定日前の1年以内に作成されたその障害の現状に関する医師等の診断書を日本年金機構に提出しなければならない。ただし、当該障害厚生年金の額の全部につき支給が停止されているときは、この限りでない。"}, {"label": "D", "text": "実施機関は、合意分割（厚生年金保険法第78条の2に規定する離婚等をした場合における標準報酬の改定の特例をいう。）の規定により標準報酬の改定又は決定を行ったときは、その旨を通知しなければならない。その通知の対象となるのは、対象期間標準報酬総額が多く、分割を行う側である第1号改定者と、対象期間標準報酬総額が少なく、分割を受ける側である第2号改定者の双方である。"}, {"label": "E", "text": "厚生年金保険法第100条第1項に基づく立入検査は、適用事業所の事業主に対してだけでなく、厚生年金保険の適用が行われていないものの、適用事業所であると認められる事業所の事業主に対しても行うことができる。"}], "answer": "C", "key": "R08-6-7", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "死亡した被保険者の子は、被保険者死亡の当時、年齢が19歳で婚姻をしていたとしても、障害等級2級に該当する障害の状態にあり、かつ、被保険者によって生計を維持していれば、遺族厚生年金を受けることができる遺族に含まれる。なお、死亡した被保険者によって生計を維持していた他の遺族はいないものとする。"}, {"label": "B", "text": "死亡した被保険者の配偶者の母は、被保険者死亡の当時に年齢が55歳以上、かつ、被保険者によって生計を維持していたとしても、遺族厚生年金を受けることができる遺族には含まれない。なお、死亡した被保険者によって生計を維持していた他の遺族はいないものとする。"}, {"label": "C", "text": "厚生年金保険法第9条及び第10条第1項の規定にかかわらず、同法第12条の規定により、所在地が一定しない事業所に使用される者は、厚生年金保険の被保険者とはならない。ただし、継続して6か月を超えて使用されるべき場合は、この限りでない。"}, {"label": "D", "text": "厚生年金保険法第9条及び第10条第1項の規定にかかわらず、同法第12条の規定により、臨時的事業の事業所に使用される者は、厚生年金保険の被保険者とはならない。ただし、継続して2か月を超えて使用されるべき場合は、この限りでない。"}, {"label": "E", "text": "障害等級3級に該当する障害厚生年金を受給している者が65歳に到達し、老齢基礎年金と老齢厚生年金の受給権も取得した場合、老齢基礎年金と老齢厚生年金の組み合わせか、老齢基礎年金と障害厚生年金の組み合わせのどちらかを選択する必要がある。"}], "answer": "B", "key": "R08-6-8", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次のアからオの記述のうち、正しいものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "67歳到達時点で老齢厚生年金の支給繰下げの申出を行った場合において、経過的加算として老齢厚生年金に加算される部分についても、当該老齢厚生年金の支給繰下げの申出に応じた増額の対象となる。"}, {"label": "イ", "text": "65歳から支給される老齢厚生年金に配偶者加給年金額が加算される場合において、68歳到達時点で老齢厚生年金の支給繰下げの申出を行ったときは、当該配偶者加給年金額は、老齢厚生年金の支給繰下げの申出に応じた増額の対象となる。"}, {"label": "ウ", "text": "積立金の運用に係る行政事務に従事する厚生労働省、財務省、総務省及び文部科学省の職員（政令で定める者に限る。）は、積立金の運用の目的に沿って、慎重かつ細心の注意を払い、全力を挙げてその職務を遂行しなければならない。"}, {"label": "エ", "text": "65歳未満の特別支給の老齢厚生年金を受給していた者が、65歳に到達し、厚生年金保険法第42条に規定する本来の老齢厚生年金をその時点から受給しようとする場合は、実施機関に請求書を提出する必要はない。"}, {"label": "オ", "text": "第1号厚生年金被保険者に係る適用事業所の事業主は、被保険者が70歳に到達し、引き続き当該事業所に使用されることにより70歳以上の使用される者の要件に該当する場合において、当該者の標準報酬月額に相当する額が70歳到達日の前日における標準報酬月額と同額であっても、70歳以上被用者該当届及び70歳到達時の被保険者資格喪失届を省略することができない。"}], "choices": [{"label": "A", "text": "（アとウ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（イとオ）"}, {"label": "E", "text": "（ウとオ）"}], "answer": "A", "key": "R08-6-9", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和8年度本試験", "stem": "厚生年金保険法に関する次のアからオの記述のうち、正しいものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "障害厚生年金の受給権者は、実施機関に対し、障害の程度が増進したことによる障害厚生年金の額の改定を請求することができるが、当該請求については、障害厚生年金の受給権者の障害の程度が増進したことが明らかである場合として厚生労働省令で定める場合を除き、当該障害厚生年金の受給権を取得した日又は実施機関の診査を受けた日から起算して1年6か月を経過した日後でなければ行うことができない。"}, {"label": "イ", "text": "障害手当金の額は、障害厚生年金の額の規定の例により計算した額の100分の200に相当する額と定められているが、当該障害厚生年金の額の計算の基礎となる被保険者期間の月数が300に満たない場合も、実際の被保険者期間の月数で計算されることとなっている。"}, {"label": "ウ", "text": "第1号厚生年金被保険者が死亡したことにより、死亡した被保険者の母が遺族厚生年金の受給権者となった場合において、その後、当該母に届出をしていないが、事実上婚姻関係と同様の事情にある配偶者が生じたときは、当該母の遺族厚生年金の受給権は消滅する。"}, {"label": "エ", "text": "厚生年金保険法第78条の7に規定する離婚時みなし被保険者期間については、老齢厚生年金の配偶者加給年金額が加算されるために必要な要件の1つとなっている老齢厚生年金の額の計算の基礎となる被保険者期間の月数の中に含めることができる。"}, {"label": "オ", "text": "昭和38年10月7日生まれで、令和8年10月に63歳となる女性について、第1号厚生年金被保険者期間のみを有し、特別支給の老齢厚生年金の受給資格要件を満たす（長期加入者や障害者などの特例には該当していない。）場合、報酬比例部分の支給開始年齢も63歳である。"}], "choices": [{"label": "A", "text": "（アとウ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（イとオ）"}, {"label": "E", "text": "（ウとオ）"}], "answer": "E", "key": "R08-6-10", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R08-7", "title": "R8本試験 国年", "subject": "国民年金法", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和8年度（第58回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和8年4月10日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和8年度本試験", "stem": "国民年金法に関する次のアからオの記述のうち、誤っているものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "保険料の一部免除に関する規定により納付することを要しないものとされたその一部の額以外の残余の額に50円未満の端数が生じたときはこれを切り捨て、50円以上100円未満の端数が生じたときはこれを100円に切り上げるものとする。"}, {"label": "イ", "text": "国民年金法第90条の3第1項の規定により保険料を納付することを要しないものとされた被保険者は、国民年金法施行令第6条の6に規定する生徒若しくは学生でなくなったとき（その原因が卒業であるときを除く。）は、氏名、生年月日及び住所並びに個人番号又は基礎年金番号を記載した届書を日本年金機構に提出しなければならない。"}, {"label": "ウ", "text": "納付猶予とは、第1号被保険者等本人（50歳未満）及びその世帯主又は配偶者のいずれもが、地方税法に定める障害者、寡婦その他の同法の規定による市町村民税が課されない者として政令で定める者であって、当該保険料を納付することを要しないものとすべき月の属する年の前年の所得が135万円以下であるとき、当該第1号被保険者等が厚生労働大臣に申請することにより、保険料の全額の納付義務を猶予する制度である。"}, {"label": "エ", "text": "法定免除、全額免除、学生納付特例又は納付猶予の規定により納付することを要しないものとされた保険料の一部につき追納をするときは、学生納付特例又は納付猶予の規定により納付することを要しないものとされた保険料につき行い、次いで法定免除若しくは全額免除、一部免除の規定によりその一部の額につき納付することを要しないものとされた保険料につき行うものとし、これらの保険料のうちにあっては、先に経過した月の分から順次に行うものとする。なお、学生納付特例又は納付猶予により納付を免除された保険料より前に法定免除、全額免除及び申請一部免除により納付を免除された保険料は一切ないものとする。"}, {"label": "オ", "text": "厚生労働大臣は、国民年金法第96条第1項の規定による督促を受けた者がその指定の期限までに保険料その他この法律の規定による徴収金を納付しないときは、国税滞納処分の例によってこれを処分し、又は滞納者の居住地若しくはその者の財産所在地の市町村に対して、その処分を請求することができる。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとウ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（ウとオ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "B", "key": "R08-7-1", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和8年度本試験", "stem": "国民年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "障害基礎年金、遺族基礎年金又は寡婦年金は、その受給権者が他の年金給付（付加年金を除く。）又は厚生年金保険法による年金たる保険給付（当該年金給付と同一の支給事由に基づいて支給されるものを除く。）を受けることができるときは、その間、その支給を停止する。"}, {"label": "B", "text": "年金給付（国民年金法の他の規定又は他の法令の規定によりその全額につき支給を停止されている年金給付を除く。）につき、その全額の支給を停止する受給権者の申出は、申出の時点に遡って撤回することができる。"}, {"label": "C", "text": "自己の故意の犯罪行為若しくは重大な過失により、又は正当な理由がなくて療養に関する指示に従わないことにより、死亡又はその原因となった事故を生じさせた者の死亡については、これを支給事由とする給付を一時差し止めることができる。"}, {"label": "D", "text": "障害認定日は、初診日から起算して1年6か月を経過した日（その期間内にその傷病が治った場合においては、その治った日（その症状が固定し治療の効果が期待できない状態に至った日を含む。））とされるが、人工透析療法を受けている場合には透析を始めてから3か月を経過した日（初診日から起算して1年6か月を超える場合を除く。）が障害認定日とされる。"}, {"label": "E", "text": "死亡一時金の支給を受ける者が第1号被保険者の死亡により寡婦年金を受けることができるときは、死亡一時金と寡婦年金とのうち、死亡日から6年間、その1つを支給し、他は支給を停止する。"}], "answer": "D", "key": "R08-7-2", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和8年度本試験", "stem": "国民年金法における産前産後期間の保険料免除制度に関する次のアからオの記述のうち、正しいものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "産前産後期間の保険料免除制度により保険料を納付することを要しないこととされた期間について、当該期間中に生活保護法による生活扶助を受けるときは、国民年金法第89条第1項第2号に該当するため、同条により保険料が免除される。"}, {"label": "イ", "text": "産前産後の保険料免除期間は、死亡一時金及び脱退一時金の支給要件において、保険料納付済期間に算入される。"}, {"label": "ウ", "text": "産前産後期間の保険料免除に関わる出産とは、妊娠85日（4か月）以上の分娩をいい、早産、死産、流産及び人工妊娠中絶を含む。"}, {"label": "エ", "text": "国民年金に任意加入している被保険者は、産前産後保険料免除の対象となり、保険料の負担を免除される。"}, {"label": "オ", "text": "保険料の納付期限から2年を経過したとき以降、産前産後の保険料免除に係る届出を行うことはできない。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとウ）"}, {"label": "D", "text": "（ウとオ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "C", "key": "R08-7-3", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和8年度本試験", "stem": "国民年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "任意加入被保険者として保険料を前納した者が、前納期間の途中で第1号被保険者資格を取得した場合に当該被保険者が希望したときは、未経過期間に係る前納保険料の還付請求を求めず、当該期間を第1号被保険者の保険料納付済期間として算入させる。"}, {"label": "B", "text": "第1号被保険者として保険料を前納した者が、前納期間の途中で国民年金法第88条の2の規定により産前産後期間の保険料納付義務が免除される場合は、未経過期間に係る前納保険料の還付請求を求めず、当該保険料を免除期間後の保険料として充当する。"}, {"label": "C", "text": "第1号被保険者として保険料を前納した者が、前納期間の途中で第2号被保険者資格を取得したときは、未経過期間に係る前納保険料の還付請求を求めず、当該期間を第2号被保険者の保険料納付済期間として算入させる。"}, {"label": "D", "text": "保険料を前納した者が、前納期間の途中で障害基礎年金の受給権者となったときは、既に納付した前納保険料は、その全額が保険料納付済期間として将来の老齢基礎年金の額に反映されるため、還付請求できない。"}, {"label": "E", "text": "障害基礎年金の受給権者は、保険料納付を要しないため、保険料の前納はできない。"}], "answer": "A", "key": "R08-7-4", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和8年度本試験", "stem": "国民年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "国民年金法第89条第1項等の規定により納付を要しないとされた保険料の全部又は一部につき追納できるのは、被保険者又は被保険者であった者であり、障害基礎年金の受給権者は該当しない。"}, {"label": "B", "text": "保険料を追納できる期間は、老齢基礎年金の受給権を得る前で、追納申請が厚生労働大臣に承認された日の属する月前5年以内の期間に限られる。"}, {"label": "C", "text": "保険料の一部の額につき納付することを要しないものとされた保険料について追納するには、その残余の額につき納付されていなければならない。"}, {"label": "D", "text": "平成15年10月生まれの大学生が、20歳となった令和5年の誕生日月から令和8年3月末に卒業するまで学生納付特例の承認を受けた。この者が、令和10年10月に初めて追納を開始する場合の保険料額は、学生納付特例の承認を受けた当時の保険料額である。"}, {"label": "E", "text": "申請免除等の始期は、申請日の属する月の5年前とされていることから、保険料の納期限から5年を経過していない期間について、遡って保険料免除申請及び納付猶予申請ができる。"}], "answer": "C", "key": "R08-7-5", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和8年度本試験", "stem": "国民年金法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "厚生年金保険の被保険者の資格を取得したときは、その者が20歳未満でも、国民年金の第2号被保険者資格を取得する。"}, {"label": "B", "text": "国民年金法第109条の2の2第1項に規定する学生等被保険者が学生納付特例事務法人に学生納付特例申請をしたときは、学生等被保険者により提出された申請書類を、当該法人が日本年金機構に提出した日に学生納付特例申請があったものとみなす。"}, {"label": "C", "text": "国民年金第1号被保険者の甲は、日本国内に住所を有しなくなった日に、さらに国民年金第2号被保険者に該当するに至った。この場合、甲は、国民年金第２号被保険者に該当するに至った日に国民年金第1号被保険者資格を喪失する。"}, {"label": "D", "text": "第3号被保険者とは、第2号被保険者の被扶養配偶者のうち20歳以上60歳未満の者のことであるが、被扶養配偶者の認定については令和8年4月1日以降、認定対象者の年間収入が、労働条件通知書等の労働契約の内容が確認できる書類において規定される時給・労働時間・日数等を用いて算出した年間収入の見込み額が基準額未満である場合を想定し、労働契約段階では見込み難い時間外労働に対する賃金等の臨時収入を含めないで判定される。"}, {"label": "E", "text": "第1号被保険者及び第3号被保険者は、第2号被保険者に該当することとなった場合を除き、60歳に達した日に国民年金の被保険者の資格を喪失する。"}], "answer": "B", "key": "R08-7-6", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和8年度本試験", "stem": "国民年金法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "国民年金法第109条の2に規定された指定全額免除申請事務取扱者は、基準に該当する被保険者又は被保険者であった者に対して納付勧奨及び免除勧奨を行うこととされ、基準に該当する被保険者又は被保険者であった者より委託を受けて全額免除申請及び納付猶予申請を行うことができる。"}, {"label": "B", "text": "昭和61年3月31日までの期間において、厚生年金保険の被保険者の配偶者であったため、国民年金の任意加入被保険者となることができた期間は、老齢基礎年金の合算対象期間とされるが、この期間に任意加入の申出を行い任意加入被保険者となったものの保険料を納付しなかった場合は合算対象期間とはされない。"}, {"label": "C", "text": "障害基礎年金の受給権は、厚生年金保険法第47条第2項に規定する障害等級に該当する程度の障害の状態に該当しなくなった日から起算して障害厚生年金の障害等級に該当する程度の障害の状態に該当することなく3年を経過したときは消滅する。ただし、3年を経過した日において、当該受給権者が65歳未満であるときを除く。"}, {"label": "D", "text": "死亡日の前日において遺族基礎年金の保険料納付要件を満たした第3号被保険者が死亡したときに、その者に生計を維持する子（国民年金法第37条の2第1項第2号に該当する子）がいた場合は、その者と生計を同じくしていた配偶者の収入が将来にわたって厚生労働大臣の定める金額未満であれば、当該配偶者に遺族基礎年金が支給される。"}, {"label": "E", "text": "初診日の前日において障害基礎年金の保険料納付要件を満たした第3号被保険者が国民年金法第30条第2項に規定する障害等級に該当したときに、その者に生計を維持する子（18歳に達する日以後の最初の3月31日までの間にある子及び20歳未満であって障害等級に該当する障害の状態にある子）がいる場合は、その者の障害基礎年金の額に子の加算が行われる。"}], "answer": "B", "key": "R08-7-7", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和8年度本試験", "stem": "国民年金法に関する次のアからオの記述のうち、正しいものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "政府は、国民年金法第4条の3第1項の規定により作成する「財政の現況及び見通し」において、年金たる給付（付加年金を含む。）の額の調整を行う必要がなくなったと認められるときは、政令で、調整期間の終了年度を定めるものとされている。"}, {"label": "イ", "text": "国民年金法第94条第1項の規定により保険料の追納が行われたときは、追納が行われた日に、追納に係る月の保険料が納付されたものとみなすこととなっている。"}, {"label": "ウ", "text": "国民年金法第93条第1項の規定により保険料の前納が行われたときは、保険料納付済期間又は保険料4分の3免除期間、保険料半額免除期間若しくは保険料4分の1免除期間を計算する場合においては、前納が行われた日に、前納に係る期間の各月の保険料が納付されたものとみなすこととなっている。"}, {"label": "エ", "text": "付加保険料を納付する第1号被保険者が、国民年金基金の加入員となったときは、その加入員となった日の前日に、付加保険料の納付の辞退の申出をしたものとみなされる。"}, {"label": "オ", "text": "国民年金基金連合会には、評議員で組織する評議員会が置かれ、規約の変更、毎事業年度の予算、毎事業年度の事業報告及び決算その他規約で定める事項については、評議員会の議決を経なければならない。"}], "choices": [{"label": "A", "text": "（アとウ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（イとオ）"}, {"label": "E", "text": "（ウとオ）"}], "answer": "D", "key": "R08-7-8", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和8年度本試験", "stem": "国民年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "老齢基礎年金の振替加算について、年齢要件については大正15年4月2日から昭和41年4月1日までの間に生まれた者であるが、その額については、受給権者の老齢基礎年金の額に受給権者の生年月日に応じて政令で定められた率を乗じて得た額となる。"}, {"label": "B", "text": "振替加算が加算された老齢基礎年金の受給権者が、遺族厚生年金の支給を受けることができるときは、その間、振替加算の額に相当する部分の支給が停止される。"}, {"label": "C", "text": "付加年金の額は、200円に付加保険料に係る保険料納付済期間の月数を乗じて得た額とされており、老齢基礎年金の支給繰下げの申出を行った場合においても付加年金は支給の繰下げは行われず、支給額が増額されることもない。"}, {"label": "D", "text": "受給権者が、正当な理由がなくて、国民年金法第105条第3項の規定による届出をせず、又は書類その他の物件を提出しないときは、年金給付の支給は停止されることとなっている。"}, {"label": "E", "text": "国民年金法による学生の保険料の納付特例の規定により、保険料を納付することを要しないものとされた期間については、その期間に係る保険料が追納されない限り、老齢基礎年金の額には反映されない。"}], "answer": "E", "key": "R08-7-9", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和8年度本試験", "stem": "国民年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "年金の支払においては、毎支払期月ごとに支払われる金額に1円未満の端数が生じたときは、これを切り捨てるものとされているが、毎年5月から翌年4月までの間において切り捨てた金額の合計額（1円未満の端数が生じたときは、これを切り捨てた額）については、これを当該4月の支払期月の年金額に加算するものとする。"}, {"label": "B", "text": "厚生労働大臣は、国民年金制度に対する国民の理解を増進させ、及びその信頼を向上させるため、厚生労働省令で定めるところにより、被保険者に対し、当該被保険者の保険料納付の実績及び将来の給付に関する必要な情報を分かりやすい形で通知するものとされているが、当該被保険者が35歳、45歳及び55歳に達する日の属する年度における通知については、被保険者の資格の取得及び喪失並びに種別の変更の履歴や国民年金保険料の納付状況なども通知することとなっている。"}, {"label": "C", "text": "配偶者が遺族基礎年金の受給権を取得した当時胎児であった子が生まれたときは、その子は、配偶者がその権利を取得した当時遺族基礎年金の遺族の範囲に該当するものとされるが、遺族基礎年金の額については、その子が生まれた日の属する月から改定される。"}, {"label": "D", "text": "期間を定めて支給を停止されている障害基礎年金の受給権者に対して、更に障害基礎年金を支給すべき事由が生じたときは、併合認定の規定により支給する前後の障害を併合した障害の程度による障害基礎年金は、従前の障害基礎年金の支給を停止すべきであった期間、その支給を停止するものとし、その間、その者に従前の障害を併合しない障害の程度による障害基礎年金を支給する。"}, {"label": "E", "text": "死亡日の属する月の前月までの第1号被保険者としての被保険者期間に係る死亡日の前日における付加保険料納付済期間が2年以上である者の遺族に支給される死亡一時金の額には、一律8,500円が加算される。"}], "answer": "D", "key": "R08-7-10", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R07-1", "title": "R7本試験 労基・安衛", "subject": "労働基準法・安衛法", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和7年度（第57回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和7年4月11日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和7年度本試験", "stem": "労働基準法の総則（第1条～第12条）等に関する次の記述のうち、正しいものはいくつあるか。", "statements": [{"label": "ア", "text": "労働基準法第5条に定める「労働者の意思に反して労働を強制」するとは、不当なる手段を用いることによって、使用者が労働者の意識ある意思を抑圧し、その自由な発現を妨げて、労働すべく強要することをいい、必ずしも労働者が現実に労働することを必要としない。"}, {"label": "イ", "text": "労働基準法第6条に定める「何人も、法律に基いて許される場合の外、業として他人の就業に介入して利益を得てはならない。」の「業として利益を得る」とは、営利を目的として、同種の行為を反復継続することをいい、1回の行為であっても、反復継続して利益を得る意思があれば、これに当たる。"}, {"label": "ウ", "text": "労働審判員や裁判員としての職務は労働基準法第7条にいう「公の職務」に該当するため、労働者が労働時間中に、これらの職務を執行するために必要な時間を請求した場合においては、使用者はこれを拒んではならないが、権利の行使又は公の職務の執行に妨げがない限り、請求された時刻を変更することができる。"}, {"label": "エ", "text": "労働基準法第9条に定める「労働者」とは、他人との間に使用従属の関係に立って労務に服し、報酬を受けて生活する者をいい、現に就業していると否とを問わないから、失業者をも含む。"}, {"label": "オ", "text": "労働者が自己を被保険者として生命保険会社等と任意に保険契約を締結したときに企業が保険料の補助を行う場合、その保険料補助金は、労働者の福利厚生のために使用者が負担するものであるから、労働基準法第11条に定める「賃金」とは認められない。"}], "choices": [{"label": "A", "text": "一つ"}, {"label": "B", "text": "二つ"}, {"label": "C", "text": "三つ"}, {"label": "D", "text": "四つ"}, {"label": "E", "text": "五つ"}], "answer": "D", "key": "R07-1-1", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和7年度本試験", "stem": "労働基準法第12条（以下本問において「本条」という。）に定める平均賃金に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "令和7年1月1日から、賃金が日給1万円、毎月20日締切、当月25日支払いの条件で雇われている労働者について、同年7月15日に平均賃金を算定すべき事由が発生した。当該労働者に支払われていた賃金は、1月支払分から6月支払分までいずれも労働日数は月10日で支払額は各月10万円であり、本条第3項各号に掲げられている業務上負傷し療養のために休業した期間等の控除期間がなかった。この場合の当該労働者に係る平均賃金の額は6,000円である。"}, {"label": "B", "text": "労働基準法第20条に基づく解雇予告手当を算定する際の平均賃金算定事由発生日は、「労働者に解雇の通告をした日」であり、その後、当該労働者の同意を得て解雇日を変更した場合においても、当初の解雇を通告した日とするものとされている。"}, {"label": "C", "text": "所定労働時間が二暦日にわたる勤務を行う労働者（一昼夜交替勤務のごとく明らかに2日の労働と解することが適当な場合を除く。）について、当該勤務の二暦日目に平均賃金を算定すべき事由が発生した場合においては、当該勤務の始業時刻の属する日に当該事由が発生したものとして取り扱うこととされている。"}, {"label": "D", "text": "雇入れ後3か月未満の労働者について平均賃金を算定すべき事由が発生した場合には、算定事由発生日前に賃金締切日があるか否かにかかわらず、雇入れ後の期間とその期間中の賃金の総額で算定することとされている。"}, {"label": "E", "text": "本条第3項第1号から第4号までに掲げられている業務上負傷し療養のために休業した期間等の控除期間が、平均賃金を算定すべき事由の発生した日以前3か月以上にわたる場合の平均賃金は、都道府県労働局長がこれを定めることとされている。"}], "answer": "D", "key": "R07-1-2", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和7年度本試験", "stem": "労働基準法に定める労働契約等に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働基準法第14条第1項第2号は、満60歳以上である労働者との労働契約（同条同項第1号に掲げる労働契約を除く。）は、期間の定めのないものを除き、一定の事業の完了に必要な期間を定めるもののほかは、5年を超える期間について締結してはならないと定めているが、満60歳以上であるかどうかは当該労働契約締結時の年齢で判断される。"}, {"label": "B", "text": "労働基準法第14条第1項に規定する期間を超える期間を定めた労働契約を締結した場合は、同条同項には使用者とも労働者とも規定されていないことから、使用者と労働者の双方に罰則が適用される。"}, {"label": "C", "text": "労働契約の締結に際し明示された労働条件が事実と相違している場合、労働者は、即時に労働契約を解除することができるにとどまり、明示されたとおりの労働条件の履行を使用者に要求することはできない。"}, {"label": "D", "text": "事業主が同一人でないＸ社とＹ社に使用される労働者が、Ｘ社の業務により負傷し、その療養のために休業する期間及びその後30日間については、Ｘ社もＹ社も当該労働者を解雇してはならない。"}, {"label": "E", "text": "事業主が犯した経済法令違反を原因として購入した諸機械、資材等を没収され、事業の継続が不可能となったときは、労働基準法第20条第1項にいう「やむを得ない事由のために事業の継続が不可能となつた場合」に該当することから、当該事業主が、これを理由として労働者を解雇しようとする場合には、少なくとも30日前にその予告をしなければならない等の同条同項に定める解雇の予告を行う必要はない。"}], "answer": "A", "key": "R07-1-3", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和7年度本試験", "stem": "労働基準法に定める賃金等に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "使用者は、当該事業場の労働者の過半数で組織する労働組合があるときはその労働組合、労働者の過半数で組織する労働組合がないときは労働者の過半数を代表する者との書面による協定がある場合においては、賃金を前借金その他労働することを条件とする前貸の債権と相殺することができる。"}, {"label": "B", "text": "労働基準法第24条第1項は、使用者の意思で労働者本人以外の者に賃金を支払うことを禁止するものであるから、労働者の意思で第三者に賃金受領権限を与えようとする委任、代理等の法律行為は無効となるものではない。"}, {"label": "C", "text": "労働協約によりストライキ中の賃金を支払わないことを定めているＸ社では日給月給制を採用しており、毎月15日に当月の賃金を前払いする（例えば、8月15日に8月1日から同月末日までの分の賃金を支払う）ことになっているが、所定労働日である8月21日から25日まで5日間ストライキが行われた場合、当該ストライキに参加した労働者の賃金について、使用者が9月15日の賃金支払いにおいて前月のストライキの5日間分を控除して支払うことは、賃金全額払原則に違反する。"}, {"label": "D", "text": "労働者が労働基準法第25条に従い賃金の非常時払を請求する場合には、使用者は、特約のない限り、いまだ労務の提供のない期間に対する賃金も含めて支払期日前に支払う義務を負う。"}, {"label": "E", "text": "使用者の責に帰すべき事由による休業期間中であっても、労働協約、就業規則又は労働契約により休日と定められている日については、労働基準法第26条に定める休業手当を支払う義務は生じない。"}], "answer": "E", "key": "R07-1-4", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和7年度本試験", "stem": "労働基準法第36条に定める時間外・休日労働協定（以下本問において「協定」という。）に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働者数が、本社、Ｘ支店及びＹ支店の合計で180人の企業において、100人の労働者で組織する労働組合があるとき、本社、Ｘ支店及びＹ支店のいずれの事業場においても労働者側の協定当事者は、それぞれの事業場の労働組合員数にかかわらず、その労働組合となる。"}, {"label": "B", "text": "協定当事者である「労働者の過半数を代表する者」が、協定締結後に死亡した場合であっても、当該協定の効力は失われない。"}, {"label": "C", "text": "協定当事者である「労働者の過半数を代表する者」の「労働者」の範囲には、労働基準法第41条第2号の「管理監督者」、同条第3号の「監視、断続的労働従事者で行政官庁の許可を受けた者」、満18歳に満たない者などのような、時間外労働又は休日労働を考える余地のない者を含む全ての労働者と解すべきであるとされている。"}, {"label": "D", "text": "協定当事者である使用者は、労働基準法第10条の「使用者」であるから、各事業場の長ではなく、株式会社の社長自らが協定当事者となることも可能である。"}, {"label": "E", "text": "法人の役員を含む全従業員により構成されており、その目的・活動内容に照らし労働組合とは認められない親睦団体の代表者が自動的に協定を締結したにすぎない場合、当該代表者は、「労働者の過半数を代表する者」に当たらないとされている。"}], "answer": "A", "key": "R07-1-5", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和7年度本試験", "stem": "労働基準法第37条（以下本問において「本条」という。）に定める割増賃金の基礎となる賃金に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "通勤手当を、月額1,000円までは距離にかかわらず一律に、1,000円を超える場合は実際距離に応じた額を支給することとしている場合、割増賃金の基礎となる賃金の算定に当たっては、一律に支給される1,000円を含む通勤手当として支給した額全額を、割増賃金の基礎となる賃金に算入しなくとも差し支えないとされている。"}, {"label": "B", "text": "手術に従事した医師に対して支払われる手術手当は、当該手術手当を支給される医師が手術以外の業務で法定時間外労働を行った場合においても、割増賃金の基礎となる賃金に算入しなければならないとされている。"}, {"label": "C", "text": "通常は事務作業に従事している労働者が、法定労働時間外に特殊作業手当が支払われる現場作業に従事した場合、当該労働者にとって当該現場作業は本条第1項の「通常の労働時間」には該当しないので、当該特殊作業手当は割増賃金の基礎となる賃金に算入しなくとも差し支えないとされている。"}, {"label": "D", "text": "いわゆる年俸制の適用を受ける労働者の割増賃金の取扱いについて、賞与の支給額が確定しており、かつ、毎月支払部分と賞与とが明確に区分されている場合には、当該賞与額を割増賃金の基礎となる賃金に算入しなくとも差し支えない。"}, {"label": "E", "text": "正規の勤務時間による勤務の一部又は全部が午後10時から午前5時までの間において行われる看護業務に従事したときに、その勤務1回につき夜間看護手当として3,000円を支払う場合、当該夜間看護手当は、本条第1項の通常の労働時間又は労働日の賃金とは認められないから、割増賃金の基礎となる賃金に算入しなくとも差し支えないとされている。"}], "answer": "E", "key": "R07-1-6", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和7年度本試験", "stem": "労働基準法に定める就業規則に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "就業規則を作成した使用者は、当該就業規則を備え付けている場所等を労働者に示すこと等により、労働者が必要なときに容易に確認できる状態にする必要がある。"}, {"label": "B", "text": "使用者がその従業員に対して金品の不正隠匿の摘発・防止のために行う所持品検査は、これを必要とする合理的理由に基づいて、一般的に妥当な方法と程度で、しかも制度として、職場従業員に対して画一的に実施されるものでなければならず、このようなものとしての所持品検査が就業規則その他明示の根拠に基づいて行われるときは、従業員は、個別的な場合にその方法や程度が妥当を欠く等特段の事情がない限り、検査を受忍すべき義務があるとするのが、最高裁判所の判例である。"}, {"label": "C", "text": "労働契約の締結時点では労働日や労働時間を確定的に定めず、一定期間（1週間、1か月など）ごとに作成される勤務割や勤務シフトなどにおいて初めて具体的な労働日や労働時間が確定するような形態（シフト制）の労働者に関する労働基準法第89条第1項第1号に係る事項の就業規則への記載に際して、「個別の労働契約による」、「シフトによる」との記載のみにとどめた場合、就業規則の作成義務を果たしたことにならないが、基本となる始業及び終業の時刻や休日を定めた上で、「具体的には個別の労働契約で定める」、「具体的にはシフトによる」旨を定めることは差し支えない。"}, {"label": "D", "text": "労働基準法第90条第2項の規定により就業規則の届出に添付すべき意見を記した書面は、労働者を代表する者の氏名を記載しただけでは足りず、この者の押印もなければならない。"}, {"label": "E", "text": "労働者が、遅刻・早退をした場合、その時間については賃金債権が生じないものであるから、その時間分の減給は、労働基準法第91条に定める減給の制裁に関する規定の適用を受けないが、遅刻・早退の時間に対する賃金額を超える減給は制裁とみなされ、同条に定める規定の適用を受ける。"}], "answer": "D", "key": "R07-1-7", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和7年度本試験", "stem": "労働安全衛生法に関する次の記述のうち、誤っているものはどれか。なお、Ｃにおける「電子情報処理組織」とは、情報通信技術を活用した行政の推進等に関する法律（平成14年法律第151号）第6条第1項に規定する電子情報処理組織をいう。", "statements": [], "choices": [{"label": "A", "text": "労働安全衛生法第3条第3項には、仕事を他人に請け負わせる者は、施工方法、工期等について、安全で衛生的な作業の遂行を損なうおそれのある条件を付さないように配慮しなければならないとの責務が定められているが、当該規定は、建設工事以外の注文者にも適用される。"}, {"label": "B", "text": "労働安全衛生法第29条第1項には、元方事業者は、関係請負人及び関係請負人の労働者が、当該仕事に関し、労働安全衛生法又はこれに基づく命令の規定に違反しないよう必要な指導を行わなければならないと定められているが、当該規定は、建設業、造船業及び製造業に限らず全ての事業に適用される。"}, {"label": "C", "text": "労働安全衛生規則第2条第2項は、事業者が労働安全衛生法の定めにより総括安全衛生管理者を選任したときは、遅滞なく、電子情報処理組織を使用して、所定事項を、所轄労働基準監督署長に報告しなければならない旨定めている。"}, {"label": "D", "text": "労働安全衛生規則第11条第1項には、衛生管理者は、少なくとも毎週1回作業場等を巡視し、設備、作業方法又は衛生状態に有害のおそれがあるときは、直ちに、労働者の健康障害を防止するため必要な措置を講じなければならないとされているが、産業医については、作業場等を定期巡視する義務を課す規定は定められていない。"}, {"label": "E", "text": "労働安全衛生規則第12条の3第1項には、安全衛生推進者は、労働安全コンサルタント、労働衛生コンサルタントその他厚生労働大臣が定める者のうちから選任する場合を除きその事業場に専属の者を選任するよう定められているが、専任の者とすることまでは定められていない。"}], "answer": "D", "key": "R07-1-8", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和7年度本試験", "stem": "労働安全衛生法に定める就業制限に関する次の記述のうち、正しいものはどれか。なお、選択肢Ａ、Ｃ及びＤにおける「運転」は、道路交通法（昭和35年法律第105号）第2条第1項第1号に規定する道路を走行させる運転を除くものとする。", "statements": [], "choices": [{"label": "A", "text": "事業者は、つり上げ荷重5トン以上の移動式クレーンの運転の業務については、クレーン・デリック運転士免許を受けた者を就かせることができる。"}, {"label": "B", "text": "事業者は、つり上げ荷重3トンのクレーンを床上で運転し、かつ、当該運転をする者が荷の移動とともに移動する方式のクレーンの運転の業務については、小型移動式クレーン運転技能講習を修了した者を就かせることができる。"}, {"label": "C", "text": "機体重量が3トン未満のパワー・シヨベル（労働安全衛生法施行令別表第7第2号に定めるものをいう。）で、動力を用い、かつ、不特定の場所に自走することができるものの運転の業務は、労働安全衛生法第61条に定める就業制限業務に該当しない。"}, {"label": "D", "text": "最大荷重が3トン未満のショベルローダー又はフォークローダーの運転の業務は、労働安全衛生法第61条に定める就業制限業務に該当しない。"}, {"label": "E", "text": "つり上げ荷重5トンのクレーンで重さが1トン未満の荷を吊り上げようとする場合の玉掛けの業務は、労働安全衛生法第61条に定める就業制限業務に該当しない。"}], "answer": "C", "key": "R07-1-9", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和7年度本試験", "stem": "労働安全衛生法に定める作業環境測定の実施頻度に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "事業者は、粉じん障害防止規則第25条で定める常時特定粉じん作業が行われる屋内作業場について、6月以内ごとに1回、定期に、当該作業場における空気中の粉じんの濃度を測定しなければならない。"}, {"label": "B", "text": "事業者は、溶鉱炉により鉱物又は金属を製錬する業務を行う暑熱の屋内作業場について、半月以内ごとに1回、定期に、当該屋内作業場における気温、湿度及びふく射熱を測定しなければならない。"}, {"label": "C", "text": "事業者は、労働安全衛生規則第588条に規定する著しい騒音を発する屋内作業場について、6月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。"}, {"label": "D", "text": "事業者は、特定化学物質である労働安全衛生法施行令別表第3第2号7の塩素を取り扱う屋内作業場について、6月以内ごとに1回、定期に、当該作業場における空気中の塩素の濃度を測定しなければならない。"}, {"label": "E", "text": "事業者は、労働安全衛生法施行令第21条第9号で定める酸素欠乏危険場所において作業を行う場合の当該作業場について、半月以内ごとに1回、定期に、当該作業場における空気中の酸素の濃度を測定しなければならない。"}], "answer": "E", "key": "R07-1-10", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R07-2", "title": "R7本試験 労災・徴収", "subject": "労災保険法", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和7年度（第57回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和7年4月11日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和7年度本試験", "stem": "労災保険法の適用に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "出向元事業に雇用される労働者が、その雇用関係を存続したまま、出向元事業主の命により出向先事業の業務に従事する在籍型出向の場合、当該労働者に係る労災保険給付は、常に出向先事業に係る保険関係によるものとされている。"}, {"label": "B", "text": "派遣労働者に係る労災保険給付は、常に派遣元事業に係る保険関係によるものとされている。"}, {"label": "C", "text": "障害者総合支援法に基づく就労継続支援を行う事業場で就労する障害者は、雇用契約の締結の有無にかかわらず、労災保険法が適用される。"}, {"label": "D", "text": "インターンシップにおいての実習は、見学や体験的なものであることを原則としていることから、当該実習に参加する学生に労災保険法が適用されることはない。"}, {"label": "E", "text": "育児休業を取得する公立小学校教諭の業務を処理するために、当該育児休業請求に係る期間を任期の限度として臨時的任用された者には、その勤務の態様にかかわらず、労災保険法が適用される。"}], "answer": "B", "key": "R07-2-1", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和7年度本試験", "stem": "次の記述のうち、業務災害として保険給付の対象となるものはいくつあるか。", "statements": [{"label": "ア", "text": "鉄道保線作業に従事する労働者が、休日に自己の担当する鉄道沿線で事故があったため、使用者の呼び出しを受けて自宅から現場にかけつける途上で、つまずいて転倒し、負傷した場合"}, {"label": "イ", "text": "職場から2駅離れた社宅に居住する労働者が、休日に、台風のため社宅付近の大木が倒れたことに伴って切断された高圧電線がショートし、枯木に火が付く様子を社宅から目撃したことから、社宅への延焼を防止しようと作業していたところ、強風にあおられた高圧電線に接触して死亡した場合"}, {"label": "ウ", "text": "職業能力開発促進法に基づく技能検定であって、職務に関連する職種に係るものを、使用者から出張命令を受けて受検した労働者が、実技試験中に当該実技に起因して負傷した場合"}, {"label": "エ", "text": "山岳地区であって地理的条件から天候の変化が激しく、雷の発生頻度も高い地域で、山頂より100メートル下方で植生盤の植付作業をしていた労働者が、夕立のような異様な天候になったので、作業を中止し、他に適当な退避場所がなかったことから山頂の休憩小屋に退避しようと移動していたときに、落雷の直撃を受けて死亡した場合"}, {"label": "オ", "text": "通常は私鉄バスを利用して帰宅する夜勤労働者が、当該私鉄バスのストライキによる運休のため、早朝、電車で帰宅するつもりでバス停とは反対方向の鉄道駅に向かっている途上で自動車にはねられ、負傷した場合"}], "choices": [{"label": "A", "text": "一つ"}, {"label": "B", "text": "二つ"}, {"label": "C", "text": "三つ"}, {"label": "D", "text": "四つ"}, {"label": "E", "text": "五つ"}], "answer": "C", "key": "R07-2-2", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和7年度本試験", "stem": "厚生労働省労働基準局長通知「血管病変等を著しく増悪させる業務による脳血管疾患及び虚血性心疾患等の認定基準について」（令和3年9月14日付け基発0914第1号。以下本問において「認定基準」という。）に関する次の記述のうち、正しいものの組み合わせはどれか。", "statements": [{"label": "ア", "text": "認定基準にいう「特に過重な業務」とは、日常業務に比較して特に過重な身体的、精神的負荷を生じさせたと客観的に認められる業務をいうが、ここでいう日常業務には、労働基準法第36条に基づく労使協定により延長することができる労働時間内に行う業務が含まれる。"}, {"label": "イ", "text": "認定基準において、業務の過重性の具体的な評価を行うに当たって検討すべきとされている負荷要因の1つに勤務時間の不規則性があり、特に長期間の過重業務の判断に当たっては、勤務間インターバルがおおむね9時間未満の勤務の有無、時間数、頻度、連続性等について検討し、評価することとされている。"}, {"label": "ウ", "text": "認定基準において、業務の過重性の具体的な評価を行うに当たって検討すべきとされている負荷要因の1つである作業環境（温度環境、騒音）は、長期間の過重業務の判断に当たっては付加的に評価するのに対し、短期間の過重業務の判断に当たっては付加的に考慮するのではなく、他の負荷要因と同様に十分検討することとされている。"}, {"label": "エ", "text": "器質的心疾患（先天性心疾患、弁膜症、高血圧性心疾患、心筋症、心筋炎等）を有する者が、認定基準にいう対象疾病である虚血性心疾患等を発症した場合については、業務と発症との関連が認められることはない。"}, {"label": "オ", "text": "労災保険法第7条第1項第2号に定める複数業務要因災害による脳・心臓疾患の認定に関しては、認定基準における過重性の評価に際して、二以上の事業の業務による業務の過重性の検討に当たり、異なる事業における労働時間を通算して評価する。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとウ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（ウとオ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "D", "key": "R07-2-3", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和7年度本試験", "stem": "休業補償給付に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "第1種特別加入者の給付基礎日額として厚生労働大臣が定める額は、その最高額が25,000円であり、その最低額が2,000円である。"}, {"label": "B", "text": "労災保険法第8条の2第2項は、業務災害により休業補償給付を支給すべき事由が生じた日が当該休業補償給付に係る療養を開始した日から起算して3年を経過した日以後の日である場合において、同条同項各号のいずれかに該当するときは、当該休業補償給付を受けるべき者の休業給付基礎日額は、当該者の基準日（当該休業補償給付を受けるべき者の当該休業補償給付を支給すべき事由が生じた日の属する四半期の初日）における年齢の属する年齢階層について厚生労働大臣が定めた額とする旨規定している。"}, {"label": "C", "text": "休業補償給付は、労働者が業務上の傷病により療養のため労働不能の状態にあって賃金を受けることができない場合であっても、出勤停止の懲戒処分を受けたために雇用契約上の賃金請求権を有しない場合には支給されない。"}, {"label": "D", "text": "休業特別支給金の支給対象となる日について休業補償給付を受けることができる者は、当該休業特別支給金の支給申請を、当該休業補償給付の請求後に行わなければならない。"}, {"label": "E", "text": "休業補償給付を受ける労働者が、同一の事由について厚生年金保険法に基づく障害厚生年金又は国民年金法に基づく障害基礎年金を受けることができるときは、当該労働者に支給する休業補償給付の額は、当該障害厚生年金又は当該障害基礎年金と傷病補償年金との調整について定める率を用いて算定されるが、当該算定された額が労災保険法施行令第1条第1項で定める額を下回る場合には、同条同項で定める額となる。"}], "answer": "E", "key": "R07-2-4", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和7年度本試験", "stem": "介護補償給付に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "療養補償給付を受ける権利を有する労働者は、病院又は診療所に入院し、介護を受けている間、介護補償給付を受けることができる。"}, {"label": "B", "text": "障害補償年金を受ける権利を有する労働者は、障害者総合支援法第5条第11項に規定する障害者支援施設に入所し、同法同条第7項が定める生活介護を受けている間、併せて介護補償給付を受けることができる。"}, {"label": "C", "text": "障害補償一時金の支給を受けた労働者が、加齢により介護を要する状態となった場合、介護補償給付を受けることができる。"}, {"label": "D", "text": "業務災害により両眼を失明し、障害等級第1級の障害補償年金を受ける労働者は、他に障害を負っているか否かにかかわらず、常時介護を要する障害の程度にあるとして、介護補償給付を受けることができる。"}, {"label": "E", "text": "介護補償給付の額は、その月において、介護に要する費用を支出して介護を受けた日がない場合であって、親族による介護を受けた日があるときは、障害の程度に応じて定額とされている。"}], "answer": "E", "key": "R07-2-5", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和7年度本試験", "stem": "二次健康診断等給付に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "二次健康診断等給付を行う病院又は診療所の指定は、都道府県労働局長が行う。"}, {"label": "B", "text": "二次健康診断等給付として行われる二次健康診断は、対象労働者一人につき、1年度内1回に限り支給される。"}, {"label": "C", "text": "二次健康診断等給付として行われる特定保健指導（二次健康診断の結果に基づき行われる保健指導）は、医師又は保健師による面接によって行われ、栄養指導、運動指導及び生活指導の内容により行われる。"}, {"label": "D", "text": "特別加入者は、二次健康診断等給付の対象とならない。"}, {"label": "E", "text": "二次健康診断等給付は、労働安全衛生法第66条第1項の規定に基づき行われた直近の健康診断において、血圧検査等所定の検査を受けた労働者が、当該検査項目のいずれかに異常の所見があると診断されたときに、当該労働者に対し、その請求に基づき行われる。"}], "answer": "E", "key": "R07-2-6", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和7年度本試験", "stem": "労災保険法施行規則第46条の17第12号にいう特定フリーランス事業に係る特別加入団体（以下本問において「特別加入団体」という。）に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "特別加入団体として承認を受けるためには、特定の業種に関わらないフリーランス全般の支援のための活動実績（活動期間が1年以上、100名以上の会員等がいること）を有している必要がある。"}, {"label": "B", "text": "特別加入団体として承認を受けるためには、市町村ごとに加入希望者が訪問可能な事務所を設け、都道府県を単位として団体を運営する必要がある。"}, {"label": "C", "text": "特別加入団体は、少なくとも年に1回以上、加入者に対して災害防止等に関する研修会等を実施する必要がある。"}, {"label": "D", "text": "特別加入団体は、特定フリーランス事業を行う者として特別加入した者の災害発生時の労災給付請求に際し、当該者が提出することとなる請求書等の作成支援を行うことを求められる。"}, {"label": "E", "text": "保険給付に関する事務は、特別加入団体の主たる事務所の所在地を管轄する労働基準監督署長が行うこととされている。"}], "answer": "B", "key": "R07-2-7", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和7年度本試験", "stem": "労働保険の保険料の徴収等に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "二以上の有期事業が一括されて一の事業として労働保険徴収法が適用される場合であって、労働保険徴収法施行規則第17条第3項で定める規模の事業のとき、同法第20条に規定するいわゆる有期事業のメリット制の適用対象とされる。"}, {"label": "B", "text": "労働保険徴収法第7条の適用により一括有期事業とみなされた場合、概算保険料申告書、確定保険料申告書は当該一括有期事業に係る労働保険料の納付事務を取り扱う一の事務所の所在地を管轄する都道府県労働局歳入徴収官に提出しなければならないが、一括有期事業報告書は一括された事業ごとに作成し、各事業の所在地を管轄する都道府県労働局歳入徴収官にそれぞれ提出しなければならない。"}, {"label": "C", "text": "労働保険徴収法第7条の適用による一括有期事業を開始したときには、初めに保険関係成立届を提出することとなるが、この届を一度提出しておけば、以後何年でもこの一括有期事業が継続している限り、当該一括有期事業に含まれる個々の事業については、その都度保険関係成立届を提出する必要はない。"}, {"label": "D", "text": "労働保険徴収法第7条の適用により一括された個々の有期事業について、その後、事業の規模の変更等があった場合には、当初の一括の扱いとされず、新たに独立の有期事業として取り扱われる。"}, {"label": "E", "text": "労働保険徴収法第7条の適用により一括有期事業とみなされるための要件として、立木の伐採の事業以外の事業にあっては請負金額の上限が定められているが、当該請負金額を計算するに当たって、事業主が注文者からその事業に使用する機械器具等の貸与を受けた場合には、厚生労働大臣が定める事業の種類に該当する事業を除き、当該機械器具等の損料に相当する額（消費税等相当額を除く。）を請負代金の額（消費税等相当額を除く。）から控除することとされている。"}], "answer": "C", "key": "R07-2-8", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和7年度本試験", "stem": "次に示す業態をとる事業についての労働保険料に関する記述のうち、誤っているものはどれか。保険関係成立年月日：令和3年8月5日事業の種類：小売業労働保険関係の概要：・保険料の滞納はない。・一般保険料以外の対象となる者はいない。・社会保険適用事業所である。・令和7年度の概算保険料の額は875,000円である。令和6年度及び7年度の労災保険率：1000分の3令和6年度の雇用保険率：1000分の15．5令和7年度の雇用保険率：1000分の14．5令和7年度の雇用保険二事業の保険率：1000分の3．5令和6年度の確定賃金総額：5,000万円令和7年度に支払いが見込まれる賃金総額：6,000万円", "statements": [], "choices": [{"label": "A", "text": "令和6年度中に請負契約を締結し、使用従属関係が認められない労務提供を行った請負人に対して支払った報酬額は、令和6年度の確定賃金総額に含まれていない。"}, {"label": "B", "text": "令和7年度の概算保険料のうち、労災保険の保険料の額は150,000円であり、当該事業主がすべて負担しなければならない。"}, {"label": "C", "text": "当該事業主は令和7年度の概算保険料の納付に当たって、口座振替による場合を除き、概算保険料を概算保険料申告書に添えて令和7年7月10日までに納付しなければならない。"}, {"label": "D", "text": "当該事業主が令和7年度の概算保険料の延納を申請して認められた場合、第2期分として納付する概算保険料の額は291,667円となる。"}, {"label": "E", "text": "令和7年度の確定賃金総額が6,000万円となった場合の確定保険料のうち、当該事業主が負担することとなる一般保険料の額は総額720,000円となる。"}], "answer": "D", "key": "R07-2-9", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和7年度本試験", "stem": "労働保険の保険料の徴収等に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "事業主は、労災保険の特別加入の申請、変更届、脱退申請等に関する手続について、労働保険事務組合に処理を委託することができない。"}, {"label": "B", "text": "事業主が処理すべき労働保険事務を代理して処理できる労働保険事務組合とは、労働保険徴収法第33条に規定する団体等であって法人でなければならない。"}, {"label": "C", "text": "政府が労働保険事務組合に労働保険事務の処理を委託した事業主に対してすべき労働保険料等についての督促状による督促を、直接当該事業主に対してすることなく当該労働保険事務組合に対して行った場合、その効果は当該事業主に対して及ばない。"}, {"label": "D", "text": "督促状による督促があった旨の通知を労働保険事務組合から受けた滞納事業主が、労働保険事務処理規約等に規定する期限までに労働保険料の納付のための金銭を当該労働保険事務組合に交付しなかったために延滞金を徴収される場合、当該労働保険事務組合は延滞金の納付責任を負う。"}, {"label": "E", "text": "労働保険事務組合に労働保険事務の処理を委託した事業主に使用されていた者が、前年に当該労働保険事務組合の虚偽の届出により労災保険の保険給付を不正に受給していた場合、政府は当該労働保険事務組合に対して、当該不正受給者と連帯し、受給金額の全部又は一部を返還すべきことを命ずることができる。"}], "answer": "E", "key": "R07-2-10", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R07-3", "title": "R7本試験 雇用・徴収", "subject": "雇用保険法", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和7年度（第57回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和7年4月11日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和7年度本試験", "stem": "任意適用事業に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "公益財団法人（公益社団法人及び公益財団法人の認定等に関する法律（平成18年法律第49号）に基づき公益認定を受けた一般財団法人）である事業主の事務所は、雇用保険法第5条第1項の規定にかかわらず任意適用事業であり、厚生労働大臣の認可を受けて適用事業所となることができる。"}, {"label": "B", "text": "年間のうちごく短期間のみ陸上で行われる水産養殖業を営む個人経営事業所が8人の労働者を雇用している場合、雇用保険法第5条第1項の規定にかかわらず当該事業所は任意適用事業であり、厚生労働大臣の認可を受けて適用事業所となることができる。"}, {"label": "C", "text": "雇用保険法附則第2条第1項に定める任意適用事業については、事業主が任意加入の申請をし、厚生労働大臣の認可があった場合、当該認可の翌日にその事業の雇用保険に係る保険関係が成立する。"}, {"label": "D", "text": "常時10人の労働者を雇用する動物の飼育の事業を行う個人経営事業所が、労働者の退職により労働者数が5人未満となった場合、事業の性質上速やかに補充を要し、事業の規模からみて5人未満の状態が一時的であっても、雇用保険法附則第2条第1項に定める任意適用事業となる。"}, {"label": "E", "text": "1週間の所定労働時間が20時間以上である3人の労働者及び1週間の所定労働時間が20時間未満である5人の労働者を雇用する植物の植栽の事業を行う個人経営事業所は、雇用保険法第5条第1項の規定にかかわらず任意適用事業であり、厚生労働大臣の認可を受けて適用事業所となることができる。"}], "answer": "B", "key": "R07-3-1", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和7年度本試験", "stem": "雇用保険適用事業所に係る届出に関する次の記述のうち、誤っているものはどれか。なお、本問における事業主は、労働保険事務組合に雇用保険事務を委託しない者である。", "statements": [], "choices": [{"label": "A", "text": "事業の種類を変更した事業所の事業主は、その変更があった事項及び変更の年月日を記載した届書を、その変更があった日の翌日から起算して10日以内に、その事業所の所在地を管轄する公共職業安定所長に提出しなければならない。"}, {"label": "B", "text": "会社の合併を理由として事業所を廃止する事業主は、当該事業所の所在地を管轄する公共職業安定所長に対し、当該事業所の合併に係る契約書等必要な書類を添付して事業所廃止届を提出しなければならない。"}, {"label": "C", "text": "製造販売の事業を行う事業所から製造部門が分離され、それぞれ独立した事業所となって事業所が2つに分割された場合、分割された事業所のうち従たる事業所について、その事業所の所在地を管轄する公共職業安定所長に、事業所の設置を届け出なければならない。"}, {"label": "D", "text": "事業主が行わなければならない事項を行わせる代理人を選任していた事業主が、当該事業所を廃止したことに伴い当該代理人を解任したときは、当該廃止した事業所の所在地を管轄する公共職業安定所長に対して雇用保険代理人解任届を提出しなければならない。"}, {"label": "E", "text": "事業主は、雇用保険事業所非該当承認を受けていた施設が事業拡大により一の事業所と認められるに至った場合、当該事業所の所在地を管轄する公共職業安定所長に事業所設置届を提出しなければならない。"}], "answer": "D", "key": "R07-3-2", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和7年度本試験", "stem": "教育訓練給付金に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "一般教育訓練を受け、修了した者に支給される教育訓練給付金の額は、20万円を上限とする。"}, {"label": "B", "text": "特定一般教育訓練を受け、修了した一般被保険者が、当該訓練の受講料と別に支出した検定試験の受験料は、特定一般教育訓練給付金の支給対象である教育訓練経費に含まれない。"}, {"label": "C", "text": "雇用保険法第60条の2に規定する支給要件期間が3年以上である者であって、離職後1年以内に特定一般教育訓練の受講を開始し、修了し、当該教育訓練に係る資格を取得し、かつ、一般被保険者として当該教育訓練を修了した日の翌日から起算して1年以内に雇用された者は、当該教育訓練の受講のために支払った費用の額に100分の80を乗じて得た額の教育訓練給付金を受給することができる。"}, {"label": "D", "text": "専門実践教育訓練を開始した日前において高年齢被保険者の資格を喪失した者は、教育訓練給付金を受給することができない。"}, {"label": "E", "text": "基本手当を受給している期間であっても、他の要件を満たす限り教育訓練支援給付金を受給することができる。"}], "answer": "B", "key": "R07-3-3", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和7年度本試験", "stem": "次の①から⑤の過程を経た者の⑤の離職時における基本手当に係る受給期間の限度として正しいものはどれか。なお、当該者は適用事業所Ｘ及び適用事業所Ｙでその他欠勤・休職がなかったものとする。<br>①20歳0月で適用事業所Ｘに雇用され、初めて一般被保険者となった。<br>②育児休業給付金の支給に係る休業を31歳0月から12月間取得し、更に34歳0月から12月間取得し、その後職場復帰した。<br>③39歳0月で適用事業所Ｘを離職した。<br>④失業等給付を受給せず39歳2月で一般被保険者として適用事業所Ｙに雇用された。<br>⑤適用事業所Ｙの移転により、通勤することが困難になったため45歳8月で離職した。なお、適用事業所Ｙの離職時、その者は雇用保険法第22条第2項が定める就職が困難な者でなく、職業に就くことができる状態にあった。", "statements": [], "choices": [{"label": "A", "text": "1年"}, {"label": "B", "text": "1年と30日"}, {"label": "C", "text": "1年と60日"}, {"label": "D", "text": "4年"}, {"label": "E", "text": "4年と30日"}], "answer": "B", "key": "R07-3-4", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和7年度本試験", "stem": "定年退職者等の基本手当に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "60歳の定年に達した後、1年更新の再雇用制度により65歳まで引き続き雇用されることとなった場合に、63歳の更新時に更新を希望せずに退職したときは、受給期間の延長が認められない。"}, {"label": "B", "text": "船員であった被保険者が、労働協約、就業規則等により制度的に勤務延長又は再雇用制度が設けられていない事業所を55歳の定年により離職した場合、当該離職により受給資格を取得したときは、受給期間の延長が認められない。"}, {"label": "C", "text": "定年退職者が離職後一定期間求職の申込みをしないことを希望する場合の受給期間延長の申出は、やむを得ない理由がない限り、当該申出に係る離職の日の翌日から起算して1か月以内にしなければならない。"}, {"label": "D", "text": "定年退職者等の受給期間の延長を5か月認められた者が、当該5か月の延長期間内に負傷により職業に就くことができない期間が連続して90日間ある場合、当該負傷により職業に就くことができない期間に係る受給期間は延長されない。"}, {"label": "E", "text": "受給期間の延長の措置を受けようとする者は、当該延長の申出を郵送により行うことができず、当該者が管轄公共職業安定所に出頭し当該延長を申し出なければならない。"}], "answer": "A", "key": "R07-3-5", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和7年度本試験", "stem": "一般被保険者に係る基本手当の給付制限に関する次の記述のうち、誤っているものはいくつあるか。", "statements": [{"label": "ア", "text": "基本手当の受給資格者が、公共職業安定所に紹介された事業主の面接を受けて採用通知を受けた直後において、正当な理由がなく就職することを拒否した場合、当該受給資格者はこれを理由に給付制限を受ける。"}, {"label": "イ", "text": "建築、配線、潜水作業等の専門の知識、技能を有しない基本手当の受給資格者が、公共職業安定所にそれら専門の知識、技能を必要とする職業を紹介され、当該職業に就くことを拒んだ場合、当該受給資格者はこれを理由とした給付制限を受けない。"}, {"label": "ウ", "text": "公共職業安定所が、離職時より住所又は居所を変更していない基本手当の受給資格者に対し、その者の受けることができる基本手当の額のおおむね100分の100よりも低くなる賃金の手取額である就職先を離職直後に紹介した場合、当該受給資格者が、当該手取額を理由として当該職業に就くことを拒んだとき、当該受給資格者はこれを理由とした給付制限を受けない。"}, {"label": "エ", "text": "基本手当の受給資格者が、公共職業安定所に紹介された事業所の労働時間が不当であるとして当該職業に就くことを拒んだ場合であって、公共職業安定所が当該事業所の労働時間につき、法令には反しないがその地域の同種の業務において行われるものに比べて不当であると判定したとき、当該受給資格者はこれを理由とした給付制限を受けない。"}, {"label": "オ", "text": "一時的に2か月間賃金の2分の1が不払いとなったことがある事業所を公共職業安定所から紹介された基本手当の受給資格者が当該事業所の職業に就くことを拒んだ場合、紹介された時点では当該事業所の賃金不払いが解消しており、今後は正当な時期に賃金が支払われることが確実であっても、当該受給資格者はこれを理由とした給付制限を受けない。"}], "choices": [{"label": "A", "text": "一つ"}, {"label": "B", "text": "二つ"}, {"label": "C", "text": "三つ"}, {"label": "D", "text": "四つ"}, {"label": "E", "text": "五つ"}], "answer": "A", "key": "R07-3-6", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和7年度本試験", "stem": "解雇の効力について争いがある場合の基本手当に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "離職を認めず解雇の効力について争っているものの基本手当を受給している受給資格者が、事業所との間で雇用関係は継続するがその間賃金は支払わない旨の裁判上の和解が成立したときは、当該賃金を支払わないとされた間に支給を受けた基本手当を返還しないことができる。"}, {"label": "B", "text": "基本手当を受給している者に対し賃金支払いの仮処分命令により解雇時に遡及して賃金が支払われた場合、当該者は支給を受けた基本手当を返還しなければならない。"}, {"label": "C", "text": "解雇の効力について係争中に事業所が廃止となり、解雇無効の判決が確定しても原状回復の実現が不可能と認められる場合には、判決に先立って行われた資格喪失の確認処分は取り消されない。"}, {"label": "D", "text": "Ｘ社を解雇された基本手当の受給資格者が、Ｘ社における解雇の効力について係争中に適用事業所であるＹ社に就職し一般被保険者の資格を取得した。その後、Ｘ社に係る解雇無効の判決が確定し、Ｙ社就職中の収入を控除してＸ社の賃金が支払われた。この場合、Ｙ社就職中の収入の額がＸ社から支払われた賃金の額以上である期間については、当該者の希望により、いずれか一方の事業主との雇用関係について被保険者資格を取得する。"}, {"label": "E", "text": "労働者が事業主の行った解雇について労働組合法第7条に違反するから無効であると主張し、当該労働者が加入する労働組合が労働委員会に対して不当労働行為の申立てをしその効力を争っている場合においては、救済命令が確定するまでは、他の要件を満たす限り当該労働者は基本手当の支給を受けることができる。"}], "answer": "A", "key": "R07-3-7", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和7年度本試験", "stem": "労働保険の保険料の徴収等に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "継続事業を営む事業主が、当該事業に係る労働保険事務の処理を労働保険事務組合に委託している場合、令和6年11月1日に保険関係が成立した事業について当該保険年度の概算保険料を延納することができる。"}, {"label": "B", "text": "令和7年8月1日に保険関係が成立した一括有期事業について、納付すべき当該保険年度の概算保険料の額が50万円のとき、事業主は当該概算保険料を延納することができない。"}, {"label": "C", "text": "一般保険料の算定基礎となる賃金総額の見込額を500万円として算定し納期限までに概算保険料を納付した後、賃金総額の見込額が1,200万円に増加し、増加後の賃金総額の見込額に基づき算定した概算保険料の額と既に納付した概算保険料との差額が122,500円であるとき、事業主はその差額を所定の期限までに納付書を添えて納付しなければならない。"}, {"label": "D", "text": "事業主が所定の納期限までに概算保険料申告書を提出しなかったため、政府が納付すべき概算保険料の額を決定し、これを当該事業主に対して令和7年8月20日に通知を発した場合、当該事業主の未納額の納期限は同年9月19日となる。"}, {"label": "E", "text": "政府が保険年度の中途で保険料率の改定を行い、雇用保険率が引き上げられた場合、事業主が既に概算保険料の延納を認められているとき、当該事業主は所轄都道府県労働局歳入徴収官が発する追加徴収の通知により指定された納期限までに延納の申請をすることで追加徴収される概算保険料についても延納することができ、その最初の期分の追加徴収される概算保険料の納期限は、当該通知を発した日が令和7年10月20日であった場合、同年11月19日となる。"}], "answer": "E", "key": "R07-3-8", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和7年度本試験", "stem": "労働保険の保険料の徴収等に関する次の記述のうち、誤っているものはどれか。なお、本問において「特例対象者」とは、雇用保険法第22条第5項に規定する者をいう。", "statements": [], "choices": [{"label": "A", "text": "特例納付保険料を納付することができる事業主は、2年以内の算定基礎期間を遡及して計算することが可能な特例対象者を雇用していた事業主である。"}, {"label": "B", "text": "特例納付保険料の納付手続については、労働保険徴収法第15条及び同法第19条に定める概算・確定保険料の納付手続に係る規定は適用されない。"}, {"label": "C", "text": "特例納付保険料の納付の申出は、事業主の氏名又は名称及び住所又は所在地、労働保険番号並びに特例納付保険料の額を記載した書面を都道府県労働局長に提出することによって行わなければならない。"}, {"label": "D", "text": "特例納付保険料の対象事業主が労働保険事務組合に労働保険事務の処理を委託している場合、当該労働保険事務組合は特例納付保険料の納付等に係る事務を処理することができる。"}, {"label": "E", "text": "特例納付保険料の納付の申出を行った対象事業主が、特例納付保険料を納付する場合の納付先は、日本銀行又は都道府県労働局収入官吏とされている。"}], "answer": "A", "key": "R07-3-9", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和7年度本試験", "stem": "労働保険の保険料の徴収等に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "概算保険料額の認定決定の処分がなされ、当該処分について不服がある者は、所轄都道府県労働局の労働保険審査官に対して審査請求をすることができる。"}, {"label": "B", "text": "概算保険料額の認定決定の処分がなされ、当該処分に不服がある場合、当該処分があったことを知った日から3か月以内かつ処分の日から1年以内でなければ、取消訴訟を提起することができない。"}, {"label": "C", "text": "概算保険料額の認定決定の処分がなされ、当該処分に不服がある場合、審査請求の裁決を経た後でなければ、当該処分の取消しの訴えを提起することができない。"}, {"label": "D", "text": "当該保険年度の概算保険料を期限内に申告納付したが、誤って当該概算保険料を同一期限内に再度納付したため誤納金が生じた場合、再度納付した日の翌日から起算して2年を経過したとき、当該誤納金の還付を受ける権利は時効によって消滅する。"}, {"label": "E", "text": "概算保険料の確定精算に基づき納付すべき不足額が時効で消滅している場合、納付義務者がその時効による利益を放棄して納付する意思を示したときは、政府はその徴収権を行使できる。"}], "answer": "D", "key": "R07-3-10", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R07-4", "title": "R7本試験 一般常識", "subject": "一般常識", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和7年度（第57回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和7年4月11日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和7年度本試験", "stem": "我が国の外国人雇用に関する次の記述のうち、正しいものはどれか。なお、本問は、「令和5年外国人雇用実態調査（厚生労働省）」を参照しており、当該調査による用語及び統計等を利用している。", "statements": [], "choices": [{"label": "A", "text": "外国人常用労働者（雇用保険被保険者数5人以上事業所）は約160万人となっており、産業別にみると、「製造業」が最も多くなっている。"}, {"label": "B", "text": "外国人常用労働者の国籍・地域をみると、「中国（香港、マカオ含む）」が最も多く、次いで「ベトナム」、「フィリピン」の順となっている。"}, {"label": "C", "text": "外国人常用労働者の職業をみると、「専門的・技術的職業従事者」が最も多く、次いで「生産工程従事者」、「サービス職業従事者」の順となっている。"}, {"label": "D", "text": "外国人労働者を雇用する理由（事業所計）をみると、「日本人と同等またはそれ以上の活躍を期待して」が最も多く、次いで「労働力不足の解消・緩和のため」、「事業所の国際化、多様性の向上を図るため」、「日本人にはない知識、技術の活用を期待して」の順となっている。"}, {"label": "E", "text": "外国人労働者の雇用に関する課題（事業所計）をみると、「在留資格申請等の事務負担が面倒・煩雑」が最も多く、次いで「日本語能力等のためにコミュニケーションが取りにくい」、「在留資格によっては在留期間の上限がある」、「文化、価値観、生活習慣等の違いによるトラブルがある」の順となっている。"}], "answer": "A", "key": "R07-4-1", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和7年度本試験", "stem": "我が国の障害者雇用に関する次の記述のうち、誤っているものはどれか。なお、本問は、「令和5年度障害者雇用実態調査（厚生労働省）」を参照しており、当該調査による用語及び統計等を利用している。", "statements": [], "choices": [{"label": "A", "text": "産業別に身体障害者の雇用者数の割合をみると、「製造業」で最も多く雇用され、次いで「卸売業、小売業」となっている。"}, {"label": "B", "text": "企業規模別に身体障害者の雇用者数の割合をみると、「100～499人規模」で最も多く、次いで「1,000人以上規模」、「30～99人規模」、「5～29人規模」の順となっている。"}, {"label": "C", "text": "身体障害者の雇用上の課題がある事業所の割合は6割を超えている。このうち、課題として回答されたものの中では、「会社内に適当な仕事があるか」が最も多く、次いで「職場の安全面の配慮が適切にできるか」、「障害者を雇用するイメージやノウハウがない」の順となっている。"}, {"label": "D", "text": "身体障害者の雇用上の配慮をしている事業所の割合は5割を超えている。このうち、配慮していることとして回答されたものの中では、「休暇を取得しやすくする、勤務中の休憩を認める等休養への配慮」が最も多く、次いで「通院・服薬管理等雇用管理上の配慮」、「短時間勤務等勤務時間の配慮」の順となっている。"}, {"label": "E", "text": "身体障害者を雇用する上で関係機関に期待する取組としては、「具体的な労働条件、職務内容、環境整備などが相談できる窓口の設置」が最も多く、次いで「障害者雇用支援設備・施設・機器の設置のための助成・援助」、「障害者雇用に関する広報・啓発」の順となっている。"}], "answer": "B", "key": "R07-4-2", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和7年度本試験", "stem": "労働者派遣に関する次の記述のうち、正しいものはどれか。なお、本問は、「令和4年派遣労働者実態調査（事業所調査）（厚生労働省）」を参照しており、当該調査による用語及び統計等を利用している。", "statements": [], "choices": [{"label": "A", "text": "派遣労働者が就業している事業所について、全労働者数に対する派遣労働者の割合を産業別にみると、「宿泊業、飲食サービス業」の割合が最も高くなっている。"}, {"label": "B", "text": "派遣労働者が就業している事業所について、派遣労働者を就業させる理由（複数回答3つまで）をみると、「雇用管理の負担が軽減されるため」の割合が最も高く、次いで「一時的・季節的な業務量の変動に対処するため」、「欠員補充等必要な人員を迅速に確保できるため」の順となっている。"}, {"label": "C", "text": "派遣労働者が就業している事業所について、全労働者数に対する派遣労働者の割合を事業所規模別にみると、事業所規模が小さいほど高くなっている。"}, {"label": "D", "text": "派遣労働者が就業している事業所について、過去1年間（令和3年10月1日から令和4年9月30日）における派遣労働者に対する教育訓練・能力開発の実施の有無をみると、「実施した」が約3割となっている。"}, {"label": "E", "text": "派遣労働者が就業している事業所について、派遣労働者の不合理な待遇格差の解消に向けた派遣先労働者の待遇情報及び派遣労働者の派遣先における職務の評価情報の提供について、派遣元事業所から情報の提供が求められ、実際に提供したことがある事業所を提供した情報の種類別にみると、「福利厚生施設（給食施設、休憩室、更衣室）」の割合が最も高く、次いで「派遣先が行った派遣労働者の職務の評価情報（働きぶりや勤務態度）」、「業務に必要な能力を付与するための教育訓練」の順となっている。"}], "answer": "E", "key": "R07-4-3", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和7年度本試験", "stem": "労働契約法等に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "「労働者と使用者との間に当該労働者の職種や業務内容を特定のものに限定する旨の合意がある場合には、使用者は、当該労働者に対し、その個別的同意なしに当該合意に反する配置転換を命ずる権限を有しないと解される。」とするのが、最高裁判所の判例である。"}, {"label": "B", "text": "労働契約法第3条第2項は、労働契約の締結又は変更に当たり、均衡を考慮することが重要であることから、労働契約の締結当事者である労働者及び使用者が、労働契約を締結し、又は変更する場合には、就業の実態に応じて、均衡を考慮すべきものとするという「均衡考慮の原則」を規定しているが、この考慮すべき均衡には、異なる雇用形態間の均衡も含まれる。"}, {"label": "C", "text": "労働契約法第4条第1項は、「使用者は、労働者に提示する労働条件及び労働契約の内容について、労働者の理解を深めるようにするものとする。」と定めているが、これには労働契約の締結前において使用者が提示した労働条件について説明等をする場面や、労働契約が締結又は変更されて継続している間の各場面が広く含まれるものであり、労働基準法第15条第1項により労働条件の明示が義務付けられている労働契約の締結時より広いものである。"}, {"label": "D", "text": "「労働者が使用者（出向元）との間の雇用契約に基づく従業員たる身分を保有しながら第三者（出向先）の指揮監督の下に労務を提供するという形態の出向（いわゆる在籍出向）が命じられた場合において、その後出向元が、出向先の同意を得た上、右出向関係を解消して労働者に対し復帰を命ずるについては、原則として当該労働者の同意を得る必要があるものと解すべきである。」とするのが、最高裁判所の判例である。"}, {"label": "E", "text": "労働契約法第18条第1項に基づき、有期契約労働者が無期労働契約への転換を申し込むことができる権利（以下本肢において「無期転換申込権」という。）が生じている有期労働契約の契約期間が満了する日までの間に無期転換申込権を行使しなかった場合であっても、引き続き有期労働契約が更新された場合は、新たに無期転換申込権が発生し、有期契約労働者は、更新後の有期労働契約の契約期間が満了する日までの間に、無期転換申込権を行使することが可能である。"}], "answer": "D", "key": "R07-4-4", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和7年度本試験", "stem": "社会保険労務士法令に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "社会保険労務士法第2条第1項第1号の2にいう「提出に関する手続を代わつてする」は、法律行為の代理のことをいい、本来事業主が意思決定すべき事項にも及ぶため、代理業務、即ち申告、申請、不服申立等について事業主その他の本人から委任を受けて代理人として事務を処理することが含まれる。"}, {"label": "B", "text": "特定社会保険労務士は、男女雇用機会均等法に定める調停手続において紛争当事者の代理人としての業務を行うことができ、調停委員や相手方の当事者への説明、主張、陳述、答弁等のほか、調停案の受諾、拒否もその業務に含まれる。"}, {"label": "C", "text": "社会保険労務士について、社会保険労務士法第25条の2（不正行為の指示等を行った場合の懲戒）や同法第25条の3（一般の懲戒）に規定する行為又は事実があると認めたときは、社会保険労務士会の会員、社会保険労務士会又は全国社会保険労務士会連合会に限り、厚生労働大臣に対し、当該社会保険労務士の氏名及びその行為又は事実を通知し、適当な措置をとるべきことを求めることができる。"}, {"label": "D", "text": "社会保険労務士法人の社員には、社会保険労務士でない者もなることができる。"}, {"label": "E", "text": "社会保険労務士法人の社員は、第三者のためにその属する社会保険労務士法人の業務の範囲に属する業務を行ってはならないが、自己のためにこれを行うことはできる。"}], "answer": "B", "key": "R07-4-5", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和7年度本試験", "stem": "社会保険制度の被保険者及び給付に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "国民健康保険において、国民健康保険法第54条の4第1項によると、市町村（特別区を含む。以下本問において同じ。）及び国民健康保険組合は、被保険者が療養の給付（保険外併用療養費に係る療養及び特別療養費に係る療養を含む。）を受けるため病院又は診療所に移送されたとき、当該被保険者の属する世帯の世帯主又は組合員に対する移送費は、支給しない。"}, {"label": "B", "text": "後期高齢者医療制度において、高齢者医療確保法第54条第1項によると、被保険者は、厚生労働省令で定めるところにより、被保険者の資格の取得及び喪失に関する事項その他必要な事項を市町村に届け出なければならない。"}, {"label": "C", "text": "介護保険において、65歳以上の被保険者に関しては、介護保険法第9条によると、市町村の区域内に住所を有する65歳以上の者（生活保護法による保護を受けている世帯（その保護を停止されている世帯を除く。）に属する者を除く。）は、当該市町村が行う介護保険の被保険者とする。"}, {"label": "D", "text": "船員保険において、船員保険法第94条によると、行方不明手当金の額は、1日につき、被保険者が行方不明となった当時の標準報酬日額の100分の80に相当する金額とする。"}, {"label": "E", "text": "国民健康保険において、国民健康保険法第58条第1項及び第2項によると、市町村及び国民健康保険組合は、被保険者の出産及び死亡に関しては、条例又は規約の定めるところにより、出産育児一時金の支給又は葬祭費の支給若しくは葬祭の給付を行うものとする。これらの保険給付のほか、条例又は規約の定めるところにより、傷病手当金の支給も行うことができる。"}], "answer": "E", "key": "R07-4-6", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和7年度本試験", "stem": "確定拠出年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "確定拠出年金法第62条第2項によると、個人型年金の老齢給付金の受給権を有する者であった者は、個人型年金加入者となることができる。"}, {"label": "B", "text": "国民年金基金連合会（以下本問において「連合会」という。）は、少なくとも10年ごとに、個人型年金加入者数の動向、企業型年金の実施の状況、国民生活の動向等を勘案し、個人型年金規約の内容について再検討を加え、必要があると認めるときは、個人型年金規約を変更しなければならない。"}, {"label": "C", "text": "個人型年金の給付は、老齢給付金、遺族給付金及び死亡一時金とする。"}, {"label": "D", "text": "確定拠出年金法第60条第1項及び第3項によると、連合会は、政令で定めるところにより、運営管理業務を確定拠出年金運営管理機関に委託することができる。また、確定拠出年金運営管理機関は、政令で定めるところにより、当該委託を受けた運営管理業務の一部を他の確定拠出年金運営管理機関に再委託することができる。"}, {"label": "E", "text": "個人型年金加入者期間を計算する場合には、月によるものとし、個人型年金加入者の資格を取得した月からその資格を喪失した月の前月までをこれに算入する。"}], "answer": "E", "key": "R07-4-7", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和7年度本試験", "stem": "高齢者医療確保法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "後期高齢者医療広域連合、都道府県及び市町村（特別区を含む。）は、後期高齢者医療に関する収入及び支出について、政令で定めるところにより、特別会計を設けなければならない。"}, {"label": "B", "text": "後期高齢者医療広域連合が行う後期高齢者医療の被保険者は、後期高齢者医療広域連合の区域内に住所を有する75歳以上の者のみとされる。"}, {"label": "C", "text": "高齢者医療確保法第109条によると、普通徴収の方法によって徴収する保険料の納期は、後期高齢者医療広域連合の条例で定める。"}, {"label": "D", "text": "高齢者医療確保法第111条によると、後期高齢者医療広域連合は、条例で定めるところにより、特別の理由がある者に対し、保険料を減免し、又はその徴収を猶予することができる。"}, {"label": "E", "text": "後期高齢者医療広域連合が行う後期高齢者医療の被保険者は、当該後期高齢者医療広域連合の区域内に住所を有しなくなった日に他の後期高齢者医療広域連合の区域内に住所を有するに至ったときは、その日の翌日から、その資格を喪失する。"}], "answer": "D", "key": "R07-4-8", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和7年度本試験", "stem": "社会保険審査官及び社会保険審査会法に関する次のアからオの記述のうち、誤っているものはいくつあるか。", "statements": [{"label": "ア", "text": "社会保険審査官及び社会保険審査会法第4条第2項によると、被保険者若しくは加入員の資格、標準報酬又は標準給与に関する処分に対する審査請求は、原処分があった日の翌日から起算して3年を経過したときは、することができない。"}, {"label": "イ", "text": "審査請求人は、決定があるまでは、いつでも審査請求を取り下げることができる。審査請求の取下げは、文書でしなければならない。"}, {"label": "ウ", "text": "審査請求人が、審査請求の決定前に死亡したときは、承継人が、審査請求の手続を受け継ぐものとする。"}, {"label": "エ", "text": "社会保険審査会（以下本問において「審査会」という。）の委員長及び委員は、独立してその職権を行う。審査会は、委員長及び委員5人をもって組織される。"}, {"label": "オ", "text": "審査会の審理は、公開しなければならない。ただし、当事者の申立があったときは、公開しないことができる。"}], "choices": [{"label": "A", "text": "一つ"}, {"label": "B", "text": "二つ"}, {"label": "C", "text": "三つ"}, {"label": "D", "text": "四つ"}, {"label": "E", "text": "五つ"}], "answer": "A", "key": "R07-4-9", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和7年度本試験", "stem": "社会保険制度に関する次のアからオの記述のうち、誤っているものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "いわゆる団塊ジュニア世代の全員が65歳以上となる令和22（2040）年頃を見通すと、85歳以上人口が急増し、認知機能が低下した高齢者や要介護高齢者が更に増加する一方、生産年齢人口が急減することが見込まれている。さらに、都市部と地方では高齢化の進み方が大きく異なるなど、これまで以上にそれぞれの地域の特性や実情に応じた対応が必要となる中で、このような社会構造の変化や高齢者のニーズに応えるために、「地域包括ケアシステム」の深化・推進を目指している。"}, {"label": "イ", "text": "「地域包括ケアシステム」とは、高齢者が、可能な限り、住み慣れた地域でその有する能力に応じ自立した日常生活を営むことができるよう、医療、介護、介護予防、住まい及び自立した日常生活の支援が包括的に確保される体制のことをいい、地域の特性に応じて作り上げていくことが必要となる。なお、介護保険法の規定により、要介護認定を受けようとする被保険者は、厚生労働省令で定めるところにより、申請書に被保険者証を添付して市町村に申請をしなければならないが、この場合において、当該被保険者は、厚生労働省令で定めるところにより、地域包括支援センターに当該申請に関する手続を代わって行わせることができるとされている。"}, {"label": "ウ", "text": "ケアマネジャー（介護支援専門員）とは、厚生労働省令で定める実務の経験を有する者であって、厚生労働大臣が行う試験に合格し、かつ、都道府県知事が厚生労働省令で定めるところにより行う研修の課程を修了したものであって、厚生労働省令で定めるところにより介護保険事業を行う市町村及び特別区の登録を受け、介護支援専門員証の交付を受けたものである。なお、介護支援専門員証の有効期間は、原則5年とされている。"}, {"label": "エ", "text": "出産育児一時金に要する費用は、原則として現役世代の被保険者が自ら支払う保険料で負担することとされているが、後期高齢者医療制度の創設前は、高齢者世代も、出産育児一時金を含め、こどもの医療費について負担していた。また、生産年齢人口が急激に減少していく中で、少子化をめぐって、これまで様々な対策を講じてきたが、未だに少子化の流れを変えるには至っていない状況にある。このため、今般、子育てを社会全体で支援する観点から、後期高齢者医療制度が出産育児一時金に要する費用の一部を支援する仕組みを令和6（2024）年度から導入することとした。"}, {"label": "オ", "text": "核家族化の進行や人口の都市集中、将来の高齢化社会への展望等を背景に、全国民を対象とした老後の所得保障の必要性が高まり、昭和34（1959）年に国民年金法が制定された。これに基づき、無拠出制の福祉年金制度は昭和34（1959）年11月から、拠出制の国民年金制度は昭和36（1961）年4月から実施され、「国民皆年金」が実現することとなった。さらに平成元（1989）年改正における基礎年金の導入により、財政基盤の安定化のほか、基礎年金部分についての給付と負担の公平化、重複した給付の整理が図られた。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとウ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（ウとオ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "D", "key": "R07-4-10", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R07-5", "title": "R7本試験 健保", "subject": "健康保険法", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和7年度（第57回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和7年4月11日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和7年度本試験", "stem": "健康保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "健康保険組合は、議決機関として組合会が置かれている。組合会議員の定数は偶数で、その半数は設立事業所の事業主及び設立事業所に使用される者のうちから選定し、他の半数は、被保険者である組合員において互選する。組合会議員の任期は5年とし、補欠の組合会議員の任期は、前任者の残任期間とする。"}, {"label": "B", "text": "被保険者の資格を喪失した日の前日まで引き続き1年以上被保険者であった者が、被保険者の資格を喪失した日後6か月以内に出産したときは、出産した日の翌日から起算して5年を経過する日までの間、被保険者として受けることができるはずであった出産育児一時金の支給を最後の保険者から受けることができる。"}, {"label": "C", "text": "日本年金機構の理事長は、収納職員が交替するときは、年金事務所ごとに機構の職員のうちから検査員を命じて、当該収納職員の帳簿金庫を検査させなければならない。また、前任の収納職員は、交替の日をもって、その月分の保険料等収納簿の締切りをし、健康保険法の規定による検査を受けた上、引継ぎの年月日を記入し、後任の収納職員とともに記名して認印を押さなければならない。"}, {"label": "D", "text": "日雇特例被保険者は、介護保険第2号被保険者に該当しなくなったとき又は該当することになったときは、5日以内に、厚生労働大臣又は指定市町村長に日雇特例被保険者手帳を提出して、その交換を申請しなければならない。なお、介護保険適用除外に該当、非該当の届出は、当該申請と同時に行うものとされている。"}, {"label": "E", "text": "日雇拠出金の規定により日雇関係組合から徴収する日雇拠出金の額は、当該年度の概算日雇拠出金の額とする。ただし、前年度の概算日雇拠出金の額が前年度の確定日雇拠出金の額を超えるときは、当該年度の概算日雇拠出金の額からその超える額を控除して得た額とするものとし、前年度の概算日雇拠出金の額が前年度の確定日雇拠出金の額に満たないときは、当該年度の概算日雇拠出金の額にその満たない額を加算して得た額とする。"}], "answer": "E", "key": "R07-5-1", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和7年度本試験", "stem": "健康保険法に関する次のアからオの記述のうち、誤っているものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "高齢受給者証の交付を受けた被保険者が任意継続被保険者又は特例退職被保険者であるときは、当該被保険者は、高齢受給者証の有効期限に至ったときは、14日以内にこれを保険者に返納しなければならない。"}, {"label": "イ", "text": "健康保険組合は、被保険者が介護保険第2号被保険者に該当していない場合であっても、規約で定めるところにより、当該被保険者に介護保険第2号被保険者である被扶養者がある場合には、当該被保険者（「特定被保険者」という。）に関する保険料額を一般保険料額と介護保険料額との合算額とすることができる。"}, {"label": "ウ", "text": "厚生労働大臣は、保険給付に関して必要があると認めるときは、事業主に対して検査等を行うことができる。この検査等の権限に係る事務は、日本年金機構に行わせるものとされており、全国健康保険協会（以下「協会」という。）には行わせるものとされていない。"}, {"label": "エ", "text": "初めて公的年金制度の財政基盤及び最低保障機能の強化等のための国民年金法等の一部を改正する法律に規定する「特定適用事業所」となった適用事業所の事業主は、当該事実があった日から5日以内に、①適用事業所の名称及び所在地、②特定適用事業所となった年月日、③事業主が法人であるときは法人番号を記載した届書を厚生労働大臣又は健康保険組合に提出しなければならない。"}, {"label": "オ", "text": "患者申出療養とは、高度の医療技術を用いた療養であって、当該療養を受けようとする者の申出に基づき、評価療養の給付の対象とすべきものであるか否かについて、適正な医療の効率的な提供を図る観点から評価を行うことが必要な療養として厚生労働大臣が定めるものをいう。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとウ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（ウとエ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "B", "key": "R07-5-2", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和7年度本試験", "stem": "健康保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "日雇特例被保険者又はその被扶養者は、保険者より交付された特別療養費受給票を保険医療機関等に提出して、特別療養費の支給を受けることができる。特別療養費受給票は、特別療養費の支給を受けることのできる日雇特例被保険者で、初めて特別療養費の支給に係る日雇特例被保険者手帳の交付を受けた日の属する月の初日から起算して3か月（月の初日に日雇特例被保険者手帳の交付を受けた者については、2か月）を経過していない者等の申請により、保険者が交付する。"}, {"label": "B", "text": "偽りその他不正の行為によって保険給付を受けた者から保険者がその保険給付の価額の全部又は一部を徴収する場合において、事業主が虚偽の報告若しくは証明をし、又は保険医療機関において診療に従事する保険医若しくは主治の医師が、保険者に提出されるべき診断書に虚偽の記載をしたため、その保険給付が行われたものであるときは、保険者は、当該事業主、保険医又は主治の医師に対し、保険給付を受けた者に連帯して徴収金を納付すべきことを命ずることができる。"}, {"label": "C", "text": "日雇特例被保険者を使用する事業主（日雇特例被保険者が1日において2以上の事業所に使用される場合においては、その者を使用するそれぞれの事業主）は、日雇特例被保険者を使用する日ごとに、その者及び自己の負担すべきその日の標準賃金日額に係る保険料を納付する義務を負う。事業主は、この規定により保険料を納付したときは、日雇特例被保険者の負担すべき保険料額に相当する額をその者に支払う賃金から控除することができる。この場合においては、事業主は、その旨を日雇特例被保険者に告げなければならない。"}, {"label": "D", "text": "事業主は、被保険者の資格の取得及び喪失の確認又は標準報酬（標準報酬月額及び標準賞与額をいう。）の決定若しくは改定の通知があったときは、速やかに、これを被保険者又は被保険者であった者に通知しなければならない。"}, {"label": "E", "text": "保険料等の賦課若しくは徴収の処分又は滞納処分に不服のある者は、社会保険審査会に対して審査請求をすることができる。この不服申立てに対する審査は一審制で行われる。"}], "answer": "C", "key": "R07-5-3", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和7年度本試験", "stem": "健康保険法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "被保険者は、介護保険第2号被保険者に該当しない被保険者又はその被扶養者が介護保険第2号被保険者に該当するに至ったときは、遅滞なく、所定の事項を記載した届書を事業主を経由して厚生労働大臣又は健康保険組合に届け出なければならない。ただし、被保険者又はその被扶養者が40歳に達したときは、この限りでない。"}, {"label": "B", "text": "保険者等は、被保険者の報酬月額が、定時決定、資格取得時決定、育児休業等終了時改定若しくは産前産後休業終了時改定の規定によって算定することが困難であるとき、又は定時決定、資格取得時決定、随時改定、育児休業等終了時改定若しくは産前産後休業終了時改定の規定によって算定した額が著しく不当であると認めるときは、これらの規定にかかわらず、その算定する額を当該被保険者の報酬月額とする。上記の場合において、保険者が健康保険組合であるときは、算定方法は規約で定めなければならない。"}, {"label": "C", "text": "事業主は、健康保険法の規定に基づいて事業主がしなければならない事項につき代理人に処理させるとき、又は代理人を解任したときは、速やかに、文書でその旨を厚生労働大臣又は健康保険組合に届け出なければならない。"}, {"label": "D", "text": "政府は、当該年度の健康勘定に前年度の決算上の剰余金が繰り入れられたときは、遅滞なく、協会に対し、当該繰り入れられた額（保険料等に係るもの以外のものとして厚生労働大臣が定めるものを除く。）を保険料等交付金として交付する。"}, {"label": "E", "text": "訪問看護療養費の額は、当該指定訪問看護につき指定訪問看護に要する平均的な費用の額を勘案して厚生労働大臣が定めるところにより算定した費用の額から、その額に健康保険法第74条第1項各号に掲げる場合の区分に応じ、同項各号に定める割合を乗じて得た額（療養の給付に係る同項の一部負担金について第75条の2第1項各号の措置が採られるべきときは、当該措置が採られたものとした場合の額）を控除した額とする。"}], "answer": "C", "key": "R07-5-4", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和7年度本試験", "stem": "健康保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "資格確認書の交付を受けている任意継続被保険者が資格を喪失したときは、事業主は遅滞なく資格確認書を回収して、5日以内にこれを保険者に返納しなければならない。"}, {"label": "B", "text": "療養費の支給対象となる柔道整復師の施術において、脱臼又は骨折（不全骨折を含む。）に対する施術については、医師の同意を得たものでなければならない。また、応急手当をする場合はこの限りではないが、応急手当後の施術は医師の同意が必要である。医師の同意は個々の患者が医師から得てもよく、また、施術者が直接医師から得てもよいが、いずれの場合であっても医師の同意は、患者を診察した上で書面により与えられることを要する。"}, {"label": "C", "text": "保険医療機関等である病院又は診療所は、食事療養に要した費用についてその支払を受ける際、当該支払をした被保険者が請求した場合には、厚生労働省令で定めるところにより、領収証を交付しなければならない。この領収証には、入院時食事療養費に係る療養について被保険者から支払を受けた費用の額のうち食事療養標準負担額とその他の費用の額とを区分して記載しなければならない。"}, {"label": "D", "text": "厚生労働大臣は、保険医療機関の指定の申請があった場合において、当該申請に係る病床の種別に応じ、医療法第7条の2第1項に規定する地域における保険医療機関の病床数が、その指定により同法第30条の4第1項に規定する医療計画において定める基準病床数を勘案して厚生労働大臣が定めるところにより算定した数を超えることになると認める場合（その数を既に超えている場合を含む。）であって、当該病院又は診療所の開設者又は管理者が同法第30条の11の規定による都道府県知事の勧告を受け、これに従わないときは、その申請に係る病床の全部又は一部を除いて、その指定を行うことができる。"}, {"label": "E", "text": "被扶養者が肺癌により療養の給付を受けている間に被保険者が死亡した場合、被扶養者の概念を死亡当時そのものによって生計を維持していたものと解釈して、被保険者の死亡後も療養の給付は認められる。"}], "answer": "D", "key": "R07-5-5", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和7年度本試験", "stem": "健康保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "国庫は、予算の範囲内において、健康
