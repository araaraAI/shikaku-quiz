<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社労士 練習問題</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f2328;--sub:#5d6670;--line:#dcd9d0;--accent:#1f5f8b;--ok:#1e7a4c;--okbg:#e6f4ec;--ng:#b3372f;--ngbg:#fbeae8;--pick:#e8f0f6;--warn:#9a6700;--track:#e7e4dc}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#e8e6e1;--sub:#a2a9b1;--line:#353a40;--accent:#7db7de;--ok:#6fcf97;--okbg:#1d3328;--ng:#f08a80;--ngbg:#3a2220;--pick:#25323d;--warn:#e3b341;--track:#2c3136}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
header{padding:20px 16px 8px;max-width:760px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 4px}
h2{font-size:1.05rem;margin:0 0 8px}
.lead{color:var(--sub);font-size:.88rem;margin:0}
main{max-width:760px;margin:0 auto;padding:8px 16px 96px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tab{font:inherit;font-size:.9rem;font-weight:700;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.86rem;color:var(--sub);margin:12px 0}
.note b{color:var(--ink)}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 14px;margin:16px 0}
.qno{font-size:.8rem;color:var(--accent);font-weight:700;letter-spacing:.04em}
.qno .tp{color:var(--sub);font-weight:400;margin-left:.6em}
.stem{font-weight:600;margin:4px 0 12px}
.st{margin:0 0 10px;padding-left:1.9em;text-indent:-1.9em;font-size:.95rem}
.st .lb{font-weight:700;display:inline-block;width:1.9em;text-indent:0}
.ch{display:block;width:100%;text-align:left;background:transparent;color:inherit;font:inherit;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:8px 0;cursor:pointer;font-size:.95rem;line-height:1.7}
.ch .lb{font-weight:700;margin-right:.5em;color:var(--accent)}
.ch.short{display:inline-block;width:auto;min-width:30%;margin-right:6px}
.ch.pick{background:var(--pick);border-color:var(--accent)}
.ch.ok{background:var(--okbg);border-color:var(--ok)}
.ch.ng{background:var(--ngbg);border-color:var(--ng)}
.ch:disabled{cursor:default;opacity:1}
.passage p{margin:0 0 10px;font-size:.95rem}
.blank{display:inline-block;border:1px solid var(--accent);border-radius:6px;padding:0 .5em;font-weight:700;color:var(--accent);margin:0 .15em}
.sel{display:flex;align-items:center;gap:8px;margin:8px 0}
.sel label{font-weight:700;width:1.6em;color:var(--accent)}
select{flex:1;font:inherit;font-size:16px;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
select.ok{border-color:var(--ok);background:var(--okbg)}
select.ng{border-color:var(--ng);background:var(--ngbg)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 18px;background:var(--accent);color:#fff;cursor:pointer;margin-top:8px}
@media (prefers-color-scheme:dark){.btn,.tab.on{color:#10202b}}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.res{margin-top:12px;padding:12px;border-radius:10px;font-size:.92rem}
.res.ok{background:var(--okbg)} .res.ng{background:var(--ngbg)}
.res .verdict{font-weight:700;margin-bottom:6px}
.res .verdict.ok{color:var(--ok)} .res .verdict.ng{color:var(--ng)}
.res p{margin:0 0 8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar .score{font-weight:700;font-variant-numeric:tabular-nums;font-size:.92rem}
.bar .btn{margin:0;padding:8px 14px;font-size:.9rem;white-space:nowrap}
.big{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.big small{font-size:.9rem;font-weight:400;color:var(--sub);margin-left:.4em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .lab{font-size:.8rem;color:var(--sub)}
.row{padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .name{font-weight:600}
.row .val{font-variant-numeric:tabular-nums;white-space:nowrap}
.row .val small{color:var(--sub);margin-left:.4em}
.track{height:8px;border-radius:4px;background:var(--track);margin-top:6px;overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--accent)}
.fill.low{background:var(--ng)}
.tag{display:inline-block;font-size:.74rem;font-weight:700;border-radius:999px;padding:0 .6em;margin-left:.5em;border:1px solid currentColor}
.tag.weak{color:var(--ng)} .tag.few{color:var(--warn)}
.miss{margin:6px 0;font-size:.92rem}
.hint{font-size:.84rem;color:var(--sub);margin:8px 0 0}
textarea{width:100%;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:8px;margin-top:8px}
footer{max-width:760px;margin:0 auto;padding:0 16px 120px;color:var(--sub);font-size:.8rem}
</style>
</head>

<script>
const DATA = {"sets": [{"id": "04", "title": "労基法 第1回", "subject": "労働基準法", "questions": [{"type": "choice", "no": 1, "topic": "賃金", "stem": "労働基準法に定める賃金等に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "雇用契約においてある手当が時間外労働等に対する対価として支払われるものとされているか否かは、雇用契約に係る契約書等の記載内容のほか、具体的事案に応じ、使用者の労働者に対する当該手当や割増賃金に関する説明の内容、労働者の実際の労働時間等の勤務状況などの事情を考慮して判断すべきであるとするのが、最高裁判所の判例である。"}, {"label": "B", "text": "労働基準法第20条に基づく解雇予告手当を算定する際の平均賃金を算定すべき事由の発生した日は、労働者に解雇の通告をした日であり、その後、当該労働者の同意を得て解雇日を変更した場合においても、当初の解雇を通告した日とするものとされている。"}, {"label": "C", "text": "就業規則で定めた減給の制裁について、労働基準法第91条にいう平均賃金を算定すべき事由の発生した日は、減給の制裁の意思表示が相手方に到達した日である。"}, {"label": "D", "text": "雇入れ後3か月に満たない労働者について平均賃金を算定すべき事由が発生した場合において、算定事由発生日前に賃金締切日があるときは、直前の賃金締切日から起算して雇入れ後の期間とその期間中の賃金の総額により算定することとされている。"}, {"label": "E", "text": "使用者の責に帰すべき事由による休業が労働協約、就業規則又は労働契約により休日と定められている日を含む期間にわたる場合、使用者は、当該休日と定められている日についても、労働基準法第26条に定める休業手当を支払わなければならない。"}], "answer": "E", "answerText": "<b>正解 E</b>", "explain": ["A ○【判決】日本ケミカル事件（最一小判 平30.7.19）の本文どおり", "B ○【過去問】令和7年 問2B（正しい肢）", "C ○【過去問＋AI】令和8年 問7オは「制裁事由が発生した日」として誤り。正しくは意思表示の到達日（この部分はAIの知識）", "D ○【過去問】令和7年 問2Dは「賃金締切日があるか否かにかかわらず」として誤り", "<b>E ✕</b>【過去問】令和7年 問4E（正しい肢）の逆。休日と定められている日については、休業手当を支払う義務は生じない"], "key": "04-1"}, {"type": "choice", "no": 2, "topic": "労働契約・解雇", "stem": "労働基準法に定める労働契約等に関する次のアからオまでの記述のうち、正しいものはいくつあるか。", "statements": [{"label": "ア", "text": "満60歳以上の労働者との間に締結される労働契約について、労働基準法第14条第1項第2号により5年までの契約期間が認められるか否かは、当該労働契約の締結時における当該労働者の年齢によって判断される。"}, {"label": "イ", "text": "使用者は、有期労働契約（当該契約を2回以上更新し、又は雇入れの日から起算して1年を超えて継続勤務している者に係るものに限り、あらかじめ当該契約を更新しない旨明示されているものを除く。）を更新しないこととしようとする場合には、少なくとも当該契約の期間の満了する日の30日前までに、その予告をしなければならない。"}, {"label": "ウ", "text": "労働契約の締結に際し明示された労働条件が事実と相違する場合、労働者は、即時に労働契約を解除することができるほか、明示されたとおりの労働条件の履行を使用者に求めることもできる。"}, {"label": "エ", "text": "事業主を異にするX社とY社に使用される労働者が、X社の業務により負傷し、その療養のために休業している場合、当該休業する期間及びその後30日間について、労働基準法第19条第1項による解雇の制限を受けるのはX社であって、Y社はこの制限を受けない。"}, {"label": "オ", "text": "労災保険法に基づく療養補償給付を受ける労働者は、使用者が自ら労働基準法第75条の規定による療養補償を行っている場合に当たらないから、当該労働者が療養開始後3年を経過しても疾病等が治らない場合に、使用者が同法第81条の規定による打切補償の支払をしても、同法第19条第1項ただし書の適用を受けることはできないとするのが、最高裁判所の判例である。"}], "choices": [{"label": "A", "text": "一つ"}, {"label": "B", "text": "二つ"}, {"label": "C", "text": "三つ"}, {"label": "D", "text": "四つ"}, {"label": "E", "text": "五つ"}], "answer": "C", "answerText": "<b>正解 C（三つ：ア・ウ・エ）</b>", "explain": ["ア ○【過去問】令和7年 問3A（正しい肢）", "<b>イ ✕</b>【過去問】令和6年 問3A（正しい肢）は「<b>3回以上</b>更新し」。ここだけを入れ替えています", "ウ ○【過去問】令和7年 問3Cは「解除することができるにとどまり…要求することはできない」として誤り", "エ ○【過去問】令和7年 問3Dは「X社もY社も解雇してはならない」として誤り", "<b>オ ✕</b>【判決】専修大学事件（最二小判 平27.6.8）。記述は原審（高裁）の考え方。最高裁は、労災保険の保険給付の実質は使用者の災害補償義務を政府が保険給付の形式で行うものであるとして、打切補償の支払により第19条第1項ただし書の<b>適用を受けることができる</b>とした"], "key": "04-2"}, {"type": "choice", "no": 3, "topic": "時間外労働・割増賃金", "stem": "労働基準法に定める時間外・休日労働及び割増賃金に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働者数が本社120人、P工場60人、Q営業所20人の合計200人である企業において、本社の労働者110人のみで組織する労働組合がある場合、当該労働組合は当該企業の労働者の過半数で組織されているから、P工場及びQ営業所における労働基準法第36条の協定についても、労働者側の協定当事者となる。"}, {"label": "B", "text": "労働基準法第36条の協定の当事者である「労働者の過半数を代表する者」を選出する際の「労働者」の範囲には、同法第41条第2号の管理監督者や満18歳に満たない者のように時間外労働又は休日労働をさせることが想定されない者は含まれないと解すべきであるとされている。"}, {"label": "C", "text": "いわゆる年俸制の適用を受ける労働者について、年俸額の一部を賞与として支払うこととしている場合であって、当該賞与の支給額があらかじめ確定しているときは、当該賞与は、割増賃金の基礎となる賃金に算入しなければならない。"}, {"label": "D", "text": "使用者が雇用契約に基づき時間外労働等に対する対価として定額の手当を支払う場合について、労働基準法第37条や他の労働関係法令は、当該手当の支払によって割増賃金の全部又は一部を支払ったものといえるために、当該手当を上回る金額の割増賃金請求権が発生した事実を労働者が認識して直ちに支払を請求することができる仕組みが備わっていることを必須のものとしていると解されるとするのが、最高裁判所の判例である。"}, {"label": "E", "text": "通常は事務作業に従事している労働者が、法定労働時間外に、特殊作業手当が支払われる現場作業に従事した場合、当該現場作業は当該労働者にとって通常の業務ではないから、当該特殊作業手当は、当該時間外労働に係る割増賃金の基礎となる賃金に算入しなくとも差し支えないとされている。"}], "answer": "C", "answerText": "<b>正解 C</b>", "explain": ["<b>A ✕</b>【過去問】令和7年 問5A（誤りの肢）と同じ論点。協定は事業場ごとに締結するので、P工場・Q営業所ではその事業場の労働者の過半数を組織していなければ当事者にならない", "<b>B ✕</b>【過去問】令和7年 問5C（正しい肢）の逆。管理監督者等を<b>含む全ての労働者</b>", "C ○【過去問】令和7年 問6Dは「算入しなくとも差し支えない」として誤り", "<b>D ✕</b>【判決】日本ケミカル事件の本文は「…必須のものとしているとは<b>解されない</b>」。語尾だけの入れ替え", "<b>E ✕</b>【過去問】令和7年 問6C（誤りの肢）と同じ論点。時間外に従事した作業に付く特殊作業手当は算入する"], "key": "04-3"}, {"type": "choice", "no": 4, "topic": "年次有給休暇", "stem": "労働基準法に定める年次有給休暇及び就業規則に関する次のアからオまでの記述のうち、誤っているものの組合せは、後記AからEまでのうちどれか。", "statements": [{"label": "ア", "text": "労働基準法第39条第7項の規定による使用者の時季指定について、労働者が半日単位で取得した年次有給休暇の日数分は同条第8項の「日数」に含まれ、その分について使用者は時季指定を要しないが、労働者が時間単位で取得した分は、同項の「日数」に含まれない。"}, {"label": "イ", "text": "労働基準法第39条第1項及び第2項の出勤率の算定に当たり、産前産後の女性が同法第65条の規定によって休業した期間は出勤したものとみなされるが、生理日の就業が著しく困難な女性が同法第68条の規定によって就業しなかった期間は、同法上、出勤したものとはみなされない。"}, {"label": "ウ", "text": "労働基準法第89条第1号から第3号までに掲げる事項の一部を記載していない就業規則であっても、その効力の発生についての他の要件を具備する限り有効であるが、使用者は同条違反の責任を免れない。"}, {"label": "エ", "text": "使用者が、4月1日に入社した労働者に対し、入社日に5労働日、同年7月1日に5労働日の年次有給休暇を付与した場合、使用者は、7月1日から1年以内に5日について時季を定めることにより与えなければならず、当該労働者が4月1日から6月30日までの間に自ら請求して取得した年次有給休暇の日数があっても、その日数を当該5日から控除することはできない。"}, {"label": "オ", "text": "労働者が遅刻又は早退をした場合において、その遅刻又は早退の時間に相当する賃金額を限度として行う賃金の減額は、就業規則に制裁として定められている限り、労働基準法第91条に定める減給の制裁に関する規定の適用を受ける。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとウ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（ウとオ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "E", "answerText": "<b>正解 E（エとオ）</b>", "explain": ["ア ○【過去問】令和6年 問6D（正しい肢）", "イ ○【過去問】令和6年 問6Eは、両方とも出勤したものとみなすとして誤り", "ウ ○【過去問】令和6年 問7Aは「無効とされている」として誤り", "<b>エ ✕</b>【AI】一部を前倒しで付与した場合、付与日数の合計が10労働日に達した日（7月1日）から1年以内に5日を取得させる。その日より前に労働者が取得した日数は、5日から<b>控除することができる</b>（施行規則第24条の5）。この肢はAIの知識によるので、テキストで確認してください", "<b>オ ✕</b>【過去問】令和7年 問7E（正しい肢）の逆。遅刻・早退の時間分は賃金債権が生じないので、その時間分の減額は第91条の適用を<b>受けない</b>。その時間分を超える減額が制裁に当たる"], "key": "04-4"}, {"type": "choice", "no": 5, "topic": "総則", "stem": "労働基準法の総則等に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働基準法第5条に定める「労働者の意思に反して労働を強制」するとは、不当な手段を用いることによって、使用者が労働者の意識ある意思を抑圧し、その自由な発現を妨げて労働すべく強要することをいい、労働者が現実に労働したことを要する。"}, {"label": "B", "text": "労働基準法第6条の「業として利益を得る」とは、営利を目的として同種の行為を反復継続することをいうから、反復継続して利益を得る意思があったとしても、現に行われた行為が1回にとどまる場合は、これに当たらない。"}, {"label": "C", "text": "労働基準法第3条は、労働者の信条によって賃金その他の労働条件につき差別することを禁じているが、これは雇入れ後における労働条件についての制限であって、雇入れそのものを制約する規定ではないとするのが、最高裁判所の判例である。"}, {"label": "D", "text": "労働基準法第9条に定める「労働者」とは、他人との間に使用従属の関係に立って労務に服し、報酬を受けて生活する者をいい、現に事業又は事務所に使用されていることまでは要しない。"}, {"label": "E", "text": "出向元との労働契約関係を維持したまま出向先の指揮命令を受けて就労するいわゆる在籍型出向の出向労働者については、出向元との間に労働契約関係が存続していることから、労働基準法における使用者としての責任は、出向元の使用者が負う。"}], "answer": "C", "answerText": "<b>正解 C</b>", "explain": ["<b>A ✕</b>【過去問】令和7年 問1ア。「必ずしも労働者が現実に労働することを必要としない」", "<b>B ✕</b>【過去問】令和7年 問1イ。1回の行為であっても、反復継続して利益を得る意思があれば当たる", "C ○【過去問】三菱樹脂事件（最大判 昭48.12.12）。令和6年 問1Bは、雇入れの拒否も第3条に違反するとして誤り", "<b>D ✕</b>【過去問】令和7年 問1エ（失業者を含むとした記述）と同じ論点。労働基準法の労働者は、事業又は事務所に<b>使用される者</b>（第9条）", "<b>E ✕</b>【過去問】令和6年 問1D（正しい肢）。三者間の取決めによって定められた権限と責任に応じて、<b>出向元又は出向先</b>の使用者がそれぞれ責任を負う"], "key": "04-5"}, {"type": "cloze", "no": 6, "topic": "選択式", "stem": "次の文中の［ A ］〜［ E ］の部分を選択肢の中の最も適切な語句で埋め、完全な文章とせよ。", "passage": ["1　最高裁判所は、労災保険法による療養補償給付を受ける労働者に対する打切補償と解雇制限との関係が問題となった事件において、次のように判示した。", "「業務災害に関する労災保険制度は、労働基準法により使用者が負う災害補償義務の存在を前提として、その補償負担の緩和を図りつつ被災した労働者の迅速かつ公正な保護を確保するため、使用者による災害補償に代わる保険給付を行う制度であるということができ、このような労災保険法に基づく保険給付の実質は、使用者の労働基準法上の［ A ］を政府が保険給付の形式で行うものであると解するのが相当である。」", "2　最高裁判所は、歩合給の計算に当たり売上高等の一定割合に相当する金額から残業手当等に相当する金額を控除する旨を定めた賃金規則が問題となった事件において、次のように判示した。", "「（当該仕組みの下で）割増金を時間外労働等に対する対価とみるとすれば、出来高払制の賃金部分につき通常の労働時間の賃金に当たる部分はなく、全てが割増賃金であることとなるが、これは、法定の労働時間を超えた労働に対する割増分として支払われるという労働基準法37条の定める割増賃金の［ B ］から逸脱したものといわざるを得ない。」", "「割増金として支払われる賃金のうちどの部分が時間外労働等に対する対価に当たるかは明らかでないから、本件賃金規則における賃金の定めにつき、通常の労働時間の賃金に当たる部分と労働基準法37条の定める割増賃金に当たる部分とを［ C ］することはできないこととなる。」", "3　最高裁判所は、定額の手当の支払による割増賃金の支払が問題となった事件において、雇用契約においてある手当が時間外労働等に対する対価として支払われるものとされているか否かは、「雇用契約に係る契約書等の記載内容のほか、具体的事案に応じ、使用者の労働者に対する当該手当や割増賃金に関する［ D ］、労働者の実際の労働時間等の勤務状況などの事情を考慮して判断すべきである」と判示した。", "4　使用者は、有期労働契約（当該契約を3回以上更新し、又は雇入れの日から起算して1年を超えて継続勤務している者に係るものに限り、あらかじめ当該契約を更新しない旨明示されているものを除く。）を更新しないこととしようとする場合には、少なくとも当該契約の期間の満了する日の［ E ］前までに、その予告をしなければならない。"], "options": [{"mark": "①", "text": "安全配慮義務"}, {"mark": "②", "text": "災害補償義務"}, {"mark": "③", "text": "損害賠償責任"}, {"mark": "④", "text": "保険料負担義務"}, {"mark": "⑤", "text": "趣旨"}, {"mark": "⑥", "text": "本質"}, {"mark": "⑦", "text": "計算方法"}, {"mark": "⑧", "text": "最低基準"}, {"mark": "⑨", "text": "区分"}, {"mark": "⑩", "text": "算定"}, {"mark": "⑪", "text": "特定"}, {"mark": "⑫", "text": "判別"}, {"mark": "⑬", "text": "合意の有無"}, {"mark": "⑭", "text": "計算の根拠"}, {"mark": "⑮", "text": "周知の状況"}, {"mark": "⑯", "text": "説明の内容"}, {"mark": "⑰", "text": "14日"}, {"mark": "⑱", "text": "30日"}, {"mark": "⑲", "text": "1か月"}, {"mark": "⑳", "text": "60日"}], "answers": {"A": "②", "B": "⑥", "C": "⑫", "D": "⑯", "E": "⑱"}, "answerText": "<b>A ② 災害補償義務 ／ B ⑥ 本質 ／ C ⑫ 判別 ／ D ⑯ 説明の内容 ／ E ⑱ 30日</b>", "explain": ["A【判決】専修大学事件（最二小判 平27.6.8）", "B・C【判決】国際自動車事件（最一小判 令2.3.30）。Bは⑤「趣旨」と迷いやすいが、判決は「本質から逸脱」", "D【判決】日本ケミカル事件（最一小判 平30.7.19）", "E【過去問】令和6年 問3A。⑲「1か月」ではなく「30日」"], "key": "04-6"}]}, {"id": "05", "title": "労基法 第2回", "subject": "労働基準法", "questions": [{"type": "choice", "no": 1, "topic": "総則", "stem": "労働基準法の労働者及び使用者に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "契約の形式が請負契約であっても、その実体において使用従属関係が認められ、事業に使用されて賃金を支払われる者であるときは、労働基準法の労働者に該当する。"}, {"label": "B", "text": "同居の親族のみを使用する事業において、一時的に親族以外の者が使用されている場合、当該事業は引き続き同居の親族のみを使用する事業として取り扱われるから、この者は労働基準法の労働者に該当しない。"}, {"label": "C", "text": "法令の規定により事業主等に申請等が義務付けられている場合において、事務代理の委任を受けた社会保険労務士がその懈怠により当該申請等を行わなかったときは、当該社会保険労務士は事業主に使用される者ではないから、労働基準法第10条にいう「使用者」には該当しない。"}, {"label": "D", "text": "労働基準法第10条にいう「使用者」は、同法各条の義務についての履行の責任者をいうものであるから、同法第9条にいう「労働者」に該当する者が、同時に同法第10条にいう「使用者」に該当することはない。"}, {"label": "E", "text": "法人が業として他人の就業に介入して利益を得た場合、労働基準法第6条違反が成立するのは利益を得た当該法人であり、法人のために違反行為を計画し、実行した従業員については、その者が現実に利益を得ていない限り、同条違反は成立しない。"}], "answer": "A", "answerText": "<b>正解 A</b>", "explain": ["A ○【過去問】令和4年 問1Bは、請負の形式であれば労働者に該当することはないとして誤り", "<b>B ✕</b>【過去問】令和4年 問1C（誤りの肢）と同じ論点。一時的であっても親族以外の者が使用されていれば、この者は労働者に該当する", "<b>C ✕</b>【過去問】令和4年 問4E（正しい肢）の逆。この場合の社会保険労務士は「使用者」に該当し、責任を問われうる", "<b>D ✕</b>【過去問】令和5年 問4E（誤りの肢）と同じ論点。労働者であると同時に、ある事項については使用者に当たることがある", "<b>E ✕</b>【過去問】令和5年 問4D（誤りの肢）と同じ論点。利益の帰属先が法人であっても、行為者である従業員について成立する"], "key": "05-1"}, {"type": "choice", "no": 2, "topic": "総則", "stem": "労働基準法の総則に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働基準法第1条にいう「労働関係の当事者」には、使用者及び労働者のほか、それぞれの団体である使用者団体及び労働組合も含まれる。"}, {"label": "B", "text": "特定の思想、信条に従って行う行動が企業の秩序維持に対し重大な影響を及ぼす場合に、その秩序違反行為そのものを理由として差別的取扱いをすることは、労働基準法第3条に違反するものではない。"}, {"label": "C", "text": "就業規則に、労働者が女性であることを理由として賃金について男性と差別的取扱いをする趣旨の規定がある場合、当該規定は無効であるが、現実に男女差別待遇の事実がないときは、労働基準法第4条違反とはならない。"}, {"label": "D", "text": "使用者が、労働者に対し、労働の強制の目的はなく、単に態度が悪いことを理由として暴行を加えた場合であっても、当該暴行が労働者の精神又は身体の自由を不当に拘束する手段に当たる以上、労働基準法第5条違反となる。"}, {"label": "E", "text": "労働基準法第5条に定める「監禁」とは、一定の区画された場所から脱出できない状態に置くことによって労働者の身体の自由を拘束することをいい、必ずしも物質的障害をもって手段とすることを要しない。"}], "answer": "D", "answerText": "<b>正解 D</b>", "explain": ["A ○【過去問】令和4年 問4A", "B ○【過去問】令和5年 問4B", "C ○【過去問】令和4年 問4Cは、現実に差別待遇の事実がなくても第4条違反となるとして誤り", "<b>D ✕</b>【過去問】令和4年 問4D（正しい肢）の逆。労働の強制の目的がない暴行は、刑法の暴行罪が成立する可能性はあっても、第5条違反とはならない", "E ○【過去問】令和5年 問4Cは、物質的障害がない場合には監禁に該当することはないとして誤り"], "key": "05-2"}, {"type": "choice", "no": 3, "topic": "労働契約・解雇", "stem": "労働基準法に定める労働契約等に関する次のアからオまでの記述のうち、正しいものはいくつあるか。", "statements": [{"label": "ア", "text": "労働基準法第14条第1項に規定する期間を超える期間を定めた労働契約を締結した場合、当該労働契約の期間は、同項に規定する期間となる。"}, {"label": "イ", "text": "社宅が単なる福利厚生施設とみなされる場合においては、社宅を供与すべき旨の条件は労働基準法第15条第1項の「労働条件」に含まれないから、労働契約の締結に当たり同旨の条件を付していたにもかかわらず社宅を供与しなかったときでも、同条第2項による労働契約の解除権を行使することはできない。"}, {"label": "ウ", "text": "労働基準法第15条第3項にいう「契約解除の日から14日以内」とは、契約を解除した当日から起算して14日以内をいい、例えば、10月1日に労働契約を解除した場合は、10月14日までをいう。"}, {"label": "エ", "text": "労働基準法第16条のいわゆる賠償予定の禁止については、違約金を定め、又は損害賠償額を予定する契約を締結したときに違反が成立し、違約金又はあらかじめ定めた損害賠償額を現実に徴収したことを要しない。"}, {"label": "オ", "text": "労働基準法第22条第1項に基づいて交付する証明書には、労働者の請求しない事項を記入してはならないから、労働者が同項に定める事項の一部のみについて証明書を請求した場合には、使用者は、請求のあった事項のみを記入しなければならない。"}], "choices": [{"label": "A", "text": "一つ"}, {"label": "B", "text": "二つ"}, {"label": "C", "text": "三つ"}, {"label": "D", "text": "四つ"}, {"label": "E", "text": "五つ"}], "answer": "D", "answerText": "<b>正解 D（四つ：ア・イ・エ・オ）</b>", "explain": ["ア ○【過去問＋AI】令和5年 問5Aは「期間の定めのない労働契約となる」として誤り。上限の期間（3年又は5年）に改められるという部分はAIの知識", "イ ○【過去問】令和5年 問5B", "<b>ウ ✕</b>【過去問】令和4年 問5B（誤りの肢）と同じ論点。初日は算入しないので、解除の日の翌日から起算する（10月15日まで）", "エ ○【過去問】令和4年 問5Cは、現実に徴収したときにはじめて違反が成立するとして誤り", "オ ○【過去問・条文】令和4年 問5Eは、すべて記入しなければならないとして誤り。第22条第3項"], "key": "05-3"}, {"type": "choice", "no": 4, "topic": "賃金", "stem": "労働基準法に定める賃金等に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働基準法第24条第1項に定める直接払の原則は、労働者本人以外の者に賃金を支払うことを禁止するものであるが、労働者が未成年者である場合に、その親権者に賃金を支払うことは、同原則に違反しない。"}, {"label": "B", "text": "賃金の所定支払日が休日に当たる場合に、その支払日を繰り上げることを定めることだけでなく、その支払日を繰り下げることを定めることも、労働基準法第24条第2項に定める一定期日払の原則に違反しない。"}, {"label": "C", "text": "使用者は、労働者が出産、疾病、災害等の非常の場合の費用に充てるために請求する場合においては、支払期日前であっても既往の労働に対する賃金を支払わなければならないが、この非常時払については、通貨払及び直接払を定めた労働基準法第24条第1項の規定は適用されない。"}, {"label": "D", "text": "労働組合が自らの判断によって部分ストライキを決行した場合において、ストライキに参加しなかった当該労働組合所属の労働者の労働が社会観念上無価値となったために使用者が命じた休業は、ストライキの原因が使用者側にもあるときは、労働基準法第26条の「使用者の責に帰すべき事由」によるものに当たるとするのが、最高裁判所の判例である。"}, {"label": "E", "text": "労働基準法第27条に定める出来高払制の保障給について、同種の労働を行っている労働者が多数ある場合には、保障給の趣旨に照らし、個々の労働者の技量、経験、年齢等に応じてその額に差を設けることはできない。"}], "answer": "B", "answerText": "<b>正解 B</b>", "explain": ["<b>A ✕</b>【過去問・条文】令和5年 問6A（誤りの肢）と同じ論点。未成年者は独立して賃金を請求でき、親権者又は後見人は代わって受け取ってはならない（第59条）", "B ○【過去問】令和5年 問6C", "<b>C ✕</b>【過去問】令和5年 問6D（誤りの肢）と同じ論点。非常時払にも第24条第1項は適用される", "<b>D ✕</b>【過去問】令和5年 問6E（誤りの肢）と同じ論点。最高裁は、このような休業は使用者の責に帰すべき事由によるものとはいえないとした", "<b>E ✕</b>【過去問】令和4年 問6オ（正しい肢）の逆。差を設けることは差し支えない"], "key": "05-4"}, {"type": "choice", "no": 5, "topic": "賃金", "stem": "下記のとおり賃金を支払われている労働者が、使用者の責に帰すべき事由により半日休業した場合における労働基準法第26条の休業手当に関する次の記述のうち、正しいものはどれか。<br>賃金：日給1日12,000円。半日休業とした日の賃金は、半日分の6,000円が支払われた。<br>平均賃金：11,000円", "statements": [], "choices": [{"label": "A", "text": "使用者は、以下の算式により600円の休業手当を支払わなければならない。<br>11,000円 × 0.6 − 6,000円 ＝ 600円"}, {"label": "B", "text": "使用者は、以下の算式により1,200円の休業手当を支払わなければならない。<br>12,000円 × 0.6 − 6,000円 ＝ 1,200円"}, {"label": "C", "text": "使用者は、以下の算式により3,000円の休業手当を支払わなければならない。<br>（11,000円 − 6,000円）× 0.6 ＝ 3,000円"}, {"label": "D", "text": "使用者は、以下の算式により3,300円の休業手当を支払わなければならない。<br>11,000円 × 0.6 ÷ 2 ＝ 3,300円"}, {"label": "E", "text": "現実に就労した時間に対して6,000円の賃金が支払われているから、使用者が休業手当として支払うべき金額は発生しない。"}], "answer": "A", "answerText": "<b>正解 A</b>", "explain": ["【過去問＋AI】令和5年 問1と同じ型です。1日の一部を休業した場合、その日について<b>平均賃金の100分の60</b>に相当する額（11,000円 × 0.6 ＝ 6,600円）を保障する必要があります", "現実に就労した時間に対して支払われた賃金（6,000円）が6,600円に満たないので、その<b>差額600円</b>を休業手当として支払います", "令和5年の問題は、支払われた賃金（5,000円）が平均賃金の100分の60（4,200円）以上だったので「発生しない」が正解でした。数字を変えると結論が変わります", "差額を支払うという部分はAIの知識によります"], "key": "05-5"}, {"type": "choice", "no": 6, "topic": "労働時間・休憩", "stem": "労働基準法に定める労働時間に関する次のアからオまでの記述のうち、誤っているものの組合せは、後記AからEまでのうちどれか。", "statements": [{"label": "ア", "text": "警備員が実作業に従事しない仮眠時間について、当該警備員が労働契約に基づき仮眠室における待機と警報や電話等に対して直ちに対応することが義務付けられており、そのような対応をすることが皆無に等しいなど実質的に上記義務付けがされていないと認めることができるような事情が存しない場合には、当該仮眠時間は労働基準法第32条の労働時間に当たるとするのが、最高裁判所の判例である。"}, {"label": "イ", "text": "労働安全衛生規則第44条の定めによる定期健康診断は、事業者にその実施が義務付けられているものであるから、その受診に要する時間は、労働時間として取り扱うものとされている。"}, {"label": "ウ", "text": "事業場に火災が発生した場合において、既に帰宅している所属労働者が任意に事業場に出勤し消火作業に従事したときは、一般に労働時間と解されている。"}, {"label": "エ", "text": "労働者が遅刻をし、その時間だけ通常の終業時刻を繰り下げて労働させる場合に、1日の実労働時間を通算すれば労働基準法第32条又は第40条の労働時間を超えないときは、同法第36条第1項に基づく協定及び同法第37条に基づく割増賃金の支払の必要はない。"}, {"label": "オ", "text": "労働者が事業主を異にする複数の事業場で労働する場合、労働基準法第38条第1項により、法定労働時間に関する規定のほか、同法第34条に定める休憩に関する規定の適用についても、労働時間を通算することとされている。"}], "choices": [{"label": "A", "text": "（アとウ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（イとオ）"}, {"label": "E", "text": "（ウとオ）"}], "answer": "D", "answerText": "<b>正解 D（イとオ）</b>", "explain": ["ア ○【過去問・判決】令和4年 問2E。大星ビル管理事件（最一小判 平14.2.28）", "<b>イ ✕</b>【過去問】令和4年 問2A（誤りの肢）と同じ論点。一般健康診断の受診時間は当然には労働時間とされない（特殊健康診断は労働時間）", "ウ ○【過去問】令和4年 問2Dは「一般に労働時間としないと解されている」として誤り", "エ ○【過去問】令和4年 問3C", "<b>オ ✕</b>【過去問】令和5年 問7C（誤りの肢）と同じ論点。休憩に関する規定の適用については通算されない"], "key": "05-6"}, {"type": "choice", "no": 7, "topic": "時間外労働・割増賃金", "stem": "労働基準法に定める労働時間、時間外・休日労働等に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働基準法第32条の3に定めるフレックスタイム制において、同法第36条第1項の協定を締結する際、1日について延長することができる時間を協定する必要はなく、1か月及び1年について協定すれば足りる。"}, {"label": "B", "text": "労働基準法第32条の2に定めるいわゆる1か月単位の変形労働時間制を労使協定を締結することにより採用する場合、当該労使協定を所轄労働基準監督署長に届け出ることによって、同変形労働時間制の効力が発生する。"}, {"label": "C", "text": "使用者は、物品の販売の事業、保健衛生の事業、接客娯楽の事業等のうち常時10人未満の労働者を使用するものについては、労働基準法第32条の規定にかかわらず、1週間について46時間、1日について8時間まで労働させることができる。"}, {"label": "D", "text": "使用者が労働基準法施行規則第23条によって日直を断続的勤務として許可を受けた場合であっても、休日に日直をさせるときは、同法第36条第1項の協定を締結し、所轄労働基準監督署長に届け出なければならない。"}, {"label": "E", "text": "労働基準法第37条第3項に基づくいわゆる代替休暇を与えることができる期間は、延長して労働させた時間が1か月について60時間を超えた当該1か月の末日の翌日から3か月以内の範囲内で、労使協定で定めた期間とされている。"}], "answer": "A", "answerText": "<b>正解 A</b>", "explain": ["A ○【過去問】令和5年 問7A", "<b>B ✕</b>【過去問】令和4年 問7B（誤りの肢）と同じ論点。届出は必要だが、届出は効力の発生要件ではない", "<b>C ✕</b>【過去問・条文】令和4年 問7A（誤りの肢）と同じ論点。特例は1週間<b>44時間</b>、1日8時間", "<b>D ✕</b>【過去問】令和4年 問3A（正しい肢）の逆。許可を受けた日直には第36条第1項の協定は不要", "<b>E ✕</b>【過去問】令和4年 問7D（正しい肢）は「<b>2か月</b>以内」"], "key": "05-7"}, {"type": "choice", "no": 8, "topic": "労働時間・休憩", "stem": "労働基準法に定める休憩に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "休憩時間は原則として一斉に与えなければならないが、道路による貨物の運送の事業及び倉庫における貨物の取扱いの事業には、この規定は適用されない。"}, {"label": "B", "text": "一昼夜交替制勤務は、2日間の所定労働時間を継続して勤務する場合であるから、労働基準法第34条により、2時間以上の休憩時間を労働時間の途中に与えなければならないとされている。"}, {"label": "C", "text": "休憩時間中の外出について所属長の許可を受けさせることは、事業場内において自由に休息し得る場合には、必ずしも休憩時間の自由利用を定めた労働基準法第34条第3項に違反しない。"}, {"label": "D", "text": "工場の事務所において、昼食休憩時間に来客当番として待機させた場合であっても、結果的に来客が1人もなかったときは、当該時間は休憩時間を与えたものとして取り扱われる。"}, {"label": "E", "text": "使用者は、労働基準法第33条の「災害その他避けることのできない事由」によって臨時の必要がある場合において、行政官庁の許可を受けて労働時間を延長するときは、その必要の限度において、同法第34条の休憩時間を与えないことができる。"}], "answer": "C", "answerText": "<b>正解 C</b>", "explain": ["<b>A ✕</b>【過去問】令和5年 問2ア（誤りの記述）と同じ論点。運送の事業は適用除外だが、倉庫における貨物の取扱いの事業は適用除外ではない", "<b>B ✕</b>【過去問】令和5年 問2イ（誤りの記述）と同じ論点。法律上は1時間の休憩で足りる", "C ○【過去問】令和5年 問2ウ", "<b>D ✕</b>【過去問】令和5年 問2オ（正しい記述）の逆。来客がなくても、待機させた時間は休憩時間を与えたことにならない", "<b>E ✕</b>【過去問】令和6年 問5イ（正しい記述）の逆。第33条に該当する場合であっても休憩時間は与えなければならない"], "key": "05-8"}, {"type": "choice", "no": 9, "topic": "年少者・妊産婦", "stem": "労働基準法の年少者及び妊産婦等に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "女性労働者が妊娠中絶を行った場合、産前6週間の休業の問題は発生しないが、妊娠4か月（1か月28日として計算する。）以後に行った場合には、産後の休業について定めた労働基準法第65条第2項の適用がある。"}, {"label": "B", "text": "6週間以内に出産する予定の女性労働者が休業を請求せず引き続き就業している場合は、その期間は労働基準法第19条の解雇制限期間にはならない。"}, {"label": "C", "text": "災害等による臨時の必要がある場合の時間外労働等を規定した労働基準法第33条第1項は、満18歳に満たない者には適用されず、また、妊産婦が請求した場合においては、同項を適用して時間外労働等をさせることはできない。"}, {"label": "D", "text": "使用者は、妊娠中の女性及び坑内で行われる業務に従事しない旨を使用者に申し出た産後1年を経過しない女性を、坑内で行われるすべての業務に就かせてはならない。"}, {"label": "E", "text": "使用者は、満15歳以上で満18歳に満たない者（満15歳に達した日以後の最初の3月31日までの間を除く。）について、1週間について48時間、1日について8時間を超えない範囲内において、労働基準法第32条の4に定めるいわゆる1年単位の変形労働時間制の規定の例により労働させることができる。"}], "answer": "C", "answerText": "<b>正解 C</b>", "explain": ["A ○【過去問】令和5年 問3B", "B ○【過去問】令和5年 問3C", "<b>C ✕</b>【過去問】令和5年 問3D（正しい肢）は、第33条第1項は<b>年少者にも適用される</b>としている。後半（妊産婦が請求した場合）は正しい", "D ○【過去問・条文】令和5年 問3Aは「産後1年を経過しない」を抜いた記述で誤り。第64条の2第1号", "E ○【過去問・条文】令和8年 問4Eは「1日10時間、1週52時間」として誤り。第60条第3項第2号"], "key": "05-9"}, {"type": "choice", "no": 10, "topic": "年次有給休暇", "stem": "労働基準法に定める年次有給休暇に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "年次有給休暇の権利は、労働基準法第39条第1項、第2項の要件が充足されることによって法律上当然に労働者に生ずる権利であるが、休暇の時季を特定して年次有給休暇が成立するためには、労働者による休暇の請求に対する使用者の承認を要するとするのが、最高裁判所の判例である。"}, {"label": "B", "text": "勤務割による勤務体制がとられている事業場において、使用者としての通常の配慮をすれば、勤務割を変更して代替勤務者を配置することが客観的に可能な状況にあると認められるにもかかわらず、使用者がそのための配慮をしないことにより代替勤務者が配置されないときは、必要配置人員を欠くものとして事業の正常な運営を妨げる場合に当たるということはできないとするのが、最高裁判所の判例である。"}, {"label": "C", "text": "労働基準法第39条第7項の規定による使用者の時季指定について、労働者が半日単位で取得した年次有給休暇の日数分は、同条第8項の「日数」に含まれない。"}, {"label": "D", "text": "定年退職による退職者を引き続き嘱託社員として同一事業場で再採用している場合であっても、所定の退職手当が支給されているときは、年次有給休暇に係る継続勤務年数の算定に当たり、定年退職前の勤務年数は通算されない。"}, {"label": "E", "text": "使用者は、時間を単位として年次有給休暇を与えるためには、労使協定により所定の事項を定め、これを所轄労働基準監督署長に届け出なければならない。"}], "answer": "B", "answerText": "<b>正解 B</b>", "explain": ["<b>A ✕</b>【過去問・判決】令和4年 問7E（誤りの肢）と同じ論点。白石営林署事件（最二小判 昭48.3.2）は、年次有給休暇の成立要件として、労働者による休暇の請求や使用者の<b>承認の観念を容れる余地はない</b>とした。前半は正しい", "B ○【過去問】令和5年 問7D", "<b>C ✕</b>【過去問】令和6年 問6D（正しい肢）。半日単位で取得した分は「日数」に<b>含まれる</b>。含まれないのは時間単位で取得した分", "<b>D ✕</b>【過去問】令和8年 問6E（正しい肢）の逆。退職手当が支給されていても通算される", "<b>E ✕</b>【過去問】令和8年 問6A（正しい肢）の逆。労使協定は必要だが、届出は不要"], "key": "05-10"}, {"type": "cloze", "no": 11, "topic": "選択式", "stem": "次の文中の［ A ］〜［ E ］の部分を選択肢の中の最も適切な語句で埋め、完全な文章とせよ。", "passage": ["1　最高裁判所は、賃金債権の譲渡について、「労働者が賃金の支払を受ける前に賃金債権を他に譲渡した場合においても、その支払についてはなお同条〔労働基準法第24条〕が適用され、使用者は直接労働者に対し賃金を支払わなければならず、したがつて、右賃金債権の譲受人は自ら使用者に対してその支払を求めることは［ A ］」と判示した。", "2　最高裁判所は、ビル管理会社の従業員の仮眠時間について、従業員が労働契約に基づき仮眠室における待機と警報や電話等に対して直ちに相当の対応をすることを義務付けられているなどの事実関係の下においては、実作業に従事していない時間も含め全体として従業員が使用者の［ B ］に置かれているものであり、労働基準法第32条の労働時間に当たるとした。", "3　最高裁判所は、年次有給休暇の時季変更権について、勤務割による勤務体制がとられている事業場において、「使用者としての［ C ］をすれば、勤務割を変更して代替勤務者を配置することが客観的に可能な状況にあると認められるにもかかわらず、使用者がそのための配慮をしないことにより代替勤務者が配置されないときは、必要配置人員を欠くものとして事業の正常な運営を妨げる場合に当たるということはできない」と判示した。", "4　使用者の責に帰すべき事由による休業の場合においては、使用者は、休業期間中当該労働者に、その平均賃金の［ D ］以上の手当を支払わなければならない。", "5　労働基準法第37条第3項に基づくいわゆる代替休暇を与えることができる期間は、延長して労働させた時間が1か月について60時間を超えた当該1か月の末日の翌日から［ E ］以内の範囲内で、労使協定で定めた期間とされている。"], "options": [{"mark": "①", "text": "許されない"}, {"mark": "②", "text": "妨げられない"}, {"mark": "③", "text": "権利の濫用となる"}, {"mark": "④", "text": "使用者の承諾を要する"}, {"mark": "⑤", "text": "管理監督下"}, {"mark": "⑥", "text": "指揮命令下"}, {"mark": "⑦", "text": "支配領域内"}, {"mark": "⑧", "text": "拘束時間内"}, {"mark": "⑨", "text": "最大限の努力"}, {"mark": "⑩", "text": "相当の注意"}, {"mark": "⑪", "text": "通常の配慮"}, {"mark": "⑫", "text": "合理的な調整"}, {"mark": "⑬", "text": "100分の50"}, {"mark": "⑭", "text": "100分の60"}, {"mark": "⑮", "text": "100分の80"}, {"mark": "⑯", "text": "3分の2"}, {"mark": "⑰", "text": "1か月"}, {"mark": "⑱", "text": "2か月"}, {"mark": "⑲", "text": "3か月"}, {"mark": "⑳", "text": "6か月"}], "answers": {"A": "①", "B": "⑥", "C": "⑪", "D": "⑭", "E": "⑱"}, "answerText": "<b>A ① 許されない ／ B ⑥ 指揮命令下 ／ C ⑪ 通常の配慮 ／ D ⑭ 100分の60 ／ E ⑱ 2か月</b>", "explain": ["A【過去問・判決】令和4年 問6エ（誤りの記述）が引用した判決の前半部分。小倉電話局事件（最三小判 昭43.3.12）", "B【判決】大星ビル管理事件（最一小判 平14.2.28）の裁判要旨", "C【過去問】令和5年 問7D（正しい肢）が引用した判決", "D【条文】第26条", "E【過去問】令和4年 問7D（正しい肢）"], "key": "05-11"}]}, {"id": "06", "title": "健保 第1回", "subject": "健康保険法", "questions": [{"type": "choice", "no": 1, "topic": "被保険者・被扶養者", "stem": "健康保険法の被扶養者に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "年収500万円の被保険者と同居している妻（令和8年4月1日現在22歳の大学生であって障害者ではない。）の年間の見込収入額が140万円である場合、当該妻は、主としてその被保険者により生計を維持する者として被扶養者に認定されない。"}, {"label": "B", "text": "年収700万円の被保険者と別居している子（令和8年4月1日現在20歳の大学生であって障害者ではない。）が、被保険者から年間200万円の援助を受けて生活しており、年間の見込収入額が140万円である場合、当該子は被扶養者に認定されない。"}, {"label": "C", "text": "年収300万円の被保険者と同居している母（57歳、障害者ではない。）が、年額90万円の遺族年金を受給しながらパートタイム労働者として勤務し（健康保険の被保険者ではない。）、その給与の年間収入額が100万円である場合、母は当該被保険者の被扶養者になることができる。"}, {"label": "D", "text": "被保険者の配偶者で届出をしていないが事実上婚姻関係と同様の事情にあるものの父母及び子であって、その被保険者と同一の世帯に属し、主としてその被保険者により生計を維持するものは被扶養者となるが、その配偶者が死亡したときは、引き続き同一の世帯に属し生計を維持されていても、被扶養者でなくなる。"}, {"label": "E", "text": "独立して生計を営んでいた子が、健康保険法の適用を受けない事業所に勤務するうち疾病のため失業し、被保険者である父に扶養されるようになった場合、当該子は従前独立して生計を営んでいた者であるから、父の被扶養者とはならない。"}], "answer": "A", "answerText": "<b>正解 A</b>", "explain": ["A ○【過去問】令和8年 問8D。19歳以上23歳未満の者の収入基準（150万円未満）は<b>配偶者を除く</b>ので、妻には130万円未満の基準が適用される。令和8年は「認定される」として誤り", "<b>B ✕</b>【過去問】令和8年 問8E（正しい肢）と同じ型。19歳以上23歳未満の子は150万円未満が基準で、援助額より収入が少ないので認定される", "<b>C ✕</b>【過去問】令和7年 問10D（正しい肢）と同じ型。年金と給与の合計（190万円）が130万円以上なので被扶養者になれない", "<b>D ✕</b>【過去問】令和8年 問8C（正しい肢）の逆。配偶者の死亡後も被扶養者である", "<b>E ✕</b>【過去問】令和8年 問1D（誤りの肢）と同じ論点。被扶養者となり、家族療養費が支給される"], "key": "06-1"}, {"type": "choice", "no": 2, "topic": "被保険者・被扶養者", "stem": "健康保険法の被保険者の資格等に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "被保険者について、事実上の使用関係がなく、かつ、休業手当も支給されていない場合には、雇用契約が存続していても、被保険者の資格を喪失する。"}, {"label": "B", "text": "任意継続被保険者となった者が、他の被保険者の被扶養者となる要件を満たすに至った場合、その要件を満たした日の翌日に、任意継続被保険者の資格を喪失する。"}, {"label": "C", "text": "任意継続被保険者の申出は、被保険者の資格を喪失した日から20日以内にしなければならず、被保険者が法律を知らなかったことは、この期間を経過した後の申出を受理することができる正当な理由には当たらない。"}, {"label": "D", "text": "初めて特定適用事業所となった適用事業所の事業主は、当該事実があった日から5日以内に、所定の事項を記載した届書を厚生労働大臣又は健康保険組合に提出しなければならない。"}, {"label": "E", "text": "短時間労働者の被保険者資格の取得について、常時50人を超えると見込んで特定適用事業所該当届を提出して適用された後、実際には常時50人を超えなかった場合であっても、遡及して取り消されることはない。"}], "answer": "B", "answerText": "<b>正解 B</b>", "explain": ["A ○【過去問】令和8年 問2Aは、雇用契約が存続する場合には資格を喪失しないとして誤り", "<b>B ✕</b>【過去問＋AI】令和8年 問2Dは「その日に資格を喪失する」として誤り。被扶養者の要件を満たしただけでは資格を喪失しない（資格喪失の申出をした場合は、申出が受理された日の属する月の末日の翌日に喪失する、という部分はAIの知識）", "C ○【過去問】令和8年 問2Cは、法律の不知を正当な理由として受理できるとして誤り", "D ○【過去問】令和7年 問2エ", "E ○【過去問】令和7年 問7Dは「遡及取消となる」として誤り"], "key": "06-2"}, {"type": "choice", "no": 3, "topic": "標準報酬", "stem": "健康保険法の標準報酬に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "定時決定の規定は、6月1日から7月1日までの間に被保険者の資格を取得した者にも適用され、当該者の標準報酬月額は、その年の9月から翌年の8月までの各月の標準報酬月額とされる。"}, {"label": "B", "text": "標準報酬月額の定時決定等における支払基礎日数の取扱いとして、月給者で欠勤日数分に応じ給与が差し引かれる場合にあっては、その月における暦日の数から当該欠勤日数を控除した日数を支払基礎日数とする。"}, {"label": "C", "text": "被保険者が令和8年1月1日に職場復帰し、育児休業等終了時改定に該当した場合、改定後の標準報酬月額は、令和9年8月までの各月の標準報酬月額となる。なお、随時改定には該当しないものとする。"}, {"label": "D", "text": "事業主は、同一月に2回以上賞与等の支払を行う場合であっても、それぞれの賞与等を支払った日から5日以内に、その都度、健康保険被保険者賞与支払届を提出しなければならない。"}, {"label": "E", "text": "保険者等は、被保険者の資格を取得した者があるときは、日、時間、出来高又は請負によって報酬が定められる場合には、被保険者の資格を取得した月前1か月間に当該事業所において、同様の業務に従事し、かつ、同様の報酬を受ける者が受けた報酬の額を平均した額を報酬月額として、標準報酬月額を決定する。"}], "answer": "E", "answerText": "<b>正解 E</b>", "explain": ["<b>A ✕</b>【過去問】令和8年 問10A（正しい肢）の逆。6月1日から7月1日までに資格を取得した者には定時決定は適用されず、資格取得時の標準報酬月額が翌年8月まで用いられる", "<b>B ✕</b>【過去問】令和8年 問10C（誤りの肢）と同じ論点。就業規則等に基づき事業所が定めた日数から欠勤日数を控除する", "<b>C ✕</b>【過去問】令和7年 問9オ（正しい記述）は、1月に職場復帰した場合「その年の8月まで」", "<b>D ✕</b>【過去問】令和8年 問2E（正しい肢）の逆。同一月に2回以上支払う場合は、最後の支払後5日以内に合算して一括して届け出て差し支えない", "E ○【過去問】令和8年 問4E"], "key": "06-3"}, {"type": "choice", "no": 4, "topic": "保険給付", "stem": "健康保険法の保険給付に関する次のアからオまでの記述のうち、誤っているものの組合せは、後記AからEまでのうちどれか。", "statements": [{"label": "ア", "text": "患者申出療養とは、高度の医療技術を用いた療養であって、当該療養を受けようとする者の申出に基づき、療養の給付の対象とすべきものであるか否かについて、適正な医療の効率的な提供を図る観点から評価を行うことが必要な療養として厚生労働大臣が定めるものをいう。"}, {"label": "イ", "text": "被保険者が保険医療機関に入院している場合における食事の提供は、医療の一環として行われるものであるから、健康保険法第63条第1項に定める療養の給付として行われる。"}, {"label": "ウ", "text": "保険者は、療養の給付等を行うことが困難であると認めるとき、又は被保険者が保険医療機関等以外の病院、診療所、薬局その他の者から診療、薬剤の支給若しくは手当を受けた場合において、保険者がやむを得ないものと認めるときは、療養の給付等に代えて、療養費を支給することができる。"}, {"label": "エ", "text": "療養費の支給対象となる柔道整復師の施術において、脱臼又は骨折に対する施術については、応急手当をする場合を除き、医師の同意を得たものでなければならず、当該医師の同意は、患者を診察した上で書面により与えられたものでなければならない。"}, {"label": "オ", "text": "選定療養において、後発医薬品のある先発医薬品（長期収載品）の処方を希望する場合、当該先発医薬品の薬価から後発医薬品の薬価を控除して得た価格に4分の1を乗じて得た価格を基に算定した額を支払わなければならず、後発医薬品がいくつか存在する場合は、薬価が一番高い後発医薬品との価格差により計算する。"}], "choices": [{"label": "A", "text": "（アとウ）"}, {"label": "B", "text": "（アとオ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（イとオ）"}, {"label": "E", "text": "（ウとエ）"}], "answer": "C", "answerText": "<b>正解 C（イとエ）</b>", "explain": ["ア ○【過去問】令和7年 問2オ", "<b>イ ✕</b>【過去問】令和8年 問9オ（誤りの記述）と同じ論点。入院時の食事は療養の給付ではなく、入院時食事療養費として支給される", "ウ ○【過去問】令和8年 問1C", "<b>エ ✕</b>【過去問】令和7年 問5B（誤りの肢）と同じ論点。医師の同意は必要だが、書面によることまでは要しない", "オ ○【過去問】令和7年 問8E"], "key": "06-4"}, {"type": "choice", "no": 5, "topic": "保険給付", "stem": "健康保険法の傷病手当金及び出産に関する給付についての次のアからオまでの記述のうち、正しいものはいくつあるか。", "statements": [{"label": "ア", "text": "被保険者が就業時間内において私傷病により救急搬送され、そのまま入院した場合、傷病手当金の待期期間の起算日は、その翌日となる。"}, {"label": "イ", "text": "被保険者が療養のため本来の職場における労務に服することができない場合において、本来の職場における労務に対する代替的性格をもたない副業の労務に従事して賃金を得ているときであっても、そのことのみをもって傷病手当金が支給されないこととはならない。"}, {"label": "ウ", "text": "被保険者（任意継続被保険者を除く。）が傷病手当金を受給している期間中に65歳に達し、老齢を支給事由とする年金たる給付の支給を受けることができるときは、当該被保険者が在職中であっても、傷病手当金は支給されず、又は年金額との差額のみが支給される。"}, {"label": "エ", "text": "出産手当金は、出産の日（出産の日が出産の予定日後であるときは、出産の予定日）以前42日（多胎妊娠の場合においては、98日）から出産の日後56日までの間において労務に服さなかった期間に支給される。"}, {"label": "オ", "text": "妊娠4か月以上の人工妊娠中絶は、出産育児一時金の支給の対象となる。"}], "choices": [{"label": "A", "text": "一つ"}, {"label": "B", "text": "二つ"}, {"label": "C", "text": "三つ"}, {"label": "D", "text": "四つ"}, {"label": "E", "text": "五つ"}], "answer": "C", "answerText": "<b>正解 C（三つ：イ・エ・オ）</b>", "explain": ["<b>ア ✕</b>【過去問】令和7年 問9イ（誤りの記述）と同じ論点。就業時間内に労務不能となったときは、その日が起算日となる", "イ ○【過去問】令和8年 問6Bは、このような場合は支給されないとして誤り", "<b>ウ ✕</b>【過去問】令和8年 問9ウ（誤りの記述）と同じ論点。老齢退職年金給付との調整は、資格喪失後の継続給付を受ける者が対象で、在職中の被保険者は対象でない", "エ ○【過去問】令和8年 問6D", "オ ○【過去問】令和8年 問3A"], "key": "06-5"}, {"type": "choice", "no": 6, "topic": "保険給付", "stem": "健康保険法の高額療養費及び一部負担金に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "同一の月に同一の保険医療機関において、入院して手術を受け、退院後に外来で受診した場合、高額療養費の算定上、当該入院と外来は同一の保険医療機関で受けた一の療養とみなされ、合算して自己負担限度額と比較される。"}, {"label": "B", "text": "全国健康保険協会が管掌する健康保険の被保険者が同一月内に健康保険組合が管掌する健康保険の被保険者となった場合の高額療養費は、同一の病院で受けた療養の給付であっても、それぞれの管掌者ごとに支給対象となるか否かを判断する。"}, {"label": "C", "text": "高額療養費の時効起算日は、診療月の翌月の1日であり、傷病が月の途中で治癒した場合においても同様である。ただし、診療費の自己負担分を診療月の翌月以後に支払ったときは、支払った日の翌日が起算日となる。"}, {"label": "D", "text": "マイナ保険証により保険資格の確認を行う場合には、医療機関等の窓口において限度額適用認定証等を提示しなくても、自己負担限度額を超える一部負担金の支払が免除される。"}, {"label": "E", "text": "保険者は、震災、風水害、火災等の災害により財産について著しい損害を受けた被保険者であって、一部負担金を支払うことが困難であると認められるものに対し、一部負担金の徴収を猶予することができるが、この徴収猶予は、当該被保険者の申請により、6か月以内の期間を限って行うものとされている。"}], "answer": "A", "answerText": "<b>正解 A</b>", "explain": ["<b>A ✕</b>【過去問】令和7年 問10B（誤りの肢）と同じ論点。同一の保険医療機関でも、入院と外来は別個に取り扱う", "B ○【過去問】令和8年 問8B", "C ○【過去問】令和8年 問1B", "D ○【過去問】令和7年 問6E", "E ○【過去問】令和7年 問10A"], "key": "06-6"}, {"type": "choice", "no": 7, "topic": "保険給付", "stem": "健康保険法の保険給付に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "保険者は、被保険者又は被保険者であった者の被扶養者が、正当な理由なしに療養に関する指示に従わないときは、当該被扶養者に係る保険給付の全部又は一部を行わないことができる。"}, {"label": "B", "text": "被保険者の資格を喪失した後も引き続き傷病手当金を受給していた者が、当該傷病手当金を受けなくなった日後3か月以内に死亡したときは、被保険者であった者により生計を維持していた者であって埋葬を行うものは埋葬料の支給を受けることができ、埋葬料の支給を受けるべき者がない場合には、埋葬を行った者が、埋葬料の金額の範囲内においてその埋葬に要した費用に相当する金額の支給を受けることができる。"}, {"label": "C", "text": "被保険者の被扶養者が死亡したときは家族埋葬料が支給されるが、死産児についても法律上埋葬を必要とすることから、死産の場合には、埋葬の事実に基づいて家族埋葬料が支給される。"}, {"label": "D", "text": "被保険者の自殺による死亡は故意に基づく事故であるから、自殺による死亡については、埋葬料は支給されない。"}, {"label": "E", "text": "高齢受給者証の交付を受けている者の一部負担金の割合について、随時改定により標準報酬月額が変更になり負担割合も変更となる場合、負担割合が変更になるのは、改定後の標準報酬月額が適用される月の翌月からである。"}], "answer": "B", "answerText": "<b>正解 B</b>", "explain": ["<b>A ✕</b>【過去問】令和7年 問8D（誤りの肢）と同じ論点。療養に関する指示に従わないときは、保険給付の「一部」を行わないことができる（令和8年 問1Aも同旨）", "B ○【過去問】令和7年 問9エ", "<b>C ✕</b>【過去問】令和8年 問2B（誤りの肢）と同じ論点。死産児は被扶養者ではないので、家族埋葬料は支給されない", "<b>D ✕</b>【過去問】令和7年 問6C（誤りの肢）と同じ論点。自殺による死亡でも埋葬料は支給される", "<b>E ✕</b>【過去問】令和8年 問3D（誤りの肢）と同じ論点。改定後の標準報酬月額が<b>適用される月から</b>変更になる"], "key": "06-7"}, {"type": "choice", "no": 8, "topic": "保険料・費用", "stem": "健康保険法の保険料及び費用の負担に関する次のアからオまでの記述のうち、誤っているものの組合せは、後記AからEまでのうちどれか。", "statements": [{"label": "ア", "text": "被保険者に関する毎月の保険料は、翌月末日までに納付しなければならないが、任意継続被保険者に関する保険料については、その月の10日（初めて納付すべき保険料については、保険者が指定する日）までに納付しなければならない。"}, {"label": "イ", "text": "日雇特例被保険者が1日において2以上の事業所に使用される場合においては、その者を使用するそれぞれの事業主が、その者及び自己の負担すべきその日の標準賃金日額に係る保険料を納付する義務を負う。"}, {"label": "ウ", "text": "健康保険組合は、被保険者が介護保険第2号被保険者に該当していない場合であっても、規約で定めるところにより、当該被保険者に介護保険第2号被保険者である被扶養者がある場合には、当該被保険者に関する保険料額を一般保険料額と介護保険料額との合算額とすることができる。"}, {"label": "エ", "text": "法人である納付義務者が解散したとき、又は納付義務者について競売の開始があったときは、保険者は、納期前であっても、すべての保険料を徴収することができる。"}, {"label": "オ", "text": "国庫は、予算の範囲内において、健康保険事業の執行に要する費用のうち、特定健康診査等の実施に要する費用の全部を補助することができる。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとエ）"}, {"label": "C", "text": "（イとオ）"}, {"label": "D", "text": "（ウとエ）"}, {"label": "E", "text": "（ウとオ）"}], "answer": "C", "answerText": "<b>正解 C（イとオ）</b>", "explain": ["ア ○【過去問】令和8年 問9ア", "<b>イ ✕</b>【過去問】令和7年 問3C（誤りの肢）と同じ論点。1日に2以上の事業所に使用される場合は、<b>初めにその者を使用する事業主</b>が納付義務を負う", "ウ ○【過去問】令和7年 問2イ（特定被保険者）", "エ ○【過去問】令和8年 問6C", "<b>オ ✕</b>【過去問】令和7年 問6A（誤りの肢）と同じ論点。補助できるのは費用の「一部」"], "key": "06-8"}, {"type": "choice", "no": 9, "topic": "保険者", "stem": "健康保険組合に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "健康保険組合には議決機関として組合会が置かれ、組合会議員の任期は5年とし、補欠の組合会議員の任期は、前任者の残任期間とする。"}, {"label": "B", "text": "健康保険組合の規約の変更は、その内容にかかわりなく、厚生労働大臣の認可を受けなければ、その効力を生じない。"}, {"label": "C", "text": "保険者が健康保険組合である場合においては、健康保険法第52条各号に掲げる保険給付に併せて、理事の定数の2分の1以上の同意があれば、保険給付としてその他の給付を行うことができる。"}, {"label": "D", "text": "健康保険組合は、支払上現金に不足を生じたときは、準備金に属する現金を繰替使用し、又は一時借入金をすることができるが、この繰替使用した金額及び一時借入金は、当該会計年度内に返還しなければならない。"}, {"label": "E", "text": "健康保険組合は、毎年度、収入支出の予算を作成し、当該年度の開始前に厚生労働大臣に届け出なければならず、また、毎月の事業状況を翌月末日までに管轄地方厚生局長等に報告しなければならない。"}], "answer": "D", "answerText": "<b>正解 D</b>", "explain": ["<b>A ✕</b>【過去問＋AI】令和7年 問1A（誤りの肢）と同じ論点。組合会議員の任期は3年を超えない範囲内（3年という数字はAIの知識）", "<b>B ✕</b>【過去問】令和8年 問5イ（誤りの記述）と同じ論点。事務所の所在地など一定の事項の変更は、認可ではなく届出で足りる", "<b>C ✕</b>【過去問】令和8年 問5ウ（誤りの記述）と同じ論点。付加給付は「規約で定めるところにより」行う", "D ○【過去問】令和8年 問5エ", "<b>E ✕</b>【過去問】令和8年 問5ア（正しい記述）は、毎月の事業状況を「翌月20日まで」に報告"], "key": "06-9"}, {"type": "choice", "no": 10, "topic": "届出・不服申立て", "stem": "健康保険法の届出、不服申立て等に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "事業主は、被保険者の資格の取得及び喪失の確認又は標準報酬の決定若しくは改定の通知があったときは、速やかに、これを被保険者又は被保険者であった者に通知しなければならない。"}, {"label": "B", "text": "保険料等の賦課若しくは徴収の処分又は滞納処分に不服のある者は、社会保険審査会に対して審査請求をすることができる。"}, {"label": "C", "text": "任意継続被保険者は、氏名又は住所を変更したときは、5日以内に、変更前及び変更後の氏名又は住所を保険者に届け出なければならない。"}, {"label": "D", "text": "事業主は、健康保険法の規定に基づいて事業主がしなければならない事項につき代理人に処理させるとき、又は代理人を解任したときは、速やかに、文書でその旨を厚生労働大臣又は健康保険組合に届け出なければならない。"}, {"label": "E", "text": "偽りその他不正の行為によって保険給付を受けた者がある場合において、事業主が虚偽の報告若しくは証明をしたため、その保険給付が行われたものであるときは、保険者は、当該事業主に対し、保険給付を受けた者に連帯して徴収金を納付すべきことを命ずることができる。"}], "answer": "D", "answerText": "<b>正解 D</b>", "explain": ["A ○【過去問】令和7年 問3D", "B ○【過去問】令和7年 問3E", "C ○【過去問】令和8年 問7E", "<b>D ✕</b>【過去問＋AI】令和7年 問4C（誤りの肢）と同じ論点。代理人に処理させるとき、又は解任したときは「<b>あらかじめ</b>」届け出る（「あらかじめ」という語はAIの知識）", "E ○【過去問】令和7年 問3B"], "key": "06-10"}]}, {"id": "R08-1", "title": "R8本試験 労基・安衛", "subject": "労働基準法・安衛法", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和8年度（第58回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和8年4月10日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和8年度本試験", "stem": "労働基準法の総則（第1条～第12条）等に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働基準法第3条が禁止する「差別的取扱」をするとは、当該労働者を不利に取り扱うことをいい、有利に取り扱うことは含まれない。"}, {"label": "B", "text": "労働基準法第87条第1項によれば、土木、建築その他工作物の建設、改造、保存、修理、変更、破壊、解体又はその準備の事業が数次の請負によって行われる場合においては、災害補償については、その元請負人が使用者とみなされる。"}, {"label": "C", "text": "交通従業員の制服、工員の作業衣等業務上必要な被服は作業備品であるため、労働基準法第11条にいう賃金から除外されると解される。"}, {"label": "D", "text": "使用者の責めに帰すべき事由によって休業した期間の日数及びその期間中の賃金は、労働基準法第12条に定める平均賃金を算定する際の期間及び賃金の総額から控除される。"}, {"label": "E", "text": "使用者は、労働基準法施行規則第6条の2第1項にいう過半数代表者が、労働基準法に規定する協定等に関する事務を円滑に遂行することができるよう必要な配慮を行わなければならず、これには例えば、過半数代表者が労働者の意見集約等を行うに当たって必要となる事務機器やシステム、事務スペースの提供を行うことが含まれると解される。"}], "answer": "A", "key": "R08-1-1", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和8年度本試験", "stem": "労働基準法に定める労働契約等に関する次の記述のうち、正しいものはいくつあるか。", "statements": [{"label": "ア", "text": "労働者は、民法第95条により、労働契約の締結に際し、「錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるとき」は、当該契約を取り消すことができるが、労働基準法第15条によれば、そのような場合に該当しないときであっても、単に明示された労働条件と事実が相違することのみをもって即時に労働契約を解除することができる。"}, {"label": "イ", "text": "労働基準法第16条の禁止する損害賠償額の予定は、労働契約の不履行に伴う損害賠償に限られ、不法行為の場合における損害賠償は含まれないと解される。"}, {"label": "ウ", "text": "労働基準法第17条は、使用者の側で行う前借金その他労働することを条件とする前貸しの債権と賃金の相殺を禁止しており、実質的にみて使用者の強制によるものと認められない限り、労働者が自己の意思によって相殺をすることは禁止されていない。"}, {"label": "エ", "text": "業務上負傷して療養していた労働者が、完全に治癒したのではないが、稼働し得る程度に回復したので出勤し、元の職場で平常通り稼働していたところ、使用者が就業後30日を経過してこの労働者を労働基準法第20条に定める解雇予告手当を支給して即時解雇することは、同法第19条に定める解雇制限に違反すると解される。"}, {"label": "オ", "text": "使用者が労働基準法第20条所定の予告期間をおかず、また予告手当の支払をしないで労働者に解雇の通知をした場合、その通知は、即時解雇としては効力を生じないが、使用者が即時解雇を固執する趣旨でない限り、通知後同条所定の30日の期間を経過するか、又は予告手当の支払をしたときに解雇の効力を生ずるものと解すべきであるとするのが、最高裁判所の判例である。"}], "choices": [{"label": "A", "text": "一つ"}, {"label": "B", "text": "二つ"}, {"label": "C", "text": "三つ"}, {"label": "D", "text": "四つ"}, {"label": "E", "text": "五つ"}], "answer": "C", "key": "R08-1-2", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和8年度本試験", "stem": "労働基準法に定める賃金等に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "9月1日に当該年の1月からの新給与を決定し、遡及支払を行う場合、同年1月以降同年8月31日までの退職者については賃金差額を支給しないと規定することは、労働基準法第24条違反となると解される。"}, {"label": "B", "text": "使用者は、労働者の同意を得た場合には、賃金の支払について、当該労働者が指定する銀行その他の金融機関に対する当該労働者の預金又は貯金への振込みによることができるが、例えば、所定の賃金支払日が毎月15日である企業において、「振込み」は、振り込まれた賃金の全額が当該振り込まれた月の末日までに払い出し得るように行われることを要すると解される。"}, {"label": "C", "text": "労働基準法第24条第1項により、「事業場の労働者の過半数で組織する労働組合があるときはその労働組合、労働者の過半数で組織する労働組合がないときは労働者の過半数を代表する者との書面による協定がある場合においては、賃金の一部を控除して支払うことができる」ため、当該協定がある場合には、購買代金、社宅、寮その他の福利、厚生施設の費用、社内預金、組合費等、事理明白なもののほか、実物給与として支給した部分の金額も賃金から控除することが認められると解される。"}, {"label": "D", "text": "賃金は、毎月1回以上支払わなければならないが、「毎月」とは、暦に従うものと解されるから、毎月1日から月末までの間に少なくとも1回は賃金を支払わなければならない。"}, {"label": "E", "text": "労働基準法第24条第1項に定める直接払の原則に違反して、使用者が労働者の代理人に賃金を支払った場合でも、代理受領者が労働者本人に賃金全額を渡したときには、当該労働者が現実に利益を得た限度で民事上有効な弁済となり、その限度で使用者は二重払に応ずる必要はなく、同条違反の刑事責任を免れる。"}], "answer": "D", "key": "R08-1-3", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和8年度本試験", "stem": "労働基準法第32条の4に定めるいわゆる1年単位の変形労働時間制に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "1年単位の変形労働時間制に係る労使協定において、労使双方が合意すれば協定期間中であっても同変形労働時間制の一部を変更することがある旨が明記されていれば、これに基づき、労使協定において特定された日又は週の労働時間を労働基準法第32条の4第1項第2号に規定する対象期間（以下本問において「対象期間」という。）の途中で変更することができる。"}, {"label": "B", "text": "使用者は、1年単位の変形労働時間制の適用労働者が対象期間中に育児休業や産前産後の休業により労働せず、実際の労働期間が対象期間よりも短い者について、当該労働させた期間を平均し1週間当たり40時間を超えて労働させた場合においては、その超えた時間（労働基準法第33条又は第36条第1項の規定により延長し、又は休日に労働させた時間を除く。）の労働については、労働基準法第37条の規定の例により割増賃金を支払わなければならない。"}, {"label": "C", "text": "1年単位の変形労働時間制において、対象期間において連続して労働させることができる日数の限度は、労働基準法第32条の4第1項の協定により同項第3号に規定する特定期間として定められた期間を含め、6日である。"}, {"label": "D", "text": "使用者は、1年単位の変形労働時間制により労働者に労働させる場合には、就業規則その他これに準ずるもの又は書面による協定（労使委員会の決議及び労働時間等設定改善委員会の決議を含む。）において、対象期間の起算日を明らかにするものとされている。"}, {"label": "E", "text": "使用者は、満15歳以上で満18歳に満たない者について、1日10時間、1週52時間の範囲内で1年単位の変形労働時間制によって労働させることができる。"}], "answer": "D", "key": "R08-1-4", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和8年度本試験", "stem": "下記の労働条件で勤務する労働者について、労働基準法第37条に定める割増賃金を計算するに当たり、労働基準法施行規則第19条に定める割増賃金の基礎となる賃金の定めに従えば、通常の労働時間1時間当たりの賃金額を求める計算式のうち、正しいものはどれか。なお、当該労働者は、18歳未満の子を2人扶養している。<br>当該労働者の労働条件<br>賃金：基本給が月額400,000円。通勤手当が月額10,000円。なお、本事業場では、通勤手当は、通勤距離にかかわらずこの額が一律に支給される。住宅手当が月額20,000円。なお、本事業場では、住宅手当は、賃貸住宅居住者には月額20,000円、持家居住者には月額15,000円が支給される。生活手当が月額16,000円。なお、本事業場では、生活手当は、18歳未満の子を扶養している場合には1人につき月額8，000円が支給される。<br>年間労働日数：250日<br>所定労働時間：午前9時30分から午後5時30分まで<br>休憩時間：正午から1時間", "statements": [], "choices": [{"label": "A", "text": "（400,000円+10,000円）÷（250×7÷12）"}, {"label": "B", "text": "（400,000円+20,000円）÷（250×7÷12）"}, {"label": "C", "text": "（400,000円+10,000円+20,000円）÷（250×7÷12）"}, {"label": "D", "text": "400,000円÷（250×7÷12）"}, {"label": "E", "text": "（400,000円+10,000円+20,000円+16,000円）÷（250×7÷12）"}], "answer": "C", "key": "R08-1-5", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和8年度本試験", "stem": "労働基準法に定める年次有給休暇に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "使用者は、時間を単位として有給休暇を与えるためには、事業場に労働者の過半数で組織する労働組合があるときはその労働組合、労働者の過半数で組織する労働組合がないときは労働者の過半数を代表する者との書面による協定により所定の事項を定める必要があるが、その協定は労働基準監督署長へ届け出る必要はない。"}, {"label": "B", "text": "労働基準法第39条第3項に規定する労働者に該当するパートタイム従業員について、同条第7項に規定する基準日（以下本問において「基準日」という。）から次の基準日までの間に週所定労働日数が変更された場合、当該変更時点において、有給休暇の付与日数は増減されるものではない。"}, {"label": "C", "text": "使用者は、労働基準法の規定により有給休暇を与えたときは、時季、日数及び基準日を労働者ごとに明らかにした年次有給休暇管理簿を作成し、当該有給休暇を与えた期間中及び当該期間の満了後2年間保存しなければならない。"}, {"label": "D", "text": "時間単位の有給休暇についても、使用者の時季変更権の対象となるものであるが、使用者は、労働者が時間単位による取得を請求した場合に日単位に変更することや、日単位による取得を請求した場合に時間単位に変更することは、時季変更に当たらず、認められない。"}, {"label": "E", "text": "定年退職による退職者を引き続き嘱託社員として同一事業場で再採用している場合には、所定の退職手当が支給されている場合であっても、有給休暇に係る継続勤務年数の算定に当たっては勤務年数が通算される。ただし、退職と再採用との間に相当期間が存し、客観的に労働関係が断続していると認められる場合はこの限りではない。"}], "answer": "C", "key": "R08-1-6", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和8年度本試験", "stem": "労働基準法に定める就業規則に関する次のアからオまでの記述のうち、誤っているものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "常時10人以上の労働者を使用する使用者は、就業規則の作成について、事業場に労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者の意見を聴き、就業規則の届出には、その意見を記した書面を添付しなければならないが、当該書面の内容が当該就業規則に全面的に反対するものであっても、その効力の発生についての他の要件を具備する限り、就業規則の効力には影響はない。"}, {"label": "イ", "text": "派遣労働者については、労働基準法第89条により就業規則の作成義務を負うのは、派遣中の労働者とそれ以外の労働者とを合わせて常時10人以上の労働者を使用している派遣元の使用者である。"}, {"label": "ウ", "text": "育児介護休業法による介護休業についても、介護休業の対象となる労働者の範囲等の付与要件、介護休業取得に必要な手続、休業期間については就業規則に記載される必要があるが、同法においては、介護休業の対象者、申出手続、介護休業期間等が具体的に定められているので、同法の定めるところにより介護休業を与える旨の定めがあれば、就業規則への記載義務は満たしていると解される。"}, {"label": "エ", "text": "複数の事業場を有する企業が、全事業場で同一の就業規則を適用するため、本社で一括して就業規則の作成等を行い、各事業場分の届出を本社の所轄労働基準監督署長へ一括して行う場合において、本社及び各事業場に労働組合がないときは、労働基準法第90条第2項に規定する書面について、本社の労働者の過半数を代表する者の意見を記したもののみを添付すればよい。"}, {"label": "オ", "text": "就業規則で労働者に対して減給の制裁を定める場合、その減給は1回の額が平均賃金の1日分の半額を超え、総額が一賃金支払期における賃金の総額の10分の1を超えてはならないとされているが、この計算の基礎となる平均賃金を算定すべき事由の発生した日とは、当該減給の制裁事由が発生した日である。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとウ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（ウとオ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "E", "key": "R08-1-7", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和8年度本試験", "stem": "労働安全衛生法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働安全衛生法において労働災害とは、業務又は通勤に起因して、労働者が負傷し、疾病にかかり、又は死亡することをいう。"}, {"label": "B", "text": "労働安全衛生法において労働者とは、労働基準法第9条に規定する労働者（同居の親族のみを使用する事業又は事務所に使用される者及び家事使用人を除く。）及び特定受託事業者に係る取引の適正化等に関する法律（令和5年法律第25号、いわゆるフリーランス法）第2条に定める特定受託事業者をいう。"}, {"label": "C", "text": "労働安全衛生法において事業者とは、事業を行う者で、労働者を使用するもの及び事業の経営担当者その他その事業の労働者に関する事項について、事業主のために行為をするすべての者をいう。"}, {"label": "D", "text": "労働安全衛生法において特定元方事業者とは、同法第15条において定める元方事業者のうち、建設業、造船業又は製鉄業に属する事業を行う者をいう。"}, {"label": "E", "text": "労働安全衛生法において作業環境測定とは、作業環境の実態を把握するため空気環境その他の作業環境について行うデザイン、サンプリング及び分析（解析を含む。）をいう。"}], "answer": "E", "key": "R08-1-8", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和8年度本試験", "stem": "労働安全衛生法に定める安全衛生教育に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "事業者は、労働者を雇い入れたときは、当該労働者に対し、厚生労働省令で定めるところにより、その従事する業務に関する安全又は衛生のための教育（以下本問において「雇入れ時の安全衛生教育」という。）を行わなければならないが、派遣労働者の場合は、派遣先の事業者に、当該派遣労働者を受け入れるに際してこの教育を行う義務があるとされている。"}, {"label": "B", "text": "金融業を営む事業者は、労働安全衛生規則に定める雇入れ時の安全衛生教育を行うことを義務付けられていない。"}, {"label": "C", "text": "雇入れ時の安全衛生教育を行わなければならない対象労働者は、常時使用する労働者であって、臨時に雇い入れた労働者についてはその対象としないことが認められている。"}, {"label": "D", "text": "雇入れ時の安全衛生教育の規定は、労働者の作業内容を変更したときについて準用される。"}, {"label": "E", "text": "危険又は有害な業務で、厚生労働省令で定めるものに労働者をつかせるときに、厚生労働省令で定めるところにより、当該業務に関する安全又は衛生のための特別の教育を行う義務は、常時10人以上の労働者を使用する事業者に課せられている。"}], "answer": "D", "key": "R08-1-9", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和8年度本試験", "stem": "労働安全衛生法に定める健康診断に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働安全衛生規則第43条に定める雇入時の健康診断は、採用選考時の健康診断ではなく、常時使用する労働者を雇い入れた際における適正配置、入職後の健康管理に資するためのものであるとされている。"}, {"label": "B", "text": "労働安全衛生規則第44条に定める定期健康診断は、業務遂行との関連において行われるものではないので、その受診のために要した費用については、事業者がこれを負担しなくてもよいとされている。"}, {"label": "C", "text": "労働安全衛生規則第45条では、特定業務従事者の健康診断として、事業者は、当該業務への配置替えの際及び6月以内ごとに1回、定期に、所定の健康診断を行わなければならないと定めているが、この特定業務には、深夜業を含む業務、重量物の取扱い等重激な業務及び病原体によって汚染のおそれが著しい業務が含まれるが、給食の業務及び高所作業を含む業務は含まれない。"}, {"label": "D", "text": "常時使用され、自ら受けた医師による健康診断（事業者の指定した医師が行う健康診断を受けることを希望しない場合において、他の医師の行う労働安全衛生法第66条の規定による健康診断に相当する健康診断を除く。）を受けた日前6月間を平均して1月当たり4回以上深夜業に従事した労働者は、自ら受けた医師による健康診断の結果を証明する書面を事業者に提出することができる。ただし、当該健康診断を受けた日から3月を経過したときは、この限りでない。"}, {"label": "E", "text": "事業者は、塩酸、硝酸、硫酸、亜硫酸、弗化水素、黄りんその他歯又はその支持組織に有害な物のガス、蒸気又は粉じんを発散する場所における業務に常時従事する労働者に対し、当該業務への配置替えの際には、歯科医師による健康診断を行わなければならない。"}], "answer": "B", "key": "R08-1-10", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R08-2", "title": "R8本試験 労災・徴収", "subject": "労災保険法", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和8年度（第58回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和8年4月10日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和8年度本試験", "stem": "次の記述のうち、業務災害として保険給付の対象となるものはいくつあるか。", "statements": [{"label": "ア", "text": "従業員が自費で任意に参加することになっていた、会社の常務取締役が引率する毎年恒例の従業員慰安旅行中に、参加者である従業員が、たまたまはしけ港において乗船していた船から艀に乗り換えた際、定員オーバーによってはしけ艀が沈没し、溺死した場合。"}, {"label": "イ", "text": "出張を命じられた労働者が、自宅から直接用務地に赴くために、通常の通勤でも使用している駅に自転車で向かっている途上の踏切で誤って転倒し、列車と衝突して死亡した場合。"}, {"label": "ウ", "text": "トラックに荷物を積載して疾走中に、荷覆シートがめくれていることに気づいた運転手が直ちに停車し、運転手助手とともにシートをかけなおしたが、そのとき強風によって運転手助手の防寒帽が国道中央に吹き飛ばされたことから、当該運転手助手が、とっさにその帽子を追って走り出たところ、前方より疾走してきた乗用車に跳ね飛ばされ死亡した場合。"}, {"label": "エ", "text": "業務上の右下腿骨骨折をした労働者が、その処置として左下腿骨より骨移植片を採取する骨移植をして入院している際に、医師の指示による歩行練習において、左下肢を伸展位で左側に捻じる状態で転倒し、骨移植片の採取によって外力に対する抵抗が減弱していた左下腿骨を骨折した場合。"}, {"label": "オ", "text": "倉庫で貨物の積込作業をしていた労働者が、地震発生直後に、身の安全を図るため急いで避難しようと倉庫から外へ出るときに、足を踏み外して負傷した場合。"}], "choices": [{"label": "A", "text": "一つ"}, {"label": "B", "text": "二つ"}, {"label": "C", "text": "三つ"}, {"label": "D", "text": "四つ"}, {"label": "E", "text": "五つ"}], "answer": "D", "key": "R08-2-1", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和8年度本試験", "stem": "労災保険法第8条第2項の規定による給付基礎日額の算定に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働者が平均賃金の算定基礎期間中に親族の疾病又は負傷等の看護のため休業した場合で、その平均賃金に相当する額（①）が、その休業した期間を平均賃金の算定基礎期間から除き、かつ、休業した期間中に受けた賃金の額を平均賃金の算定基礎期間中の賃金の額から控除して算定した平均賃金に相当する額（②）に満たないときは、②の額を給付基礎日額とする。"}, {"label": "B", "text": "労働者が平均賃金の算定基礎期間中に業務外の事由による負傷又は疾病の療養のために休業した場合には、その平均賃金に相当する額（①）が、その休業した期間を平均賃金の算定基礎期間から除き、かつ、休業した期間中に受けた賃金の額を平均賃金の算定基礎期間中の賃金の額から控除して算定した平均賃金に相当する額（②）に満たないときでも、①の額を給付基礎日額とする。"}, {"label": "C", "text": "労働者がじん肺にかかったことにより保険給付を受けることとなった場合で、その平均賃金に相当する額が、じん肺にかかったため粉じん作業以外の作業に常時従事することとなった日を平均賃金を算定すべき事由の発生した日とみなして算定することとした場合における平均賃金に相当する額に満たないときは、後者の額を給付基礎日額とする。"}, {"label": "D", "text": "1年を通じて船員法（昭和22年法律第100号）第1条に規定する船員として船舶所有者に使用される者について、基本となるべき固定給の額が乗船中において乗船本給として増加する等により変動がある賃金が定められる場合には、平均賃金を算定すべき事由の発生した日以前1年間について算定することとした場合における平均賃金に相当する額を給付基礎日額とする。"}, {"label": "E", "text": "1年を通じて船員法第1条に規定する船員として船舶所有者に使用される者については、基本となるべき固定給が下船することによりてい減する賃金を受ける場合、平均賃金を算定すべき事由の発生した日以前1年間について算定することとした場合における平均賃金に相当する額を給付基礎日額とする。"}], "answer": "B", "key": "R08-2-2", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和8年度本試験", "stem": "保険給付に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "未支給の保険給付を受けるべき同順位者が2人以上あるときは、その1人がした請求は、全員のためその全額につきしたものとみなし、その1人に対してした支給は、全員に対してしたものとみなす。"}, {"label": "B", "text": "同一の傷病に関し、休業補償給付を受けている労働者が傷病補償年金を受ける権利を有することとなり、かつ、休業補償給付を行わないこととなった場合において、その後も休業補償給付が支払われたときは、その支払われた休業補償給付は、当該傷病補償年金の内払とみなす。"}, {"label": "C", "text": "保険給付の原因である事故が第三者の行為によって生じた場合において、保険給付を受けるべき者が当該第三者から同一の事由について損害賠償を受けたときは、政府は、その価額の限度で、保険給付を受けるべき者が当該第三者に対して有する損害賠償の請求権を取得する。"}, {"label": "D", "text": "遺族補償年金の額について、その算定の基礎となる遺族の数の減少により減額して改定すべきであったにもかかわらず、遺族の数が減少した月の翌月以後の分として減額しない額の遺族補償年金が支払われた場合、当該減額すべきであった部分については、その後に支払うべき遺族補償年金の内払とみなすことができる。"}, {"label": "E", "text": "障害補償年金を受ける権利を有する者が死亡したためその支給を受ける権利が消滅したにもかかわらず、その死亡の日の属する月の翌月以後の分として当該障害補償年金の過誤払が行われた場合において、当該過誤払による返還金債権に係る債務の弁済をすべき者に支払うべき保険給付があるときは、当該保険給付の支払金の金額を当該過誤払による返還金債権の金額に充当することができる。"}], "answer": "C", "key": "R08-2-3", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和8年度本試験", "stem": "「心理的負荷による精神障害の認定基準について」（令和5年9月1日付け基発0901第2号）におけるセクシュアルハラスメントの心理的負荷の評価に関する次の記述のうち、誤っているものはどれか。なお、本問において「被害者」とは「セクシュアルハラスメントを受けた者」のことであり、「行為者」とは「セクシュアルハラスメントを行った者」のことである。", "statements": [], "choices": [{"label": "A", "text": "被害者は、被害を受けてからすぐに相談行動をとらないことがあるが、この事実は心理的負荷が弱いと単純に判断する理由にはならない。"}, {"label": "B", "text": "被害者が医療機関の初診時にセクシュアルハラスメントの事実を申し立てていないことは、心理的負荷が弱いと単純に判断する理由にはならない。"}, {"label": "C", "text": "行為者が、雇用関係上、被害者に対して優越的な立場にある事実は心理的負荷を強める要素となり得る。"}, {"label": "D", "text": "胸や腰等への身体接触を含むセクシュアルハラスメントが継続して行われた場合は、「特別な出来事」として評価する。"}, {"label": "E", "text": "身体接触のない性的な発言のみのセクシュアルハラスメントであって、発言が継続していない場合、心理的負荷の強度は「中」と判断する。"}], "answer": "D", "key": "R08-2-4", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和8年度本試験", "stem": "労働者災害補償保険特別支給金支給規則（昭和49年労働省令第30号）に定める特別支給金に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "遺族補償年金前払一時金が支給されたことにより、遺族補償年金が支給停止された場合、遺族特別年金も支給停止される。"}, {"label": "B", "text": "遺族特別支給金の額は、遺族の人数に応じて、給付基礎日額の153日分から245日分である。"}, {"label": "C", "text": "最高裁判所の判例によれば、被災労働者が労災保険から受領した特別支給金は、使用者が被災労働者に支払う損害賠償額から控除することができるとされている。"}, {"label": "D", "text": "既に身体障害のあった者が、業務上の事由による負傷又は疾病により同一の部位について障害の程度を加重した場合の障害特別支給金の額は、現在の身体障害の該当する障害等級に応ずる障害特別支給金の額から、既にあった身体障害の該当する障害等級に応ずる障害特別支給金の額を差し引いた額による。"}, {"label": "E", "text": "障害特別支給金の支給の申請は、障害に係る負傷又は疾病が治った日の翌日から起算して2年以内に行わなければならない。"}], "answer": "D", "key": "R08-2-5", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和8年度本試験", "stem": "複数業務要因災害に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "複数業務要因災害の場合、いずれの事業場の事業主も労働基準法上の災害補償責任を負わない。"}, {"label": "B", "text": "複数業務要因災害による休業については、労働基準法第19条第1項に基づく解雇制限の規定の適用はないことから、複数事業労働者傷病年金については、打切補償に係る労災保険法第19条は準用されない。"}, {"label": "C", "text": "複数事業労働者については、1つの事業場の業務上の負荷との間に単独で因果関係が認められるような傷病等の場合であっても、複数業務要因災害の対象となる。"}, {"label": "D", "text": "複数事業労働者に該当するか否かは、傷病等が生じた時点、又は傷病等の原因及び要因となる事由が生じた時点において、事業主が同一人でない2以上の事業に使用されていたか否かで判断される。"}, {"label": "E", "text": "複数の事業又は作業について特別加入している者は、複数業務要因災害に係る保険給付の対象となり得る。"}], "answer": "C", "key": "R08-2-6", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和8年度本試験", "stem": "家事従事者への労災保険法の適用に関する次の記述のうち、正しいものの組み合わせはどれか。なお、本問において「家事サービス」とは、炊事、洗濯、掃除、買物等の、家庭において日常生活を円滑に営むことができるようにするための必要な援助として行われる作業をいう。", "statements": [{"label": "ア", "text": "家事従事者が家事代行サービス事業者と雇用契約を締結し、同事業者から就業場所として指定された私家庭において家事サービスを提供する場合、当該家事従事者は家事代行サービス事業者の労働者として労災保険法の適用を受ける。"}, {"label": "イ", "text": "家事従事者が家事使用人として私家庭と雇用契約を締結して家事サービスを提供する場合、当該家事従事者は、労災保険法第33条第5号が定める特定作業従事者として労災保険に特別加入することができる。"}, {"label": "ウ", "text": "家事従事者が家事従事者紹介所からの紹介・あっせんを受けて私家庭と雇用契約を締結して家事サービスを提供する場合、当該家事従事者は家事従事者紹介所の労働者として労災保険法の適用を受ける。"}, {"label": "エ", "text": "家事従事者が家事代行サービス事業者として私家庭と請負契約を締結して家事サービスを提供する場合、当該家事従事者は、労災保険法第33条第3号が定める一人親方等として労災保険に特別加入することができる。"}, {"label": "オ", "text": "家事従事者が家事従事者派遣企業と私家庭との間の労働者派遣契約に基づき私家庭に派遣されて家事サービスを提供する場合、当該家事従事者は、労災保険法第33条第7号が定める事業主が派遣する者として、労災保険に特別加入することができる。"}], "choices": [{"label": "A", "text": "（アとイ）"}, {"label": "B", "text": "（アとウ）"}, {"label": "C", "text": "（イとエ）"}, {"label": "D", "text": "（ウとオ）"}, {"label": "E", "text": "（エとオ）"}], "answer": "A", "key": "R08-2-7", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和8年度本試験", "stem": "労働保険の保険料の徴収等に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労災保険率は、労災保険法の適用を受ける全ての事業の過去3年間の業務災害、複数業務要因災害及び通勤災害に係る災害率並びに二次健康診断等給付に要した費用の額、社会復帰促進等事業として行う事業の種類及び内容その他の事情を考慮して厚生労働大臣が定める。"}, {"label": "B", "text": "労災保険率は、労働保険徴収法施行規則第16条第1項及び別表第1の「労災保険率表」に定められており、各事業の細目ないし具体的範囲については、日本標準産業分類とは異なる独自の分類方式による「労災保険率適用事業細目表」及び「船舶所有者の事業の種類の細目表」において定められている。"}, {"label": "C", "text": "労災保険に係る保険関係が成立している立木の伐採の事業であって、賃金総額を正確に算定することが困難なものについては、事業場の所在地を管轄する都道府県知事が定める素材1立方メートルを生産するために必要な労務費の額に、生産するすべての素材の材積を乗じて得た額を賃金総額とする。"}, {"label": "D", "text": "4か月以内の期間を定めて季節的に雇用される者を使用する一元適用事業の場合、一般保険料の額の算定に当たって、当該事業を労災保険に係る保険関係及び雇用保険に係る保険関係ごとに別個の事業とみなしてその額を算定する。"}, {"label": "E", "text": "労災保険に係る保険関係が成立している水産動植物の採捕又は養殖の事業であって、賃金総額を正確に算定することが困難なものについては、その事業の労働者につき厚生労働大臣が定める平均賃金に相当する額に、それぞれの労働者の使用期間の総日数を乗じて得た額の合算額を賃金総額とする。"}], "answer": "C", "key": "R08-2-8", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和8年度本試験", "stem": "労働保険の保険料の徴収等に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "継続事業の事業主は、延納の要件を満たしている場合、納付した概算保険料の額が確定保険料の額に足りないときはその不足額を、納付した概算保険料がないときは確定保険料を、確定保険料申告書を提出する際に申請することにより当該不足額等を延納することができる。"}, {"label": "B", "text": "事業主は、既に納付した概算保険料の額のうち確定保険料の額を超える額の還付を請求する場合、労働保険料還付請求書を官署支出官又は所轄都道府県労働局資金前渡官吏に提出することによって行わなければならない。"}, {"label": "C", "text": "事業主は、納付すべき次の保険年度の概算保険料その他未納の労働保険料等がある場合、既に納付した概算保険料の額が確定保険料の額を超えるときであっても、その超過額について還付請求することができない。"}, {"label": "D", "text": "事業主が既に納付した概算保険料の額が確定保険料の額を超える場合に納付すべき次の保険年度の概算保険料があるとき、当該事業主の請求ないし承認によって、所轄都道府県労働局歳入徴収官が当該超過額を次の保険年度の概算保険料に充当したときは、その旨を当該事業主に通知しなくてよい。"}, {"label": "E", "text": "政府は、事業主からなされた労働保険料の還付請求に応じる場合、還付金に利息相当分である還付加算金を加えた額を還付することとされている。"}], "answer": "B", "key": "R08-2-9", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和8年度本試験", "stem": "労働保険の保険料の徴収等に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "保険関係が成立し、又は成立していた事業の事業主が、労働保険徴収法第42条の規定による命令に違反して虚偽の記載をした文書を提出した場合、当該事業主は6月以下の拘禁刑又は30万円以下の罰金に処せられる。"}, {"label": "B", "text": "法人である労働保険事務組合が労働保険徴収法第36条の規定に違反して帳簿を備えて置かなかった場合、その違反行為をした労働保険事務組合の代表者又は代理人、使用人その他の従業者は、6月以下の拘禁刑又は30万円以下の罰金に処せられる。"}, {"label": "C", "text": "法人でない労働保険事務組合の従業者が、当該労働保険事務組合の業務に関して、労働保険徴収法第43条第1項の規定に違反して行政庁職員の質問に対して答弁をしなかった場合、当該従業者は6月以下の拘禁刑又は30万円以下の罰金に処せられ、当該労働保険事務組合は罰金に処せられない。"}, {"label": "D", "text": "労災保険法第35条第1項に規定する団体（以下本問において「労災保険の特別加入に係る一人親方等の団体」という。）の使用人が、労働保険徴収法第42条の規定による命令に違反して報告をしなかった場合、当該使用人は6月以下の拘禁刑又は30万円以下の罰金に処せられる。"}, {"label": "E", "text": "労災保険の特別加入に係る一人親方等の団体が、当該団体の業務に関して、労働保険徴収法第42条の規定による命令に違反して文書を提出しなかった場合、当該団体は30万円以下の罰金に処せられる。"}], "answer": "C", "key": "R08-2-10", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R08-3", "title": "R8本試験 雇用・徴収", "subject": "雇用保険法", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和8年度（第58回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和8年4月10日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和8年度本試験", "stem": "雇用保険の被保険者に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "独立行政法人通則法（平成11年法律第103号）第2条第4項に規定する行政執行法人の事業に雇用される者（国家公務員退職手当法（昭和28年法律第182号）第2条第1項に規定する常時勤務に服することを要する国家公務員以外の者であって、同条第2項の規定により職員とみなされないものを除く。）は、厚生労働大臣の承認を受けることにより被保険者とならない。"}, {"label": "B", "text": "市町村の事業に雇用される者は、雇用保険法の適用を受けることについて都道府県労働局長の承認を受けることにより被保険者となることができる。"}, {"label": "C", "text": "地方独立行政法人法（平成15年法律第118号）第2条第2項に規定する特定地方独立行政法人であって設立に当たり総務大臣の認可を受けたものの事業に雇用される者は、当該特定地方独立行政法人の長が雇用保険法を適用しないことについて、都道府県知事に申請し、その承認を受けることにより被保険者とならない。"}, {"label": "D", "text": "国その他これに準ずるものの事業に雇用される非常勤職員（日雇労働者を含む。）であって労働者と認められる者は、国家公務員退職手当法第2条第2項の規定により同法上の職員とみなされ同法の適用を受けるに至るまでの間は、他の要件を満たす限り雇用保険の被保険者となり、職員とみなされ同法の適用を受けるに至ったときから被保険者とならない。"}, {"label": "E", "text": "民間企業に雇用される労働者が地方公務員として出向する場合であって、地方公務員法（昭和25年法律第261号）第38条第1項に規定する任命権者の兼業許可を受けている場合、当該出向元事業主との雇用関係を継続したまま地方公務員としての身分を併有しているときは、出向元事業主との雇用関係に係る被保険者とならない。"}], "answer": "D", "key": "R08-3-1", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和8年度本試験", "stem": "被保険者資格の確認に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "雇用保険法第9条第1項の規定による被保険者となったこと又は被保険者でなくなったことの確認を受けた者が、事業主の届出による資格取得の日に誤りがあると考える場合は、資格取得日が相違していることについての確認請求を行うことができる。"}, {"label": "B", "text": "労働者が被保険者であったことの確認をはじめて請求するとき、当該確認の請求は離職後2年を超えて行うことができる。"}, {"label": "C", "text": "文書により確認の請求をしようとする者は、その者を雇用し又は雇用していた事業主の事業所の所在地を管轄する公共職業安定所の長に所定の請求書を提出しなければならない。"}, {"label": "D", "text": "公共職業安定所長は、雇用保険法第9条第1項の規定による労働者が被保険者でなくなったことの確認をしたときは、雇用保険被保険者資格喪失確認通知書により、その旨を当該確認に係る者及びその者を雇用していた事業主（それらの所在が明らかでない場合を除く。）に通知しなければならない。"}, {"label": "E", "text": "公共職業安定所長は、雇用保険法第9条の規定により被保険者となったことの確認をしたときは、その確認に係る者に雇用保険被保険者証を交付しなければならない。"}], "answer": "A", "key": "R08-3-2", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和8年度本試験", "stem": "特定理由離職者及び特定受給資格者（雇用保険法第22条第2項に規定する就職困難者を除く。）に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "父又は母の死亡、疾病、負傷等のため、父又は母を扶養するために退職を余儀なくされた場合など、家庭の事情の急変により退職した者は、特定理由離職者に該当しない。"}, {"label": "B", "text": "学校入学のために離職した者は、特定理由離職者に該当しない。"}, {"label": "C", "text": "オフィスコンピュータ機器が導入されたことにより、これまで有していた専門知識を十分に発揮する機会が失われた被保険者が、新たに導入された当該機器を取り扱うこととされたものの、当該機器に係るプログラム作成が困難であるなど新技術への適応が困難であることを理由に退職した場合、特定理由離職者に該当しない。"}, {"label": "D", "text": "期間の定めのある労働契約の締結に際し、当該労働契約が更新されることが明示されており、更新を希望していたにもかかわらず更新されずに離職した者は、離職した事業所における通算雇用期間が3年以上でなければ特定受給資格者に該当しない。"}, {"label": "E", "text": "事業の期間が予定されていない事業所において事業活動が停止し、再開される見込みがない場合であっても、裁判上の倒産手続がとられておらず、適用事業所が廃止されていないときは、事業活動が停止し、再開される見込がないことを理由に離職した者は、特定受給資格者に該当しない。"}], "answer": "B", "key": "R08-3-3", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和8年度本試験", "stem": "基本手当の支給手続に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "就職に伴う移管の場合を除き、受給資格者が他の公共職業安定所の管轄内に住居を変更した場合、基本手当の支給は移管の手続が終了した後に行われる。"}, {"label": "B", "text": "基本手当の支給を口座振込の方法によって受ける場合、指定する振込先普通預金又は普通貯金の口座は、受給資格者本人の同意がある場合に限り、当該受給資格者と生計を同じくする配偶者名義の口座を指定することができる。"}, {"label": "C", "text": "受給資格者が公共職業安定所への出頭に要する時間が通常の交通機関を利用して往復6時間以上要する離島等特殊遠隔地（厚生労働省職業安定局長の承認を受けた地域に限る。）に居住し、失業の認定を受けるために出頭するのに多額の費用を必要とする場合、当該受給資格者の居住する市町村長の取次ぎにより、失業の認定及び基本手当の支給を受けることができる。"}, {"label": "D", "text": "基本手当の受給資格者（口座振込受給資格者を除く。）が疾病、負傷、就職その他やむを得ない理由によって、支給日に管轄公共職業安定所に出頭することができないときは、その代理人が当該受給資格者に支給されるべき基本手当の支給を受けることができる。"}, {"label": "E", "text": "管轄公共職業安定所の長は、受給資格者に公共職業訓練等を受けることを指示したときは、その者について支給日を新たに定め、その者に通知するものとされている。"}], "answer": "B", "key": "R08-3-4", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和8年度本試験", "stem": "延長給付に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "基本手当の所定給付日数を超えて基本手当を支給することができる広域延長給付は、60日を限度とする。"}, {"label": "B", "text": "雇用保険法第27条第1項に基づき全国延長給付を支給する措置は、連続する4月間内の各月における基本手当の受給率（雇用保険法施行令第7条第1項第1号に規定する率をいう。）が100分の4を超え、かつ、当該連続する4月間内の各月における初回受給率（雇用保険法施行令第7条第1項第2号に規定する率をいう。）が、当該期間内において低下する傾向にない状態が継続すると認められる場合に実施される。"}, {"label": "C", "text": "厚生労働大臣は、その地域において職業に就くことが困難であると認める地域に居住する求職者が他の地域において職業に就くことを促進するための計画を作成し、関係都道府県労働局長及び公共職業安定所長に当該計画に基づく広範囲の地域にわたる職業紹介活動を行わせた場合、受給資格者に対し所定給付日数を超えて基本手当を支給する措置を決定することができる。"}, {"label": "D", "text": "個別延長給付を受けている受給資格者は、当該個別延長給付が終わった後でなければ全国延長給付を受けることができない。"}, {"label": "E", "text": "訓練延長給付を受けている受給資格者について広域延長給付が行われる間、当該受給資格者について訓練延長給付は行われない。"}], "answer": "A", "key": "R08-3-5", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和8年度本試験", "stem": "高年齢被保険者に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "高年齢受給資格者は、公共職業安定所長の指示により公共職業訓練等を受講することとなった場合、技能習得手当を受給することができる。"}, {"label": "B", "text": "高年齢受給資格者は、求職の申込みをした後に疾病又は負傷により引き続き15日以上職業に就くことができなくなった場合、傷病手当を受給することができる。"}, {"label": "C", "text": "高年齢求職者給付金の支給を受けるためには、離職の日以前2年間に、雇用保険の被保険者期間が通算して12か月以上あることが必要である。"}, {"label": "D", "text": "高年齢求職者給付金は、高年齢受給資格に係る失業の認定があった日から受給期限日（離職の日の翌日から起算して1年を経過する日）までの日数が、算定基礎期間に応じた所定の給付日数未満であるときは、当該給付日数にかかわらず、当該認定があった日から受給期限日までの日数分のみが支給される。"}, {"label": "E", "text": "高年齢受給資格者が離職の日の翌日から起算して1年を経過する日までの間に疾病又は負傷により引き続き15日以上職業に就くことができない場合、管轄公共職業安定所の長に申し出ることにより、高年齢求職者給付金の支給を受けることができる期限を1年間延長することができる。"}], "answer": "D", "key": "R08-3-6", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和8年度本試験", "stem": "次の①から⑧の過程を経た者の、⑧の育児休業開始に伴う育児休業給付金の受給資格確認において、みなし被保険者期間の長さとして適切なものはどれか。なお、各事業所での就業期間中に③⑥⑦⑧の期間を除く欠勤・休職期間はなく、就業期間中の各月における賃金支払基礎日数はすべて20日以上であった。<br>①22歳0月で適用事業所Ｘに、週所定労働時間が8時間の短時間労働者として雇用された。<br>②23歳0月でＸにおける週所定労働時間が33時間に変更され、初めて一般被保険者となった。<br>③24歳0月から私傷病により引き続き18か月間Ｘを休職したが、その休職の期間賃金は受けなかった。<br>④25歳6月で当該私傷病によるＸの休職期間が満了したことで、Ｘを退職した。<br>⑤基本手当の受給資格の決定を受けることなく、25歳7月で適用事業所Ｙに一般被保険者として雇用された。<br>⑥25歳10月から産前休業を開始したが、その休業の間賃金は受けなかった。<br>⑦26歳0月で出産し、産後休業を開始したが、その休業の間賃金は受けなかった。<br>⑧26歳2月から育児休業を開始した（令和3年9月1日以降）。", "statements": [], "choices": [{"label": "A", "text": "3か月"}, {"label": "B", "text": "12か月"}, {"label": "C", "text": "15か月"}, {"label": "D", "text": "18か月"}, {"label": "E", "text": "19か月"}], "answer": "C", "key": "R08-3-7", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和8年度本試験", "stem": "労働保険徴収法等の規定により、保険関係が成立した次の事業の事業主が提出すべき保険関係成立届の提出先等に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "二元適用事業に係る雇用保険関係成立届の提出先は、所轄公共職業安定所長である。"}, {"label": "B", "text": "一元適用事業であって、労働保険事務組合に労働保険事務の処理を委託していないもののうち、労災保険に係る保険関係及び雇用保険に係る保険関係が成立している事業に係る保険関係成立届の提出先は、所轄労働基準監督署長である。"}, {"label": "C", "text": "一元適用事業であって、労働保険事務組合に労働保険事務の処理を委託していないもののうち、雇用保険に係る保険関係のみが成立している事業に係る保険関係成立届の提出先は、所轄公共職業安定所長である。"}, {"label": "D", "text": "一元適用事業であって、労働保険事務組合に労働保険事務の処理を委託している事業に係る保険関係成立届の提出先は、所轄公共職業安定所長である。"}, {"label": "E", "text": "有期事業であって、労働保険事務組合に労働保険事務の処理を委託していない社会保険適用事業所（厚生年金保険又は健康保険の適用事業所をいう。）の事業主は、保険関係成立届を年金事務所（日本年金機構法（平成19年法律第109号）第29条の年金事務所をいう。）を経由して提出することができる。"}], "answer": "E", "key": "R08-3-8", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和8年度本試験", "stem": "労働保険の保険料の徴収等に関して、次の状況にある事業主が納付すべき延滞金の記述のうち、正しいものはどれか。なお、本問においては労働保険徴収法第28条第1項に規定する延滞金の割合（年14．6％及び年7．3％）を適用し、租税特別措置法（昭和32年法律第26号）第94条第1項に規定する延滞税特例基準割合は考慮しないものとする。", "statements": [], "choices": [{"label": "A", "text": "法定納期限が令和8年7月10日の概算保険料100,000円を滞納している事業主に対して、所轄都道府県労働局歳入徴収官が当該概算保険料の納付を督促し、督促状に記された指定期限が同年8月31日であるとき、当該事業主が同年8月31日に完納した場合に納付すべき延滞金は1，000円となる。"}, {"label": "B", "text": "法定納期限が令和8年7月10日の概算保険料100,000円を滞納している事業主に対して、所轄都道府県労働局歳入徴収官が当該概算保険料の納付を督促し、督促状に記された指定期限が同年8月31日であるとき、当該事業主が同年9月30日に完納した場合に納付すべき延滞金は3，200円となる。"}, {"label": "C", "text": "法定納期限が令和8年7月10日の概算保険料100，000円を滞納している事業主の住所及び居所が明らかでないため、同年8月10日に都道府県労働局の掲示場に公示送達書が掲示されたとき、当該事業主が同年8月19日に完納した場合に納付すべき延滞金は700円となる。"}, {"label": "D", "text": "法定納期限が令和8年10月31日の概算保険料10,000円を滞納している事業主に対して、所轄都道府県労働局歳入徴収官が当該概算保険料の納付を督促し、督促状に記された指定期限が同年12月15日であるとき、当該事業主が同年12月20日に完納した場合に納付すべき延滞金は98円となる。"}, {"label": "E", "text": "法定納期限が令和8年10月31日の概算保険料100,000円を滞納している事業主に対して、所轄都道府県労働局歳入徴収官が当該概算保険料の納付を督促し、督促状に記された指定期限が同年12月20日であるとき、当該事業主が同年12月10日に滞納概算保険料の一部50,000円を納付していた場合、当該事業主が翌年1月20日に完納した場合に納付すべき延滞金は1,300円となる。"}], "answer": "E", "key": "R08-3-9", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和8年度本試験", "stem": "労働保険の保険料の徴収等に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働保険事務組合は、労働保険事務の処理を委託している事業主ごとに労働保険事務等処理委託事業主名簿、労働保険料等徴収及び納付簿、（雇用保険に係る保険関係が成立している事業にあっては）雇用保険被保険者関係届出事務等処理簿を事務所に備えておかなければならず、これら3つの帳簿すべてに当該事業主の事業が労働保険徴収法施行規則第68条に規定する5人未満委託事業、5人以上15人以下委託事業又はそれ以外の事業のいずれの事業に該当するかの別を記載する項目がある。"}, {"label": "B", "text": "政府は、労働保険事務組合に労働保険事務の処理を委託した事業主に対してすべき概算保険料の超過納付額の還付について、当該事業主に対して還付せずに当該労働保険事務組合に対してすることができる。"}, {"label": "C", "text": "労働保険事務組合が政府から労働保険料に係る報奨金の交付を受けるには、7月10日において、常時15人以下の労働者を使用する事業の事業主の委託に係るものにつき、前年度の確定保険料の額（当該確定保険料に係る追徴金又は延滞金を納付すべき場合にあっては、当該確定保険料の額と当該追徴金又は延滞金の額との合計額）のすべてが納付されていることが、その要件の一つに定められている。"}, {"label": "D", "text": "事業主が労働保険事務組合に処理を委託することができる労働保険事務の範囲に「雇用保険の被保険者資格の取得及び喪失の届出」は含まれるが、「雇用保険の保険給付に関する請求書等に係る事務手続及びその代行」は当該範囲に含まれない。"}, {"label": "E", "text": "労働保険事務組合は、労働保険事務の処理の業務を廃止しようとするときは、60日前までに、業務の廃止に係る届書を労働保険事務組合の主たる事務所の所在地を管轄する都道府県労働局長に提出することにより、業務廃止の旨を厚生労働大臣に届け出なければならない。"}], "answer": "C", "key": "R08-3-10", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}]}, {"id": "R08-4", "title": "R8本試験 一般常識", "subject": "一般常識", "kind": "kakomon", "source": "出典: 社会保険労務士試験オフィシャルサイト（全国社会保険労務士会連合会 試験センター）令和8年度（第58回）社会保険労務士試験 択一式試験問題及び正答。問題文はPDFから機械的に取り出したもので、表記が原文と異なる場合があります。解答は令和8年4月10日時点の法令等によります。", "questions": [{"type": "choice", "no": 1, "topic": "令和8年度本試験", "stem": "我が国の若年者雇用に関する次の記述のうち、正しいものはどれか。なお、本問は、「令和5年若年者雇用実態調査（厚生労働省）」を参照しており、当該調査による用語及び統計等を利用している。当該調査では、「若年労働者」を令和5年10月1日時点で満15歳から34歳までの労働者とし、「若年正社員」を若年労働者のうち正社員の者としている。", "statements": [], "choices": [{"label": "A", "text": "「若年正社員がいる」事業所の割合を産業別にみると、「宿泊業，飲食サービス業」が最も高く、次いで「教育，学習支援業」となっている。"}, {"label": "B", "text": "「正社員以外の若年労働者がいる」事業所の割合を産業別にみると、「金融業，保険業」が最も高く、次いで「電気・ガス・熱供給・水道業」となっている。"}, {"label": "C", "text": "若年正社員の採用選考をした事業所のうち、採用選考にあたり重視した点（複数回答）について採用区分別にみると、「新規学卒者」、「中途採用者」とも「業務に役立つ職業経験・訓練経験」がそれぞれ最も高くなっている。次いで「新規学卒者」、「中途採用者」とも「コミュニケーション能力」、「マナー・社会常識」の順となっている。"}, {"label": "D", "text": "若年正社員の育成方法（複数回答）についてみると、「OJT」が最も高く、次いで「OFF︲JT」、「自己啓発への支援」、「ジョブローテーション」の順となっている。"}, {"label": "E", "text": "正社員以外の労働者を正社員へ転換させる「制度がある」事業所は約3割となっている。"}], "answer": "D", "key": "R08-4-1", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 2, "topic": "令和8年度本試験", "stem": "我が国の雇用管理の実態等に関する次の記述のうち、誤っているものはどれか。なお、本問は、「令和6年度雇用均等基本調査（企業調査）（厚生労働省）」を参照しており、当該調査による用語及び統計等を利用している。", "statements": [], "choices": [{"label": "A", "text": "新規学卒者の採用を行った企業を規模別にみると、企業規模が大きいほど女性を採用した企業割合が高い傾向にある。"}, {"label": "B", "text": "男性のみ採用した採用区分があった企業が、男性のみ採用した理由（複数回答）については、「女性の応募がなかった」とする企業割合が最も高く、次いで「女性の応募はあったが、採用前に辞退された」、「女性の応募はあったが、試験の成績等が採用基準に達していなかった」の順となっている。"}, {"label": "C", "text": "係長相当職以上（役員を含む。）の女性管理職等を有する企業割合は約4割、課長相当職以上（役員を含む。）の女性管理職を有する企業割合は約3割となっている。"}, {"label": "D", "text": "課長相当職以上（役員を含む。）の管理職に占める女性の割合を産業別にみると、「医療，福祉」が最も高く、次いで「生活関連サービス業，娯楽業」、「宿泊業，飲食サービス業」、「教育，学習支援業」の順となっている。"}, {"label": "E", "text": "セクシュアルハラスメントを防止するための対策に「取り組んでいる」と回答した企業割合は約9割となっている。"}], "answer": "C", "key": "R08-4-2", "answerText": "<b>正解 C</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 3, "topic": "令和8年度本試験", "stem": "我が国における労働争議に関する次の記述のうち、誤っているものはどれか。なお、本問は、「令和6年労働争議統計調査（厚生労働省）」を参照しており、当該調査による用語及び統計等を利用している。当該調査では、「争議行為を伴う争議」を争議行為（同盟罷業、作業所閉鎖、怠業、その他（業務管理等））を伴う争議のこととし、「労働損失日数」を半日以上の同盟罷業又は作業所閉鎖が行われた期間に労働者が実際に半日以上の同盟罷業に参加した又は作業所閉鎖の対象となったことによって労働に従事しなかった延べ日数のこととし、「総争議」を当該調査の対象となるすべての労働争議のこととしている。", "statements": [], "choices": [{"label": "A", "text": "「争議行為を伴う争議」を産業別にみると、件数は「医療，福祉」が最も多く、次いで「製造業」、「運輸業，郵便業」の順となっている。"}, {"label": "B", "text": "「争議行為を伴う争議」を産業別にみると、労働損失日数は「運輸業，郵便業」が最も多く、次いで「製造業」、「医療，福祉」の順となっている。"}, {"label": "C", "text": "民営企業における「争議行為を伴う争議」があった企業数（延べ数）を企業規模（「99人以下」、「100～299人」、「300～999人」、「1,000人以上」）別にみると、「300～999人」で最も多くなっている。"}, {"label": "D", "text": "民営企業における「争議行為を伴う争議」による労働損失日数を企業規模別にみると、「1,000人以上」で最も多くなっている。"}, {"label": "E", "text": "「総争議」の件数を要求事項別（主要要求事項2つまでの複数回答）にみると、「組合保障及び労働協約」に関する事項が最も多く、次いで「経営・雇用・人事」に関する事項、「賃金」に関する事項の順となっている。"}], "answer": "E", "key": "R08-4-3", "answerText": "<b>正解 E</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 4, "topic": "令和8年度本試験", "stem": "労働契約法等に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "労働契約法第3条第5項は、権利濫用の禁止の原則を規定しているが、この規定は同法第3章に定める出向、懲戒及び解雇に関する権利濫用の禁止を確認したものであり、同章で規定していない労働契約の場面では、権利濫用の禁止の原則は適用されない。"}, {"label": "B", "text": "請負人と雇用契約を締結し注文者の工場に派遣されていた労働者が、注文者から直接具体的な指揮命令を受けて作業に従事していたために、請負人と注文者の関係がいわゆる偽装請負に当たり、上記の派遣を労働者派遣法に違反する労働者派遣と解すべき場合において、⑴上記雇用契約は有効に存在していたこと、⑵注文者が請負人による当該労働者の採用に関与していたとは認められないこと、⑶当該労働者が請負人から支給を受けていた給与等の額を注文者が事実上決定していたといえるような事情はうかがわれないこと、⑷請負人が配置を含む当該労働者の具体的な就業態様を一定の限度で決定し得る地位にあったことなど判示の事情の下であっても、当該労働者が注文者から直接具体的な指揮命令を受けて作業に従事していたことをもって、注文者と当該労働者との間に雇用契約関係が黙示的に成立していたといえるとするのが、最高裁判所の判例である。"}, {"label": "C", "text": "労働契約法第7条により、労働契約において労働条件を詳細に定めずに労働者が就職した場合でも、合理的な労働条件が定められている就業規則であるという要件さえ満たしていれば、当該就業規則を労働者に周知させていなくても、当該就業規則で定める労働条件が労働契約の内容を補充し、「労働契約の内容は、その就業規則で定める労働条件による」という法的効果が生じる。"}, {"label": "D", "text": "労働契約において、労働者及び使用者が就業規則の変更によっては変更されない労働条件として合意していた部分についても、合意の内容が就業規則で定める基準に達しない場合には、就業規則の内容が優先されることとなる。"}, {"label": "E", "text": "従業員が職場で上司に対する暴行事件を起こしたことなどが就業規則所定の懲戒解雇事由に該当するとして、使用者が捜査機関による捜査の結果を待った上で上記暴行事件から7年以上経過した後に諭旨退職処分を行った場合において、上記暴行事件には目撃者が存在しており、捜査の結果を待たずとも使用者において処分を決めることが十分に可能であったこと、上記諭旨退職処分がされた時点で企業秩序維持の観点から重い懲戒処分を行うことを必要とするような状況はなかったことなど判示の事情の下であっても、就業規則所定の懲戒解雇事由を厳正に解釈して、上記諭旨退職処分は、権利の濫用として無効であるとまではいえないとするのが、最高裁判所の判例である。"}], "answer": "D", "key": "R08-4-4", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 5, "topic": "令和8年度本試験", "stem": "社会保険労務士法令に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "社会保険労務士法第1条は、「この法律は、社会保険労務士の制度を定めて、その業務の適正を図り、もつて労働及び社会保険に関する法令の円滑な実施に寄与するとともに、事業の健全な発達と労働者等の福祉の向上に資することを目的とする。」と定めている。"}, {"label": "B", "text": "社会保険労務士が、「労働社会保険諸法令に基づく療養の給付及びこれに相当する給付の費用についてこれらの給付を担当する者のなす請求に関する事務」を、社会保険労務士の名称を用いず、医療機関と個人の契約に基づいて行うことは、社会保険労務士法上、問題ないこととされている。"}, {"label": "C", "text": "社会保険労務士の業務のうち、社会保険労務士法第2条第1項第1号の3に定める「事務代理」は、同号に定める申請等及びこれらに係る行政機関等の調査又は処分に対してする主張又は陳述の事実行為にとどまるから、代理人の判断で法律行為を行う余地はなく、代理人には、行政機関等の許可、決定等の受領、申請等の撤回、委任の範囲外の申請等の内容の変更等を行う権限はないと解される。"}, {"label": "D", "text": "社会保険労務士が、新たに開業するために事務所を設けるに至ったとき等、社会保険労務士名簿に新たに登録事項を追加する場合は、社会保険労務士法第14条の4に基づき、変更の登録を申請しなければならない。"}, {"label": "E", "text": "他人の求めに応じ報酬を得て、社会保険労務士法第2条に規定する事務を業として行う社会保険労務士（社会保険労務士法人の社員を除く。）は、厚生労働大臣の許可を受けていない限り、その業務を行うための事務所を2以上設けてはならない。"}], "answer": "A", "key": "R08-4-5", "answerText": "<b>正解 A</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 6, "topic": "令和8年度本試験", "stem": "確定給付企業年金法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "確定給付企業年金法第2条第3項によると、確定給付企業年金法において「厚生年金保険の被保険者」とは、厚生年金保険法第2条の5第1項第1号に規定する第1号厚生年金被保険者のみをいう。"}, {"label": "B", "text": "確定給付企業年金法第30条第1項によると、給付を受ける権利（以下本問において「受給権」という。）は、その権利を有する者の請求に基づいて、事業主（企業年金基金を設立して実施する確定給付企業年金を実施する場合にあっては、企業年金基金。以下本問において「事業主等」という。）が裁定する。"}, {"label": "C", "text": "確定給付企業年金法第34条第1項及び第2項によると、受給権は、譲り渡し、担保に供し、又は差し押さえることができない。ただし、老齢給付金、脱退一時金及び障害給付金を受ける権利を国税滞納処分（その例による処分を含む。）により差し押さえる場合は、この限りでない。また、租税その他の公課は、遺族給付金として支給を受けた金銭を標準として、課することができない。"}, {"label": "D", "text": "確定給付企業年金法第55条第1項及び第2項によると、事業主は、給付に関する事業に要する費用に充てるため、規約で定めるところにより、年1回以上、定期的に掛金を拠出しなければならない。加入者は、政令で定める基準に従い規約で定めるところにより、当該掛金の一部を負担しなければならない。"}, {"label": "E", "text": "事業主等は、毎事業年度終了後6か月以内に、厚生労働省令で定めるところにより、確定給付企業年金の事業及び決算に関する報告書を作成し、厚生労働大臣に提出しなければならない。"}], "answer": "B", "key": "R08-4-6", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 7, "topic": "令和8年度本試験", "stem": "確定拠出年金法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "確定拠出年金法において「個人型年金加入者」とは、個人型年金において、掛金を拠出し、かつ、その個人別管理資産について運用の指図を行う者をいう。"}, {"label": "B", "text": "確定拠出年金法第19条第2項によると、事業主掛金の額は、企業型年金規約で定めるものとする。"}, {"label": "C", "text": "確定拠出年金法第40条によると、企業型年金の死亡一時金は、企業型年金加入者又は企業型年金加入者であった者（当該企業型年金に個人別管理資産がある者に限る。）が死亡したときに、その者の遺族に、資産管理機関が企業型記録関連運営管理機関等の裁定に基づいて、支給する。"}, {"label": "D", "text": "確定拠出年金法第70条の2第1項によると、中小事業主は、同法第68条の2第1項の規定により中小事業主掛金を拠出するときは、個人型年金規約で定めるところにより、確定拠出年金運営管理機関に納付するものとする。"}, {"label": "E", "text": "確定拠出年金法第88条第1項及び第2項によると、確定拠出年金運営管理業は、主務大臣の登録を受けた法人でなければ、営んではならない。銀行その他の政令で定める金融機関は、他の法律の規定にかかわらず、当該登録を受けて確定拠出年金運営管理業を営むことができる。"}], "answer": "D", "key": "R08-4-7", "answerText": "<b>正解 D</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 8, "topic": "令和8年度本試験", "stem": "国民健康保険法に関する次の記述のうち、正しいものはどれか。", "statements": [], "choices": [{"label": "A", "text": "国民健康保険法第5条第1項及び同法第6条第1項によると、都道府県の区域内に住所を有する世帯主は、当該都道府県が当該都道府県内の市町村とともに行う国民健康保険の被保険者とする。なお、世帯主に扶養される者は、当該国民健康保険の被扶養者とする。しかしながら、健康保険法の規定による被保険者及び健康保険法の規定による被扶養者は都道府県が当該都道府県内の市町村とともに行う国民健康保険の被保険者としない。"}, {"label": "B", "text": "国民健康保険法第116条によると、修学のため一の市町村の区域内に住所を有する被保険者であって、修学していないとすれば他の市町村の区域内に住所を有する他人と同一の世帯に属するものと認められるものは、この法律の適用については、当該他の市町村の区域内に住所を有するものとみなし、かつ、当該世帯に属するものとみなす。"}, {"label": "C", "text": "国民健康保険法第116条の2第1項によると、病院又は診療所への入院をしたことにより、病院、診療所の所在する場所に住所を変更したと認められる被保険者であって、当該病院等に入院等をした際他の市町村（当該病院等が所在する市町村以外の市町村をいう。）の区域内に住所を有していたと認められるものは、この法律の適用については、当該他の市町村の区域内に住所を有するものとみなすが、老人福祉法に規定する養護老人ホーム又は特別養護老人ホームへの入所をしたことにより、養護老人ホーム又は特別養護老人ホームの所在する場所に住所を変更したと認められる被保険者については、当該病院等に入所をした際他の市町村（当該病院等が所在する市町村以外の市町村をいう。）の区域内に住所を有していたと認められるものであっても、この法律の適用については、当該他の市町村の区域内に住所を有するものとみなさない。"}, {"label": "D", "text": "国民健康保険法第19条第1項によると、国民健康保険組合の組合員及び組合員の世帯に属する者は、当該国民健康保険組合が行う国民健康保険の被保険者とする。その国民健康保険の被保険者が同時に2以上の事業所に使用される場合において、保険者である国民健康保険組合が2以上あるときは、事実発生から10日以内に被保険者が主たる事業所を選択しなければならない。"}, {"label": "E", "text": "国民健康保険法第99条によると、審査請求は、処分があったことを知った日の翌日から起算して2か月以内に、文書又は口頭でしなければならない。ただし、正当な理由により、この期間内に審査請求をすることができなかったことを疎明したときは、この限りでない。"}], "answer": "B", "key": "R08-4-8", "answerText": "<b>正解 B</b>", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 9, "topic": "令和8年度本試験", "stem": "高齢者医療確保法に関する次の記述のうち、誤っているものはどれか。", "statements": [], "choices": [{"label": "A", "text": "高齢者医療確保法において「特定健康診査」とは、同法第18条第1項によると、糖尿病その他の政令で定める生活習慣病に関する健康診査をいう。"}, {"label": "B", "text": "高齢者医療確保法第51条によると、生活保護法による保護を受けている世帯（その保護を停止されている世帯を除く。）に属する者及び後期高齢者医療の適用除外とすべき特別の理由がある者で厚生労働省令で定めるものは、後期高齢者医療広域連合が行う後期高齢者医療の被保険者としない。"}, {"label": "C", "text": "高齢者医療確保法第56条によると、後期高齢者医療給付は、療養の給付及び入院時食事療養費等の支給、高額療養費及び高額介護合算療養費の支給、後期高齢者医療広域連合の条例で定めるところにより行う給付とする。"}, {"label": "D", "text": "高齢者医療確保法第95条第1項及び第2項によると、国は、後期高齢者医療の財政を調整するため、政令で定めるところにより、後期高齢者医療広域連合に対して調整交付金を交付する。当該調整交付金の総額は、同法第93条第1項の規定による負担対象総額の見込額の総額の12分の1に相当する額とする。"}, {"label": "E", "text": "高齢者医療確保法第104条第2項及び第3項によると、後期高齢者医療の保険料率（政令で定める基準に従い後期高齢者医療広域連合の条例で定めるところにより算定された保険料率）は、療養の給付等に要する費用の額の予想額等に照らし、おおむね5年を通じ財政の均衡を保つことができるものでなければならない。"}], "answer": "DE", "key": "R08-4-9", "answerText": "<b>正解 D・E</b>（公式が複数の選択肢を正答としています）", "explain": ["解説はありません（公式に公表されているのは正答だけです）。"]}, {"type": "choice", "no": 10, "topic": "令和8年度本試験", "stem": "児童手当法に関する次のアからオの記述のうち、正しいものの組合せは、後記ＡからＥまでのうちどれか。", "statements": [{"label": "ア", "text": "「児童」とは、15歳に達する日以後の最初の3月31日までの間にある者であって、日本国内に住所を有するもの又は留学その他の内閣府令で定める理由により日本国内に住所を有しないものをいう。"}, {"label": "イ", "text": "児童手当の支給は、一般受給資格者及び施設等受給資格者が児童手当法第7条の規定による認定の請求をした日の属する月から始め、児童手当を支給すべき事由が消滅した日の属する月で終わる。"}, {"label": "ウ", "text": "児童手当は、毎年2月、4月、6月、8月、10月及び12月の6期に、それぞれの前月までの分を支払う。ただし、
